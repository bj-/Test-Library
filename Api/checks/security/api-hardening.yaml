  - OWASP API Security Top 10
- id: HARD-UNSAFE-API-CONSUMPTION
  status: approved
  title: Ответы сторонних API валидируются перед использованием
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - resilience
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис вызывает внешние API.
  steps:
  - action: Через заглушку внешнего API вернуть некорректную схему, огромный ответ, редирект, инъекции в полях.
  - action: Смоделировать у внешнего узла обрыв соединения и ответ не по тому протоколу
    notes: 'Real-world bug: RWB-0080 (GHSA-542g-h47m-68v8)'
  - action: Тяжёлый для разбора ответ внешнего сервера (ReDoS/квадратичный парсер), а не только неверные данные
    notes: 'Real-world bug: RWB-0080 (GHSA-c475-qrg2-pj4r)'
  - action: Компрессионная бомба в ответе внешнего сервиса
    notes: 'Real-world bug: RWB-0080 (GHSA-3xpg-4rpp-hhhm)'
  - action: Указать в импорте или миграции внешний сервер, отдающий много вложений допустимого размера, и проверить суммарный
      лимит задачи
    notes: 'Real-world bug: RWB-0080 (GHSA-wq92-8x3r-fm38)'
  - action: Указать во внешнем репозитории файл конфигурации в виде символьной ссылки на /dev/zero или файл вне репозитория
      и проверить отказ без неограниченного чтения
    notes: 'Real-world bug: RWB-0080 (GHSA-fmgp-q6jx-gg3x)'
  - action: Указать в настройке источника данных URL внешнего WSDL с вредоносным содержимым и проверить, что сервер не генерирует
      и не исполняет код из него
    notes: 'Real-world bug: RWB-0080 (GHSA-vrgw-pc9c-qrrc)'
  expected:
  - Сервис отклоняет или санитизирует данные, не следует редиректам слепо, ограничивает размер.
  applicability:
    when:
    - Есть интеграции.
    skip_when:
    - Интеграций нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0080'
- id: HARD-EXPENSIVE-OPERATION-LIMITS
  status: approved
  title: Дорогие операции ограничены по ресурсам
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - rate-limiting
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть экспорт, отчёты, поиск, массовые операции.
  steps:
  - action: Запросить максимальный limit, широкий период, тяжёлые фильтры, параллельные экспорты.
  - action: Усиление памяти при разборе URL (числовые ключи параметров)
    notes: 'Real-world bug: RWB-0077 (GHSA-ff3f-86qr-9cv3)'
  - action: Сверхдлинный пароль на auth-эндпоинтах (в том числе для несуществующего пользователя)
    notes: 'Real-world bug: RWB-0077 (GHSA-477h-4r7f-fvrx)'
  - action: Алгоритмическая сложность парсеров ввода — плоский вход с большим числом элементов при нулевой вложенности
    notes: 'Real-world bug: RWB-0077 (GHSA-rj75-hqrm-r3gf)'
  - action: YAML с алиасами и merge-ключами (включая пустые отображения) — стоимость разбора ограничена
    notes: 'Real-world bug: RWB-0077 (GHSA-r3ph-w7gj-g6xm)'
  - action: Отправить коллекцию из N ссылок на объекты по ID, определяемые позже в обратном порядке, и сравнить время ответа
      для N и 2N
    notes: 'Real-world bug: RWB-0077 (GHSA-cxp5-3px4-pw24)'
  - action: Отправить в строковое поле длительности или даты компоненту из миллиона цифр и проверить, что отказ приходит быстро
      по лимиту длины
    notes: 'Real-world bug: RWB-0077 (GHSA-q4xh-88c3-wmh7)'
  - action: Отправлять XML из повторяющихся «</» мелкими порциями без закрывающей «>» и проверить, что время обработки не
      растёт квадратично, а сервис отвечает другим клиентам
    notes: 'Real-world bug: RWB-0077 (GHSA-v74w-7mr3-4qg3)'
  - action: Передать тело с числом из миллионов цифр потоково мелкими порциями без завершающего символа и проверить отказ
      по лимиту длины числа до конца передачи
    notes: 'Real-world bug: RWB-0077 (GHSA-r7wm-3cxj-wff9)'
  - action: Передать JSON с одним длинным токеном очень мелкими порциями и сравнить время обработки для длины N и 2N
    notes: 'Real-world bug: RWB-0077 (GHSA-w4cm-gvhj-cgw6)'
  - action: Отправить бинарное сообщение (Binary HTTP) с заявленной длиной секции полей, не совпадающей с границами строк
      полей, и проверить, что разбор завершается ошибкой за ограниченное время
    notes: 'Real-world bug: RWB-0077 (GHSA-4899-mpch-38p3)'
  - action: Отправить один кадр настроек соединения с сотнями тысяч уникальных параметров и проверить, что сервер его ограничивает
    notes: 'Real-world bug: RWB-0077 (GHSA-6jqx-86gh-f27w)'
  - action: Отправить заголовок baggage (или другой заголовок-список) с десятками тысяч элементов и проверить, что разбор
      ограничен лимитом
    notes: 'Real-world bug: RWB-0077 (GHSA-74xj-wh4w-vqxc)'
  - action: Отправить multipart-сообщение с тысячами частей-вложений
    notes: 'Real-world bug: RWB-0077 (GHSA-ghvc-7hp8-2g2v)'
  - action: Открыть много подписок на изменения без resourceVersion на большую коллекцию и проверить, что ограничитель учитывает
      их начальную выгрузку как дорогую операцию
    notes: 'Real-world bug: RWB-0077 (kubernetes/kubernetes#134580)'
  - action: Отправить заголовок Cookie предельного размера с множеством разделителей и пустых пар и сравнить время ответа
      с обычным
    notes: 'Real-world bug: RWB-0077 (GHSA-gh9q-2xrm-x6qv)'
  - action: Отправить JSON с буквой i/I на месте вложенного значения и проверить быстрый ответ
    notes: 'Real-world bug: RWB-0077 (GHSA-2x79-gwq3-vxxm)'
  - action: Отправить Accept-Encoding с тысячами значений * и сравнить время ответа с обычным
    notes: 'Real-world bug: RWB-0077 (GHSA-v569-hp3g-36wr)'
  - action: Отправить multipart с множеством частей, у которых длинные параметры с плотными обратными слэшами
    notes: 'Real-world bug: RWB-0077 (GHSA-v6x5-cg8r-vv6x)'
  - action: Отправить query с числом параметров сверх лимита, разделёнными ';' вместо '&'
    notes: 'Real-world bug: RWB-0077 (GHSA-625h-95r8-8xpm)'
  - action: Отправить XML с патологическими последовательностями (повторные XML-декларации, тысячи пробелов, '<', '>]', ']>',
      '>' в атрибутах) и сравнить время разбора с обычным документом того же размера
    notes: 'Real-world bug: RWB-0077 (GHSA-c2f4-jgmc-q2r5)'
  - action: Отправить в поле расписания (текстом или cron) строку длиной десятки тысяч символов
    notes: 'Real-world bug: RWB-0077 (GHSA-2m96-52r3-2f3g)'
  - action: Отправить XML с множеством вложенных расширений внутренних сущностей (billion laughs)
    notes: 'Real-world bug: RWB-0077 (GHSA-5866-49gr-22v4)'
  - action: Передать огромное значение параметра, задающего число повторов или итераций обработки
    notes: 'Real-world bug: RWB-0077 (GHSA-8c8q-2xw3-j869)'
  - action: Передать закодированный идентификатор (hashid) длиной до лимита URL веб-сервера и замерить время ответа
    notes: 'Real-world bug: RWB-0077 (GHSA-3px7-jm2p-6h2c)'
  - action: Отправить multipart с десятками тысяч нефайловых частей и проверить, что лимит считает все части, а не только
      файлы
    notes: 'Real-world bug: RWB-0077 (GHSA-3h57-hmj3-gj3p)'
  - action: Отправить в поле с серверным рендерингом Markdown большой патологический документ и сравнить время с обычным документом
      того же размера
    notes: 'Real-world bug: RWB-0077 (GHSA-636f-xm5j-pj9m)'
  - action: Отправить в поле с Markdown длинный текст из множества фрагментов, похожих на автоссылки, и сравнить время рендера
      с текстом вдвое короче
    notes: 'Real-world bug: RWB-0077 (GHSA-4qw4-jpp4-8gvp)'
  - action: Отправить форму с большим числом параметров, имена которых дают коллизии хэша, и проверить время ответа и лимит
      числа параметров
    notes: 'Real-world bug: RWB-0077 (GHSA-v6j3-7jrw-hq2p)'
  - action: Загрузить xlsx с номером строки далеко за пределом формата после обычной строки и проверить быстрый отказ
    notes: 'Real-world bug: RWB-0077 (GHSA-jw42-f3rr-4cc3)'
  - action: Загрузить зашифрованный OOXML-файл с завышенным spinCount и проверить быстрый отказ
    notes: 'Real-world bug: RWB-0077 (GHSA-jrfj-fhj2-jjvm)'
  - action: Отправить multipart-запрос с десятками тысяч минимальных файловых частей и проверить отказ по числу частей и что
      следующие запросы обслуживаются
    notes: 'Real-world bug: RWB-0077 (GHSA-rp9v-7xv3-r6g3)'
  - action: Запросить загрузку внешнего объекта с глубоко вложенным и ветвящимся графом ссылок с повторами и проверить отказ
      по лимиту глубины и ширины
    notes: 'Real-world bug: RWB-0077 (GHSA-pg57-6jwg-q645)'
  - action: Отправить длинный заголовок Accept-Language из некорректных тегов с разными разделителями и проверить обычное
      время ответа
    notes: 'Real-world bug: RWB-0077 (GHSA-jr34-h97m-9hpx)'
  - action: Отправить через каждый транспорт сервиса сообщение с некорректными счётчиками секций и проверить ранний отказ
    notes: 'Real-world bug: RWB-0077 (GHSA-mrg3-qvqr-jw29)'
  - action: Отправить в потоке кадр неизвестного типа с большой заявленной длиной и проверить, что сервер отбрасывает его
      тело без накопления в памяти
    notes: 'Real-world bug: RWB-0077 (GHSA-g35j-m5xg-vh3q)'
  - action: Отправить MIME-письмо с глубокой вложенностью multipart, тысячами соседних частей и мегабайтами строк заголовков;
      замерить время и память
    notes: 'Real-world bug: RWB-0077 (GHSA-f6v3-2qmr-vfjx)'
  - action: Отправить подписанное XML-сообщение (SAML) с XPath-преобразованиями и большим числом элементов Transform
    notes: 'Real-world bug: RWB-0077 (GHSA-5cjr-mxj5-wmrx)'
  - action: Отправить YAML из 8–9 уровней, где каждый уровень — массив алиасов на якорь предыдущего (billion laughs), и проверить
      отказ 4xx без роста памяти
    notes: 'Real-world bug: RWB-0077 (GHSA-7pxr-59rr-hqj2)'
  - action: Отправить в поле-выражение, которое вычисляет сервер, факториал огромного или дробного числа (99999999999999!,
      1.5e16!) и проверить отказ 4xx за ограниченное время
    notes: 'Real-world bug: RWB-0077 (GHSA-3w5p-95mh-gq75)'
  - action: Отправить подписанный XML (SAML, XML-DSig) с глубокой вложенностью, множеством атрибутов и пространств имён в
      канонизируемых узлах, DTD и множеством EncryptedData и проверить отказ 4xx без исчерпания ресурсов
    notes: 'Real-world bug: RWB-0077 (GHSA-c399-9853-6jmj)'
  - action: Отправить серию параллельных multipart-запросов и проверить, что память сервиса ограничена и запросы сверх лимита
      получают 4xx, а не отказ сервиса
    notes: 'Real-world bug: RWB-0077 (GHSA-w5qq-qrpp-rf4c)'
  - action: Отправить шаблон с умножением массива на огромное число ([1,2,3,4,5] * 50000000) и проверить отказ по лимиту без
      выделения памяти
    notes: 'Real-world bug: RWB-0077 (GHSA-q6rr-fm2g-g5x8)'
  - action: Отправить шаблон со вставкой элемента в массив по огромному индексу ({{ [1] | array.insert_at 200000000 'x' }})
      и проверить отказ по лимиту
    notes: 'Real-world bug: RWB-0077 (GHSA-24c8-4792-22hx)'
  - action: Отправить XML с некорректно сформированным зашифрованным элементом (EncryptedData, EncryptedKey) и проверить отказ
      4xx за ограниченное время
    notes: 'Real-world bug: RWB-0077 (GHSA-37gx-xxp4-5rgx)'
  - action: Отправить пользовательский шаблон с умножением строки на очень большое число и сдвигом большого целого на миллионы
      бит и проверить отказ по лимиту
    notes: 'Real-world bug: RWB-0077 (GHSA-xw6w-9jjh-p9cr)'
  - action: Отправить шаблон из множества выражений, каждое чуть меньше лимита вывода, и проверить, что ограничен суммарный
      размер результата
    notes: 'Real-world bug: RWB-0077 (GHSA-m2p3-hwv5-xpqw)'
  - action: Вызвать во входном шаблоне функцию дополнения строки (pad_left, pad_right) с шириной около 10^9 и проверить отказ
      без выделения памяти
    notes: 'Real-world bug: RWB-0077 (GHSA-v66j-x4hw-fv9g)'
  - action: Отправить шаблон с операцией над большим диапазоном (1..1000000 | array.size) при малом лимите циклов и проверить
      прерывание по лимиту
    notes: 'Real-world bug: RWB-0077 (GHSA-c875-h985-hvrc)'
  - action: Отправить шаблон, удваивающий строку в цикле из 30 итераций, и проверить отказ по лимиту размера при настройках
      по умолчанию
    notes: 'Real-world bug: RWB-0077 (GHSA-5rpf-x9jg-8j5p)'
  - action: Загрузить MVG с многоуровневой вложенностью, запросить конвертацию в SVG и проверить отказ по лимиту глубины за
      ограниченное время
    notes: 'Real-world bug: RWB-0077 (GHSA-wg3g-gvx5-2pmv)'
  - action: Отправить тело в формате Amazon Ion с синтаксической ошибкой и проверить отказ 4xx за ограниченное время
    notes: 'Real-world bug: RWB-0077 (GHSA-q5r6-9qwq-g2wj)'
  - action: Передать (загрузить или предъявить при mTLS) EC-сертификат с искусственными параметрами кривой F2m и проверить
      отказ за ограниченное время
    notes: 'Real-world bug: RWB-0077 (GHSA-8xfc-gm6g-vgpv)'
  expected:
  - Действуют лимиты на размер, время и параллельность; сервис доступен другим клиентам.
  applicability:
    when:
    - Есть дорогие операции.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
