- id: ASYNC-JOB-LIFECYCLE
  status: approved
  title: Фоновая задача проходит статусы и отдаёт результат
  category: async
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: positive
  priority: P2
  tags:
  - positive
  - async-jobs
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть асинхронные задачи.
  steps:
  - action: Создать задачу, опрашивать статус до завершения, получить результат; задачу с ошибкой.
  - action: Задача падает на ограничении данных — проверить детализацию причины в статусе и судьбу частичного результата
    notes: 'Real-world bug: RWB-0052 (strapi/strapi#26579)'
  - action: Удалить целевой тип ресурса, пока фоновая задача ожидает выполнения, и проверить, что задача переходит в статус
      ошибки, а остальные фоновые задачи продолжают обрабатываться
    notes: 'Real-world bug: RWB-0052 (kubernetes/kubernetes#140561)'
  expected:
  - Статусы соответствуют контракту; ошибка содержит причину; результат доступен в течение срока хранения.
  applicability:
    when:
    - Есть задачи.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0052'
