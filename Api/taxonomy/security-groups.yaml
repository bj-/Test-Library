# Группы проверок безопасности (ADR 0011): каждая группа - отдельная сессия ассистента на всех этапах
# (генерация тестов, прогон, разбор, баги, поиск дублей). Остановка фильтра безопасности в одной группе не обрывает
# работу с остальными, сессия не читает подробности чужих групп.
#
# В группу попадает запись из checks/security/, категории security или с меткой security. Группу назначает скрипт по правилам ниже
# (сверху вниз, первое совпадение), явное поле записи `security_group` важнее правил.
# Индекс id -> группа: taxonomy/security-groups-index.yaml (`python tools/security_groups.py index`, вручную не править).
# Метка группы - id группы: в метаданных тестов («метки»), в шапке бага («Группа»), тег задачи в трекере.
#
# risk - риск остановки фильтром: low / medium / high / restricted (только заготовки [DRAFT] и работа человека).
# executor - кто ведёт рутину группы (генерация, разбор, баги), ADR 0011, решение bj 2026-10-23. Значение -
# ЛОГИЧЕСКОЕ имя из таблицы `executors` ниже, не конкретная модель: модель с низким фильтром меняется в одном месте
# (сегодня 4.8; когда её выведут, «более старой» станет модель с фильтром - тогда правится только `executors`).
#   self   - основная сессия ассистента (низкий риск остановки);
#   child  - дочерняя сессия claude -p на модели с низким фильтром (`executors.child.model`); останавливает и её -
#            путь на внешнюю/локальную LLM (`executors.external`);
#   human  - только человек (sg-restricted).
# Исполнитель - не обход ограничения: остановленный фрагмент не повторяется (память ai-generation-restrictions).

# Конкретные исполнители логических имён - правятся при смене доступных моделей, группы не трогаются.
executors:
  self:
    kind: main
  child:
    kind: child                       # дочерняя сессия: claude -p "<промпт группы>" --model <model> из каталога проекта
    model: claude-opus-4-8            # модель Claude с низким фильтром на сегодня; сменить здесь, когда 4.8 выведут
    # «Более старой» с низким фильтром может оказаться и модель другого семейства Claude - Sonnet или Haiku,
    # в том числе старой версии (claude-sonnet-*, claude-haiku-*); сначала перебрать их через тот же claude -p --model,
    # к external переходить, только если подходящей модели Claude нет (решение bj 2026-10-23).
    note: Проверяется по итогам первой сессии sg-token; не ловит блоки - вся рутина безопасности на неё (решение bj 2026-10-23).
    on_filter_stop: external          # остановит и её (и нет другой модели Claude) - перейти к external; фрагмент не повторять
  external:
    kind: external                    # сторонняя/локальная LLM без доступа к репозиторию: выгрузка export_for_llm.py --group,
    via: Api/tools/export_for_llm.py  # ответ проверяет скрипт и подставляет дочерняя сессия (как сбор inj-a, Process/test-data.md)
    targets:                          # крайний случай, когда нет подходящей модели Claude; локальный Qwen - для простой рутины
      - local-qwen
      - chatgpt
  human:
    kind: human
groups:
  - id: sg-restricted
    title: Стоп-темы - подбор, перечисление, готовые значения закрытых инъекций
    risk: restricted
    executor: child
    note: Записи с automation.ai_generation.restricted и кандидаты стоп-тем (ai-stop-topics.yaml) - даже без флага.
      Генерация - только дочерняя сессия, одна запись на сессию, оркестратор «вслепую» (ADR 0014, bj 2026-10-29);
      разбор прогона - человек; флаг записи по-прежнему ставит человек (restrict_records.py).
  - id: sg-token
    title: Токены и проверка аутентификации запроса - подделка и структура JWT, подпись, alg, aud/iss, сроки, тип токена
    risk: medium
    executor: child
    note: 2026-10-23 - остановка основной сессии на чтении кода подделки JWT фреймворка (forgeJwt). Рутину ведёт
      дочерняя сессия (executors.child).
  - id: sg-session
    title: Сессии - обновление и повтор refresh, выход и его область, отзыв, cookie, CSRF, тайм-ауты
    risk: medium
    executor: child
    note: 2026-10-21 - остановка на теме «вход и сессии» мобильного приложения (BFF-Mobile-Auth).
  - id: sg-login
    title: Вход и учётные данные - одноразовые коды, пароли, MFA, OAuth/OIDC/SAML, внешние IdP, нормализация логина
    risk: medium
    executor: child
  - id: sg-authz
    title: Авторизация - роли, владение объектом (BOLA), тенанты, scope, повышение привилегий
    risk: low
    executor: self
  - id: sg-injection
    title: Инъекции - значения только по ссылке TD (ADR 0009)
    risk: medium
    executor: child
  - id: sg-privacy
    title: Персональные и чувствительные данные - маскирование, утечки, удаление, согласия
    risk: low
    executor: self
  - id: sg-hardening
    title: Укрепление API - заголовки, CORS, TLS, отладочные ручки, лимиты, кэш, прочее
    risk: low
    executor: self

# Правило: ids - шаблоны id (fnmatch), tags - метки записи; совпадение по любому из них.
# sg-restricted назначает скрипт до правил: флаг restricted или совпадение со стоп-темой.
rules:
  # --- по id: точнее меток (AUTH-JWT-HEADER-INJECTION - токен, а не инъекция) ---
  # записи, сгенерированные из реальных контрактов, - по операции в id
  - group: sg-login
    ids: [REAL-*-LOGIN-INVALID-*, REAL-*-SENDCODE-*, REAL-*-VERIFYCODE-*]
  - group: sg-session
    ids: [REAL-*-REFRESH-*, REAL-*-LOGOUT-*]
  - group: sg-session
    ids: [SEC-TOKEN-REFRESH-REPLAY, SEC-TOKEN-REVOKED, AUTH-REFRESH-*, AUTH-LOGOUT-*, AUTH-SESSION-*, AUTH-REVOKED-*,
          AUTH-PASSWORD-CHANGE-REVOKES, AUTH-CONCURRENT-SESSIONS, AUTH-COOKIE-*, AUTH-CSRF, AUTH-OIDC-LOGOUT-*,
          AUTH-PROTOCOL-SESSION-*, AUTH-LOGIN-CROSS-ACCOUNT-COOKIE, AUTH-DUPLICATE-CREDENTIALS, GQL-CSRF-*, WS-ORIGIN-CHECK]
  - group: sg-token
    ids: [AUTH-JWT-*, SEC-TOKEN-*, AUTH-TOKEN-*, AUTH-API-KEY-*, AUTH-CLIENT-ASSERTION-*, AUTH-SAML-ASSERTION-*,
          SEC-AUTHN-*, SECURITY-AUTH-REQUIRED, REST-AUTH-ERROR-NO-LEAK, GRPC-METADATA-AUTH-*,
          GRPC-UNAUTHENTICATED-VS-PERMISSION-DENIED, GRPC-STREAM-AUTH-EXPIRY, WS-HANDSHAKE-AUTH, WS-TOKEN-EXPIRY,
          ASYNC-WEBHOOK-SIGNATURE, AUTH-CREDENTIAL-CHANNEL-STRICT, AUTH-PATH-NORMALIZATION-BYPASS]
  - group: sg-login
    ids: [AUTH-OTP-*, AUTH-PASSWORD-*, AUTH-MFA-*, AUTH-OAUTH-*, AUTH-EXTERNAL-*, AUTH-LOGIN-*, AUTH-MULTISTEP-*,
          AUTH-CONTACT-*, AUTH-IMPORTED-*, AUTH-BASIC-*, AUTH-PRE-ACCOUNT-*, AUTH-SENSITIVE-CHANGE-*, UI-AUTH-FLOWS]
  - group: sg-injection
    ids: [INJ-*, AUTH-NOSQL-*, DB-DYNAMIC-SQL-*, REST-SSRF-*, ASYNC-WEBHOOK-URL-SSRF, HARD-HOST-HEADER,
          FILE-FILENAME-SANITIZATION, UI-SAFE-RENDERING]
  - group: sg-authz
    ids: [SEC-AUTHZ-*, SEC-ROLE-*, SEC-TENANT-*, SEC-OWNERSHIP-*, SEC-SCOPE-*, SEC-BOLA-*, SEC-*-ESCALATION, REST-OBJECT-LEVEL-AUTHZ,
          REST-MASS-ASSIGNMENT, SECURITY-AUTHZ-*, SEC-IDENTITY-PROOF-OF-POSSESSION, REAL-*-ACCESS-*]
  - group: sg-privacy
    ids: [PRIV-*, REST-SENSITIVE-DATA, HARD-EXCESSIVE-DATA-EXPOSURE, HARD-SENSITIVE-DATA-IN-URL, OBS-NO-SECRETS-IN-LOGS]
  - group: sg-hardening
    ids: [HARD-*, REST-CORS-*, REST-SECURITY-HEADERS, REST-RATE-LIMIT, REST-SENSITIVE-CACHE-CONTROL, REST-OPEN-REDIRECT, GQL-ALIAS-BATCH-ABUSE]
  # --- по меткам: для остального ---
  - group: sg-login
    tags: [otp]
  - group: sg-session
    tags: [session]
  - group: sg-token
    tags: [token-lifecycle]
  - group: sg-injection
    tags: [injection]
  - group: sg-authz
    tags: [authz, ownership, tenant-isolation, roles-scopes, privilege-escalation]
  - group: sg-privacy
    tags: [privacy]
  - group: sg-login
    ids: [AUTH-*]
  - group: sg-token
    tags: [authn]
default: sg-hardening
