- id: DB-CONNECTION-POOL-LIFECYCLE
  status: approved
  title: Соединения пула освобождаются и не оставляют фоновой нагрузки
  category: db
  protocols:
  - db
  kind: reliability
  priority: P3
  tags:
  - db
  - reliability
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  - Нужна статистика соединений и журнал запросов БД.
  steps:
  - action: Оставить соединения пула простаивать — закрываются по тайм-ауту, память на кэш каталога не копится
    notes: inbox №312
  - action: Отключить всех подписчиков потоковых подписок — периодических опросов в журнале запросов БД не остаётся
    notes: inbox №178
  expected:
  - Простаивающие соединения закрываются по тайм-ауту без роста памяти; после отключения клиентов периодических запросов нет.
  applicability:
    when:
    - Есть пул соединений.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация пула соединений
  - ADR 0006 (проверки БД)
- id: DB-CONNECTION-CONFIG-HANDLING
  status: approved
  title: Ошибки и формы настройки подключения к БД обрабатываются предсказуемо
  category: db
  protocols:
  - db
  kind: reliability
  priority: P3
  tags:
  - db
  - reliability
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  - Нужна возможность перезапускать сервис с разной конфигурацией.
  steps:
  - action: Запустить сервис с неверным паролем к БД — ограниченное число повторов и понятная ошибка, а не бесконечный цикл
      подключений
    notes: inbox №313
  - action: Задать строку подключения в формате URI без параметров — параметры, которые добавляет сервис (application_name),
      её не ломают
    notes: inbox №314
  expected:
  - Неверные учётные данные — ограниченное число повторов и понятная ошибка; строка подключения любой допустимой формы работает.
  applicability:
    when:
    - Есть настройка подключения к БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация драйвера
  - ADR 0006 (проверки БД)
- id: DB-DRIVER-LARGE-PARAMS
  status: approved
  title: Драйвер БД обрабатывает параметры очень большого размера
  category: db
  protocols:
  - db
  kind: boundary
  priority: P3
  tags:
  - db
  - boundary
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  - Стенд и драйвер должны допускать такие объёмы.
  steps:
  - action: Передать параметры суммарным размером больше 2^31 байт (если стенд и драйвер это допускают) — драйвер не переполняет
      длину сообщения
    notes: inbox №293
  expected:
  - Параметры суммарным размером больше 2^31 байт отклоняются понятной ошибкой или обрабатываются; переполнения длины сообщения
    нет.
  applicability:
    when:
    - Есть передача больших значений в БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация драйвера
  - ADR 0006 (проверки БД)
- id: DB-METADATA-CACHE-FRESH
  status: approved
  title: Кэш метаданных схемы в сервисе актуален после изменений БД
  category: db
  protocols:
  - db
  kind: reliability
  priority: P2
  tags:
  - db
  - reliability
  - ci
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Выполнить серию DDL-миграций с уведомлением после каждой — кэш метаданных в состоянии после последней
    notes: inbox №307
  - action: Пересоздать таблицу с другим типом колонки — долгоживущие соединения пула не используют устаревшие метаданные
    notes: inbox №309
  expected:
  - После DDL и уведомлений кэш соответствует последней схеме; долгоживущие соединения пула не используют устаревшие метаданные.
  applicability:
    when:
    - Сервис кэширует схему БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Смежная — PERF-METADATA-RELOAD-NO-BLOCK
  - ADR 0006 (проверки БД)
