  - API exposes asynchronous jobs or operation handles.
  steps:
  - action: Create or discover a job as user A and attempt to poll, cancel, or fetch its result as user B.
    notes: 'Matrix axis: Authorization; scenario: Async job ownership. Use isolated synthetic identities and data.'
  - action: Эндпоинт списка задач, а не только чтение отдельной задачи
    notes: 'Real-world bug: RWB-0144 (GHSA-7hfw-grcm-cqm6)'
