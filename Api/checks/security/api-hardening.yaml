checks:
- id: HARD-TLS-ONLY
  status: approved
  title: API доступен только по TLS с актуальными настройками
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - transport-security
  - hardening
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Публичный или межсервисный эндпоинт.
  steps:
  - action: Обратиться по HTTP, по TLS 1.0/1.1, со слабыми шифрами; проверить HSTS и сертификат.
  expected:
  - HTTP отклоняется или перенаправляется без передачи данных; устаревшие протоколы отключены; HSTS присутствует; сертификат
    валиден.
  applicability:
    when:
    - Сетевой доступ к эндпоинту.
    skip_when:
    - Тест в среде без TLS (зафиксировать).
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: HARD-DEBUG-ENDPOINTS
  status: approved
  title: Отладочные и служебные эндпоинты недоступны извне
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Известен стек (Spring, .NET, Node, Django).
  steps:
  - action: Запросить /actuator, /debug, /metrics, /env, /swagger, /graphiql, /.git, /admin, /console, /heapdump.
  - action: Служебный сервер доступен по сети (0.0.0.0) и с wildcard CORS — проверить доступность не с loopback и ответ на
      preflight с чужим Origin
    notes: 'Real-world bug: RWB-0075 (GHSA-jmg2-rcxh-w8q3)'
  expected:
  - Служебные эндпоинты закрыты или требуют аутентификации в соответствии с политикой окружения.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0075'
- id: HARD-VERSION-DISCLOSURE
  status: approved
  title: Ответы не раскрывают версии ПО и инфраструктуры
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P3
  tags:
  - security
  - hardening
  - regression
  - nightly
  preconditions:
  - Нет.
  steps:
  - action: Проанализировать Server, X-Powered-By, X-AspNet-Version и тела ошибок.
  expected:
  - Версии продуктов не раскрываются.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: HARD-EXCESSIVE-DATA-EXPOSURE
  status: approved
  title: Ответы не содержат внутренних полей сверх контракта
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - contract
  - privacy
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Схемы ответов описаны в контракте.
  steps:
  - action: Сравнить фактические поля ответов со схемой для всех ролей.
  - action: 'Вариант для токенов: состав claims по политике проверить для каждого типа grant, а не только основного'
    notes: 'Real-world bug: RWB-0076 (keycloak/keycloak#51137)'
  - action: Ответы о фоновых задачах (статус, шаги, журнал) — без секретов контекста выполнения
    notes: 'Real-world bug: RWB-0076 (GHSA-g2v8-7jhw-pp8p)'
  - action: Ответы auth-эндпоинтов (refresh, reset, verify), обходящие общую фильтрацию полей
    notes: 'Real-world bug: RWB-0076 (GHSA-xgv3-crq2-6f69)'
  - action: Запросить ресурс в альтернативных форматах через расширение пути (.xml, .json) и сравнить набор полей с основным
      ответом
    notes: 'Real-world bug: RWB-0076 (GHSA-f25h-3mj6-4jpg)'
  expected:
  - 'Нет недокументированных полей: внутренних id, флагов, хешей паролей, служебных метаданных.'
  applicability:
    when:
    - Есть схемы ответов.
    skip_when:
    - Схемы отсутствуют.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0076'
- id: HARD-ID-PREDICTABILITY
  status: approved
  title: Предсказуемые идентификаторы не позволяют собрать данные перебором
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - enumeration
  - ci
  - regression
  - nightly
  preconditions:
  - Используются последовательные числовые id.
  steps:
  - action: Перебрать соседние id от имени пользователя без прав.
  - action: Сравнить ответы для существующих и несуществующих id.
  expected:
  - Ответы для чужих и несуществующих id неразличимы по политике.
  - Нельзя оценить объём бизнеса по id.
  applicability:
    when:
    - Последовательные id.
    skip_when:
    - UUID или случайные id.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: HARD-SHADOW-API-VERSIONS
  status: approved
  title: Старые версии API и недокументированные маршруты не обходят защиту
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - versioning
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API версионируется.
  steps:
  - action: Вызвать ту же операцию через /v0, /v1, /beta, /internal, старые хосты.
  - action: Сравнить авторизацию и валидацию с текущей версией.
  - action: Устаревший маршрут доверяет описанию сущности из тела запроса - сравнить объём выдачи с актуальной операцией при
      подменённых атрибутах
    notes: 'Real-world bug: RWB-0079 (GHSA-r9ph-3637-55px)'
  expected:
  - Устаревшие версии отключены или защищены не слабее текущей.
  applicability:
    when:
    - Есть версионирование.
    skip_when:
    - Одна версия.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0079'
- id: HARD-METHOD-OVERRIDE
  status: approved
  title: Заголовки переопределения метода не обходят авторизацию
  category: security
  protocols:
  - rest
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authz
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - За шлюзом или фреймворком, поддерживающим override.
  steps:
  - action: 'Отправить POST с X-HTTP-Method-Override: DELETE, X-Method-Override, _method=PUT.'
  expected:
  - Override игнорируется или проверяется так же, как исходный метод.
  applicability:
    when:
    - Всегда для REST.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: HARD-HOST-HEADER
  status: approved
  title: Подмена Host и X-Forwarded-Host не влияет на ссылки и маршрутизацию
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API формирует абсолютные ссылки (сброс пароля, Location, pagination links).
  steps:
  - action: Отправить запрос с поддельными Host, X-Forwarded-Host, X-Forwarded-Proto, Forwarded.
  - action: Сервис без аутентификации — Host проверяется по allowlist; совпадения Origin с Host недостаточно
    notes: 'Real-world bug: RWB-0078 (GHSA-fm8p-53ww-hf6w)'
  expected:
  - Ссылки строятся из доверенной конфигурации, а не из заголовков клиента.
  applicability:
    when:
    - Есть абсолютные ссылки.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0078'
- id: HARD-CACHE-POISONING
  status: approved
  title: Неключевые заголовки не отравляют общий кэш
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - caching
  - costly
  - regression
  - nightly
  preconditions:
  - Есть CDN или обратный прокси с кэшем.
  steps:
  - action: Отправить запрос с X-Forwarded-Host, X-Original-URL и cache buster; затем обычный запрос.
  expected:
  - Второй запрос не получает отравленный ответ.
  applicability:
    when:
    - Есть общий кэш.
    skip_when:
    - Кэша нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: HARD-BUSINESS-FLOW-AUTOMATION
  status: approved
  title: Чувствительные бизнес-потоки защищены от автоматизированного злоупотребления
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - business-logic
  - rate-limiting
  - costly
  - regression
  - nightly
  preconditions:
  - Есть потоки регистрации, бронирования, покупки, отправки сообщений.
  steps:
  - action: Выполнить поток скриптом массово с одного и нескольких клиентов.
  expected:
  - Срабатывают задокументированные ограничения (лимиты, CAPTCHA, device binding).
  applicability:
    when:
    - Есть чувствительные потоки.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - OWASP API Security Top 10
- id: HARD-UNSAFE-API-CONSUMPTION
  status: approved
  title: Ответы сторонних API валидируются перед использованием
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - resilience
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис вызывает внешние API.
  steps:
  - action: Через заглушку внешнего API вернуть некорректную схему, огромный ответ, редирект, инъекции в полях.
  - action: Добавить сбои на уровне соединения и протокола у внешнего узла (обрыв, не тот протокол) — не только некорректные
      ответы
    notes: 'Real-world bug: RWB-0080 (GHSA-542g-h47m-68v8)'
  - action: Тяжёлый для разбора ответ внешнего сервера (ReDoS/квадратичный парсер), а не только неверные данные
    notes: 'Real-world bug: RWB-0080 (GHSA-c475-qrg2-pj4r)'
  - action: Компрессионная бомба в ответе внешнего сервиса
    notes: 'Real-world bug: RWB-0080 (GHSA-3xpg-4rpp-hhhm)'
  expected:
  - Сервис отклоняет или санитизирует данные, не следует редиректам слепо, ограничивает размер.
  applicability:
    when:
    - Есть интеграции.
    skip_when:
    - Интеграций нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0080'
- id: HARD-EXPENSIVE-OPERATION-LIMITS
  status: approved
  title: Дорогие операции ограничены по ресурсам
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - rate-limiting
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть экспорт, отчёты, поиск, массовые операции.
  steps:
  - action: Запросить максимальный limit, широкий период, тяжёлые фильтры, параллельные экспорты.
  - action: Усиление памяти при разборе URL (числовые ключи параметров)
    notes: 'Real-world bug: RWB-0077 (GHSA-ff3f-86qr-9cv3)'
  - action: Сверхдлинный пароль на auth-эндпоинтах (в том числе для несуществующего пользователя)
    notes: 'Real-world bug: RWB-0077 (GHSA-477h-4r7f-fvrx)'
  - action: Алгоритмическая сложность парсеров ввода — плоский вход с большим числом элементов при нулевой вложенности
    notes: 'Real-world bug: RWB-0077 (GHSA-rj75-hqrm-r3gf)'
  - action: YAML с алиасами и merge-ключами (включая пустые отображения) — стоимость разбора ограничена
    notes: 'Real-world bug: RWB-0077 (GHSA-r3ph-w7gj-g6xm)'
  - action: Отправить коллекцию из N ссылок на объекты по ID, определяемые позже в обратном порядке, и сравнить время ответа
      для N и 2N
    notes: 'Real-world bug: RWB-0077 (GHSA-cxp5-3px4-pw24)'
  - action: Отправить в строковое поле длительности или даты компоненту из миллиона цифр и проверить, что отказ приходит быстро
      по лимиту длины
    notes: 'Real-world bug: RWB-0077 (GHSA-q4xh-88c3-wmh7)'
  - action: Отправлять XML из повторяющихся «</» мелкими порциями без закрывающей «>» и проверить, что время обработки не
      растёт квадратично, а сервис отвечает другим клиентам
    notes: 'Real-world bug: RWB-0077 (GHSA-v74w-7mr3-4qg3)'
  - action: Передать тело с числом из миллионов цифр потоково мелкими порциями без завершающего символа и проверить отказ
      по лимиту длины числа до конца передачи
    notes: 'Real-world bug: RWB-0077 (GHSA-r7wm-3cxj-wff9)'
  - action: Передать JSON с одним длинным токеном очень мелкими порциями и сравнить время обработки для длины N и 2N
    notes: 'Real-world bug: RWB-0077 (GHSA-w4cm-gvhj-cgw6)'
  - action: Отправить бинарное сообщение (Binary HTTP) с заявленной длиной секции полей, не совпадающей с границами строк
      полей, и проверить, что разбор завершается ошибкой за ограниченное время
    notes: 'Real-world bug: RWB-0077 (GHSA-4899-mpch-38p3)'
  - action: Отправить один кадр настроек соединения с сотнями тысяч уникальных параметров и проверить, что сервер его ограничивает
    notes: 'Real-world bug: RWB-0077 (GHSA-6jqx-86gh-f27w)'
  - action: Отправить заголовок baggage (или другой заголовок-список) с десятками тысяч элементов и проверить, что разбор
      ограничен лимитом
    notes: 'Real-world bug: RWB-0077 (GHSA-74xj-wh4w-vqxc)'
  - action: Отправить multipart-сообщение с тысячами частей-вложений
    notes: 'Real-world bug: RWB-0077 (GHSA-ghvc-7hp8-2g2v)'
  - action: Открыть много подписок на изменения без resourceVersion на большую коллекцию и проверить, что ограничитель учитывает
      их начальную выгрузку как дорогую операцию
    notes: 'Real-world bug: RWB-0077 (kubernetes/kubernetes#134580)'
  - action: Отправить заголовок Cookie предельного размера с множеством разделителей и пустых пар и сравнить время ответа
      с обычным
    notes: 'Real-world bug: RWB-0077 (GHSA-gh9q-2xrm-x6qv)'
  - action: Отправить JSON с буквой i/I на месте вложенного значения и проверить быстрый ответ
    notes: 'Real-world bug: RWB-0077 (GHSA-2x79-gwq3-vxxm)'
  - action: Отправить Accept-Encoding с тысячами значений * и сравнить время ответа с обычным
    notes: 'Real-world bug: RWB-0077 (GHSA-v569-hp3g-36wr)'
  - action: Отправить multipart с множеством частей, у которых длинные параметры с плотными обратными слэшами
    notes: 'Real-world bug: RWB-0077 (GHSA-v6x5-cg8r-vv6x)'
  - action: Отправить query с числом параметров сверх лимита, разделёнными ';' вместо '&'
    notes: 'Real-world bug: RWB-0077 (GHSA-625h-95r8-8xpm)'
  - action: Отправить XML с патологическими последовательностями (повторные XML-декларации, тысячи пробелов, '<', '>]', ']>',
      '>' в атрибутах) и сравнить время разбора с обычным документом того же размера
    notes: 'Real-world bug: RWB-0077 (GHSA-c2f4-jgmc-q2r5)'
  - action: Отправить в поле расписания (текстом или cron) строку длиной десятки тысяч символов
    notes: 'Real-world bug: RWB-0077 (GHSA-2m96-52r3-2f3g)'
  - action: Отправить XML с множеством вложенных расширений внутренних сущностей (billion laughs)
    notes: 'Real-world bug: RWB-0077 (GHSA-5866-49gr-22v4)'
  - action: Передать огромное значение параметра, задающего число повторов или итераций обработки
    notes: 'Real-world bug: RWB-0077 (GHSA-8c8q-2xw3-j869)'
  - action: Передать закодированный идентификатор (hashid) длиной до лимита URL веб-сервера и замерить время ответа
    notes: 'Real-world bug: RWB-0077 (GHSA-3px7-jm2p-6h2c)'
  - action: Отправить multipart с десятками тысяч нефайловых частей и проверить, что лимит считает все части, а не только
      файлы
    notes: 'Real-world bug: RWB-0077 (GHSA-3h57-hmj3-gj3p)'
  - action: Отправить в поле с серверным рендерингом Markdown большой патологический документ и сравнить время с обычным документом
      того же размера
    notes: 'Real-world bug: RWB-0077 (GHSA-636f-xm5j-pj9m)'
  - action: Отправить в поле с Markdown длинный текст из множества фрагментов, похожих на автоссылки, и сравнить время рендера
      с текстом вдвое короче
    notes: 'Real-world bug: RWB-0077 (GHSA-4qw4-jpp4-8gvp)'
  - action: Отправить форму с большим числом параметров, имена которых дают коллизии хэша, и проверить время ответа и лимит
      числа параметров
    notes: 'Real-world bug: RWB-0077 (GHSA-v6j3-7jrw-hq2p)'
  expected:
  - Действуют лимиты на размер, время и параллельность; сервис доступен другим клиентам.
  applicability:
    when:
    - Есть дорогие операции.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0077'
- id: HARD-SENSITIVE-DATA-IN-URL
  status: approved
