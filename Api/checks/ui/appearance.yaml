checks:
- id: UI-TEXTS-CORRECT
  status: approved
  title: Тексты интерфейса без ошибок и на языке интерфейса
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P3
  tags:
  - ui
  - i18n
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Прочитать тексты экранов, подписи, подсказки и сообщения об ошибках — без ошибок, на языке интерфейса, сообщение
      соответствует заголовку окна и ситуации
    notes: inbox №99
  - action: Вызвать пустые состояния (нет результатов поиска) — тексты без опечаток, термины написаны правильно
    notes: inbox №180
  - action: Проверить раскрытие плейсхолдеров локализации во всех местах показа имени, включая QR-код и ссылки для внешних
      приложений
    notes: inbox №334
  - action: Сменить язык интерфейса и вернуть обратно - названия, заданные пользователем (объект, комната, устройство), не
      переводятся и не меняются, локализуется только системный текст
    notes: inbox №452
  - action: Настольный клиент при русской и английской локали ОС - текст диалогов, системные кнопки (Да/Нет/Отмена, а не
      Yes/No/Cancel), установщик, деинсталлятор и справка на языке интерфейса программы
    notes: inbox №460
  - action: 'Мобильное приложение - сменить язык и регион ОС: язык и регион приложения меняются по правилу ТЗ, язык ОС
      не из списка поддерживаемых - запасной язык по ТЗ, длинные переводы не обрезаются'
    notes: inbox №486
  expected:
  - Тексты экранов, пустых состояний и сообщений без орфографических и грамматических ошибок, на языке интерфейса, термины
    единообразны.
  - Названия, заданные пользователем, при смене языка не меняются.
  - Язык диалогов, системных кнопок, установщика и справки не зависит от локали ОС и совпадает с языком интерфейса.
  - Язык и регион приложения следуют за ОС по правилу ТЗ, для неподдерживаемого языка - запасной язык; длинные
    переводы видны полностью.
  applicability:
    when:
    - Есть клиент с текстами интерфейса.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-VISUAL-CONSISTENCY
  status: approved
  title: Шрифты, отступы и кнопки единообразны по макету и гайдлайнам
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P3
  tags:
  - ui
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Сравнить гарнитуру, размер и начертание с макетом; включить системное увеличение шрифта — вёрстка не ломается
    notes: inbox №100
  - action: Проверить выравнивание текстов, полей, колонок и сообщений об ошибках — ничего не налезает
    notes: inbox №101
  - action: Сравнить кнопки одного типа действий по виду и размеру; на mobile зона нажатия не меньше 44 pt или 48 dp
    notes: inbox №103
  expected:
  - Шрифты, выравнивание и кнопки одного типа соответствуют макету и гайдлайну платформы; системное увеличение шрифта не ломает
    вёрстку; зона нажатия на mobile по гайдлайну платформы.
  applicability:
    when:
    - Есть макет или гайдлайн интерфейса.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Apple HIG (44 pt), Material Design (48 dp)
  - ADR 0006 (проверки UI)
- id: UI-RESPONSIVE-LAYOUT
  status: approved
  title: Интерфейс работает на всех поддерживаемых размерах экрана
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: compatibility
  priority: P2
  tags:
  - ui
  - compatibility
  - ci
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Проверить web от 640×480 до 4K и масштаб браузера; desktop — размер окна, DPI 100–200 %, несколько мониторов;
      mobile — малые и большие экраны, планшеты, портрет и ландшафт, вырезы
    notes: inbox №108
  - action: Проверить, что прокрутка появляется только когда содержимое не помещается; в web на узком экране нет горизонтальной
      прокрутки страницы
    notes: inbox №111
  expected:
  - Вёрстка корректна на всех размерах и масштабах; прокрутка появляется только при необходимости; горизонтальной прокрутки
    страницы на узком экране нет.
  applicability:
    when:
    - Клиент поддерживает несколько размеров экрана.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-PLATFORM-COMPATIBILITY
  status: approved
  title: Интерфейс одинаково работает в поддерживаемых браузерах, ОС и режимах
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: compatibility
  priority: P2
  tags:
  - ui
  - compatibility
  - i18n
  - ci
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Проверить отображение, картинки, шрифты, анимацию и JavaScript в поддерживаемых браузерах и версиях, включая мобильные
    notes: inbox №127
  - action: Проверить поддерживаемые версии ОС, производителей и размеры экрана, тёмную тему и системный язык
    notes: inbox №128
  - action: Включить RTL — элементы, не зависящие от языка (редактор кода, цветовых значений), не переворачиваются
    notes: inbox №202
  - action: Мобильное приложение - установка и основной сценарий на нижней границе версии ОС по ТЗ; на версии ниже
      границы магазин не даёт поставить или приложение сообщает о неподдерживаемой версии
    notes: inbox №488
  expected:
  - Отображение и поведение одинаковы в поддерживаемых браузерах, ОС и устройствах, в тёмной теме, на системном языке и в
    RTL.
  - На нижней границе версии ОС основной сценарий работает, ниже границы - сообщение о неподдерживаемой версии, а не
    падение.
  applicability:
    when:
    - Заявлен список поддерживаемых браузеров, ОС или устройств.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-KEYBOARD-ACCESS
  status: approved
  title: Интерфейс полностью управляется с клавиатуры в логическом порядке
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - ci
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Пройти форму по TAB и Shift+TAB — логический порядок, фокус виден; на mobile «Далее» ведёт к следующему полю
    notes: inbox №110
  - action: Пройти сценарии без мыши — все поля, списки, радиокнопки, чекбоксы и кнопки управляются с клавиатуры
    notes: inbox №113
  - action: Нажать горячие клавиши редактора в каждом поддерживаемом браузере — перехватываются и не вызывают встроенные действия
      браузера
    notes: inbox №278
  - action: Пройти экран по Tab - фокус попадает в каждую группу переключателей и на все активные элементы; при переходе
      в поле текст выделяется или редактируется по правилу платформы
    notes: inbox №471
  expected:
  - Все элементы доступны с клавиатуры; порядок фокуса логичен и виден; горячие клавиши перехватываются приложением во всех
    браузерах.
  applicability:
    when:
    - Есть клиент, управляемый с клавиатуры.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - WCAG 2.1 — 2.1.1, 2.4.3, 2.4.7
  - ADR 0006 (проверки UI)
- id: UI-FIELD-LABELS-MATCH-FORM
  status: approved
  title: Подписи и подсказки полей соответствуют назначению формы
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P3
  tags:
  - ui
  - i18n
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Сравнить placeholder и подписи полей с назначением формы — не скопированы с соседней формы
    notes: inbox №168
  expected:
  - Подписи и placeholder каждого поля соответствуют назначению этой формы и смыслу поля.
  applicability:
    when:
    - Есть формы.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-LAYOUT-OVERFLOW
  status: approved
  title: Длинные тексты и раскрывающиеся элементы не выходят за границы и не перекрываются
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P3
  tags:
  - ui
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Ввести длинные названия элементов — обрезаются с многоточием и подсказкой или переносятся, не выходят за блок
    notes: inbox №279
  - action: Открыть выпадающие элементы соседних блоков — не перекрывают друг друга
    notes: inbox №284
  - action: 'Мобильное приложение - открыть клавиатуру на каждом поле ввода: она не перекрывает активное поле и кнопку
      отправки; крупный системный шрифт не ломает экран'
    notes: inbox №489
  expected:
  - Длинные названия обрезаются с подсказкой или переносятся; раскрывающиеся элементы соседних блоков не перекрывают друг
    друга.
  - Клавиатура не перекрывает активное поле и кнопку отправки, крупный системный шрифт не ломает экран.
  applicability:
    when:
    - Есть списки, карточки или формы с переменной длиной текста.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Apple HIG (44 pt), Material Design (48 dp)
  - ADR 0006 (проверки UI)
- id: UI-TEXTS-BY-LOCALIZATION-KEYS
  status: approved
  title: Тексты экрана совпадают с файлом локализации по ключу на каждом языке
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - regression
  preconditions:
  - Есть файлы локализации приложения и поддерживаемые языки по ТЗ; нет доступа к файлам - запросить,
    это пробел покрытия, а не неприменимость.
  steps:
  - action: Сверять текст на экране не с захардкоженной строкой, а с файлом локализации по ключу - один
      тест запускается на каждом языке, заданном ОС или настройкой приложения
    notes: inbox №492
  - action: Проверить, что на экране нет непереведённых ключей, строк другого языка и ключей вместо текста
      (auth.wrong_password)
    notes: inbox №492
  expected:
  - На каждом поддерживаемом языке текст экрана равен значению ключа; ключей и строк другого языка на
    экране нет.
  applicability:
    when:
    - Приложение локализовано.
    skip_when:
    - Один язык интерфейса.
  automation:
    level: full
    deterministic: true
  risk:
    impact: medium
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
  - Смежная - UI-TEXTS-CORRECT (смысл перевода эта запись не оценивает)
