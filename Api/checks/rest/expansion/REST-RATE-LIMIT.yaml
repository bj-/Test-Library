checks:
- id: REST-RATE-LIMIT
  status: approved
  title: Ограничение частоты запросов
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - security
  - resilience
  - negative
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Отключить отдачу заголовков лимита, исчерпать лимит и проверить ответ 429 без 5xx и без заголовков лимита
    notes: 'Real-world bug: RWB-0281 (Kong/kong#13715)'
  - action: Отправить запрос через шлюз на echo-сервис и проверить, что сервис получил заголовки остатка лимита
    notes: 'Real-world bug: RWB-0281 (Kong/kong#13682)'
  expected:
  - лимит и заголовки соответствуют политике, доступ восстанавливается по окончании окна
  applicability:
    when:
    - настроен rate limit
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0281'
