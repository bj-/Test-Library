checks:
- id: REST-NULL-VS-OMITTED
  title: Null и отсутствующее поле
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: boundary
  priority: P1
  tags:
  - boundary
  - validation
  - contract
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - каждый вариант соответствует правилам required/nullable/type
  applicability:
    when:
    - схема различает optional и nullable
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references: []
