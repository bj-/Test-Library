checks:
- id: REST-OPEN-REDIRECT
  status: approved
  title: Валидация redirect URL
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - security
  - negative
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Добавить опасные схемы (javascript:, data:)
    notes: 'Real-world bug: RWB-0125 (expressjs/express#6614)'
  - action: Параметры внутри redirect URI и кодированные имена параметров (регрессия от защитного фикса)
    notes: 'Real-world bug: RWB-0125 (keycloak/keycloak#51712)'
  - action: Редирект на внутренний маршрут, где пользовательское значение — сегмент пути; проверить scheme-relative '//host'
    notes: 'Real-world bug: RWB-0125 (GHSA-2m6q-8v3h-jqww)'
  expected:
  - разрешены только адреса по allowlist/политике
  applicability:
    when:
    - API принимает returnUrl/redirectUri
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0125'
