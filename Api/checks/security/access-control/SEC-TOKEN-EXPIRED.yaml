checks:
- id: SEC-TOKEN-EXPIRED
  status: approved
  title: Expired access token is rejected
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authn
  - real-world-bug
  - smoke
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Access tokens have an expiry claim or server-side expiration policy.
  steps:
  - action: Call a protected operation using a token whose expiry is in the past.
    notes: 'Matrix axis: Authentication; scenario: Expired token. Use isolated synthetic identities and data.'
  - action: Токен без iat, использованный до истечения (прогретый кэш проверки), повторно после exp
    notes: 'Real-world bug: RWB-0161 (GHSA-x937-hj6v-793p)'
  - action: Передать просроченный ID-токен в параметре claim_token запроса разрешения и ожидать отказ
    notes: 'Real-world bug: RWB-0161 (keycloak/keycloak#46716)'
  expected:
  - Reject the request according to policy; no protected read or mutation occurs.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Access tokens have an expiry claim or server-side expiration policy.
    skip_when:
    - The credential type has no expiry by design and this is documented.
  automation:
    level: full
    deterministic: true
  profiles:
  - Smoke
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0161'
