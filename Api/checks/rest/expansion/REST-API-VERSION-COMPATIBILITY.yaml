checks:
- id: REST-API-VERSION-COMPATIBILITY
  status: approved
  title: Совместимость версий API
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: positive
  priority: P1
  tags:
  - compatibility
  - contract
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Записать подресурс status через версию API, отличную от версии хранения, и проверить, что managedFields и spec
      объекта не изменились
    notes: 'Real-world bug: RWB-0229 (kubernetes/kubernetes#133704)'
  expected:
  - поддерживаемые версии сохраняют документированную семантику
  applicability:
    when:
    - поддерживаются несколько версий
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0229'
