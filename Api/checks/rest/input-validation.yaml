- id: VAL-DEFERRED-FAILURE
  status: draft
  title: Принятые при записи данные не вызывают 5xx в зависимых операциях
  category: validation
  protocols:
  - generic
  kind: negative
  priority: P2
  tags:
  - negative
  - validation
  - data-integrity
  - error-handling
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Ресурс имеет необязательные числовые, датовые или перечисляемые поля, которые используются другими операциями.
  steps:
  - action: Создать объект с пустой строкой, null и граничными значениями в необязательных полях.
  - action: Выполнить все операции, которые используют объект — чтение, список, поиск, вычисление, экспорт, применение политики.
  - action: Создать политику, ссылающуюся на тип параметров со схемой без type, и проверить, что фоновая проверка типов не
      падает и сервис продолжает работать
    notes: 'Real-world bug: RWB-0003 (kubernetes/kubernetes#136472)'
  - action: 'Создать политику, правила отбора которой указывают на тип со свойством type: object и additionalProperties: true,
      и проверить, что фоновая проверка типов не падает'
    notes: 'Real-world bug: RWB-0003 (kubernetes/kubernetes#135145)'
  - action: Создать определение типа в устаревшей форме без схем по версиям и проверить, что PUT подресурса status его объектов
      через каждую версию не даёт 5xx
    notes: 'Real-world bug: RWB-0003 (kubernetes/kubernetes#133651)'
  expected:
  - Запись либо отклоняется 400, либо значение нормализуется к отсутствующему.
  - Ни одна зависимая операция не возвращает 5xx из-за ранее принятых данных.
  applicability:
    when:
    - Есть операции
    - использующие сохранённые поля объекта.
    skip_when:
    - Ресурс только хранится и читается без обработки.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - OWASP ASVS V5 — валидация на входе
  - а не при использовании
  - 'Real-world bug: RWB-0003'
