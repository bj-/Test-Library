checks:
- id: PAGE-CURSOR-TAMPERING
  status: approved
  title: Подделанный или чужой курсор пагинации не раскрывает данные
  category: pagination
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - pagination
  - security
  - authz
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Курсорная пагинация.
  steps:
  - action: Изменить байты курсора, декодировать base64 и изменить поля, использовать курсор другого пользователя или фильтра.
  expected:
  - Подделанный курсор отклоняется 4xx.
  - Чужой курсор не возвращает данные вне прав текущего пользователя.
  applicability:
    when:
    - Используются курсоры.
    skip_when:
    - Offset-пагинация.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: PAGE-BEYOND-LAST
  status: approved
  title: Запрос страницы за последней возвращает пустой результат без ошибки
  category: pagination
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P2
  tags:
  - boundary
  - pagination
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Коллекция с известным числом элементов.
  steps:
  - action: Запросить offset = total, total+1, очень большой offset.
  - action: Запросить смещение больше числа записей с запросом точного общего счётчика и проверить статус, Content-Range и
      Content-Length ответа
    notes: 'Real-world bug: RWB-0337 (PostgREST/postgrest#4455)'
  expected:
  - Пустой список с корректными метаданными или задокументированная ошибка; без 5xx.
  applicability:
    when:
    - Коллекция пагинируется.
    skip_when:
    - Нет пагинации.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0337'
- id: PAGE-TOTAL-COUNT
  status: approved
  title: Общее число элементов согласовано с суммой страниц
  category: pagination
  protocols:
  - rest
  - grpc
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - pagination
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - API возвращает total/count.
  steps:
  - action: Пройти все страницы и подсчитать элементы при стабильных данных.
  - action: Число записей больше лимита по умолчанию, агрегат количества через GraphQL и REST совпадает с реальным
    notes: 'Real-world bug: RWB-0095 (directus/directus#26768)'
  - action: Отфильтровать по полю связи многие-ко-многим, где у записи несколько подходящих связанных элементов, и сравнить
      filter_count с числом записей
    notes: 'Real-world bug: RWB-0095 (directus/directus#24719)'
  - action: Запросить общий счётчик вместе с фильтром по наличию вложенного ресурса (is null, not is null) и проверить данные
      и Content-Range
    notes: 'Real-world bug: RWB-0095 (PostgREST/postgrest#2846)'
  - action: Вызвать эндпоинт количества и список с каждым параметром фильтра (в том числе exact=true) и проверить совпадение
      чисел
    notes: 'Real-world bug: RWB-0095 (keycloak/keycloak#45219)'
  expected:
  - Сумма элементов равна total, нет дублей и пропусков.
  applicability:
    when:
    - Есть total.
    skip_when:
    - total не возвращается.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0095'
- id: PAGE-CONCURRENT-MODIFICATION
  status: approved
  title: Изменения коллекции во время обхода не приводят к дублям и пропускам сверх контракта
  category: pagination
  protocols:
  - rest
  - grpc
  - graphql
  kind: reliability
  priority: P2
  tags:
  - pagination
  - concurrency
  - costly
  - regression
  - nightly
  preconditions:
  - Коллекция изменяется во время обхода.
  steps:
  - action: Начать обход, вставить и удалить элементы до текущей позиции, продолжить обход.
  expected:
  - Для курсорной пагинации нет дублей и пропусков существующих элементов.
  - Для offset поведение задокументировано.
  applicability:
    when:
    - Пагинация по изменяемой коллекции.
    skip_when:
    - Коллекция неизменяема.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: PAGE-SEARCH-SPECIAL-CHARS
  status: approved
  title: Поиск со спецсимволами и wildcard не ломается и не расширяет выборку
  category: pagination
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - filtering
  - injection
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть полнотекстовый или LIKE-поиск.
  steps:
  - action: Искать %, _, *, ?, \, кавычки, пустую строку, строку из пробелов, очень длинный запрос.
  - action: Искать по значениям с обратным слэшем в конце и незакрытыми экранированными кавычками в синтаксисе key:value
    notes: 'Real-world bug: RWB-0094 (keycloak/keycloak#50228)'
  - action: Выполнить поиск со строками «_», «%», «*» в каждом эндпоинте поиска (пользователи, группы, члены организации)
      и проверить одинаковую обработку
    notes: 'Real-world bug: RWB-0094 (keycloak/keycloak#44678)'
  expected:
  - Спецсимволы трактуются буквально или по документированному синтаксису.
  - '% или * не возвращают всю коллекцию в обход ограничений.'
  - Нет 5xx.
  applicability:
    when:
    - Есть поиск.
    skip_when:
    - Поиска нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0094'
- id: PAGE-SORT-NULLS-TIES
  status: approved
  title: Сортировка по полю с null и одинаковыми значениями детерминирована
  category: pagination
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P3
  tags:
  - boundary
  - sorting
  - regression
  - nightly
  preconditions:
  - Сортируемое поле может быть null или совпадать.
  steps:
  - action: Создать элементы с null и одинаковыми значениями, отсортировать asc и desc, пройти по страницам.
  expected:
  - Положение null задокументировано.
  - Порядок при равных значениях стабилен (вторичный ключ).
  applicability:
    when:
    - Есть сортировка.
    skip_when:
    - Сортировки нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: PAGE-SORT-MULTI-KEY-PRIORITY
  status: approved
  title: Сортировка по нескольким ключам соблюдает заданный клиентом порядок приоритета
  category: pagination
  protocols:
  - rest
  - graphql
  kind: contract
  priority: P3
  tags:
  - contract
  - pagination
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Поддерживается сортировка по нескольким полям.
  steps:
  - action: Запросить список с сортировкой (a, b), затем (b, a) на данных, где порядки различаются.
  expected:
  - Первый ключ — главный; смена порядка ключей меняет порядок результатов согласно ему.
  applicability:
    when:
    - Есть сортировка по нескольким полям.
    skip_when:
    - Сортировка по одному полю.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - Здравый смысл — ORDER BY a, b
  - 'Real-world bug: RWB-0213'
- id: PAGE-NEXT-LINK-VALID
  status: approved
  title: Ссылка next ведёт на ту же коллекцию, сохраняет фильтры и работает
  category: pagination
  protocols:
  - rest
  kind: contract
  priority: P2
  tags:
  - contract
  - pagination
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Пагинация возвращает ссылку next (в теле или заголовке Link); коллекция может быть доступна по нескольким путям.
  steps:
  - action: Запросить первую страницу с фильтром и сортировкой по каждому пути коллекции и перейти по ссылке next до конца.
  expected:
  - Ссылка ведёт на тот же путь, сохраняет фильтры и сортировку; каждая страница 200, последняя без next.
  applicability:
    when:
    - Есть ссылки пагинации.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - RFC 8288 (Link)
  - 'Real-world bug: RWB-0271'
- id: PAGE-SORT-FIELD-TYPE-MATRIX
  status: approved
  title: Сортировка по каждому полю учитывает его тип, локаль и направление
  category: pagination
  protocols:
  - rest
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - sorting
  - ci
  - regression
  - nightly
  preconditions:
  - Список поддерживает сортировку по нескольким полям разных типов.
  steps:
  - action: Для каждого сортируемого поля запросить asc и desc на данных с числами, датами, строками в разном регистре и с
      буквами ё и е.
  - action: Запросить без параметра сортировки.
  - action: Пройти все страницы отсортированного списка на данных с одинаковыми значениями ключа — порядок стабилен, нет пропусков
      и повторов
  expected:
  - Числа сортируются как числа, даты как даты; регистр и локаль — по документации; null — в задокументированном месте; порядок
    по умолчанию задокументирован.
  - Порядок стабилен между страницами (вторичный ключ — PAGE-SORT-NULLS-TIES).
  applicability:
    when:
    - Есть сортировка.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - Смежные — PAGE-SORT-NULLS-TIES, REST-SORT-INVALID-FIELD
  - inbox №70
