checks:
- id: DB-ROLES-AND-PRIVILEGES
  status: draft
  title: Роли БД приложения имеют минимальные права, переключение ролей безопасно
  category: db
  protocols:
  - db
  kind: security
  priority: P1
  tags:
  - db
  - security
  - authz
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Выполнить каждую DDL-команду (DROP и ALTER столбца, переименование, наследование, ограничения) ролью без права
      изменения схемы — отказ
    notes: inbox №153
  - action: Задать настройки роли (ALTER ROLE … SET) с регистрозависимыми значениями — применяются без изменения регистра
    notes: inbox №296
  - action: Переключиться (SET ROLE) на непривилегированную роль — приложение не пытается применить параметры только для суперпользователя
    notes: inbox №304
  - action: Проверить роль подключения сервиса — права на схему API только у переключаемых ролей
    notes: inbox №308
  expected:
  - DDL выполняется только ролями с нужными для операции правами (по модели прав СУБД); роль подключения сервиса минимальна;
    при SET ROLE не применяются параметры, недоступные этой роли.
  applicability:
    when:
    - Есть доступ к ролям БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP ASVS V14.1
  - Документация СУБД (GRANT, SET ROLE, SECURITY DEFINER)
  - ADR 0006 (проверки БД)
- id: DB-MIGRATIONS-SAFE
  status: draft
  title: Миграции схемы применяются предсказуемо и не портят данные
  category: db
  protocols:
  - db
  kind: reliability
  priority: P2
  tags:
  - db
  - reliability
  - data-integrity
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  - Нужен стенд, который можно развернуть с чистой БД и обновить.
  steps:
  - action: Удалить коллекцию с внешними ключами миграцией — учитывается актуальный набор ограничений, а не закэшированный
    notes: inbox №194
  - action: Применить миграции и перезапустить — применённые отмечены и не считаются невыполненными
    notes: inbox №208
  - action: Добавить ограничение уникальности на столбец serial — тип и default nextval() сохраняются
    notes: inbox №212
  - action: Изменить атрибуты столбца — заданная длина varchar сохраняется
    notes: inbox №217
  - action: Создать таблицу без столбцов — отклоняется до выполнения DDL
    notes: inbox №218
  - action: Применить миграцию удаления ограничения на СУБД, где его нет, — выполняется (IF EXISTS)
    notes: inbox №221
  - action: Применить миграции на чистую БД в нестандартной схеме — типы и объекты создаются раньше, чем используются
    notes: inbox №257
  - action: Применить миграцию, создающую копии записей (черновики), — порядок связей переносится по колонке порядка, а не
      по id
    notes: inbox №271
  expected:
  - Миграции отмечаются выполненными, идемпотентны, работают на чистой БД и нестандартной схеме; изменения столбцов сохраняют
    их свойства; данные и порядок связей переносятся.
  applicability:
    when:
    - Есть миграции схемы.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Практика миграций (IF EXISTS, порядок создания объектов)
  - ADR 0006 (проверки БД)
- id: DB-METADATA-CACHE-FRESH
  status: draft
  title: Кэш метаданных схемы в сервисе актуален после изменений БД
  category: db
  protocols:
  - db
  kind: reliability
  priority: P2
  tags:
  - db
  - reliability
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Выполнить серию DDL-миграций с уведомлением после каждой — кэш метаданных в состоянии после последней
    notes: inbox №307
  - action: Пересоздать таблицу с другим типом колонки — долгоживущие соединения пула не используют устаревшие метаданные
    notes: inbox №309
  - action: Задать настройки сервиса в самой БД (in-db config) и перезапустить или обновить — применяются ко всем видам ресурсов
    notes: inbox №317
  expected:
  - После DDL и уведомлений кэш соответствует последней схеме; соединения пула не используют устаревшие метаданные; настройки
    из БД применяются при старте.
  applicability:
    when:
    - Сервис кэширует схему БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Смежная — PERF-METADATA-RELOAD-NO-BLOCK
  - ADR 0006 (проверки БД)
- id: DB-CONNECTION-HANDLING
  status: draft
  title: Соединения с БД управляются предсказуемо
  category: db
  protocols:
  - db
  kind: reliability
  priority: P3
  tags:
  - db
  - reliability
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Отключить всех подписчиков потоковых подписок — периодических опросов в журнале запросов БД не остаётся
    notes: inbox №178
  - action: Передать параметры суммарным размером больше 2^31 байт (если стенд и драйвер это допускают) — драйвер не переполняет
      длину сообщения
    notes: inbox №293
  - action: Оставить соединения пула простаивать — закрываются по тайм-ауту, память на кэш каталога не копится
    notes: inbox №312
  - action: Запустить сервис с неверным паролем к БД — ограниченное число повторов и понятная ошибка, а не бесконечный цикл
      подключений
    notes: inbox №313
  - action: Задать строку подключения в формате URI без параметров — параметры, которые добавляет сервис (application_name),
      её не ломают
    notes: inbox №314
  expected:
  - Простаивающие соединения закрываются; неверные учётные данные дают фатальную ошибку; строка подключения любой допустимой
    формы работает; лишних запросов после отключения клиентов нет.
  applicability:
    when:
    - Есть доступ к журналу и статистике соединений БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация драйвера и пула соединений
  - ADR 0006 (проверки БД)
