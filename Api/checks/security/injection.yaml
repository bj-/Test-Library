checks:
- id: INJ-SQL
  status: approved
  title: SQL-инъекция во входных параметрах не исполняется
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Параметр попадает в запрос к реляционной БД (фильтр, поиск, сортировка, id).
  steps:
  - action: 'Подставить в path, query, body и заголовки: '' OR ''1''=''1, ''; --, UNION SELECT, boolean- и time-based payload
      (pg_sleep, WAITFOR).'
  - action: Сравнить ответы и время с контрольным запросом.
  expected:
  - 'Полезная нагрузка не исполняется: нет изменения поведения, данных, времени ответа или ошибок интерпретатора.'
  - Ответ — штатная ошибка валидации или обычный результат с данными, трактованными как литерал.
  - Нет 5xx и утечек деталей интерпретатора.
  applicability:
    when:
    - Параметры участвуют в запросах к SQL БД.
    skip_when:
    - Хранилище без SQL и параметры не транслируются в SQL.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
- id: INJ-NOSQL
  status: approved
  title: NoSQL-инъекция операторами запросов не исполняется
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Используется MongoDB/Elastic/другая документная БД.
  steps:
  - action: 'Передать объекты вместо скаляров: {"$ne": null}, {"$gt": ""}, {"$regex": ".*"}, $where.'
  - action: Использовать в логине и фильтрах.
  expected:
  - 'Полезная нагрузка не исполняется: нет изменения поведения, данных, времени ответа или ошибок интерпретатора.'
  - Ответ — штатная ошибка валидации или обычный результат с данными, трактованными как литерал.
  - Нет 5xx и утечек деталей интерпретатора.
  - Логин с операторами вместо пароля не выполняется.
  applicability:
    when:
    - Используется NoSQL хранилище.
    skip_when:
    - NoSQL не используется.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
