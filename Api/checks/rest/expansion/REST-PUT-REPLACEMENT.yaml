checks:
- id: REST-PUT-REPLACEMENT
  status: approved
  title: Семантика PUT
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: positive
  priority: P1
  tags:
  - contract
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Отправить полное представление ресурса, изменив только разрешённое поле, и проверить, что обновление принято,
      а остальные поля сохранены
    notes: 'Real-world bug: RWB-0356 (keycloak/keycloak#44163)'
  expected:
  - состояние после PUT соответствует полной модели запроса
  applicability:
    when:
    - PUT документирован как полная замена
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0356'
