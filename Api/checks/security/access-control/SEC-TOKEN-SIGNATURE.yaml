checks:
- id: SEC-TOKEN-SIGNATURE
  status: approved
  title: Token with invalid signature is rejected
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authn
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Signed tokens are used.
  steps:
  - action: Modify a signed token claim or use a token signed with an untrusted key.
    notes: 'Matrix axis: Authentication; scenario: Invalid signature. Use isolated synthetic identities and data.'
  - action: Отправить произвольную строку и неподписанный JWT на маршрут, защищённый без требований к ролям и разрешениям,
      и проверить 401
    notes: 'Real-world bug: RWB-0204 (GHSA-qvc3-6q9x-95pj)'
  expected:
  - Token is rejected; modified claims do not influence identity or permissions.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Signed tokens are used.
    skip_when:
    - Authentication mechanism does not use signed tokens.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0204'
