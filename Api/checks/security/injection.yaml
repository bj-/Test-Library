checks:
- id: INJ-SQL
  status: approved
  title: SQL-инъекция во входных параметрах не исполняется
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Параметр попадает в запрос к реляционной БД (фильтр, поиск, сортировка, id).
  steps:
  - action: 'Подставить в path, query, body и заголовки: '' OR ''1''=''1, ''; --, UNION SELECT, boolean- и time-based payload
      (pg_sleep, WAITFOR).'
  - action: Сравнить ответы и время с контрольным запросом.
  - action: Передать нагрузки, рассчитанные на экранирование обратным слэшем (\\'), — ломаются при режиме удвоения кавычек
    notes: 'Real-world bug: RWB-0089 (GHSA-r3rv-jm3r-62q2)'
  - action: Инъекция в имени поля (ключе JSON), а не в значении; связано с REST-MASS-ASSIGNMENT
    notes: 'Real-world bug: RWB-0089 (GHSA-v6pj-gxxw-phfw)'
  - action: Инъекция в имени поля сортировки (ORDER BY не параметризуется); связано с REST-SORT-INVALID-FIELD
    notes: 'Real-world bug: RWB-0089 (GHSA-r223-96jv-q533)'
  - action: Имена полей, операторы и join-параметры динамических фильтров (зависит от адаптера БД)
    notes: 'Real-world bug: RWB-0089 (GHSA-v49j-62m6-pgrr)'
  - action: Инъекция в имена параметров/полей фильтра, а не только в значения
    notes: 'Real-world bug: RWB-0089 (GHSA-wmw4-mw6x-6vfm)'
  - action: Отправить в аргумент функции выражения фильтра (например, jsonArrayContains) значение с одинарной кавычкой и SQL-фрагментом
    notes: 'Real-world bug: RWB-0089 (GHSA-mqjf-5f49-2fjh)'
  - action: Сохранить SQL-синтаксис в имени объекта и вызвать операцию, использующую его позже (экспорт, отчёт), и проверить,
      что SQL не выполняется
    notes: 'Real-world bug: RWB-0089 (GHSA-cgfv-jrfp-2r7v)'
  - action: Отправить SQL-инъекцию в имени поля (ключе метаданных) фильтра; повторить со значением, оканчивающимся обратным
      слэшем
    notes: 'Real-world bug: RWB-0089 (GHSA-2mfg-cc43-9pcj)'
  - action: Передать SQL-полезную нагрузку в поисковом термине, который используется в сортировке по похожести, и сравнить
      время ответа
    notes: 'Real-world bug: RWB-0089 (GHSA-jvqq-cvh4-xm37)'
  - action: Передать в значение, которое попадает в комментарий SQL-запроса (аннотации, теги журналирования запросов), последовательность
      */ с SQL после неё
    notes: 'Real-world bug: RWB-0089 (GHSA-hq7p-j377-6v63)'
  - action: Отправить в поле сырого запроса каждого эндпоинта, принимающего SQL, изменяющий оператор и чтение системного каталога
      и проверить отказ
    notes: 'Real-world bug: RWB-0089 (GHSA-f46q-3v67-fmm4)'
  - action: Сохранить объект с одинарной кавычкой и SQL-фрагментом в названии и выполнить операцию, которая подставляет это
      название в запрос; проверить, что SQL не исполняется
    notes: 'Real-world bug: RWB-0089 (GHSA-q2vg-7qgx-x5fc)'
  - action: Внедрить в параметр-массив путей UNION SELECT с разрешёнными значениями полей, по которым фильтруется доступ,
      и проверить, что скрытые записи не возвращаются
    notes: 'Real-world bug: RWB-0089 (GHSA-h89q-4j2h-7h88)'
  - action: 'Передать SQL-фрагмент в параметр, который подставляется в запрос как ключевое слово: тип приведения, часть даты,
      единица интервала'
    notes: 'Real-world bug: RWB-0089 (GHSA-vjqc-q4mp-2rvf)'
  - action: Передать в поля конфигурации, принимающие SQL-фрагменты, UNION SELECT, INTO OUTFILE, комментарии /*!*/ и стековые
      запросы в обход чёрного списка ключевых слов, а в limit и offset — нечисловое значение
    notes: 'Real-world bug: RWB-0089 (GHSA-23rh-xw42-fq82)'
  - action: Передать SQL-фрагмент в параметр пути внутри JSON-поля (jsonPath), по которому сервер фильтрует или выбирает данные
    notes: 'Real-world bug: RWB-0089 (GHSA-fxf7-vhh8-7vpq)'
  - action: Сохранить SQL-полезную нагрузку элементом массива в поле и вызвать операцию, которая использует сохранённое значение
      (инъекция второго порядка)
    notes: 'Real-world bug: RWB-0089 (GHSA-w27m-rmmf-g5w4)'
  - action: Передать SQL в границах числового диапазона фильтра списка
    notes: 'Real-world bug: RWB-0089 (GHSA-m7jc-g4rc-jmvh)'
  - action: Передать SQL-полезную нагрузку в условие массового удаления и сравнить с одиночным удалением
    notes: 'Real-world bug: RWB-0089 (GHSA-c9w5-rwh3-7pm9)'
  - action: Сохранить SQL в параметре конфигурации, который подставляется в ORDER BY, и открыть страницу, которая его применяет
    notes: 'Real-world bug: RWB-0089 (GHSA-mw6p-33vw-46cc)'
  - action: Передать SQL в имени поля фильтра (ключе filter[...]) со скобками
    notes: 'Real-world bug: RWB-0089 (GHSA-5qmh-x653-g8qj)'
  - action: Создать ресурс со значением-SQL-фрагментом в имени или идентификаторе, затем вызвать операции, использующие сохранённое
      значение (удаление, связи, отчёты)
    notes: 'Real-world bug: RWB-0089 (GHSA-8f2v-2qhj-gfwg)'
  - action: Передать в фильтре по числовому полю булево SQL-выражение без кавычек (1 OR 1=1, 1 AND 1=0) и сравнить выборки
    notes: 'Real-world bug: RWB-0089 (GHSA-qg78-vmvc-fhjw)'
  - action: Передать SQL-нагрузку в аргументе макроса в сохраняемом контенте, если тот же параметр в query проверяется whitelist,
      и открыть страницу
    notes: 'Real-world bug: RWB-0089 (GHSA-89v6-j5x6-cmj3)'
  - action: Передать SQL-нагрузку на втором и более глубоком уровне вложенного параметра фильтра (массив в массиве)
    notes: 'Real-world bug: RWB-0089 (GHSA-fcmw-wx57-9p75)'
  - action: Передать одинарную кавычку и SQL-выражение в имени ключа атрибута фильтра и в идентификаторе арендатора и проверить,
      что лишние записи и данные других арендаторов не возвращаются
    notes: 'Real-world bug: RWB-0089 (GHSA-rfx3-98h7-v3xp)'
  - action: Передать одинарную кавычку и SQL с pg_sleep в параметр языка полнотекстового поиска и проверить отказ без задержки
      ответа
    notes: 'Real-world bug: RWB-0089 (GHSA-vmw2-qwm8-x84c)'
  - action: Отправить данные с суммарным размером параметров больше 2 ГБ и проверить отказ по лимиту размера, а не выполнение
      внедрённого SQL
    notes: 'Real-world bug: RWB-0089 (GHSA-x9vc-6hfv-hg8c)'
  expected:
  - 'Полезная нагрузка не исполняется: нет изменения поведения, данных, времени ответа или ошибок интерпретатора.'
  - Ответ — штатная ошибка валидации или обычный результат с данными, трактованными как литерал.
  - Нет 5xx и утечек деталей интерпретатора.
  applicability:
    when:
    - Параметры участвуют в запросах к SQL БД.
    skip_when:
    - Хранилище без SQL и параметры не транслируются в SQL.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
  - 'Real-world bug: RWB-0089'
- id: INJ-NOSQL
  status: approved
  title: NoSQL-инъекция операторами запросов не исполняется
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Используется MongoDB/Elastic/другая документная БД.
  steps:
  - action: 'Передать объекты вместо скаляров: {"$ne": null}, {"$gt": ""}, {"$regex": ".*"}, $where.'
  - action: Использовать в логине и фильтрах.
  - action: Отправить объект условий поиска, где имя ключа (а не значение) содержит синтаксис языка запросов графовой БД,
      и проверить отказ без изменения структуры запроса
    notes: 'Real-world bug: RWB-0084 (GHSA-q86m-qjpm-vqcw)'
  - action: Отправить в параметр поиска строку, выходящую из экранирования regex, с метасимволами
    notes: 'Real-world bug: RWB-0084 (GHSA-hc43-m36c-8v33)'
  expected:
  - 'Полезная нагрузка не исполняется: нет изменения поведения, данных, времени ответа или ошибок интерпретатора.'
  - Ответ — штатная ошибка валидации или обычный результат с данными, трактованными как литерал.
  - Нет 5xx и утечек деталей интерпретатора.
  - Логин с операторами вместо пароля не выполняется.
  applicability:
    when:
    - Используется NoSQL хранилище.
    skip_when:
    - NoSQL не используется.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
  - 'Real-world bug: RWB-0084'
- id: INJ-OS-COMMAND
  status: approved
  title: Инъекция команд ОС не исполняется
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Параметр может попадать в shell, конвертеры файлов или системные утилиты.
  steps:
  - action: Подставить ; id, | whoami, `sleep 10`, $(sleep 10), && ping.
  - action: Без метасимволов оболочки — интерпретатор и флаг выполнения кода в разрешённых аргументах execFile
    notes: 'Real-world bug: RWB-0085 (GHSA-hf57-cqmx-p4gr)'
  - action: Конфигурация серверного генератора/сборщика из пользовательских данных (allowlist ключей)
    notes: 'Real-world bug: RWB-0085 (GHSA-8w7q-29mw-gf5c)'
  - action: 'Символы конца строки (включая U+2028/2029) в связке с # в аргументах, экранируемых библиотекой'
    notes: 'Real-world bug: RWB-0085 (GHSA-pqg4-j6r4-53mv)'
  - action: Создать пользовательский скрипт (триггер, процедуру), вызывающий запуск процесса ОС через стандартную библиотеку,
      и проверить, что песочница его запрещает
    notes: 'Real-world bug: RWB-0085 (GHSA-x9f9-r4m8-9xc2)'
  - action: Сохранить через API настройку с метасимволами оболочки и запустить операцию, которая использует эту настройку
      в командной строке
    notes: 'Real-world bug: RWB-0085 (GHSA-vp3w-52v9-q57f)'
  - action: Загрузить файл, в поле метаданных которого метасимволы оболочки, и вызвать операцию распаковки или перечисления
      содержимого
    notes: 'Real-world bug: RWB-0085 (GHSA-88cv-mj24-8w3q)'
  - action: Подставить метасимволы оболочки в имя файла, который сервер обрабатывает фоновой задачей
    notes: 'Real-world bug: RWB-0085 (GHSA-6qjf-g333-pv38)'
  - action: Загрузить файл, в имени которого метасимволы оболочки, на эндпоинт, обрабатывающий файл внешней утилитой
    notes: 'Real-world bug: RWB-0085 (GHSA-4fvg-pwv7-v54g)'
  - action: Вызвать выполнение разрешённого интерпретатора (bash -c, sh -c) с командой вне allowlist и проверить отказ
    notes: 'Real-world bug: RWB-0085 (GHSA-f5pj-2738-996m)'
  - action: Передать разрешённой программе опции, запускающие вложенную команду (git -c alias.x=!cmd), и проверить отказ
    notes: 'Real-world bug: RWB-0085 (GHSA-74hp-mggr-hv58)'
  - action: Сохранить URL прокси с метасимволами оболочки в хосте, затем вызвать проверку соединения и проверить, что команда
      не выполняется
    notes: 'Real-world bug: RWB-0085 (GHSA-j6cw-g6p4-7hch)'
  - action: Передать подстановку команды $(…) в аргумент каждого типа, допустимого для действия, выполняемого через shell,
      и проверить, что она не исполняется
    notes: 'Real-world bug: RWB-0085 (GHSA-xc5w-4v5w-7x65)'
  - action: Отправить многократно запрос с метасимволами оболочки в заголовке Host (обработка может срабатывать выборочно)
    notes: 'Real-world bug: RWB-0085 (GHSA-mrc5-3mm3-45c5)'
  - action: Задать в настройке пути к исполняемому файлу произвольную программу или скрипт и открыть страницу, которая её
      запускает
    notes: 'Real-world bug: RWB-0085 (GHSA-jf24-8g2h-2wg7)'
  - action: Передать разрешённую команду с опциями, запускающими другие программы (find -exec, git -c), без метасимволов оболочки
    notes: 'Real-world bug: RWB-0085 (GHSA-g3hq-hphg-8fhh)'
  - action: Передать в параметр, который сервер отдаёт внешней утилите, значение с метасимволами cmd.exe (&, |, ^) и проверить,
      что команда не исполняется на Windows
    notes: 'Real-world bug: RWB-0085 (GHSA-2jh5-g5ch-43q5)'
  expected:
  - 'Полезная нагрузка не исполняется: нет изменения поведения, данных, времени ответа или ошибок интерпретатора.'
  - Ответ — штатная ошибка валидации или обычный результат с данными, трактованными как литерал.
  - Нет 5xx и утечек деталей интерпретатора.
  applicability:
    when:
    - Сервис вызывает внешние процессы.
    skip_when:
    - Внешние процессы не вызываются.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
  - 'Real-world bug: RWB-0085'
- id: INJ-TEMPLATE-SSTI
  status: approved
  title: Инъекция в серверные шаблоны не исполняется
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Пользовательские данные попадают в шаблоны писем, документов или уведомлений.
  steps:
  - action: 'Сохранить {{7*7}}, ${7*7}, <%= 7*7 %>, #{7*7} и вызвать генерацию письма или документа.'
  - action: Передать объект вместо строки шаблона
    notes: 'Real-world bug: RWB-0091 (GHSA-8r5x-fm3f-whwj)'
  - action: Передать в аргумент шаблона конфигурации значение с переводом строки и новыми YAML-ключами и проверить, что структура
      итоговой конфигурации не меняется
    notes: 'Real-world bug: RWB-0091 (GHSA-73mf-m39p-wpm9)'
  - action: Создать объект с идентификатором (имя столбца, поля), содержащим синтаксис языка генерируемого кода, и вызвать
      операцию, компилирующую выражение с ним
    notes: 'Real-world bug: RWB-0091 (GHSA-3g44-3m7x-cgg2)'
  - action: Передать в поле, вычисляемое как выражение в ограниченном контексте, вызов метода без аргументов
    notes: 'Real-world bug: RWB-0091 (GHSA-9f52-rjqv-25qv)'
  - action: Загрузить под учёткой без роли администратора файл конфигурации с шаблонным выражением в каталог, откуда сервер
      читает определения, и вызвать операцию, которая его читает
    notes: 'Real-world bug: RWB-0091 (GHSA-jjq7-m736-w977)'
  - action: Отправить в заголовке, подставляемом в шаблон URL, синтаксис плейсхолдера окружения и проверить, что он не раскрывается
    notes: 'Real-world bug: RWB-0091 (GHSA-j8px-rmrx-76h9)'
  - action: Импортировать данные с шаблонным выражением, вызывающим функцию запроса к БД, отобразить их и проверить, что внедрённый
      SQL не исполняется
    notes: 'Real-world bug: RWB-0091 (GHSA-x67c-8pwr-m8g3)'
  - action: Передать в пользовательскую переменную плейсхолдер чтения конфигурации сервиса ({{config.token}}) и проверить,
      что секрет не подставляется в результат
    notes: 'Real-world bug: RWB-0091 (GHSA-pfvc-3p5h-x7h6)'
  - action: Сохранить в контенте с включённой песочницей шаблонные выражения, читающие системную конфигурацию (пароли, ключи),
      и открыть страницу
    notes: 'Real-world bug: RWB-0091 (GHSA-p597-crqc-m349)'
  - action: 'В режиме песочницы вызвать в шаблоне методы доступных объектов фреймворка: запись в сессию и сырой SQL через
      построитель запросов'
    notes: 'Real-world bug: RWB-0091 (GHSA-xv9m-fm3w-8w5x)'
  - action: Вставить в поле с динамическим рендерингом ссылку на секретные поля текущего пользователя (коды восстановления
      2FA) и проверить, что они не выводятся
    notes: 'Real-world bug: RWB-0091 (GHSA-jppw-r5j3-xf7x)'
  - action: Загрузить файл шаблона, в атрибуте которого значение с $ и командой в обратных кавычках, и вызвать его отрисовку
    notes: 'Real-world bug: RWB-0091 (GHSA-8737-2x9g-xjj7)'
  - action: Отправить изменяющий запрос с заголовком Referer, содержащим выражение шаблонизатора ({{7*7}}), и проверить URL
      перенаправления
    notes: 'Real-world bug: RWB-0091 (GHSA-f74w-488g-8x5r)'
  - action: Вставить в пользовательский шаблон (письма, документа) разрешённую функцию чтения файла с путём к .env и проверить
      результат
    notes: 'Real-world bug: RWB-0091 (GHSA-287w-mxq6-x2cp)'
  - action: Через разрешённый фильтр выборки столбца (column) прочитать в пользовательском шаблоне свойство, запрещённое политикой
      песочницы
    notes: 'Real-world bug: RWB-0091 (GHSA-h8vq-8gpg-mhcg)'
  - action: Отправить шаблон с присваиванием свойств переданного в контекст объекта ({{ user.is_admin = true }}) и проверить,
      что после рендеринга объект не изменился
    notes: 'Real-world bug: RWB-0091 (GHSA-7jvp-hj45-2f2m)'
  expected:
  - В результате буквальная строка, а не 49.
  - Нет ошибок шаблонизатора в ответе.
  applicability:
    when:
    - Есть рендеринг шаблонов с пользовательскими данными.
    skip_when:
    - Шаблоны не используются.
  automation:
