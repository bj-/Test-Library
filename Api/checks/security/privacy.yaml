checks:
- id: PRIV-DATA-MASKING
  status: approved
  title: Чувствительные данные маскируются в ответах по политике
  category: privacy
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - privacy
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть номера карт, документов, телефоны.
  steps:
  - action: Прочитать ресурс от имени ролей с разным уровнем доступа.
  - action: Проверить, что несекретные поля не маскируются, и выполнить read-modify-write с маской — секрет не затирается
      маской
    notes: 'Real-world bug: RWB-0098 (keycloak/keycloak#52792)'
  - action: Обойти все пути получения одного и того же чувствительного объекта (и эквивалентные пользовательские типы) и сравнить
      маскирование
    notes: 'Real-world bug: RWB-0098 (GHSA-p795-mqf2-36mf)'
  - action: Запросить объекты пользователей через каждый эндпоинт, где они встраиваются, и сравнить маскирование email
    notes: 'Real-world bug: RWB-0098 (GHSA-8wvg-r2j4-3737)'
  - action: Запросить ролью с ограниченным доступом вспомогательные эндпоинты (поиск, подбор целей), возвращающие объект с
      секретами, и проверить ту же маскировку, что в основных
    notes: 'Real-world bug: RWB-0098 (GHSA-88p2-jj8w-j8qg)'
  expected:
  - Маскирование соответствует роли; полные значения доступны только разрешённым ролям.
  applicability:
    when:
    - Есть чувствительные поля.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0098'
- id: PRIV-ERASURE
