checks:
- id: REST-ERROR-SCHEMA
  status: approved
  title: Стабильная схема ошибок
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - contract
  - negative
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Регрессия схемы ошибок после обновления фреймворка — снимок ошибок до/после
    notes: 'Real-world bug: RWB-0117 (nestjs/nest#4319)'
  - action: Ошибки промежуточных слоёв (middleware, guard, прокси) — та же схема, что у ошибок обработчика
    notes: 'Real-world bug: RWB-0117 (nestjs/nest#431)'
  expected:
  - ошибка соответствует схеме и не раскрывает stack trace/секреты
  applicability:
    when:
    - определён общий формат ошибки
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0117'
