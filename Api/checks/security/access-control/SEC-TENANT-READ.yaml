checks:
- id: SEC-TENANT-READ
  status: approved
  title: Tenant A cannot read tenant B data
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - smoke
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Multi-tenant data model with tenant-scoped resources; tenants A and B exist.
  steps:
  - action: Authenticate in tenant A and request a known tenant B resource identifier.
    notes: 'Matrix axis: Tenant isolation; scenario: Cross-tenant read. Use isolated synthetic identities and data.'
  - action: Глобальное функциональное право (управление ролями) не заменяет проверку доступа к конкретному проекту/арендатору
      из параметра
    notes: 'Real-world bug: RWB-0157 (GHSA-cqr2-h44g-v75v)'
  - action: Повторить доступ к чужой базе через все вспомогательные эндпоинты (пакетная запись, временные ряды, интеграции
      мониторинга), а не только через основной
    notes: 'Real-world bug: RWB-0157 (GHSA-x8mg-6r4p-87pf)'
  - action: Запросить объект чужого арендатора по ID через путь своего родительского ресурса и проверить 404
    notes: 'Real-world bug: RWB-0157 (GHSA-p5vg-v7mj-f6q4)'
  - action: Запросить токеном, ограниченным префиксом пути арендатора, соседние пути с тем же началом (/tenant1234, /tenant1-old)
      и проверить отказ
    notes: 'Real-world bug: RWB-0157 (GHSA-gv5w-hfx8-8cwq)'
  - action: Зарегистрировать в стриме ID задачи другого арендатора и проверить, что после отказа проверки владения результаты
      этой задачи в стрим не приходят
    notes: 'Real-world bug: RWB-0157 (GHSA-9q4h-f4x5-ffq8)'
  - action: Запросить, изменить и удалить объекты без арендатора (company_id = null) пользователем, привязанным к арендатору
    notes: 'Real-world bug: RWB-0157 (GHSA-c6w2-j4wq-mvwg)'
  expected:
  - Tenant B data is not disclosed; response and side effects match the documented denial/concealment policy.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Multi-tenant data model with tenant-scoped resources; tenants A and B exist.
    skip_when:
    - API is single-tenant or resource is explicitly shared across tenants.
  automation:
    level: full
    deterministic: true
  profiles:
  - Smoke
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0157'
