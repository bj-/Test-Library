- id: PERF-DEEP-PAGINATION
  status: approved
  title: Глубокая пагинация и большие выборки не деградируют неприемлемо
  category: performance
  protocols:
  - rest
  - grpc
  - graphql
  kind: performance
  priority: P2
  tags:
  - performance
  - pagination
  - costly
  - real-world-bug
  - nightly
  preconditions:
  - Коллекция большого объёма.
  steps:
  - action: Запросить первые и последние страницы большой коллекции, сложные фильтры.
  - action: Выполнить поиск по строке в коллекции из 100 000+ записей со многими текстовыми полями и замерить время ответа
    notes: 'Real-world bug: RWB-0264 (directus/directus#24594)'
  expected:
  - Время ответа в пределах SLO или действуют ограничения глубины.
  applicability:
    when:
    - Большие коллекции.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Nightly
  risk:
