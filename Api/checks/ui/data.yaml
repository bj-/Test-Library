- id: UI-CHANGE-HISTORY
  status: draft
  title: История изменений показывает каждое изменение с автором
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P3
  tags:
  - ui
  - audit
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Удалить связь у объекта из другого проекта — изменение отражено в истории изменений с автором
    notes: 'inbox №229'
  expected:
  - Изменения, в том числе неявные (исчезновение связи из-за действия в другом проекте), отражены в истории с автором и временем.
