- id: RES-LIST-REFLECTS-CHANGES
  status: approved
  title: Списки и счётчики отражают создание, изменение и удаление
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: positive
  priority: P2
  tags:
  - positive
  - data-integrity
  - pagination
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть операция списка.
  steps:
  - action: Создать, изменить, удалить ресурс и запросить список и счётчики.
  - action: Загрузить YAML, где одинаковые вложенные объекты подставлены через якоря в несколько родителей, и проверить, что
      список содержит все экземпляры
    notes: 'Real-world bug: RWB-0278 (Kong/kong#7620)'
  - action: Составить карту представлений сущности (карточка, список, поиск, вложенное в родителя, экспорт,
      агрегат), изменить сущность и сверить каждое
    notes: inbox №521
  - action: Изменить дочерний ресурс - производные значения родителя (счётчик, сумма), денормализованные копии и
      кэш обновились
    notes: inbox №521
  expected:
  - Изменения видны в списке и счётчиках в пределах задокументированной задержки.
  - Все представления сущности согласованы, производные значения родителя обновлены.
  applicability:
    when:
    - Есть списки.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0278'
- id: RES-READ-AFTER-WRITE
  status: approved
  title: Чтение после записи соответствует модели согласованности
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: reliability
  priority: P2
  tags:
  - data-integrity
  - reliability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть реплики, кэши или асинхронная обработка.
  steps:
  - action: Сразу после записи прочитать ресурс многократно из разных узлов.
