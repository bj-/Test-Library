checks:
- id: DB-MIGRATION-STATE-TRACKED
  status: approved
  title: Применённые миграции учитываются, повторный запуск безопасен
  category: db
  protocols:
  - db
  kind: reliability
  priority: P2
  tags:
  - db
  - reliability
  - ci
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  - Нужен стенд, который можно перезапустить и обновить.
  steps:
  - action: Применить миграции и перезапустить — применённые отмечены и не считаются невыполненными
    notes: inbox №208
  - action: Применить миграцию удаления ограничения на СУБД, где его нет, — выполняется (IF EXISTS)
    notes: inbox №221
  expected:
  - Применённые миграции отмечены и не выполняются повторно; миграция над отсутствующим объектом не падает (IF EXISTS), если
    так задумано.
  applicability:
    when:
    - Есть миграции схемы.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Практика миграций
  - ADR 0006 (проверки БД)
- id: DB-MIGRATION-CLEAN-INSTALL
