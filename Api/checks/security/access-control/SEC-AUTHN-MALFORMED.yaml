checks:
- id: SEC-AUTHN-MALFORMED
  status: approved
  title: Malformed credential is rejected
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P1
  tags:
  - negative
  - security
  - authn
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Operation requires authentication and accepts a token or credential.
  steps:
  - action: Send an invalidly formatted, truncated, or syntactically malformed credential.
    notes: 'Matrix axis: Authentication; scenario: Malformed credential. Use isolated synthetic identities and data.'
  - action: Передать синтаксически битый и пустой заголовок Cookie, в том числе в рукопожатии WebSocket
    notes: 'Real-world bug: RWB-0142 (jshttp/cookie#35)'
  - action: Basic без части с паролем или с пустым секретом
    notes: 'Real-world bug: RWB-0142 (keycloak/keycloak#50791)'
  - action: Передать JWT, в заголовке которого нет alg, alg=null или пустой объект
    notes: 'Real-world bug: RWB-0142 (keycloak/keycloak#49969)'
  - action: Отправить в сброс пароля строку, не являющуюся JWT, и в проверку хеша строку, не являющуюся хешем, без аутентификации
    notes: 'Real-world bug: RWB-0142 (directus/directus#23941)'
  - action: Подписать запрос для произвольного ключа доступа пустым секретом и проверить отказ
    notes: 'Real-world bug: RWB-0142 (GHSA-xwwr-4h3p-r22c)'
  - action: Подставить в токен сессии верный ID сессии с произвольной секретной частью и проверить отказ
    notes: 'Real-world bug: RWB-0142 (GHSA-c3jm-gv5r-9wcp)'
  - action: 'Отправить Authorization: Bearer с пустым значением токена и проверить 401 без выполнения операции'
    notes: 'Real-world bug: RWB-0142 (PostgREST/postgrest#3926)'
  - action: Отправить подписанный токен с ролью, которой нет на сервере, и проверить 401
    notes: 'Real-world bug: RWB-0142 (PostgREST/postgrest#3601)'
  expected:
  - Reject according to authentication policy; do not fall back to anonymous or weaker authentication.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Operation requires authentication and accepts a token or credential.
    skip_when:
    - Malformed credentials are explicitly supported by a documented compatibility mode.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0142'
