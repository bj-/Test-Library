- id: AUTH-CONCURRENT-SESSIONS
  status: approved
  title: Лимит одновременных сессий и устройств соблюдается
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P3
  tags:
  - security
  - boundary
  - session
  - regression
  - nightly
  preconditions:
  - Политика ограничивает число сессий.
  steps:
  - action: Войти с N+1 устройств.
  expected:
  - Поведение соответствует политике (вытеснение старой сессии или отказ).
  applicability:
    when:
    - Есть лимит.
    skip_when:
    - Лимита нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: AUTH-MFA-STEP-UP
  status: approved
  title: Операции, требующие второго фактора, недоступны без него
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - authn
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть MFA или step-up для чувствительных операций.
  steps:
  - action: Вызвать чувствительную операцию токеном после первого фактора; повторно использовать подтверждение для другой
      операции.
  expected:
  - Операция отклоняется без второго фактора; подтверждение привязано к операции.
  applicability:
    when:
    - Есть MFA.
    skip_when:
    - MFA нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
- id: AUTH-OAUTH-REDIRECT-STATE
  status: approved
  title: OAuth/OIDC flow проверяет redirect_uri, state и PKCE
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authn
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API выступает OAuth-сервером или клиентом.
  steps:
  - action: Подменить redirect_uri (поддомен, путь, параметры), опустить state, использовать чужой code, опустить code_verifier.
  expected:
  - redirect_uri сравнивается точно; без state и PKCE обмен отклоняется; code одноразовый.
  applicability:
    when:
    - Есть OAuth flow.
    skip_when:
    - OAuth не используется.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - RFC 6749, RFC 7636, OAuth 2.0 Security BCP
