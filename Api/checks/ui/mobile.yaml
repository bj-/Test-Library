checks:
- id: UI-MOBILE-WIFI-PROVISIONING
  status: approved
  title: Подключение устройства к Wi-Fi проходит при разных диапазонах телефона и роутера
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение, парк телефонов и подключаемые устройства.
  - Есть роутер с настройкой диапазонов и режимов безопасности.
  steps:
  - action: Телефон в 5 ГГц, устройство только 2,4 ГГц, общий SSID с band steering и раздельные SSID -
      приложение доводит подключение до конца или объясняет, что сделать
    notes: inbox №422
  - action: Телефон, который не видит 5 ГГц, в общей сети 2,4 + 5 ГГц - подключение через точку доступа
      устройства и возврат в домашнюю сеть проходят
    notes: inbox №439
  expected:
  - Подключение завершается на всех сочетаниях диапазонов или приложение объясняет причину и что сделать;
    зависаний и молчаливых отказов нет.
  applicability:
    when:
    - Устройство подключается к Wi-Fi через приложение.
    skip_when:
    - Приложение не работает с физическими устройствами.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: high
    likelihood: high
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-WIFI-SOFTAP
  status: approved
  title: Подключение через точку доступа устройства не рвётся при смене сети ОС
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение, парк телефонов и подключаемые устройства.
  steps:
  - action: Подключение через точку доступа устройства (SoftAP) - ОС уходит с сети без интернета на домашнюю
      (Android), запрашивает подключение (iOS), процесс не рвётся
    notes: inbox №423
  expected:
  - Подключение завершается, телефон возвращается в домашнюю сеть.
  applicability:
    when:
    - Устройство подключается через свою точку доступа.
    skip_when:
    - Точки доступа у устройства нет.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: high
    likelihood: high
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-WIFI-SECURITY-MODES
  status: approved
  title: Режим безопасности роутера не приводит к зависанию подключения устройства
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение, парк телефонов и подключаемые устройства.
  - Есть роутер с настройкой диапазонов и режимов безопасности.
  steps:
  - action: 'Устройство умеет только WPA2: роутер только WPA3 - понятная ошибка, а не зависание; переходный
      WPA2/3 и Wi-Fi 6 с WPA2 - подключение проходит или причина объяснена'
    notes: inbox №429
  expected:
  - Совместимые режимы подключаются, несовместимый даёт понятную ошибку; зависаний нет.
  applicability:
    when:
    - Устройство подключается к Wi-Fi через приложение.
    skip_when:
    - Приложение не работает с физическими устройствами.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: high
    likelihood: high
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-PAIRING-BY-RADIO
  status: approved
  title: Мастер сопряжения выбирает путь по возможностям устройства
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение, парк телефонов и подключаемые устройства.
  - Есть устройства разных каналов связи.
  steps:
  - action: Устройство без Bluetooth - мастер не застревает на поиске по BLE и сам предлагает доступный
      способ (точка доступа устройства или другой)
    notes: inbox №434
  - action: Устройство только с BLE, без Wi-Fi - мастер не просит сеть Wi-Fi; понятное поведение вне радиуса
      BT и при удалённом доступе (через хаб, телефон или «недоступно удалённо»)
    notes: inbox №438
  - action: Один тип устройства на старой и новой прошивке в одном доме - путь сопряжения определяется
      по устройству, оба управляются, после миграции прошивки повторное сопряжение не создаёт дубль
    notes: inbox №435
  expected:
  - Мастер предлагает путь, доступный этому устройству; дублей устройств нет.
  applicability:
    when:
    - Есть сопряжение устройств через приложение.
    skip_when:
    - Приложение не работает с физическими устройствами.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: high
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-BLE-GENERATIONS
  status: approved
  title: Сопряжение по BLE работает между поколениями телефона и устройства
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение, парк телефонов и подключаемые устройства.
  - Есть устройства разных поколений BLE и телефоны с разными версиями Bluetooth.
  steps:
  - action: Сопряжение по BLE с устройствами разных поколений (4.2, 5.0) на Android и iOS - обнаружение,
      MTU, повторное подключение
    notes: inbox №436
  - action: Сопряжение с телефона на Bluetooth 4.2 с устройствами BLE 4.2 и 5.0 - приложение не опирается
      на возможности BLE 5 без проверки
    notes: inbox №440
  - action: Устройство с LE Extended Advertising или 2M PHY на телефоне без их поддержки - приложение
      сообщает об этом или предлагает другой способ
    notes: inbox №431
  expected:
  - На поддерживаемой паре обнаружение и повторное подключение проходят, MTU и PHY используются при фактической
    поддержке; на неподдерживаемой - понятное сообщение или другой способ.
  applicability:
    when:
    - Есть сопряжение по BLE.
    skip_when:
    - BLE не используется.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: high
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-PERMISSIONS-BY-OS
  status: approved
  title: Разрешения запрашиваются по версии ОС и targetSdk сборки
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение и телефоны с разными версиями ОС.
  steps:
  - action: Проверить набор разрешений по версии ОС, targetSdk сборки и используемым функциям - Android
      до 11 (выключенная геолокация даёт пустой BLE-скан), 12+ (BLUETOOTH_SCAN, BLUETOOTH_CONNECT), 13+
      (NEARBY_WIFI_DEVICES для Wi-Fi, POST_NOTIFICATIONS), iOS (Bluetooth, «Локальная сеть»)
    notes: inbox №424
  expected:
  - На каждой версии ОС запрашиваются нужные функциям разрешения, лишних нет.
  applicability:
    when:
    - Приложение использует разрешения ОС.
    skip_when:
    - Только web-клиент.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: medium
    likelihood: high
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-PERMISSION-DENIAL
  status: approved
  title: Отказ в разрешении объяснён, обратим и не роняет приложение
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение и телефоны из парка.
  steps:
  - action: Отказать в каждом разрешении (камера, геолокация, Bluetooth, уведомления, локальная сеть)
      - понятное сообщение и путь в настройки; выдать разрешение в настройках и вернуться - работает без
      перезапуска приложения
    notes: inbox №424, №482
  - action: Отказать в разрешении, выбрать «Больше не спрашивать», отозвать разрешение в настройках ОС
      во время работы - приложение не падает, остальные функции работают
    notes: inbox №482
  - action: 'После отказа на экране есть действие: повторный запрос, а после «Больше не спрашивать» переход
      в настройки ОС, а не только плашка с объяснением'
    notes: inbox №494
  - action: Отказать в первом из связанных разрешений (геолокация, затем устройства поблизости) - второе
      запрашивается, когда снова понадобится, и не теряется
    notes: inbox №494
  expected:
  - Отказ объяснён и обратим без перезапуска.
  - Отказ и отзыв разрешения не роняют приложение и отключают только зависящую от него функцию; из отказа
    есть действие для возврата, связанные разрешения не теряются.
  applicability:
    when:
    - Приложение использует разрешения ОС.
    skip_when:
    - Только web-клиент.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: medium
    likelihood: high
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-PUSH-NO-GMS
  status: approved
  title: Push работает на Android без сервисов Google
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P2
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть телефон без сервисов Google и подключённый альтернативный провайдер push (например, Huawei Push
    Kit).
  steps:
  - action: Отправить push при открытом, свёрнутом и выгруженном приложении - доставка
    notes: inbox №425
  - action: Нажать на push - открывается нужный экран
    notes: inbox №425
  - action: Обновить токен провайдера (сброс данных push-сервиса или переустановка) - новый токен зарегистрирован
      на сервере, push приходит на него
    notes: inbox №425
  expected:
  - Push доставляется, нажатие открывает нужный экран, обновлённый токен регистрируется на сервере.
  applicability:
    when:
    - Заявлена поддержка устройств без сервисов Google, в приложении есть push.
    skip_when:
    - Такие устройства не поддерживаются.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: medium
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-LOCAL-AUTH-FALLBACK
  status: approved
  title: Локальная аутентификация учитывает класс биометрии и предлагает альтернативу
  category: ui
  protocols:
  - ui-mobile
  kind: negative
  priority: P2
  tags:
  - ui
  - negative
  preconditions:
  - Есть телефоны с биометрией разных классов и без неё.
  - В приложении настроен PIN или пароль.
  steps:
  - action: На Android только разблокировка лицом не класса Strong или нет биометрии - приложение не считает
      её доступной и предлагает альтернативу
    notes: inbox №426
  - action: Удалить биометрию или вызвать её блокировку после включения входа по ней - альтернативный
      вход работает
    notes: сверка inbox-2026-10-30
  expected:
  - Биометрия слабого класса не принимается за доступную, если политика приложения явно её не допускает;
    пользователь не заблокирован, альтернативный вход работает.
  applicability:
    when:
    - Есть вход по биометрии.
    skip_when:
    - Биометрия не используется.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: medium
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-BACKGROUND-WORK
  status: approved
  title: Прямое управление переживает фон, блокировку и энергосбережение
  category: ui
  protocols:
  - ui-mobile
  kind: reliability
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение, парк телефонов и подключаемые устройства.
  - Есть телефоны производителей с агрессивным энергосбережением (MIUI/HyperOS, EMUI, One UI).
  steps:
  - action: Свернуть приложение, заблокировать экран, дать энергосбережению убить процесс - сценарии без
      интернета выполняются или пользователь предупреждён
    notes: inbox №427
  - action: На версиях оболочки из парка проверить в фоне и после блокировки экрана локальные уведомления
      и обновление состояния устройств, с автозапуском и без, в режиме экономии батареи - поведение не
      хуже предыдущей версии оболочки
    notes: inbox №441
  expected:
  - Фоновые сценарии выполняются или пользователь предупреждён заранее и знает, какие исключения энергосбережения
    включить; ухудшение между версиями оболочки - находка.
  applicability:
    when:
    - Приложение работает в фоне или управляет устройством напрямую.
    skip_when:
    - Только сценарии на активном экране.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: high
    likelihood: high
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-LONG-OPERATION-INTERRUPTED
  status: approved
  title: Прерванная долгая операция не выводит устройство из строя
  category: ui
  protocols:
  - ui-mobile
  kind: reliability
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение, парк телефонов и подключаемые устройства.
  steps:
  - action: Во время долгой операции по LAN (обновление прошивки устройства) сменить сеть
    notes: inbox №432
  - action: Заблокировать экран во время операции
    notes: inbox №432
  - action: Свернуть приложение во время операции
    notes: inbox №432
  expected:
  - Долгая операция завершается или откатывается, устройство исправно; статус в приложении верный, вечного
    индикатора нет, при ошибке есть повтор.
  applicability:
    when:
    - Приложение ведёт долгие операции на устройстве (обновление прошивки).
    skip_when:
    - Долгих операций нет.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: high
    likelihood: high
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-LOCAL-CHANNEL-FALLBACK
  status: approved
  title: Недоступность локальной сети не ломает управление устройством
  category: ui
  protocols:
  - ui-mobile
  kind: reliability
  priority: P2
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение, парк телефонов и подключаемые устройства.
  - Есть сеть с изоляцией клиентов или гостевая сеть.
  - Какие операции доступны через облако - из требований.
  steps:
  - action: В сети с изоляцией клиентов или гостевой сети mDNS и локальное управление недоступны - приложение
      переходит на облачный канал, локальные уведомления не теряются молча
    notes: inbox №428
  - action: Вернуть локальную сеть - канал восстанавливается, команды и события не дублируются
    notes: сверка inbox-2026-10-30
  expected:
  - Управление продолжается через облачный канал или недоступность объяснена; события не теряются молча.
  applicability:
    when:
    - Есть гибридное управление - локальное и облачное.
    skip_when:
    - Только облачное управление.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: medium
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-TABLET-NO-SIM
  status: approved
  title: Планшет без SIM проходит вход и управляет удалённо по Wi-Fi
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P3
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть планшет без SIM и второе устройство с номером учётки.
  steps:
  - action: 'Если есть вход по SMS: войти по коду, который пришёл на другое устройство - автозаполнения
      нет, ручной ввод работает'
    notes: inbox №430
  - action: Проверить удалённое управление только по Wi-Fi
    notes: inbox №430
  expected:
  - Отсутствие SIM не приводит к падению; вход без автозаполнения проходит, удалённое управление работает
    по Wi-Fi.
  applicability:
    when:
    - Заявлена поддержка планшетов.
    skip_when:
    - Только телефоны.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: low
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
  - Смежная - UI-MOBILE-STATE-SURVIVES-LIFECYCLE (поворот в мастере, идея №430)
- id: UI-MOBILE-STATE-SURVIVES-LIFECYCLE
  status: approved
  title: Состояние экрана переживает фон, убийство процесса и поворот
  category: ui
  protocols:
  - ui-mobile
  kind: reliability
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение и телефоны из парка.
  steps:
  - action: Уйти в фон посреди операции (ввод формы, загрузка, онбординг) и вернуться через несколько
      секунд и несколько минут - состояние и введённые данные сохранены
    notes: inbox №483
  - action: Убить процесс системой (нехватка памяти, am kill, энергосбережение оболочки, «Не сохранять
      действия» в настройках разработчика) и открыть приложение - оно на том же экране или корректно с
      начала, подтверждённые данные не потеряны
    notes: inbox №483
  - action: 'Если поворот не заблокирован по ТЗ: повернуть экран посреди ввода и в открытых диалогах -
      данные не теряются, диалог не закрывается и не дублируется'
    notes: inbox №484
  - action: На планшете проверить обе ориентации, режим разделённого экрана и поворот во время мастера
      сопряжения - шаг сохраняется
    notes: inbox №484, №430
  expected:
  - Уход в фон и поворот не теряют ввод и не дублируют диалоги; после убийства процесса приложение восстанавливается
    без потери подтверждённых данных.
  applicability:
    when:
    - Есть экраны с вводом или многошаговые операции.
    skip_when:
    - Только web-клиент.
  automation:
    level: partial
    deterministic: false
  risk:
    impact: high
    likelihood: high
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-APP-UPDATE
  status: approved
  title: Обновление поверх предыдущей версии сохраняет вход, настройки и данные
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть сборки предыдущей и новой версий, на старой выполнен вход и заданы настройки.
  steps:
  - action: Установить новую версию поверх предыдущей и самой старой поддерживаемой - вход, настройки
      и локальные данные сохранены, миграция локального хранилища не падает
    notes: inbox №487
  expected:
  - После обновления повторный вход не нужен, если его не требует политика безопасности; настройки и локальные
    данные на месте.
  applicability:
    when:
    - Приложение хранит локальные данные или вход.
    skip_when:
    - Только web-клиент.
  automation:
    level: partial
    deterministic: true
  risk:
    impact: high
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-FORCED-UPDATE
  status: approved
  title: Неподдерживаемая версия приложения ведёт к обновлению
  category: ui
  protocols:
  - ui-mobile
  kind: compatibility
  priority: P1
  tags:
  - ui
  - compatibility
  preconditions:
