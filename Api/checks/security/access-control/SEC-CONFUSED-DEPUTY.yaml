checks:
- id: SEC-CONFUSED-DEPUTY
  status: approved
  title: Действия во внешней системе от имени пользователя выполняются только с его правами
  category: security
  protocols:
  - rest
  - generic
  kind: security
  priority: P1
  tags:
  - security
  - authz
  - privilege-escalation
  - money
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Сервер действует во внешней системе (SCM, платежи, почта) от имени пользователя или проксирует запросы со своим ключом.
  steps:
  - action: Запустить операцию над ресурсом внешней системы, к которому у пользователя нет доступа, без своего токена и с
      токеном без прав.
  - action: Под обычным пользователем вызвать через прокси операции сверх нужных (создание выплат, чтение клиентов, удаление).
  - action: Создать в своём пространстве имён политику или шаблон, порождающий ресурсы в чужом пространстве, и проверить отказ
    notes: 'Real-world bug: RWB-0043 (GHSA-79gf-7frw-68m9)'
  - action: Сослаться из ресурса своего репозитория на файл приватного репозитория той же установки интеграции и проверить,
      что сервис его не загружает
    notes: 'Real-world bug: RWB-0043 (GHSA-6f2p-296r-cc28)'
  - action: Передать объект, недоступный пользователю, через каждый путь описания ресурсов для контроллера и проверить, что
      он не создаётся правами контроллера
    notes: 'Real-world bug: RWB-0043 (GHSA-jr6p-8pjj-mfx6)'
  expected:
  - Операция отклоняется или выполняется только с правами пользователя; отката на сервисные учётные данные нет.
  - Неразрешённые методы и пути прокси — 403.
  applicability:
    when:
    - Есть интеграции от имени пользователя или прокси к стороннему API.
    skip_when:
    - Нет исходящих интеграций.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: low
  references:
  - OWASP API5:2023
  - CWE-441
  - 'Real-world bug: RWB-0043'
