checks:
- id: PERF-LATENCY-BASELINE
  status: approved
  title: Задержка ключевых операций в пределах SLO при обычной нагрузке
  category: performance
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: performance
  priority: P2
  tags:
  - performance
  - costly
  - real-world-bug
  - nightly
  preconditions:
  - Определены SLO и тестовые данные реалистичного объёма.
  steps:
  - action: Измерить p50/p95/p99 для ключевых операций.
  - action: Добавить замер задержки при росте объёма данных (тенанты, роли) и сравнение с предыдущей версией — ловит регрессии
      сложности
    notes: 'Real-world bug: RWB-0096 (keycloak/keycloak#51554)'
  - action: Добавить замер при росте числа ролей; проверять все варианты эндпоинта (realm и client) — фикс одного не гарантирует
      другой
    notes: 'Real-world bug: RWB-0096 (keycloak/keycloak#51531)'
  expected:
  - Перцентили в пределах SLO; регрессия относительно базовой линии не выше порога.
  applicability:
    when:
    - Есть SLO.
    skip_when:
    - SLO не определены.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0096'
