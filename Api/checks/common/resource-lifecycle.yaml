checks:
- id: RES-CRUD-CYCLE
  status: approved
  title: 'Полный жизненный цикл ресурса: создание, чтение, изменение, удаление'
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: positive
  priority: P1
  tags:
  - positive
  - data-integrity
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Пользователь с правами на все операции.
  steps:
  - action: Создать ресурс, прочитать, изменить, прочитать, удалить, прочитать.
  expected:
  - Каждый шаг возвращает задокументированный результат; прочитанное состояние соответствует последней записи; после удаления
    ресурс недоступен.
  applicability:
    when:
    - Ресурс поддерживает CRUD.
    skip_when:
    - Ресурс только для чтения.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: RES-CREATE-RESPONSE-MATCHES-READ
  status: approved
  title: Ответ на создание и изменение совпадает с последующим чтением
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - data-integrity
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Операции записи возвращают ресурс.
  steps:
  - action: Создать/изменить ресурс и сравнить ответ с GET.
  - action: Поле-связь, заданное альтернативным идентификатором, на нестандартном эндпоинте ресурса — 200 без применения
    notes: 'Real-world bug: RWB-0101 (strapi/strapi#26606)'
  expected:
  - Поля и значения совпадают, кроме задокументированных вычисляемых асинхронно.
  applicability:
    when:
    - Запись возвращает тело.
    skip_when:
    - Запись возвращает только id.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0101'
- id: RES-UPDATE-MISSING
  status: approved
  title: Изменение несуществующего ресурса не создаёт его неявно
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - data-integrity
  - ci
  - regression
  - nightly
  preconditions:
  - Есть операции изменения.
  steps:
  - action: Выполнить PUT/PATCH/DELETE для несуществующего id.
  expected:
  - Ответ 404 или upsert строго по контракту; неявное создание отсутствует, если не задокументировано.
  applicability:
    when:
    - Есть изменения.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: RES-IMMUTABLE-FIELDS
  status: approved
  title: Неизменяемые поля нельзя изменить после создания
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - data-integrity
  - security
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - У ресурса есть неизменяемые поля (владелец, тип, дата создания, номер).
  steps:
  - action: Попытаться изменить каждое неизменяемое поле через PUT, PATCH и вложенные объекты.
  - action: Добавить служебные поля синглтона настроек
    notes: 'Real-world bug: RWB-0103 (directus/directus#28131)'
  expected:
  - Изменение отклоняется или игнорируется по контракту; значение не меняется.
  applicability:
    when:
    - Есть неизменяемые поля.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0103'
- id: RES-SERVER-GENERATED-FIELDS
  status: approved
  title: Клиент не может задать серверные поля (id, createdAt, status, version)
