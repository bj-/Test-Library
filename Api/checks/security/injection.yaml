  - action: Отправить request-target без ведущего слэша с сегментами ../ и проверить, что файл вне каталога не отдаётся
    notes: 'Real-world bug: RWB-0086 (GHSA-5g75-477j-2c2f)'
  - action: Передать в параметре языка или локали значение с ../ и абсолютным путём и проверить, что применяется язык по умолчанию
    notes: 'Real-world bug: RWB-0086 (GHSA-2xmw-f8j8-wfxc)'
  - action: Отправить данные, поле которых подставляется в шаблон пути выходного файла, с ../ в этом поле
