checks:
- id: CONTRACT-REQUIRED-FIELDS
  status: approved
  title: Successful response contains required contract fields
  category: contract
  protocols:
  - rest
  - grpc
  - graphql
  - generic
  kind: contract
  priority: P1
  tags:
  - positive
  - contract
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - A valid request exists for the operation.
  steps:
  - action: Execute a valid request and validate the response against the contract.
  - action: Проверить обязательные поля исходящего payload хука для каждого типа события
    notes: 'Real-world bug: RWB-0314 (supabase/auth#1744)'
  expected:
  - Required fields are present.
  - Field types and constraints match the schema.
  applicability:
    when:
    - A response schema is defined.
    skip_when:
    - The operation intentionally has no payload
    - such as HTTP 204.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: high
  references:
  - 'Real-world bug: RWB-0314'
- id: CONTRACT-UNKNOWN-FIELD-POLICY
  status: approved
  title: Unknown fields follow the documented contract policy
  category: contract
  protocols:
  - rest
  - graphql
  - generic
  kind: compatibility
  priority: P2
  tags:
  - contract
  - compatibility
  - ci
  - regression
  - nightly
  preconditions:
  - Unknown-field policy is documented.
  steps:
  - action: Add an unknown request field or inspect an extended response as applicable.
  expected:
  - Unknown fields are rejected
  - ignored
  - or preserved exactly as documented.
  applicability:
    when:
    - The contract defines unknown-field handling.
    skip_when:
    - The format does not allow extensible fields.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
- id: CONTRACT-FIELD-SELECTION
  status: draft
  title: Выбор полей возвращает ровно запрошенные поля с правильными значениями
  category: contract
  protocols:
  - rest
  kind: contract
  priority: P2
  tags:
  - contract
  - compatibility
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - API поддерживает выбор полей (fields, select, sparse fieldsets), в том числе для связей.
  steps:
  - action: Запросить списки и объекты с разными наборами полей — с id и без, со связями, с '*'.
  - action: Сравнить с полным ответом.
  - action: Запросить экспорт в CSV, поставив поля связанной сущности между прямыми полями, и проверить порядок колонок
    notes: 'Real-world bug: RWB-0026 (directus/directus#25521)'
  - action: Задать алиас поля с именем в синтаксисе функции (year(x)) и проверить ключ и значение в ответе
    notes: 'Real-world bug: RWB-0026 (directus/directus#25138)'
  - action: Запросить fields=* вместе с заданным алиасом и проверить, что алиас есть в ответе
    notes: 'Real-world bug: RWB-0026 (directus/directus#25121)'
  expected:
  - Возвращаются запрошенные поля с теми же значениями, что в полном ответе; ключ есть, если запрошен или обязателен.
  - Поля сверх запрошенных не возвращаются (кроме обязательных по контракту).
  applicability:
    when:
    - Есть выбор полей.
    skip_when:
    - Ответ фиксированной формы.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - JSON API sparse fieldsets
  - 'Real-world bug: RWB-0026'
- id: CONTRACT-PUBLISHED-SCHEMA-VALID
  status: draft
  title: Опубликованные сервисом описания API валидны в заявленном диалекте
  category: contract
  protocols:
  - generic
  kind: contract
  priority: P2
  tags:
  - contract
  - compatibility
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис отдаёт описание (openapi.json, JSON Schema, MCP tools/list, GraphQL SDL, proto через reflection).
  steps:
  - action: Скачать описание и проверить строгим валидатором заявленной версии (OpenAPI 3.1, JSON Schema 2020-12).
  - action: Выполнить полный запрос introspection и проверить ответ на соответствие мета-схеме GraphQL, включая non-null поля
      вроде isRepeatable
    notes: 'Real-world bug: RWB-0049 (hasura/graphql-engine#10560)'
  expected:
  - Описание валидно; $schema и версия соответствуют фактическому синтаксису.
  applicability:
    when:
    - Сервис публикует описание.
    skip_when:
    - Описание не публикуется.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - OpenAPI 3.1
  - JSON Schema 2020-12
  - 'Real-world bug: RWB-0049'
