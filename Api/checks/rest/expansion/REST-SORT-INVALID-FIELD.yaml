checks:
- id: REST-SORT-INVALID-FIELD
  status: approved
  title: Сортировка по неизвестному полю
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: pagination
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - negative
  - filtering
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Добавить сортировку по существующему, но скрытому полю как оракул, включая алиасы, суффиксы и составные выражения
    notes: 'Real-world bug: RWB-0134 (GHSA-53vv-xm9f-mm82)'
  - action: Сортировка по существующему, но закрытому полевыми правами полю — отклонять как неизвестное
    notes: 'Real-world bug: RWB-0134 (GHSA-9g87-32v6-3c2r)'
  - action: Передать в параметре сортировки имя столбца, которого нет в ответе, и SQL-выражение и проверить 400
    notes: 'Real-world bug: RWB-0134 (GHSA-rxhg-vcww-2mpw)'
  expected:
  - запрещённые поля не раскрываются, ошибка/игнорирование соответствует контракту
  applicability:
    when:
    - операция поддерживает сортировку
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0134'
