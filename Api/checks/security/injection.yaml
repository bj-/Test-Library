    notes: 'Real-world bug: RWB-0088 (GHSA-prgh-xp8r-p3m5)'
  - action: glob/brace-шаблоны в параметрах поиска — квадратичное раскрытие, а не regex
    notes: 'Real-world bug: RWB-0088 (GHSA-q2hr-2g5m-vwhr)'
  - action: Рендеринг Markdown/разметки пользователя (автоссылки) — квадратичный разбор, а не regex
    notes: 'Real-world bug: RWB-0088 (GHSA-253c-mchw-3w2r)'
  - action: Незавершённая HTML-разметка в контенте с серверным разбором — зависание парсера, не regex
    notes: 'Real-world bug: RWB-0088 (GHSA-f67j-2jqw-jpq7)'
  - action: Сверхлинейный разбор сериализованного формата (индексы вне границ), не только регулярные выражения
    notes: 'Real-world bug: RWB-0088 (GHSA-9rgm-9g3h-6x36)'
  - action: Оператор фильтра, принимающий сырой regex от клиента; проверять на каждом драйвере БД/окружении
    notes: 'Real-world bug: RWB-0088 (GHSA-jgm3-qmp2-c4p7)'
  - action: Отправить в числовое поле строку из десятков тысяч цифр, не совпадающую с шаблоном числа, и сравнить время ответа
      для длины N и 2N
    notes: 'Real-world bug: RWB-0088 (GHSA-p6pp-m3f8-5c89)'
  - action: Передать собственное регулярное выражение с вложенными квантификаторами в функцию языка выражений (matches, replace)
      и проверить, что выполнение прекращается по тайм-ауту
    notes: 'Real-world bug: RWB-0088 (GHSA-7cmj-v6x8-frvv)'
  - action: Повторить проверку ReDoS для каждой функции выражений с regex (matches, replaceMatches) и каждой версии API
    notes: 'Real-world bug: RWB-0088 (GHSA-fxj4-p9xp-37v5)'
  - action: Отправить в поле, которое сервер экранирует как HTML, длинный повтор незакрытых тегов '<A '
    notes: 'Real-world bug: RWB-0088 (GHSA-mhwm-jh88-3gjf)'
  - action: Передать в параметр, который используется как CSS-селектор, незакрытую строку в кавычках и длинную цепочку hex-экранирований
    notes: 'Real-world bug: RWB-0088 (GHSA-c4rq-3m3g-8wgx)'
  - action: Отправить URI с длинной цепочкой разделителей под маршрут, заданный URI-шаблоном с explode-модификатором
    notes: 'Real-world bug: RWB-0088 (GHSA-h27x-rffw-24p4)'
  - action: Отправить в числовое поле, которое сервер выводит с разделителями разрядов, строку из десятков тысяч цифр
    notes: 'Real-world bug: RWB-0088 (GHSA-cg4j-q9v8-6v38)'
  - action: Отправить длинное патологическое значение в If-Match и If-None-Match к ресурсу, который отдаёт ETag
    notes: 'Real-world bug: RWB-0088 (GHSA-mr3q-g2mv-mr4q)'
  - action: Отправить multipart-часть с длинным патологическим заголовком Content-Disposition
    notes: 'Real-world bug: RWB-0088 (GHSA-47m2-26rw-j2jw)'
  - action: Отправить XML с числовой ссылкой на символ (&#…x…;) из тысяч цифр
    notes: 'Real-world bug: RWB-0088 (GHSA-2rxp-v6pw-ch6m)'
  - action: Отправить длинное патологическое значение в заголовке Authorization (схема Token) к защищённому эндпоинту
    notes: 'Real-world bug: RWB-0088 (GHSA-vfg9-r3fq-jvx4)'
  - action: Отправить параметры с длинными патологическими именами, которые сервер фильтрует перед записью в лог
    notes: 'Real-world bug: RWB-0088 (GHSA-x76w-6vjr-8xgj)'
  - action: Отправить длинные патологические значения в Accept-Encoding и Accept-Language
    notes: 'Real-world bug: RWB-0088 (GHSA-cj83-2ww7-mvq7)'
  - action: Отправить длинное патологическое значение в заголовке Forwarded
    notes: 'Real-world bug: RWB-0088 (GHSA-54rr-7fvw-6x8f)'
  - action: Отправить запрос с cookie и длинным патологическим X-Forwarded-Host
    notes: 'Real-world bug: RWB-0088 (GHSA-p84v-45xj-wwqj)'
  - action: Отправить длинный специально построенный заголовок If-None-Match и замерить время ответа
    notes: 'Real-world bug: RWB-0088 (GHSA-8xww-x3g3-6jcv)'
  - action: Отправить на эндпоинт скачивания длинный специально построенный заголовок Range и замерить время ответа
    notes: 'Real-world bug: RWB-0088 (GHSA-65f5-mfpf-vfhj)'
  - action: Отправить multipart с длинными атрибутами Content-Disposition частей, содержащими управляющие символы, и замерить
      время ответа
    notes: 'Real-world bug: RWB-0088 (GHSA-rqv2-275x-2jq5)'
  - action: Передать в параметр с глобальным идентификатором объекта (gid://app/Model/id) длинное специально построенное имя
      модели
    notes: 'Real-world bug: RWB-0088 (GHSA-23c2-gwp5-pxw9)'
  - action: Отправить в поле с санитизируемым HTML SVG-элемент с длинным специально построенным значением атрибута
    notes: 'Real-world bug: RWB-0088 (GHSA-5x79-w82f-gw8w)'
  - action: Отправить запрос с путём из длинной серии слэшей, не совпадающим с маршрутом, и замерить время ответа
    notes: 'Real-world bug: RWB-0088 (GHSA-x7rj-f32v-7jjg)'
  - action: Отправить в поле, проверяемое рекурсивным регулярным выражением, значение с тысячами вложенных скобок
    notes: 'Real-world bug: RWB-0088 (GHSA-px5m-h76g-p7p8)'
  - action: Запросить путь, где сегмент с несколькими параметрами без разделителя / заполнен десятками тысяч дефисов, и проверить
      ответ за обычное время
    notes: 'Real-world bug: RWB-0088 (GHSA-c2g3-c4gc-w5wg)'
  expected:
  - Время ответа остаётся в пределах бюджета, CPU не насыщается.
  applicability:
