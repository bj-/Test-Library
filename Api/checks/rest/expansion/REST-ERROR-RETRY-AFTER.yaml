checks:
- id: REST-ERROR-RETRY-AFTER
  title: Retry-After при временной ошибке
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - contract
  - reliability
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - заголовок присутствует в ожидаемых случаях и имеет корректный формат
  applicability:
    when:
    - Retry-After предусмотрен для 429/503 или других статусов
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
