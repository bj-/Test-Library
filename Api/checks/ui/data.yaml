checks:
- id: UI-RELATED-RECORDS
  status: approved
  title: Связанные записи редактируются во вложенной форме так же, как отдельно
  category: ui
  protocols:
  - ui-web
  kind: contract
  priority: P3
  tags:
  - ui
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Открыть поле файла во вложенной панели связанной записи — те же действия (загрузить, выбрать), что в основной
      форме
    notes: inbox №204
  - action: Открыть таблицу связанных записей многие-ко-многим в карточке пользователем с правами — активна и открывает запись
    notes: inbox №210
  - action: Добавить новые несохранённые связанные записи — редактируются в форме так же, как существующие
    notes: inbox №214
  expected:
  - Таблицы и поля связанных записей активны по правам и предлагают те же действия, что основная форма; новые несохранённые
    записи редактируются.
  applicability:
    when:
    - Есть вложенные формы или таблицы связанных записей.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Здравый смысл — одинаковое поведение во вложенной и основной форме
  - ADR 0006 (проверки UI)
