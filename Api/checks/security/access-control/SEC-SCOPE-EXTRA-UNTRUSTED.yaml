checks:
- id: SEC-SCOPE-EXTRA-UNTRUSTED
  status: approved
  title: Client cannot add scopes by request parameter
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Scope-based authorization exists.
  steps:
  - action: Attempt to supply extra scopes or permission claims in query, body, or untrusted headers.
    notes: 'Matrix axis: Roles/Scopes; scenario: Scope injection. Use isolated synthetic identities and data.'
  expected:
  - Only trusted issuer/server-side authorization grants determine effective scopes.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Scope-based authorization exists.
    skip_when:
    - No scope-based authorization exists.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
