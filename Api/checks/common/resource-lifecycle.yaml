  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: RES-IMMUTABLE-FIELDS
  status: approved
  title: Неизменяемые поля нельзя изменить после создания
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - data-integrity
  - security
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - У ресурса есть неизменяемые поля (владелец, тип, дата создания, номер).
  steps:
  - action: Попытаться изменить каждое неизменяемое поле через PUT, PATCH и вложенные объекты.
  - action: Попытаться изменить служебные поля синглтона настроек
    notes: 'Real-world bug: RWB-0103 (directus/directus#28131)'
  - action: Отправить обновление на путь с альтернативным идентификатором (внутренний id вместо alias) и проверить, что неизменяемый
      ключ не перезаписан значением из пути
    notes: 'Real-world bug: RWB-0103 (keycloak/keycloak#47733)'
  expected:
  - Изменение отклоняется или игнорируется по контракту; значение не меняется.
  applicability:
    when:
    - Есть неизменяемые поля.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0103'
- id: RES-SERVER-GENERATED-FIELDS
  status: approved
  title: Клиент не может задать серверные поля (id, createdAt, status, version)
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - data-integrity
  - security
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть серверные поля.
  steps:
  - action: Передать серверные поля при создании.
  - action: Передать серверные поля при загрузке файла (multipart) и при повторной внутренней записи
    notes: 'Real-world bug: RWB-0105 (directus/directus#28207)'
  - action: Создать объект с заданной меткой удаления через серверное применение и через PUT несуществующего объекта и проверить,
      что сервер её отбрасывает
    notes: 'Real-world bug: RWB-0105 (kubernetes/kubernetes#133388)'
  - action: Передать в запросе импорта поле автора (created_by) с ID другого пользователя и прочитать созданный объект
    notes: 'Real-world bug: RWB-0105 (GHSA-5wx7-xq8j-v4qm)'
  expected:
  - Значения клиента отклоняются или игнорируются; сервер задаёт собственные.
  applicability:
    when:
    - Есть серверные поля.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0105'
- id: RES-TIMESTAMPS
  status: approved
  title: Метки времени создания и изменения ведут себя корректно
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - data-integrity
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Ресурс содержит createdAt/updatedAt.
  steps:
  - action: Создать ресурс, изменить его, выполнить запрос без изменений.
  - action: Создать объект каждым альтернативным путём (resumable-загрузка и др.) и проверить метки времени
    notes: 'Real-world bug: RWB-0106 (directus/directus#28042)'
  expected:
  - createdAt не меняется; updatedAt растёт только при изменении; время в задокументированной зоне и формате.
  applicability:
    when:
    - Есть метки времени.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0106'
- id: RES-REFERENTIAL-INTEGRITY
  status: approved
  title: Ссылка на несуществующий или чужой связанный ресурс отклоняется
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - data-integrity
  - authz
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Ресурс ссылается на другие ресурсы по id.
  steps:
  - action: Создать ресурс со ссылкой на несуществующий, удалённый и принадлежащий другому пользователю объект.
  - action: Обе ссылки существуют, но не связаны между собой; интерфейс ограничивает выбор, API — нет (см. REQ-CROSS-CLIENT-CONSISTENCY)
    notes: 'Real-world bug: RWB-0104 (keycloak/keycloak#50178)'
  - action: Во вложенном объекте указать явную ссылку объектом {id} на несуществующий родитель и проверить 400 с указанием
      ссылки
    notes: 'Real-world bug: RWB-0104 (Kong/kong#7696)'
  - action: Привязать к своему ресурсу чужую группу пользователей по ID и проверить отказ и отсутствие её состава в ответах
    notes: 'Real-world bug: RWB-0104 (GHSA-39p5-2wrr-xh29)'
  - action: Передать в теле запроса к своему ресурсу ID вспомогательного объекта (представление, колонка) чужого проекта и
      проверить отказ
    notes: 'Real-world bug: RWB-0104 (GHSA-w39f-h553-h2mx)'
  - action: Сослаться из ресурса другого вида (TCP вместо HTTP) на запрещённый объект другого провайдера или пространства
      и проверить такой же отказ
    notes: 'Real-world bug: RWB-0104 (GHSA-42cj-m3vj-89wv)'
  - action: Создать маршрут, зеркалирующий трафик на сервис другого пространства имён без разрешения, и проверить отказ
    notes: 'Real-world bug: RWB-0104 (GHSA-w7c2-w76w-5hmj)'
  - action: Изменить через PATCH и PUT ссылку существующего объекта на связанный ресурс другой компании
    notes: 'Real-world bug: RWB-0104 (GHSA-575r-357h-fhch)'
  - action: Создать через API дочерний объект иерархии с родителем из другой компании и проверить, что запись не сохранилась,
      как и в веб-интерфейсе
    notes: 'Real-world bug: RWB-0104 (GHSA-8w8c-8mx9-52cw)'
  - action: Передать при сохранении родителя в поле связи один-ко-многим ID дочерних записей другого родителя и проверить,
      что они не переназначены, не отвязаны и не удалены
    notes: 'Real-world bug: RWB-0104 (GHSA-42vx-43vc-x6pr)'
  - action: Сменить связанный объект на недоступный в контексте ресурса (выключенный в канале) через каждый эндпоинт, который
      меняет эту связь, и сравнить ответы
    notes: 'Real-world bug: RWB-0104 (GHSA-6955-hrm5-c4qp)'
  - action: Создать ресурс со ссылкой на существующий объект инфраструктуры (сервер, пул), не входящий в разрешённый пользователю
      список
    notes: 'Real-world bug: RWB-0104 (GHSA-q4rm-m6xh-5pv7)'
  - action: Сослаться на связанную сущность в неактивном или архивном статусе и на сущность другого типа
    notes: inbox №510
  - action: Создать ресурс с несколькими ссылками, где неверна только последняя - первые не сохранились, ошибка
      4xx с указанием поля, а не 500 от внешнего ключа БД
    notes: inbox №510
  expected:
  - Ссылки отклоняются; чужой объект не раскрывается через сообщение об ошибке.
  - Отказ не оставляет частично сохранённых данных; ошибка 4xx называет поле.
  applicability:
    when:
    - Есть связи.
    skip_when:
    - Нет связей.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0104'
- id: RES-DELETE-WITH-DEPENDENTS
  status: approved
  title: Удаление ресурса с зависимыми объектами выполняется по правилам каскада
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - data-integrity
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть зависимые объекты.
  steps:
  - action: Удалить родительский ресурс с дочерними.
  - action: После удаления проверить зависимые операции (выдача токена, вычисление прав), в том числе при закэшированной конфигурации
    notes: 'Real-world bug: RWB-0102 (keycloak/keycloak#51589)'
  - action: Удалить владельца, у которого сервер автоматически создал зависимые объекты, и проверить, что ссылка на владельца
      в них разрешается и зависимые удаляются
    notes: 'Real-world bug: RWB-0102 (kubernetes/kubernetes#136890)'
  - action: Удалить поле, указанное в настройках коллекции (поля для дублирования), и проверить, что ссылка на него удалена
      из настроек
    notes: 'Real-world bug: RWB-0102 (directus/directus#23923)'
  - action: Удалить объект, перекрывающий адрес сервиса по имени, и проверить, что сервис вернулся к прежнему поведению без
      503
    notes: 'Real-world bug: RWB-0102 (Kong/kong#7859)'
  - action: Удалить объект с миллионами зависимых записей и проверить, что удаление завершается успешно за время жизни токена
    notes: 'Real-world bug: RWB-0102 (keycloak/keycloak#43516)'
  - action: Удалить настройку, на которую ссылается контент (язык с документами, историями, шаблонами) - запрет или каскад по
      ТЗ, опубликованные переводы не теряются молча
    notes: inbox №447
  expected:
  - Каскадное удаление или отказ строго по контракту; нет висячих ссылок.
  applicability:
    when:
    - Есть зависимости.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0102'
- id: RES-SOFT-DELETE-VISIBILITY
  status: approved
  title: Мягко удалённые ресурсы не видны в обычных операциях
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - data-integrity
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Используется soft delete.
  steps:
  - action: Удалить ресурс и проверить чтение, список, поиск, счётчики, уникальность имени.
  - action: Заблокировать или деактивировать учётку и проверить, что поиск и списки пользователей её не возвращают, как и
      чтение по ID
    notes: 'Real-world bug: RWB-0297 (GHSA-8r7f-r8hj-r3rv)'
  - action: 'Запросить неактивный объект через все публичные эндпоинты: по ID, по категории, по тегу'
    notes: 'Real-world bug: RWB-0297 (GHSA-mf8r-wm2w-f8c5)'
  expected:
  - Ресурс скрыт везде, кроме задокументированных административных операций; уникальность учитывает политику.
  applicability:
    when:
    - Soft delete.
    skip_when:
    - Hard delete.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0297'
