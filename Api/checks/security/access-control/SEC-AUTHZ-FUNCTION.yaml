checks:
- id: SEC-AUTHZ-FUNCTION
  status: approved
  title: User without required permission cannot invoke operation
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Operation has a permission/authorization rule.
  steps:
  - action: Authenticate as a user lacking the permission and call the protected operation.
    notes: 'Matrix axis: Authorization; scenario: Missing permission. Use isolated synthetic identities and data.'
  - action: Запросить ресурс минимальной достаточной ролью и сравнить с ответом полной учётки и прежней версии — вложенные
      коллекции не отфильтрованы молча при 200
    notes: 'Real-world bug: RWB-0146 (keycloak/keycloak#52753)'
  - action: Маршруты из базовых/общих обработчиков — проверять каждый отдельно, а не по одному представителю
    notes: 'Real-world bug: RWB-0146 (nestjs/nest#879)'
  - action: Имена методов/маршрутов с общим префиксом и разным регистром при правилах по имени
    notes: 'Real-world bug: RWB-0146 (GHSA-88h9-xgvx-hvf2)'
  - action: Под пользователем с правом отправки или чтения выполнить операцию с параметром, неявно меняющим настройку ресурса
      (тип маршрутизации адреса), и проверить отказ без права на изменение ресурса
    notes: 'Real-world bug: RWB-0146 (GHSA-rf99-f9j2-gv3f)'
  - action: Повторить операцию на каждом поддерживаемом языке команд (SQL, скриптовые) под ролью только для чтения
    notes: 'Real-world bug: RWB-0146 (GHSA-48qw-824m-86pr)'
  - action: Повторить проверку права для каждой операции группы (все команды изменения схемы), а не только для одной
    notes: 'Real-world bug: RWB-0146 (GHSA-vg6x-6pg9-6qwg)'
  - action: Повторить операции над данными без прав через каждый альтернативный интерфейс к тем же данным (HTTP API хранилища,
      а не только SQL)
    notes: 'Real-world bug: RWB-0146 (GHSA-2xv8-gjwh-fv8p)'
  - action: Вызвать операцию под пользователем с глобальным правом того же типа, но без права на конкретный объект
    notes: 'Real-world bug: RWB-0146 (GHSA-jhcq-6wqp-qcfx)'
  - action: Заменить родительскую группу, включив в неё объект, требующий дополнительной привилегии, под пользователем только
      с общим правом записи
    notes: 'Real-world bug: RWB-0146 (GHSA-r2g5-993q-664g)'
  - action: Отправить запрос проверки (dry-run) с предлагаемыми значениями под пользователем только с правом чтения
    notes: 'Real-world bug: RWB-0146 (GHSA-qvj8-gwpm-4x49)'
  - action: Выполнить операцию над объектом под пользователем с правом на операцию, но без права чтения этого объекта
    notes: 'Real-world bug: RWB-0146 (GHSA-mw82-xcg6-gx79)'
  - action: Загрузить вложение в запись через отдельный эндпоинт вложений, когда политики запрещают изменение записи и загрузку
      в это поле
    notes: 'Real-world bug: RWB-0146 (GHSA-pqpw-cvm4-8mv9)'
  - action: Отправить напрямую изменяющий запрос, право на который проверяется только при открытии формы
    notes: 'Real-world bug: RWB-0146 (GHSA-8fq9-273g-6mrg)'
  - action: Изменить собственный объект от роли без права публикации, передав статус «опубликован», и изменить свой уже опубликованный
      объект; сравнить с тем же действием через другой API продукта
    notes: 'Real-world bug: RWB-0146 (GHSA-5mmc-8pc9-wggg)'
  - action: Отправить от роли без права загрузки незавершённые части chunked-загрузки и проверить, что они отклоняются до
      сохранения во временное хранилище
    notes: 'Real-world bug: RWB-0146 (GHSA-67mx-6wf2-92xp)'
  - action: Изменить в присылаемом клиентом состоянии серверного компонента ID привязанного объекта и вызвать изменяющее действие
      от роли только с правом просмотра
    notes: 'Real-world bug: RWB-0146 (GHSA-2cg9-97gq-9mqp)'
  - action: Вызвать устаревший эндпоинт обратной операции (возврат) пользователем, у которого есть только право на прямую
      операцию (выдачу)
    notes: 'Real-world bug: RWB-0146 (GHSA-8frh-vhgh-64cf)'
  - action: Вызвать вспомогательные обработчики операции (загрузка формы, выполнение, скачивание результата) напрямую, минуя
      основной эндпоинт с проверкой права
    notes: 'Real-world bug: RWB-0146 (GHSA-fm29-4mq3-phg6)'
  - action: Передать в поле формы _handler имя внутреннего метода контроллера и проверить отказ, как при передаче через заголовок
    notes: 'Real-world bug: RWB-0146 (GHSA-j5jq-cr68-v2xx)'
  - action: Открыть список с правом только на просмотр, затем изменить порядок и родителя элементов структуры
    notes: 'Real-world bug: RWB-0146 (GHSA-xxpx-f366-4xpq)'
  - action: Выполнить перемещение с перезаписью (force=true) при конфликте имён пользователем без права удаления в месте назначения
    notes: 'Real-world bug: RWB-0146 (GHSA-3w32-23wj-rxg3)'
  - action: Заменить файл другим существующим файлом (assetId + sourceAssetId) без права удаления источника; источник не удаляется
    notes: 'Real-world bug: RWB-0146 (GHSA-qh45-9g5p-m2v4)'
  - action: Переместить объект в раздел или контейнер, где у пользователя только право чтения
    notes: 'Real-world bug: RWB-0146 (GHSA-43cq-c2gq-pfpw)'
  - action: Вызвать эндпоинты административного API с токеном пользователя другого типа (участника сайта, а не сотрудника)
      и проверить 403
    notes: 'Real-world bug: RWB-0146 (GHSA-hrww-x3fq-xcvh)'
  expected:
  - Access is denied according to policy; no protected side effect occurs.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Operation has a permission/authorization rule.
    skip_when:
    - Operation is intentionally available to all authenticated users.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0146'
