checks:
- id: DB-API-DATA-MATCH
  status: approved
  title: После операции API в БД изменены ровно ожидаемые строки с ожидаемыми значениями
  category: db
  protocols:
  - db
  kind: contract
  priority: P1
  tags:
  - db
  - contract
  - data-integrity
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  - Известны допустимые побочные изменения операции (триггеры, аудит, мягкое удаление).
  steps:
  - action: После каждого create, update, delete через API сравнить запись в БД с запросом и ответом — значения, типы, default,
      null
    notes: inbox №75
  - action: Сравнить снимок затронутых таблиц до и после операции — изменены именно ожидаемые строки и никакие другие
    notes: inbox №136
  expected:
  - Затронуты только ожидаемые таблицы и строки, кроме описанных побочных изменений; значения, типы, default и null совпадают
    с запросом и ответом; удаление удаляет или помечает по правилу.
  applicability:
    when:
    - Есть доступ к БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки БД)
- id: DB-SENSITIVE-DATA-PROTECTED
  status: approved
  title: Чувствительные данные хранятся защищённо
  category: db
  protocols:
  - db
  kind: security
  priority: P1
  tags:
  - db
  - security
  - privacy
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Прочитать колонки с паролями, картами и секретами — нет открытого текста
    notes: inbox №80
  - action: Проверить колонки с персональными данными — шифрование по требованиям
    notes: inbox №139
  - action: Проверить, что импортированные хеши разных алгоритмов хранятся в формате, по которому определяется алгоритм (префикс
      или параметры), и проверяются при входе (AUTH-IMPORTED-PASSWORD-HASH)
    notes: inbox №256
  expected:
  - Пароли — стойкий хэш с солью; номера карт — токен или маска; секреты зашифрованы; персональные данные — по классификации
    и требованиям; открытого текста там, где он запрещён, нет.
  applicability:
    when:
    - Есть доступ к БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP ASVS V6, V2.4
  - Смежные — PRIV-DATA-MASKING, AUTH-IMPORTED-PASSWORD-HASH
  - ADR 0006 (проверки БД)
- id: DB-ACCESS-SCOPE-IN-QUERY
  status: approved
  title: Граница доступа задаётся в самом запросе к БД
  category: db
  protocols:
  - db
  kind: security
  priority: P1
  tags:
  - db
  - security
  - authz
  - tenant-isolation
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Проверить в журнале запросов, что выборка дочерних объектов по ID содержит условие на родительский проект
    notes: inbox №233
  - action: Удалить запись с зависимыми строками — каскад ограничен тем же project_id
    notes: inbox №234
  - action: Выполнить операцию пользователем без разрешённых объектов — условие IN по пустому списку не превращается в запрос
      без условия
    notes: inbox №236
  - action: Проверить, что фильтр доступа применяется в запросе к БД, а не по полям результата после выборки
    notes: inbox №241
  - action: Сменить видимость ресурса на приватную каждым путём изменения — производные записи (подписки, звёзды) пользователей
      без доступа удаляются
    notes: inbox №246
  expected:
  - Граница доступа применяется при выборке и изменении (условие в запросе, RLS или эквивалент), а не фильтрацией результата;
    каскады ограничены своим проектом; пустой список разрешённых даёт пустой результат; производные данные чистятся при смене
    видимости; чужие данные не утекают и не меняются.
  applicability:
    when:
    - Есть доступ к журналу запросов.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API1:2023
  - Смежные — SEC-TENANT-READ, SEC-OWNERSHIP-REFERENCE-INDIRECT
  - ADR 0006 (проверки БД)
- id: DB-IMPORT-CONSISTENCY
  status: approved
  title: Импорт не оставляет частичного состояния вне документированной политики
  category: db
  protocols:
  - db
  kind: reliability
  priority: P2
  tags:
  - db
  - reliability
  - data-integrity
  - ci
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Импортировать выгрузку с таблицами, где есть столбцы-счётчики, — импорт не прерывается на полпути
    notes: inbox №228
  - action: 'Импортировать связи с нарушением внешнего ключа в одной строке — по документированной политике: строка пропускается
      с отчётом, а остальные импортируются, или импорт откатывается целиком; обрыва посередине нет'
    notes: inbox №268
  expected:
  - Результат соответствует документированной политике импорта (атомарный откат или пропуск строк с отчётом); частичного состояния
    вне политики нет.
  applicability:
    when:
    - Есть импорт данных.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Смежная — RES-EXPORT-IMPORT-ROUNDTRIP
  - ADR 0006 (проверки БД)
