# decision: accept | reject | pending
batch: strapi
clusters:
- key: relation-connect-disconnect-conflict
  decision: accept
  check_id: RES-RELATION-CONNECT-DISCONNECT-CONFLICT
  file: checks/common/resource-lifecycle.yaml
  bugs: [strapi/strapi#25710]
  idea: Изменение упорядоченных связей, где в одном запросе connect ставит позицию относительно связи из disconnect (before/after удаляемой), выполняется с корректным порядком оставшихся связей или отклоняется 4xx с понятной ошибкой — без 5xx
