checks:
- id: REST-MASS-ASSIGNMENT
  status: approved
  title: Mass assignment защищённых полей
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - security
  - validation
  - negative
  - rest
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Передать служебные флаги защиты, снятие которых отключает другие проверки
    notes: 'Real-world bug: RWB-0121 (keycloak/keycloak#52488)'
  - action: Передать точечные пути и операторы хранилища и проверить обход полевых прав на каждом бэкенде хранения
    notes: 'Real-world bug: RWB-0121 (GHSA-4ww4-68q3-h7g5)'
  - action: Учётные поля (password) в общем эндпоинте изменения пользователя при полевом запрете
    notes: 'Real-world bug: RWB-0121 (GHSA-fx49-4h83-wjv9)'
  - action: Глобальные флаги безопасности в объекте настроек и проверка последствий для доступа
    notes: 'Real-world bug: RWB-0121 (GHSA-vmjq-hvgq-2wv4)'
  - action: Отправить на публичный эндпоинт привилегированные поля, которые модель разворачивает из вложенного объекта на
      верхний уровень JSON, и проверить, что они не записаны
    notes: 'Real-world bug: RWB-0121 (GHSA-5gvw-p9qm-jgwh)'
  - action: Отправить защищённое поле под именем в стиле именования API (snake_case) и под исходным именем и проверить, что
      оно не записано
    notes: 'Real-world bug: RWB-0121 (GHSA-3pjw-73gf-8qr5)'
  - action: Отправить на публичный эндпоинт привилегированное поле-коллекцию (список ролей, словарь прав) и проверить, что
      она не заполнена
    notes: 'Real-world bug: RWB-0121 (GHSA-5hh8-q8hv-fr38)'
  - action: Отправить на публичный эндпоинт привилегированное полиморфное поле вместе с его внешним свойством-дискриминатором
      типа и проверить, что поле не записано
    notes: 'Real-world bug: RWB-0121 (GHSA-mhm7-754m-9p8w)'
  - action: Отправить защищённое поле с именем в другом регистре при регистронезависимом сопоставлении полей
    notes: 'Real-world bug: RWB-0121 (GHSA-5jmj-h7xm-6q6v)'
  - action: Отправить JSON Patch с многосегментным путём через поле, закрытое для записи
    notes: 'Real-world bug: RWB-0121 (GHSA-cv39-x4c6-hhp2)'
  - action: Отправить защищённое поле в теле каждого поддерживаемого медиатипа (Collection+JSON, UBER)
    notes: 'Real-world bug: RWB-0121 (GHSA-7fxc-486f-32q9)'
  - action: Передать в теле обновления своего объекта поле родителя с ID чужого проекта и проверить, что объект не переносится
    notes: 'Real-world bug: RWB-0121 (GHSA-569v-q83c-3j3g)'
  - action: Передать защищённое поле вложенным в разрешённый объект верхнего уровня и проверить, что оно отклоняется или не
      применяется
    notes: 'Real-world bug: RWB-0121 (GHSA-48p8-g2fx-3wwm)'
  - action: Передать новый пароль в общем эндпоинте сохранения пользователя, минуя отдельную операцию смены пароля
    notes: 'Real-world bug: RWB-0121 (GHSA-p8x7-9vfw-p7vc)'
  - action: Передать id во вложенном объекте атрибутов (newAttributes) операции дублирования или массового изменения
    notes: 'Real-world bug: RWB-0121 (GHSA-x5m4-g2cq-52pq)'
  - action: Сохранить свой ресурс с полем авторов (authors, author) на другого пользователя без права менять авторство
    notes: 'Real-world bug: RWB-0121 (GHSA-qq2c-2q8j-jh27)'
  expected:
  - role/owner/status/balance нельзя менять через неразрешённые поля payload
  applicability:
    when:
    - есть защищённые поля модели
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0121'
