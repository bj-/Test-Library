- id: INJ-FILTER-EXPRESSION
  status: approved
  title: Выражения фильтрации (OData, RSQL, JSONPath, GraphQL where) не позволяют выйти за ограничения
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - filtering
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API принимает язык выражений фильтрации.
  steps:
  - action: Сформировать фильтры по скрытым полям, с вложенными связями, с функциями и подзапросами.
  - action: Добавить фильтр по скрытым полям как оракул подбора секрета (без инъекции синтаксиса)
    notes: 'Real-world bug: RWB-0082 (GHSA-v6q3-xqxm-6f5v)'
  - action: Добавить синтаксис поисковых движков (RediSearch TAG/TEXT) и фильтры векторных хранилищ в RAG
    notes: 'Real-world bug: RWB-0082 (GHSA-5x6v-p487-7qh2)'
  - action: Пользовательский SQL-подобный DSL — инъекция через позиции идентификаторов (имена функций) с обходом фильтра тенанта
    notes: 'Real-world bug: RWB-0082 (GHSA-9q4r-4842-93vw)'
  - action: Сегменты пути к вложенным полям JSON в фильтре, а не только значения
    notes: 'Real-world bug: RWB-0082 (GHSA-pj7x-6wpf-pgvp)'
  - action: Фильтр по скрытым полям через полиморфные связи как оракул подбора
    notes: 'Real-world bug: RWB-0082 (GHSA-fpww-c55p-cjv6)'
  - action: Параметр логического оператора (filterOperator=OR) в комбинации с обязательным серверным фильтром видимости/арендатора
    notes: 'Real-world bug: RWB-0082 (GHSA-xf65-r35x-wmmv)'
  expected:
  - Фильтрация по непубличным полям запрещена.
  - Результат не расширяет видимость данных.
  applicability:
    when:
    - Есть язык фильтров.
    skip_when:
    - Фиксированные параметры фильтрации.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0082'
- id: INJ-REDOS
  status: approved
  title: Пользовательский ввод не вызывает катастрофический backtracking в regex
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - hardening
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Поля валидируются регулярными выражениями или поиск поддерживает regex.
  steps:
  - action: Отправить строки вида aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa! против уязвимых паттернов (email, url).
  - action: 'data: URL и другие нестандартные схемы в параметрах с URL; заодно — ограничение допустимых схем'
    notes: 'Real-world bug: RWB-0088 (GHSA-c29m-xwm3-cm6r)'
  - action: Патологический хост в Location редиректа при server-side загрузке URL
    notes: 'Real-world bug: RWB-0088 (GHSA-mghh-pgcx-3jjj)'
  - action: Поля даты/времени с длинной дробной частью секунд
    notes: 'Real-world bug: RWB-0088 (GHSA-6h2x-m376-mqjq)'
  - action: Пользователь задаёт сам шаблон (pathFilters), а не только данные под серверный regex
    notes: 'Real-world bug: RWB-0088 (GHSA-jx63-h26r-8cph)'
  - action: Заголовки запроса (User-Agent), разбираемые до маршрутизации, — в том числе на несуществующих путях
    notes: 'Real-world bug: RWB-0088 (GHSA-68jq-fhch-4xq4)'
  - action: Заголовок Content-Type multipart и параметр boundary
    notes: 'Real-world bug: RWB-0088 (GHSA-2g7p-5934-q4w7)'
  - action: ReDoS при анализе содержимого файла (заголовок SVG/изображения), в том числе скачанного по URL, а не только в
      полях запроса
    notes: 'Real-world bug: RWB-0088 (GHSA-gjj5-9665-rwrc)'
  - action: email-адреса и почтовые заголовки (комментарии RFC 5322, длинные строки без '@') — квадратичный парсер, а не только
      regex
    notes: 'Real-world bug: RWB-0088 (GHSA-prgh-xp8r-p3m5)'
  - action: glob/brace-шаблоны в параметрах поиска — квадратичное раскрытие, а не regex
    notes: 'Real-world bug: RWB-0088 (GHSA-q2hr-2g5m-vwhr)'
  - action: Рендеринг Markdown/разметки пользователя (автоссылки) — квадратичный разбор, а не regex
    notes: 'Real-world bug: RWB-0088 (GHSA-253c-mchw-3w2r)'
  - action: Незавершённая HTML-разметка в контенте с серверным разбором — зависание парсера, не regex
    notes: 'Real-world bug: RWB-0088 (GHSA-f67j-2jqw-jpq7)'
  - action: Сверхлинейный разбор сериализованного формата (индексы вне границ), не только регулярные выражения
    notes: 'Real-world bug: RWB-0088 (GHSA-9rgm-9g3h-6x36)'
  - action: Оператор фильтра, принимающий сырой regex от клиента; проверять на каждом драйвере БД/окружении
    notes: 'Real-world bug: RWB-0088 (GHSA-jgm3-qmp2-c4p7)'
  expected:
  - Время ответа остаётся в пределах бюджета, CPU не насыщается.
  applicability:
    when:
    - Есть regex-валидация.
    skip_when:
    - Нет regex.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0088'
