checks:
- id: REST-RETRY-TRANSIENT-ERROR
  title: Retry после временной ошибки
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - reliability
  - resilience
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - повтор безопасен и не дублирует бизнес-эффект
  applicability:
    when:
    - есть retry policy или временные ошибки
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
