- id: RES-DB-OBJECT-NAMES
  status: draft
  title: API по схеме БД работает с объектами в любом регистре, со спецсимволами и зарезервированными именами
  category: resources
  protocols:
  - generic
  kind: boundary
  priority: P2
  tags:
  - boundary
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - API строится по схеме БД (автогенерация, интроспекция) или работает с объектами БД по их именам.
  - Желательно — доступ к БД или её описанию (СУБД, collation, правила регистра идентификаторов); без него ожидание по регистру
    — только по документации и фактическому поведению.
  steps:
  - action: Создать таблицы, столбцы и пользовательские типы с именами в верхнем и смешанном регистре, со спецсимволами (пробел,
      дефис, кавычки, точка) и совпадающими со встроенными типами и ключевыми словами.
  - action: Прочитать, создать, изменить и удалить записи через API; сравнить имена в схеме API, запросах и ответах с именами
      в БД.
  - action: Обратиться к объекту по имени в другом регистре.
  expected:
  - Все операции работают; имена сохраняют регистр на всём пути (БД → схема API → запрос → ответ), без молчаливой нормализации.
  - Обращение в другом регистре ведёт себя так, как сама БД (регистрозависимая или нет) и как описано в документации; расхождение
    источников — находка.
