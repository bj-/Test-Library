checks:
- id: REST-REQUEST-SIZE-LIMIT
  status: approved
  title: Лимит размера тела
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: boundary
  priority: P1
  tags:
  - boundary
  - negative
  - reliability
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: 'Добавить сочетание лимитов по маршрутам: особый лимит не ломает разбор тела на других'
    notes: 'Real-world bug: RWB-0130 (nestjs/nest#14734)'
  - action: 'Отправить тело с Content-Encoding: gzip, которое после распаковки превышает лимит в сотни раз'
    notes: 'Real-world bug: RWB-0130 (GHSA-2jc5-xhx8-qj6h)'
  - action: Отправить тело application/x-www-form-urlencoded больше лимита и проверить отказ до чтения тела целиком
    notes: 'Real-world bug: RWB-0130 (GHSA-6xw4-3v39-52mm)'
  - action: Отправить multipart с одним текстовым полем (без filename) размером в сотни мегабайт
    notes: 'Real-world bug: RWB-0130 (GHSA-w9pc-fmgc-vxvw)'
  - action: Отправить сообщение больше лимита на эндпоинт с проверкой формата и убедиться по времени ответа, что лимит проверяется
      до разбора
    notes: 'Real-world bug: RWB-0130 (GHSA-rrqh-93c8-j966)'
  - action: Отправить без валидной подписи большое тело на эндпоинт с подписью тела и проверить отказ до приёма всего тела
      и отсутствие временных файлов
    notes: 'Real-world bug: RWB-0130 (GHSA-j3hg-9rp3-5hw9)'
  - action: Отправить на публичный эндпоинт вебхука тело больше лимита с неверной подписью и проверить 413 и отсутствие тела
      в логах
    notes: 'Real-world bug: RWB-0130 (GHSA-v828-m3pf-vq9q)'
  expected:
  - размеры около границы обрабатываются корректно; превышение безопасно отклоняется
  applicability:
    when:
    - задан лимит тела запроса
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0130'
