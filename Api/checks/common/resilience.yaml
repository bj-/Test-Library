checks:
- id: RESIL-DEPENDENCY-DOWN
  status: approved
  title: Недоступность зависимости даёт контролируемую ошибку
  category: resilience
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: reliability
  priority: P1
  tags:
  - resilience
  - error-handling
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Можно отключить зависимость (БД, кэш, внешний API) в тестовом окружении.
  steps:
  - action: Отключить зависимость и выполнить операции, которые от неё зависят.
  - action: Сразу после отказа зависимости проверить живость сервиса
    notes: 'Real-world bug: RWB-0107 (strapi/strapi#27374)'
  - action: Ошибка зависимости не маппится в 403/404 (ложный отказ в доступе)
    notes: 'Real-world bug: RWB-0107 (directus/directus#27412)'
  - action: Зависимость отключена в конфигурации (а не упала) — контролируемая ошибка
    notes: 'Real-world bug: RWB-0107 (keycloak/keycloak#51352)'
  - action: Явно проверять, что при недоступном хранилище списки не возвращают 200 с пустыми данными
    notes: 'Real-world bug: RWB-0107 (keycloak/keycloak#51268)'
  - action: Отказ зависимости после отправки заголовков потокового ответа — проверить живость сервиса после
    notes: 'Real-world bug: RWB-0107 (nestjs/nest#10681)'
  - action: Вернуть зависимость и проверить, что сервис переподключается без своего перезапуска
    notes: 'Real-world bug: RWB-0107 (nestjs/nest#9363)'
  - action: Сделать недоступным вызываемый сервером вебхук (таймаут, обрыв, отказ соединения) и проверить, что ответ — 503
      или 504, а не 400
    notes: 'Real-world bug: RWB-0107 (kubernetes/kubernetes#130690)'
  - action: Сделать DNS недоступным и проверить, что ошибка возвращается за настроенный тайм-аут без повторов по другим типам
      записей
    notes: 'Real-world bug: RWB-0107 (Kong/kong#10182)'
  - action: Включить буферизацию ответа, сделать upstream недоступным и проверить 502, как без буферизации
    notes: 'Real-world bug: RWB-0107 (Kong/kong#6726)'
  - action: Получить от зависимости 4xx или 5xx на кэшируемый запрос, восстановить зависимость и повторить запрос в пределах
      ttl кэша
    notes: 'Real-world bug: RWB-0107 (apollographql/apollo-server#1510)'
  - action: Вызвать на реплике конфликт запроса с восстановлением и проверить, что запрос завершается ошибкой, а не повторяется
      бесконечно
    notes: 'Real-world bug: RWB-0107 (PostgREST/postgrest#3673)'
  expected:
  - Ответ 503 или задокументированная ошибка, без зависания и утечек; после восстановления работа продолжается.
  applicability:
    when:
    - Есть зависимости.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0107'
- id: RESIL-PARTIAL-DEGRADATION
  status: approved
  title: Отказ некритичной зависимости не ломает основной функционал
  category: resilience
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: reliability
  priority: P2
  tags:
  - resilience
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть некритичные зависимости (рекомендации, аналитика).
  steps:
  - action: Отключить некритичную зависимость.
  - action: Отключить модуль или фичу лицензии и проверить все операции CRUD, а не только создание
    notes: 'Real-world bug: RWB-0109 (strapi/strapi#27245)'
  - action: Прервать по тайм-ауту перезагрузку кэша схемы и проверить, что запросы обслуживаются по прежнему кэшу
    notes: 'Real-world bug: RWB-0109 (PostgREST/postgrest#4873)'
  expected:
  - Основные операции работают; ответ помечает отсутствующие данные по контракту.
  applicability:
    when:
    - Есть некритичные зависимости.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0109'
- id: RESIL-GRACEFUL-SHUTDOWN
  status: approved
  title: Перезапуск экземпляра не обрывает выполняющиеся запросы
  category: resilience
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: reliability
  priority: P2
  tags:
  - resilience
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Несколько экземпляров за балансировщиком.
  steps:
  - action: Под нагрузкой выполнить rolling restart.
  - action: Остановить экземпляр, удерживающий распределённую блокировку, негрейсфул (SIGKILL, OOM) и проверить, что блокировка
      освобождается и работа продолжается
    notes: 'Real-world bug: RWB-0108 (directus/directus#27961)'
  - action: Долгие соединения разных типов не блокируют остановку
    notes: 'Real-world bug: RWB-0108 (nestjs/nest#13910)'
  - action: Отправить SIGTERM экземпляру, у которого фоновая регистрация постоянно отклоняется, и проверить, что он завершается
      в пределах срока остановки
    notes: 'Real-world bug: RWB-0108 (kubernetes/kubernetes#140242)'
  - action: Вывести экземпляр вызываемого вебхука из эндпоинтов сервиса и проверить, что сервер в пределах срока прекращает
      слать ему запросы по старым соединениям
    notes: 'Real-world bug: RWB-0108 (kubernetes/kubernetes#127335)'
  expected:
  - Нет ошибок сверх порога; длительные запросы завершаются.
  applicability:
    when:
    - Есть оркестрация.
    skip_when:
    - Один экземпляр.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0108'
- id: RESIL-CIRCUIT-BREAKER
  status: approved
  title: Circuit breaker размыкается и восстанавливается по политике
  category: resilience
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: reliability
  priority: P3
  tags:
  - resilience
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Используется circuit breaker.
  steps:
  - action: Вызвать серию ошибок зависимости, затем восстановить её.
  - action: Отправить много уникальных сбойных запросов и проверить, что circuit breaker и повторы для других запросов работают
    notes: 'Real-world bug: RWB-0200 (GHSA-2827-2mxx-j8pv)'
  - action: Подменить код ответа клиенту на 5xx при успешном ответе зависимости и проверить, что она не помечается неработоспособной
    notes: 'Real-world bug: RWB-0200 (Kong/kong#10281)'
  expected:
  - Разомкнутое состояние возвращает быструю ошибку; полуоткрытое восстанавливается.
  applicability:
    when:
    - Есть breaker.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0200'
- id: RESIL-BROKER-DOWN
  status: approved
  title: Недоступность брокера сообщений не теряет события
  category: resilience
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: reliability
  priority: P2
  tags:
  - resilience
  - async-jobs
  - data-integrity
  - costly
  - regression
  - nightly
  preconditions:
  - Используется брокер (Kafka, RabbitMQ).
  steps:
  - action: Отключить брокер, выполнить операции, восстановить брокер.
  expected:
  - События доставлены после восстановления (outbox) или операция отклонена явно.
  applicability:
    when:
    - Есть брокер.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: RESIL-ENCRYPTION-KEY-ROTATION
  status: draft
  title: Нерасшифровываемое после смены ключа значение не ломает чтение и сохранение остальных данных
  category: resilience
  protocols:
  - rest
  kind: reliability
  priority: P3
  tags:
  - resilience
  - data-integrity
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Часть полей хранится зашифрованной (ключи интеграций, секреты); есть доступ к смене ключа и перезапуску стенда.
  steps:
  - action: Сохранить зашифрованное значение, сменить ключ шифрования и перезапустить сервис.
  - action: Прочитать и изменить объект с этим полем и соседние поля; ввести значение заново.
  expected:
  - Чтение и сохранение работают; нерасшифровываемое поле пустое или помечено, в журнале предупреждение.
  - Значение можно ввести заново.
  applicability:
    when:
    - Есть шифрование хранимых полей и управляемый стенд.
    skip_when:
    - Нет доступа к ключам стенда.
  automation:
    level: manual
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - Практика ротации ключей
  - 'Real-world bug: RWB-0021'
- id: RESIL-DEPENDENCY-TLS-RECOVERY
  status: draft
  title: Проверка доступности внешнего бэкенда проверяет его сертификат и восстанавливается без перезапуска
  category: resilience
  protocols:
  - generic
  kind: reliability
  priority: P2
  tags:
  - reliability
  - resilience
  - transport-security
  - real-world-bug
  - nightly
  preconditions:
  - Сервис обращается к внешнему бэкенду по TLS с заданным CA и следит за его доступностью.
  - Нужна возможность на время подменить бэкенд на том же адресе (тестовый сервер с чужим сертификатом).
  steps:
  - action: Подменить бэкенд сервером с сертификатом другого CA; наблюдать статус доступности и запросы через сервис.
  - action: Вернуть настоящий бэкенд и наблюдать статус без перезапуска сервиса.
  expected:
  - Соединение с сервером с чужим сертификатом отклоняется, запросы к нему не проксируются.
  - После возврата настоящего бэкенда статус в разумный срок становится «доступен» без перезапуска.
  applicability:
    when:
    - Есть внешние бэкенды по TLS и возможность подмены из предусловий.
    skip_when:
    - Нет внешних TLS-зависимостей.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - RFC 9110 §4.3.4 (проверка сертификата сервера)
  - Смежные — HARD-TLS-ONLY, RESIL-DEPENDENCY-DOWN
  - 'Real-world bug: RWB-0218'
- id: RESIL-TLS-CERT-RELOAD
  status: draft
  title: Сервер подхватывает заменённый TLS-сертификат без перезапуска
  category: resilience
  protocols:
  - generic
  kind: reliability
  priority: P3
  tags:
  - reliability
  - transport-security
  - real-world-bug
  - nightly
  preconditions:
  - Сертификат и ключ сервера заданы файлами и заменяются внешней ротацией; ротация без перезапуска заявлена.
  - Нужен доступ к файлам сертификата на стенде.
  steps:
  - action: Заменить файлы сертификата и ключа действующей новой парой; подключаться к серверу и проверять серийный номер
      и срок отдаваемого сертификата.
  expected:
  - В заявленный срок новые соединения получают новый сертификат; после истечения старого соединения успешны.
  applicability:
    when:
    - Ротация сертификата без перезапуска заявлена и есть доступ к файлам.
    skip_when:
    - Ротация без перезапуска не заявлена или нет доступа к файлам стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - Смежные — HARD-TLS-ONLY, RESIL-ENCRYPTION-KEY-ROTATION
  - 'Real-world bug: RWB-0219'
