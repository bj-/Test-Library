- id: PRIV-RESPONSE-FOREIGN-DATA
  status: approved
  title: Ответ не содержит фрагментов данных других запросов и памяти процесса
  category: privacy
  protocols:
  - rest
  - generic
  kind: security
  priority: P1
  tags:
  - security
  - privacy
  - data-integrity
  - concurrency
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Ответ формируется из двоичных данных или сериализует объекты сервера (SSR, кэш, экспорт, файлы).
  steps:
  - action: Параллельно слать запросы с уникальными маркерами в теле и Authorization.
  - action: Читать ответы эндпоинтов, отдающих двоичные или сериализованные данные; искать чужие маркеры и аномальный размер.
  - action: Загрузить изображение MNG, кадры которого не покрывают полотно, повторить несколько раз и проверить, что непокрытые
      области результата одинаковы и не содержат данных памяти
    notes: 'Real-world bug: RWB-0009 (GHSA-8g53-9m3c-69xg)'
  expected:
  - В ответе только данные этого ресурса; размер соответствует содержимому; чужих маркеров нет.
  applicability:
    when:
    - Есть двоичные или сериализованные ответы.
    skip_when:
    - Только статичный JSON из БД без общих буферов.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: critical
    likelihood: low
  references:
  - OWASP API3:2023
  - CWE-226
  - 'Real-world bug: RWB-0009'
- id: PRIV-IMPORT-URL-CREDENTIALS-NOT-STORED
  status: draft
  title: Учётные данные из URL источника импорта не сохраняются после завершения импорта
  category: privacy
  protocols:
  - generic
  kind: security
  priority: P2
  tags:
  - privacy
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть импорт или зеркалирование по URL с учётными данными (https://user:token@host/...).
  steps:
  - action: Импортировать по URL с тестовыми учётными данными, дождаться завершения и прочитать через API параметры объекта
      — адрес источника, настройки зеркала, журнал задачи.
  expected:
  - Учётные данные не сохранены и не возвращаются; адрес источника — без userinfo.
  applicability:
    when:
    - Есть импорт по URL с учётными данными.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - OWASP API3:2023, CWE-522
  - Смежные — HARD-SENSITIVE-DATA-IN-URL, OBS-NO-SECRETS-IN-LOGS
  - 'Real-world bug: RWB-0237'
