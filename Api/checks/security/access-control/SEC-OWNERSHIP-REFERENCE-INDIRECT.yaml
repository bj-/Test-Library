checks:
- id: SEC-OWNERSHIP-REFERENCE-INDIRECT
  status: approved
  title: Indirect resource references preserve authorization
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P1
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Nested resources or relationships are supported.
  steps:
  - action: Use a foreign resource identifier in nested paths, relationship fields, parent IDs, or linked-object references.
    notes: 'Matrix axis: Resource ownership; scenario: Nested reference bypass. Use isolated synthetic identities and data.'
  - action: Добавить ссылку на скрытый объект при создании, после которой ответ раскрывает его фрагмент (snippet)
    notes: 'Real-world bug: RWB-0151 (GHSA-6q6j-f24j-p477)'
  - action: Косвенная ссылка через параметр scope в запросе токена — данные цели раскрываются в claims
    notes: 'Real-world bug: RWB-0151 (keycloak/keycloak#51061)'
  - action: Вспомогательный эндпоинт с параметрами collection+id вызывает внутренний API без проверки доступа
    notes: 'Real-world bug: RWB-0151 (GHSA-4qpv-39hg-f7fx)'
  - action: Раскрытие связи и фильтр по полям связанной коллекции с условными правами чтения
    notes: 'Real-world bug: RWB-0151 (GHSA-7c34-32v3-j575)'
  - action: Несоответствие родителя в пути и фактического владельца вложенного объекта (projectId из пути игнорируется); плюс
      права, проверяемые в обработчике, а не на маршруте — проверять каждую такую операцию пользователем без права
    notes: 'Real-world bug: RWB-0151 (GHSA-72h8-wp98-7hch)'
  - action: Ссылка на секрет/учётные данные по ID в конфигурации, которую сервер использует при отправке наружу
    notes: 'Real-world bug: RWB-0151 (GHSA-pq6c-vh67-xpm3)'
  - action: Передать в обновлении ресурса ID чужого связанного объекта плоским полем (*_id) вместо вложенного объекта и проверить,
      что проверка владения одинакова для обеих форм
    notes: 'Real-world bug: RWB-0151 (GHSA-87fh-rc96-6fr6)'
  - action: Анонимно создать дочерний объект (комментарий) у ресурса в непубличном состоянии (черновик) и проверить отказ,
      как при его чтении
    notes: 'Real-world bug: RWB-0151 (GHSA-79m3-q3wh-c3qm)'
  - action: Удалить связь своего объекта с объектом недоступного проекта и проверить отказ и сохранность связи у второй стороны
    notes: 'Real-world bug: RWB-0151 (GHSA-w2ch-4xgr-22ww)'
  - action: Запросить список с раскрытием связанных объектов (expand) и проверить, что объекты недоступных проектов, включая
      вложенные уровни, не возвращаются
    notes: 'Real-world bug: RWB-0151 (GHSA-3hc7-r24j-rpwc)'
  - action: Указать в запросе свой проект и имя объекта чужого проекта для действия над ним и проверить отказ
    notes: 'Real-world bug: RWB-0151 (GHSA-52gf-6rpq-fgmx)'
  - action: Сослаться по имени на объект в ресурсе с межпространственной ссылкой и проверить, что имя разрешается в пространстве
      ссылающегося ресурса
    notes: 'Real-world bug: RWB-0151 (GHSA-qq9q-x9w4-chhj)'
  - action: Запросить данные своего проекта, подставив в путь ID вложенного объекта чужого проекта, и проверить отказ без
      его данных
    notes: 'Real-world bug: RWB-0151 (GHSA-rj9j-8772-4h6c)'
  - action: Ролью без пароля документа запросить обратные ссылки на открытый объект и проверить, что ссылки из защищённых
      документов не возвращаются
    notes: 'Real-world bug: RWB-0151 (GHSA-vg99-7gj7-2fr5)'
  - action: Создать объект со ссылкой на секрет, к которому нет права чтения, и проверить отказ
    notes: 'Real-world bug: RWB-0151 (GHSA-4227-9989-jrhx)'
  - action: Запросить доступный объект, встраивающий содержимое других объектов, и проверить, что содержимое недоступных объектов
      не возвращается
    notes: 'Real-world bug: RWB-0151 (GHSA-h6w7-xxcf-w2mq)'
  - action: Создать ресурс копированием, указав в источнике ресурс недоступного проекта, и проверить отказ
    notes: 'Real-world bug: RWB-0151 (GHSA-c9f5-j9c3-mhrg)'
  - action: Повторить ссылку на ресурс другого пространства имён для каждого типа ссылок конфигурации и проверить единый отказ
    notes: 'Real-world bug: RWB-0151 (GHSA-62fc-8686-hfmq)'
  - action: Создать публичную ссылку (предпросмотр, шаринг) на объект без права его просмотра и открыть её без аутентификации
    notes: 'Real-world bug: RWB-0151 (GHSA-65cv-w493-7vhq)'
  - action: Запросить карточку и печатную форму связанного объекта с правом только на него и проверить, что вложенные данные
      модулей без права чтения не возвращаются
    notes: 'Real-world bug: RWB-0151 (GHSA-fc33-6w3q-538h)'
  - action: Передать в одном запросе изменения ID своего родителя и ID дочернего объекта из чужого родителя
    notes: 'Real-world bug: RWB-0151 (GHSA-rm67-g9ch-vxff)'
  - action: Отправить запросы добавления в избранное и удаления из избранного для записи другого пользователя по её ID и проверить,
      что его данные не изменились
    notes: 'Real-world bug: RWB-0151 (GHSA-j5mc-p8qg-39j7)'
  - action: Запросить подтверждение удаления дочернего объекта своего ресурса с ID дочернего объекта другого пользователя
    notes: 'Real-world bug: RWB-0151 (GHSA-mr9h-45p9-fg8h)'
  - action: Запросить анонимно публичный ресурс со ссылкой на защищённый без expand и с expand, в том числе во вложенных блоках,
      и проверить, что не возвращаются ни свойства, ни имя, маршрут и id защищённого
    notes: 'Real-world bug: RWB-0151 (GHSA-wr57-hqmp-fgvh)'
  expected:
  - Authorization is enforced for both parent and referenced child resources; no cross-owner association is created.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Nested resources or relationships are supported.
    skip_when:
    - No nested or linked resources exist.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0151'
