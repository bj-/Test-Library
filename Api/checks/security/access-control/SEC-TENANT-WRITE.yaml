checks:
- id: SEC-TENANT-WRITE
  status: approved
  title: Tenant A cannot mutate tenant B data
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Multi-tenant model and mutable tenant-scoped resource.
  steps:
  - action: From tenant A, attempt to update or delete a tenant B resource.
    notes: 'Matrix axis: Tenant isolation; scenario: Cross-tenant mutation. Use isolated synthetic identities and data.'
  expected:
  - Request is denied and tenant B persisted data is unchanged.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Multi-tenant model and mutable tenant-scoped resource.
    skip_when:
    - Resource is explicitly shared with cross-tenant write permission.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
