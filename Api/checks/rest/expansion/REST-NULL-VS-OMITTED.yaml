checks:
- id: REST-NULL-VS-OMITTED
  status: approved
  title: Null и отсутствующее поле
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: boundary
  priority: P1
  tags:
  - boundary
  - validation
  - contract
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Явный null для секрета/служебного поля в PATCH запускает побочную операцию (перегенерацию) - проверить, что она
      идёт через те же правила, что и штатная операция
    notes: 'Real-world bug: RWB-0122 (keycloak/keycloak#51527)'
  expected:
  - каждый вариант соответствует правилам required/nullable/type
  applicability:
    when:
    - схема различает optional и nullable
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0122'
