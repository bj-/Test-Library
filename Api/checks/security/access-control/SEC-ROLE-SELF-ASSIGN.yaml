checks:
- id: SEC-ROLE-SELF-ASSIGN
  status: approved
  title: User cannot grant self a higher role
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - User profile or role-assignment API accepts mutable data.
  steps:
  - action: Attempt to modify own role, group, privilege flags, or permission assignments through writable fields.
    notes: 'Matrix axis: Roles/Scopes; scenario: Self role assignment. Use isolated synthetic identities and data.'
  - action: Добавить назначение своей и более высокой роли другим пользователям, а не только себе
    notes: 'Real-world bug: RWB-0153 (GHSA-4pvx-fwjj-8gpc)'
  - action: Самоназначение членства в арендаторах (поле массива), а не роли
    notes: 'Real-world bug: RWB-0153 (GHSA-p96c-xwx8-3cqj)'
  - action: Под учёткой с правом редактирования ресурса отправить его обновление с настройками доступа, дающими роль владельца
      другой своей учётке
    notes: 'Real-world bug: RWB-0153 (GHSA-m9c2-85gv-8xr5)'
  - action: Выдать себе более высокое право через универсальный API редактирования данных объекта и проверить, что применяются
      те же проверки, что в основном пути
    notes: 'Real-world bug: RWB-0153 (GHSA-45ph-gxxr-gwgw)'
  - action: Включить в участники субъект другого вида (группа, сервисный аккаунт, «все аутентифицированные») без права управления
      участниками и проверить отказ
    notes: 'Real-world bug: RWB-0153 (GHSA-gfjv-gqf2-c888)'
  expected:
  - Privileged fields are ignored or rejected unless the caller has explicit grant permission; effective privileges do not
    increase.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - User profile or role-assignment API accepts mutable data.
    skip_when:
    - Role changes are intentionally self-service under a documented policy.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0153'
