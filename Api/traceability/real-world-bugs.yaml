    правилу — не области исходного или другого клиента
  checks:
  - AUTH-TOKEN-EXCHANGE-DEFAULT-SCOPE
  batch: keycloak
  bugs:
  - url: https://github.com/keycloak/keycloak/issues/45716
    fix: https://github.com/keycloak/keycloak/commit/0981d2411c73e52c961f36efacef83005270f463
    product: Keycloak
    closed: '2026-05-18'
    summary: При обмене токенов с включёнными динамическими областями берутся области по умолчанию не того клиента
RWB-0349:
  pattern: Итог нескольких правил над одним значением в одном запросе (маппинг групп и ролей при входе, правила скидок, политики)
    детерминирован и соответствует документированному приоритету — повтор операции даёт тот же результат
  checks:
  - BIZ-RULES-DETERMINISTIC
  batch: keycloak
  bugs:
  - url: https://github.com/keycloak/keycloak/issues/44480
    fix: https://github.com/keycloak/keycloak/commit/37f2488441f1103db6900cb29546c437e05b306e
    product: Keycloak
    closed: '2025-11-26'
    summary: Два правила в одном запросе по-разному решают о членстве в группе, итог зависит от порядка их выполнения
RWB-0350:
  pattern: Ограничения системных и административных ролей применяются по идентичности роли (id, область), а не по совпадению
    имени — пользовательская роль с таким же именем назначается законно, настоящая административная — по правилам
  checks:
  - SEC-ROLE-IDENTITY-NOT-NAME
  batch: keycloak
  bugs:
  - url: https://github.com/keycloak/keycloak/issues/43578
    fix: https://github.com/keycloak/keycloak/commit/2b785425fa17d54bb8b72eb2dc7f46284c9a6dab
    product: Keycloak
    closed: '2025-10-23'
    summary: Клиентская роль с именем admin в обычной области ограничена как роль администратора сервера
RWB-0351:
  pattern: Выход по OIDC (RP-Initiated Logout) без активной сессии на сервере — истекла, offline-доступ, вход через внешний
    IdP — с валидным id_token_hint и зарегистрированным post_logout_redirect_uri завершается перенаправлением на него без
    ошибки; недоверенный URI по-прежнему отклоняется
  checks:
  - AUTH-OIDC-LOGOUT-WITHOUT-SESSION
  batch: keycloak
  bugs:
  - url: https://github.com/keycloak/keycloak/issues/46379
    fix: https://github.com/keycloak/keycloak/pull/46479
    product: Keycloak
    closed: '2026-02-27'
    summary: Выход без SSO-сессии после входа через внешний IdP завершается ошибкой
