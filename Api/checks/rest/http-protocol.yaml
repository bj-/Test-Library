checks:
- id: HTTP-UNKNOWN-ROUTE
  status: approved
  title: Неизвестный маршрут возвращает 404, а не 5xx или 200
  category: http-semantics
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - negative
  - contract
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Базовый URL API известен.
  steps:
  - action: Запросить несуществующий путь и опечатку в существующем пути.
  - action: Запросить несуществующий ресурс при десятках тысяч существующих и проверить, что приходит быстрый 404, а не обрыв
      соединения
    notes: 'Real-world bug: RWB-0336 (PostgREST/postgrest#4463)'
  - action: Запросить несуществующий ресурс с параметром вложения связанных ресурсов и проверить 404, а не 400
    notes: 'Real-world bug: RWB-0336 (PostgREST/postgrest#3602)'
  - action: Запросить несуществующий путь со скриптом в пути — тело не содержит отпечатка фреймворка (Cannot GET) и не отражает
      путь неэкранированным
    notes: inbox №9
  - action: Запросить эндпоинт функции, отключённой в конфигурации сервера, и проверить 404, а не 5xx
    notes: 'Real-world bug: RWB-0336 (keycloak/keycloak#48806)'
  expected:
  - Ответ 404 в формате модели ошибок.
  - Не возвращается HTML-страница по умолчанию и не раскрывается фреймворк.
  applicability:
    when:
    - Всегда для REST API.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0336'
- id: HTTP-OPTIONS-ALLOW
  status: approved
  title: OPTIONS возвращает согласованный список методов
  category: http-semantics
  protocols:
  - rest
  kind: contract
  priority: P3
  tags:
  - contract
  - compatibility
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Эндпоинт поддерживает несколько методов.
  steps:
  - action: Отправить OPTIONS без Origin.
  - action: 'Отправить OPTIONS с Accept: application/json и другими поддерживаемыми медиатипами и проверить 200 с Allow'
    notes: 'Real-world bug: RWB-0335 (PostgREST/postgrest#2821)'
  expected:
  - Allow соответствует реально поддерживаемым методам.
  applicability:
    when:
    - OPTIONS поддерживается.
    skip_when:
    - OPTIONS отключён на шлюзе.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0335'
- id: HTTP-TRAILING-SLASH-CASE
  status: approved
  title: Вариации пути (слэш в конце, регистр, двойной слэш) обрабатываются единообразно
  category: http-semantics
  protocols:
  - rest
  kind: boundary
  priority: P3
  tags:
  - boundary
  - contract
  - security
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Существующий эндпоинт.
  steps:
  - action: Вызвать /items/, /Items, //items, /items;param, /./items - с сессией и без.
  - action: Вызвать защищённый путь с закодированными %3B, %2F и %5C в сегментах без прав и проверить, что правило доступа
      по пути срабатывает
    notes: 'Real-world bug: RWB-0197 (GHSA-qcxp-gm7m-4j5v)'
  - action: Запросить заблокированный файл с косой чертой в конце пути и проверить, что ответ — тот же отказ, что без слэша
    notes: 'Real-world bug: RWB-0197 (GHSA-964w-f6gj-5236)'
  - action: Повторить изменяющую операцию по URL с завершающим «?» без параметров и сравнить побочные эффекты с вызовом без
      него
    notes: 'Real-world bug: RWB-0197 (strapi/strapi#25724)'
  - action: 'Повторить слеши в каждой позиции пути (//api/auth/login, ///api/auth/login, /api//auth/login, /api/auth//login, /api/auth/login//) на каждом стенде, включая PROD: тот же код и тело или единообразный редирект 301/308, без 404; ответ не отражает путь из запроса'
    notes: 'inbox №350; нормализацию может давать или ломать прокси - это и проверка конфигурации стенда'
  expected:
  - Поведение одинаково для всех ручек API (либо вариация ведёт на ту же ручку, либо везде 404).
  - Вариации пути не обходят авторизацию или правила шлюза.
  - Проверяется, даже если контракт молчит или прежняя версия контракта обещала иное; фактическое поведение фиксируется тестом,
    несогласованность или исчезнувшее обещание - потенциальный дефект.
  applicability:
    when:
    - Всегда для REST.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0197'
- id: HTTP-COMPRESSION
  status: approved
  title: Сжатие ответа согласуется через Accept-Encoding
  category: http-semantics
  protocols:
  - rest
  kind: positive
  priority: P3
  tags:
  - positive
  - contract
  - performance
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Ответы крупнее порога сжатия.
  steps:
  - action: 'Запросить с Accept-Encoding: gzip, br и identity.'
  - action: Отправить сжатое тело запроса с Content-Encoding.
  - action: Запросить сжатый ответ, который устанавливает cookie сессии, и проверить живость сервиса
    notes: 'Real-world bug: RWB-0081 (expressjs/session#72)'
  expected:
  - Content-Encoding соответствует запрошенному.
  - Распакованное тело совпадает с несжатым.
  - Неподдерживаемое сжатие запроса отклоняется 415.
  applicability:
    when:
    - Сжатие включено.
    skip_when:
    - Сжатие не используется.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0081'
- id: HTTP-REQUEST-SMUGGLING
  status: approved
  title: Противоречивые Content-Length и Transfer-Encoding не приводят к request smuggling
  category: http-semantics
  protocols:
  - rest
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - hardening
  - costly
  - regression
  - nightly
  preconditions:
  - API за прокси/балансировщиком.
  steps:
  - action: Отправить запрос с CL и TE одновременно, дублирующим CL, некорректным chunked.
  - action: Сразу отправить второй запрос в то же соединение.
  expected:
  - Противоречивые запросы отклоняются 400.
  - Второй запрос не получает чужой ответ и не склеивается с первым.
  applicability:
    when:
    - Есть промежуточные прокси.
    skip_when:
    - Прямое подключение без прокси.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: HTTP-HEADER-SIZE-LIMIT
  status: approved
  title: Слишком большие заголовки отклоняются контролируемо
  category: http-semantics
  protocols:
  - rest
  kind: boundary
  priority: P2
  tags:
  - boundary
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Нет.
  steps:
  - action: Отправить заголовок 16KB, 64KB, 1000 заголовков, огромный Cookie.
  - action: По HTTP/2 отправить HEADERS без END_HEADERS и непрерывный поток CONTINUATION-фреймов и проверить разрыв по лимиту
      размера заголовков
    notes: 'Real-world bug: RWB-0196 (GHSA-cp4q-fqw9-4hf6)'
  - action: Отправить в бинарном представлении HTTP поле с заявленной длиной сверх лимита и проверить отказ до буферизации
      данных
    notes: 'Real-world bug: RWB-0196 (GHSA-hmq9-67w8-j5pw)'
  - action: Отправить сжатый блок заголовков, раскрывающийся далеко за лимит, и проверить, что распаковка прекращается на
      лимите
    notes: 'Real-world bug: RWB-0196 (GHSA-mvh2-crg5-v77c)'
  - action: Отправить кадр STOMP с огромным числом коротких заголовков и проверить, что сервер его отклоняет
    notes: 'Real-world bug: RWB-0196 (GHSA-vhch-2wf3-m8rp)'
  - action: Отправить по HTTP/2 крупный сжатый блок заголовков до подтверждения SETTINGS и проверить, что лимит уже действует
    notes: 'Real-world bug: RWB-0196 (GHSA-v3jc-474w-2wm6)'
  - action: Повторить отправку чрезмерных заголовков по HTTP/3
    notes: 'Real-world bug: RWB-0196 (GHSA-c2rx-5r8w-8xr2)'
  - action: Отправить при рукопожатии WebSocket непрерывный поток заголовков без завершения и проверить закрытие по лимиту
    notes: 'Real-world bug: RWB-0196 (GHSA-8j3g-f24p-4mpw)'
  expected:
  - Ответ 431 или 400, без 5xx и разрыва без ответа.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0196'
- id: HTTP-URL-LENGTH-LIMIT
  status: approved
  title: Очень длинный URL отклоняется контролируемо
  category: http-semantics
  protocols:
  - rest
  kind: boundary
  priority: P3
  tags:
  - boundary
  - hardening
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть query или path параметры.
  steps:
  - action: Отправить URL длиной 8KB, 16KB и 64KB.
  - action: Отправить URL максимальной допустимой длины и проверить, что сервер не отражает его в заголовках ответа без ограничения
      размера
    notes: 'Real-world bug: RWB-0243 (GHSA-m875-3xf6-mf78)'
  expected:
  - Ответ 414 или задокументированная ошибка без 5xx.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0243'
- id: HTTP-ACCEPT-LANGUAGE
  status: approved
  title: Язык сообщений определяется Accept-Language с fallback
  category: http-semantics
  protocols:
  - rest
  - graphql
  kind: positive
  priority: P3
  tags:
  - positive
  - i18n
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - API локализует сообщения.
  steps:
  - action: Запросить с ru, en, неподдерживаемым языком, некорректным значением заголовка.
  - action: Отправить серию анонимных запросов с уникальными несуществующими именами культур в Accept-Language и параметре
      культуры и проверить, что память сервиса не растёт
    notes: 'Real-world bug: RWB-0324 (GHSA-f4g7-52wc-p8x7)'
  - action: Проверить тексты ошибок на опечатки и соответствие коду и полю, а не общее «Ошибка»
    notes: inbox №57
  - action: Отправить параметр выбора языка с неподдерживаемым значением и проверить, что cookie языка не установлена и не
      изменена
    notes: 'Real-world bug: RWB-0324 (keycloak/keycloak#53999)'
  - action: 'Если регион и язык выбираются независимо, отправить теги с языком системы и регионом из перечня в любом сочетании (en-ru, ru-us) и проверить, что регион определяется по региональной части тега, язык - по языковой; отказ только для региона вне перечня'
    notes: 'inbox №359'
  - action: Запросить с тегом языка не из языков региона, в разном регистре и с подтегами (ru, ru-RU, ru-Latn-RU) - ответ на
      запасном языке региона или ошибка по контракту
    notes: inbox №449
  expected:
  - Используется запрошенный язык или задокументированный fallback.
  - Коды ошибок не зависят от языка.
  applicability:
    when:
    - API поддерживает локализацию.
    skip_when:
    - Локализации нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0324'
- id: HTTP-VARY-HEADER
  status: approved
  title: Кэшируемые ответы содержат корректный Vary
  category: http-semantics
  protocols:
  - rest
  kind: contract
  priority: P3
  tags:
  - contract
  - caching
  - regression
  - nightly
  preconditions:
  - Ответ зависит от Accept, Accept-Language, Authorization или Origin.
  steps:
  - action: Запросить ресурс с разными значениями влияющих заголовков.
  expected:
  - Vary перечисляет все заголовки, влияющие на ответ.
  applicability:
    when:
    - Ответы кэшируемы.
    skip_when:
    - 'Cache-Control: no-store для всех ответов.'
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: HTTP-BODY-WITHOUT-CONTENT-TYPE
  status: approved
  title: Тело без Content-Type обрабатывается предсказуемо
  category: http-semantics
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - negative
  - validation
  - ci
  - regression
  - nightly
  preconditions:
  - Эндпоинт принимает тело.
  steps:
  - action: Отправить JSON-тело без Content-Type и с text/plain.
  expected:
  - Ответ 415 или задокументированное поведение; тело не интерпретируется как другой формат молча.
  applicability:
    when:
    - Есть тело запроса.
    skip_when:
    - Нет тела.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: HTTP-BODY-ON-GET-DELETE
  status: approved
  title: Тело в GET/DELETE игнорируется или отклоняется по контракту
  category: http-semantics
  protocols:
  - rest
  kind: boundary
  priority: P3
  tags:
  - boundary
  - contract
  - regression
  - nightly
  preconditions:
  - Есть GET или DELETE.
  steps:
  - action: Отправить GET и DELETE с телом, содержащим фильтры или id.
  - action: 'Отправить GET, DELETE и HEAD с Content-Type: application/json и пустым телом — запрос принимается, заголовок
      не делает его невалидным'
    notes: inbox №3
  - action: 'Вызвать операцию без requestBody (POST/PUT-действие) с Content-Type: application/json и Content-Length: 0 и проверить, что ответ тот же, что без заголовка, а не 400'
    notes: 'inbox №361; заголовок на каждый POST ставят OkHttp/Retrofit, Alamofire, axios с общими заголовками'
  expected:
  - Тело не меняет семантику запроса, если контракт этого не описывает.
  applicability:
    when:
    - Есть GET/DELETE.
    skip_when:
    - Контракт явно использует тело.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: HTTP-VERSION-PARITY
  status: approved
  title: Запросы по HTTP/2 и с предложением Upgrade h2c обслуживаются так же, как по HTTP/1.1
  category: http-semantics
  protocols:
  - rest
  kind: compatibility
  priority: P3
  tags:
  - compatibility
  - reliability
  - transport-security
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервер или прокси принимает HTTP/2 (ALPN h2) или клиенты могут предлагать Upgrade.
  steps:
  - action: Выполнить основные запросы (GET, POST с телом) по HTTP/2 и по HTTP/1.1; сравнить ответы.
  - action: Отправить HTTP/1.1 запрос с Connection Upgrade, Upgrade h2c и HTTP2-Settings (GET и POST с телом).
  - action: Проверить живость сервиса после серии.
  expected:
  - Ответы одинаковы для обеих версий протокола.
  - Upgrade игнорируется (обычный ответ HTTP/1.1) или выполняется корректно (101); соединение не сбрасывается, процесс не
    падает.
  applicability:
    when:
    - Сервис доступен по HTTP.
    skip_when:
    - —
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - RFC 9113
  - RFC 9110 §7.8
  - 'Real-world bug: RWB-0013'
- id: HTTP-ABSOLUTE-URL-BASE-PATH
  status: approved
  title: Абсолютные URL, которые формирует сервер, учитывают публичный адрес и базовый путь
  category: http-semantics
  protocols:
  - rest
  kind: positive
  priority: P3
  tags:
  - positive
  - compatibility
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис опубликован за прокси, возможно под подпутём; сервер формирует абсолютные ссылки (Location, callback OAuth, ссылки
    в письмах, пагинация).
  steps:
  - action: Запустить сценарии, где сервер формирует абсолютный URL, и разобрать полученные адреса.
  - action: Проверить ссылки, построенные от адреса сайта, во всех типах писем, включая уведомления о смене пароля и email
    notes: 'Real-world bug: RWB-0027 (supabase/auth#2468)'
  - action: Запросить discovery через прокси с префиксом пути при динамическом backend-адресе и проверить, что token_endpoint
      и другие backend-адреса содержат базовый путь
    notes: 'Real-world bug: RWB-0027 (keycloak/keycloak#43166)'
  expected:
  - URL содержит публичную схему, хост и базовый путь и ведёт на рабочий маршрут.
  applicability:
    when:
    - Сервер формирует абсолютные ссылки.
    skip_when:
    - Только относительные ссылки.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Конфигурация публичного URL
  - 'Real-world bug: RWB-0027'
- id: HTTP-HTTP2-RESOURCE-LIMITS
  status: approved
  title: Параметры HTTP/2 со стороны клиента не заставляют сервер буферизовать и работать без предела
  category: http-semantics
  protocols:
  - rest
  - grpc
  kind: boundary
  priority: P3
  tags:
  - boundary
  - hardening
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервер поддерживает HTTP/2.
  - Нужны инструменты — клиент HTTP/2 с управлением кадрами (h2load, h2spec, собственный клиент) и мониторинг памяти и CPU
    сервера; без них проверка пропускается осознанно.
  steps:
  - action: Передавать по HTTP/2 большое или бесконечное тело на маршрут, который не читает тело или читает его медленно;
      наблюдать память сервера.
  - action: Объявить в SETTINGS малый MAX_HEADER_LIST_SIZE и отправить много запросов, ответы которых его превышают.
  - action: Открыть несколько стримов HTTP/2 и отправлять тело кадрами DATA по 1 байту в пределах окон управления потоком;
      наблюдать память сервера и доступность
    notes: 'Real-world bug: RWB-0189 (GHSA-vp52-pcj8-j9qc)'
  expected:
  - Окно управления потоком не расширяется сверх прочитанного приложением, память ограничена.
  - Сервер не выполняет запросы впустую ради ответа, который клиент не примет; нагрузка не растёт.
  applicability:
    when:
