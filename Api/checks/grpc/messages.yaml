    likelihood: medium
- id: GRPC-WELL-KNOWN-TYPES
  status: approved
  title: Timestamp, Duration и другие well-known types валидируются по диапазонам
  category: grpc-contract
  protocols:
  - grpc
  kind: boundary
  priority: P2
  tags:
  - boundary
  - validation
  - ci
  - regression
  - nightly
  preconditions:
  - Используются google.protobuf.Timestamp/Duration.
  steps:
  - action: Отправить nanos вне 0..999999999, секунды вне диапазона, отрицательную Duration.
  expected:
  - Невалидные значения отклоняются INVALID_ARGUMENT.
  applicability:
    when:
    - Есть WKT.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: GRPC-PROTO-BREAKING
  status: approved
  title: Изменения proto не ломают совместимость wire и JSON
  category: grpc-contract
  protocols:
  - grpc
  kind: compatibility
  priority: P0
  tags:
  - compatibility
  - contract
  - versioning
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Proto-файлы в репозитории.
  steps:
  - action: Запустить buf breaking против последнего релиза; проверить reserved для удалённых номеров и имён.
  expected:
  - Нет переиспользования номеров полей, смены типов и переименований без новой версии пакета.
  applicability:
    when:
    - Есть proto.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - https://buf.build/docs/breaking
- id: GRPC-JSON-TRANSCODING
  status: approved
  title: HTTP/JSON транскодирование соответствует proto-аннотациям
  category: grpc-contract
  protocols:
  - grpc
  - rest
  kind: contract
  priority: P2
  tags:
  - contract
  - compatibility
  - ci
  - regression
  - nightly
  preconditions:
  - Используется grpc-gateway или Envoy transcoding.
  steps:
  - action: 'Вызвать REST-эквиваленты: int64 как строка, имена полей lowerCamelCase, enum строкой, ошибки в HTTP-статусы.'
  expected:
  - Отображение соответствует google.api.http и стандартному маппингу статусов.
  applicability:
    when:
    - Есть транскодирование.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
