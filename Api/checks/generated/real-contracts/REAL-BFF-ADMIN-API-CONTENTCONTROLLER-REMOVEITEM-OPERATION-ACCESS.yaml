    перед исполнением.
  category: security
  protocols:
  - rest
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authz
  - roles-scopes
  - ci
  - regression
  - release
  preconditions:
  - Изолированное тестовое окружение и синтетические учётные записи доступны
  - Ожидаемая политика доступа подтверждена
  steps:
