    impact: high
    likelihood: medium
- id: FILE-MALICIOUS-CONTENT
  status: approved
  title: Вредоносное содержимое обнаруживается или изолируется
  category: files
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - files
  - security
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Файлы доступны другим пользователям.
  steps:
  - action: Загрузить тестовый EICAR, SVG со скриптом, PDF с JavaScript, документ с макросами.
  - action: Файл получает сам сервер по ссылке пользователя (превью, закладка), а не загружает клиент
    notes: 'Real-world bug: RWB-0072 (GHSA-788w-68h3-cvxp)'
  - action: Пакеты расширений (темы, плагины) — путь за каталог и исполнение файлов данных; связано с INJ-PATH-TRAVERSAL
    notes: 'Real-world bug: RWB-0072 (GHSA-jj74-hc2q-xrvm)'
  expected:
  - Файл блокируется, помещается в карантин или отдаётся только как attachment по политике.
  applicability:
    when:
    - Файлы распространяются.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0072'
- id: FILE-ARCHIVE-BOMB
  status: approved
  title: Архивные и графические бомбы не исчерпывают ресурсы
  category: files
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - files
  - security
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервер распаковывает архивы или обрабатывает изображения.
  steps:
  - action: Загрузить zip-бомбу, архив с path traversal в именах, изображение 50000x50000 пикселей.
  - action: Добавить медиафайлы с искажёнными размерами блоков (бесконечный цикл разбора), не только архивы и изображения
    notes: 'Real-world bug: RWB-0069 (GHSA-f94x-6692-553q)'
  - action: Заявленный в заголовке ZIP размер занижен — лимит должен считаться по фактическому выходу
    notes: 'Real-world bug: RWB-0069 (GHSA-c6fg-446q-cg94)'
  - action: Не бомба, а испорченные сжатые данные — проверять живость сервиса после ответа
    notes: 'Real-world bug: RWB-0069 (GHSA-8238-w5pm-2374)'
  - action: Отправить JWT с заголовком zip=DEF и payload, распаковывающимся в сотни мегабайт, и проверить отказ по лимиту
      размера
    notes: 'Real-world bug: RWB-0069 (GHSA-3w98-rrpr-fprr)'
  - action: Отправить сжатые данные из тысяч минимальных пустых фреймов с максимальным размером блока и проверить, что время
      обработки пропорционально размеру входа
    notes: 'Real-world bug: RWB-0069 (GHSA-gm45-99xc-r7wv)'
  - action: Отправить deflate-бомбу в сжатом параметре запроса (SAMLRequest, SAMLResponse)
    notes: 'Real-world bug: RWB-0069 (GHSA-m69x-pw9p-7j3q)'
  - action: Отправить сжатое сообщение протокола (SAMLRequest/SAMLResponse deflate), которое после распаковки превышает лимит
      размера
    notes: 'Real-world bug: RWB-0069 (GHSA-92rq-c8cf-prrq)'
  - action: Загрузить крошечное изображение с экстремальным соотношением сторон (20000×10) в каждый путь загрузки изображений
      и проверить отказ
    notes: 'Real-world bug: RWB-0069 (GHSA-4vh2-39rq-rq8j)'
  - action: Загрузить SVG с глубоко вложенными элементами <use>, где атрибут ссылки записан в смешанном регистре (xlink:HrEf),
      и проверить скачанный результат
    notes: 'Real-world bug: RWB-0069 (GHSA-m9xh-6747-9r6f)'
  - action: Встроить в рендеримый HTML base64-изображение огромных размеров со случайным шумом
    notes: 'Real-world bug: RWB-0069 (GHSA-f5gf-2cj8-52g2)'
  - action: Встроить BMP с крошечным телом и огромными размерами в заголовке
    notes: 'Real-world bug: RWB-0069 (GHSA-8hg6-c449-896m)'
  expected:
  - Обработка ограничена по размеру и времени; файлы не пишутся вне каталога.
  applicability:
    when:
    - Есть распаковка или обработка изображений.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0069'
- id: FILE-EMPTY-AND-MALFORMED-MULTIPART
  status: approved
  title: Пустой файл и некорректный multipart обрабатываются корректно
  category: files
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - negative
  - files
  - validation
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть multipart загрузка.
  steps:
  - action: Отправить файл 0 байт, multipart без boundary, с неверным boundary, без части file, с несколькими файлами вместо
      одного.
  - action: Отправить multipart-часть, блок заголовков которой не завершается пустой строкой и занимает мегабайты
    notes: 'Real-world bug: RWB-0071 (GHSA-wpv5-97wm-hp9c)'
  - action: Отправить multipart с преамбулой в сотни мегабайт перед первой границей
    notes: 'Real-world bug: RWB-0071 (GHSA-p543-xpfm-54cp)'
  expected:
  - Ошибки 4xx по контракту без 5xx.
  applicability:
    when:
    - Есть multipart.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0071'
- id: FILE-DOWNLOAD-AUTHZ
  status: approved
  title: Скачивание файлов проверяет права и срок действия ссылок
  category: files
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - negative
  - files
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Файлы приватны.
  steps:
  - action: Скачать чужой файл по id, по прямому URL хранилища, по истёкшей подписанной ссылке, по подписанной ссылке с изменёнными
      параметрами.
  - action: Манипуляция путём в URL статического контента (traversal, кодирование) приводит к файлу другой сущности, а права
      проверены по сущности из исходного пути; прогонять на внешнем хранилище
    notes: 'Real-world bug: RWB-0070 (GHSA-rg9r-hr7g-5gc2)'
  - action: Получить подписанную ссылку на чувствительный файл, выйти и запросить её без сессии; проверить, что доступ запрещён
      или срок ссылки — минуты
    notes: 'Real-world bug: RWB-0070 (GHSA-3mvf-82qp-8qh5)'
  - action: Скачать собственный файл через защищённый эндпоинт и повторить запрос по URL из Location без сессии
    notes: 'Real-world bug: RWB-0070 (GHSA-767h-63j4-5226)'
  - action: 'Запретить роли чтение поля имени файла и скачать файл: Content-Disposition не содержит запрещённого имени'
    notes: 'Real-world bug: RWB-0070 (directus/directus#24057)'
  - action: Запросить защищённый файл через эндпоинты истории версий и сравнения снимков и проверить тот же отказ, что у прямого
      чтения
    notes: 'Real-world bug: RWB-0070 (GHSA-3cm4-ccvw-6xr6)'
  - action: Запросить через статические маршруты данные, закрытые в файловом API, и проверить тот же отказ
    notes: 'Real-world bug: RWB-0070 (GHSA-fgmr-7w36-9qfq)'
  - action: Запросить через служебный эндпоинт сопутствующие данные файла (аннотации, превью) закрытого документа и проверить
      тот же отказ, что у скачивания самого файла
    notes: 'Real-world bug: RWB-0070 (GHSA-v7ph-r5r6-4jcj)'
  - action: Получить подсказку контекста при действующем доступе по общей ссылке, отозвать доступ и повторить получение ссылки
      на файл с той же подсказкой; проверить отказ
    notes: 'Real-world bug: RWB-0070 (GHSA-vx2m-jpxr-xv7w)'
  - action: Скачать защищённый файл через маршрут массового скачивания архивом и проверить тот же отказ, что у прямого скачивания
    notes: 'Real-world bug: RWB-0070 (GHSA-rmxw-pq4x-3fvh)'
  - action: Скачать чужой файл по имени через альтернативный маршрут (профиль пользователя), когда основной маршрут отвечает
      403
    notes: 'Real-world bug: RWB-0070 (GHSA-3hgv-jr5j-cg9x)'
  - action: Запросить превью или миниатюру приватного файла пользователем без права просмотра; ответ не содержит подписанной
      ссылки
    notes: 'Real-world bug: RWB-0070 (GHSA-x76w-8c62-48mg)'
  expected:
  - Доступ отклоняется во всех случаях.
  applicability:
    when:
    - Есть приватные файлы.
    skip_when:
    - Все файлы публичны.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0070'
- id: FILE-DOWNLOAD-HEADERS
  status: approved
  title: Скачивание отдаёт корректные Content-Type, Content-Disposition и nosniff
  category: files
  protocols:
  - rest
  kind: contract
  priority: P2
  tags:
  - contract
  - files
  - security
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть скачивание.
  steps:
  - action: Скачать файлы разных типов, включая имена с unicode и кавычками.
  - action: Скачать файл и проверить, что ответ успешный и содержит корректный Content-Security-Policy (default-src 'none')
    notes: 'Real-world bug: RWB-0262 (directus/directus#23849)'
  expected:
  - 'Content-Disposition с корректным кодированием имени; X-Content-Type-Options: nosniff; нет inline для опасных типов.'
  applicability:
    when:
    - Есть скачивание.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0262'
- id: FILE-RANGE-REQUESTS
  status: approved
  title: Частичное скачивание через Range работает по контракту
  category: files
  protocols:
  - rest
  kind: boundary
  priority: P3
  tags:
  - boundary
  - files
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Поддерживается Range.
  steps:
  - action: Запросить bytes=0-99, bytes=-100, диапазон за концом файла, множественные диапазоны.
  - action: Отправить Range с тысячами перекрывающихся диапазонов 0-0 и проверить, что ответ — 416 или 200 без multipart
    notes: 'Real-world bug: RWB-0239 (GHSA-x8cg-fq8g-mxfx)'
  - action: Отправить специально построенный Range и проверить, что размер ответа не превышает размер ресурса многократно
    notes: 'Real-world bug: RWB-0239 (GHSA-xj5v-6v4g-jfw6)'
  expected:
  - 206 с корректным Content-Range; некорректный диапазон — 416.
  applicability:
    when:
    - Поддерживается Range.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0239'
- id: FILE-METADATA-STRIP
  status: approved
  title: Метаданные изображений с ПДн удаляются
  category: files
  protocols:
