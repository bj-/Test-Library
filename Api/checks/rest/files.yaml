    likelihood: medium
- id: FILE-MALICIOUS-CONTENT
  status: approved
  title: Вредоносное содержимое обнаруживается или изолируется
  category: files
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - files
  - security
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Файлы доступны другим пользователям.
  steps:
  - action: Загрузить тестовый EICAR, SVG со скриптом, PDF с JavaScript, документ с макросами.
  - action: Файл получает сам сервер по ссылке пользователя (превью, закладка), а не загружает клиент
    notes: 'Real-world bug: RWB-0072 (GHSA-788w-68h3-cvxp)'
  - action: Пакеты расширений (темы, плагины) — путь за каталог и исполнение файлов данных; связано с INJ-PATH-TRAVERSAL
    notes: 'Real-world bug: RWB-0072 (GHSA-jj74-hc2q-xrvm)'
  expected:
  - Файл блокируется, помещается в карантин или отдаётся только как attachment по политике.
  applicability:
    when:
    - Файлы распространяются.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0072'
- id: FILE-ARCHIVE-BOMB
  status: approved
  title: Архивные и графические бомбы не исчерпывают ресурсы
  category: files
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - files
  - security
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервер распаковывает архивы или обрабатывает изображения.
  steps:
  - action: Загрузить zip-бомбу, архив с path traversal в именах, изображение 50000x50000 пикселей.
  - action: Добавить медиафайлы с искажёнными размерами блоков (бесконечный цикл разбора), не только архивы и изображения
    notes: 'Real-world bug: RWB-0069 (GHSA-f94x-6692-553q)'
  - action: Заявленный в заголовке ZIP размер занижен — лимит должен считаться по фактическому выходу
    notes: 'Real-world bug: RWB-0069 (GHSA-c6fg-446q-cg94)'
  - action: Не бомба, а испорченные сжатые данные — проверять живость сервиса после ответа
    notes: 'Real-world bug: RWB-0069 (GHSA-8238-w5pm-2374)'
  - action: Отправить JWT с заголовком zip=DEF и payload, распаковывающимся в сотни мегабайт, и проверить отказ по лимиту
      размера
    notes: 'Real-world bug: RWB-0069 (GHSA-3w98-rrpr-fprr)'
  - action: Отправить сжатые данные из тысяч минимальных пустых фреймов с максимальным размером блока и проверить, что время
      обработки пропорционально размеру входа
    notes: 'Real-world bug: RWB-0069 (GHSA-gm45-99xc-r7wv)'
  - action: Отправить deflate-бомбу в сжатом параметре запроса (SAMLRequest, SAMLResponse)
    notes: 'Real-world bug: RWB-0069 (GHSA-m69x-pw9p-7j3q)'
  expected:
  - Обработка ограничена по размеру и времени; файлы не пишутся вне каталога.
  applicability:
    when:
    - Есть распаковка или обработка изображений.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0069'
- id: FILE-EMPTY-AND-MALFORMED-MULTIPART
  status: approved
  title: Пустой файл и некорректный multipart обрабатываются корректно
  category: files
  protocols:
