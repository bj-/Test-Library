  - ci
  - regression
  - nightly
  preconditions:
  - Сервис за обратными прокси; IP клиента используется в rate limit, аудите или allowlist.
  steps:
  - action: Отправить запросы с X-Forwarded-For из разного числа адресов (1, N, N+2, с поддельным первым).
  - action: Повторить на маршрутах разных модулей; посмотреть IP в ответе, журнале или срабатывании лимита.
  - action: Отправить X-Forwarded_For и X-Forwarded_Proto (с подчёркиванием) вместе с заголовками прокси и проверить, что
      значения прокси не перезаписаны
    notes: 'Real-world bug: RWB-0030 (GHSA-9hf4-67fc-4vf4)'
  - action: 'Менять X-Forwarded-For на каждой неудачной попытке входа и проверить, что счётчик блокировки не сбрасывается, а в журнале аудита и списке сессий записан реальный адрес; подменить X-Forwarded-Proto и проверить, что признак защищённого соединения не меняется'
    notes: 'inbox №347; превышение лимита входа - разрушающий тест, отдельная учётка'
  expected:
  - Берётся адрес, добавленный последним доверенным прокси; поддельные левые записи игнорируются.
  - IP одинаков на всех маршрутах; адрес прокси не выдаётся за клиента.
