checks:
- id: UI-NAVIGATION
  status: draft
  title: 'Навигация последовательна: путь на главную, заголовки, рабочие пункты меню'
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P3
  tags:
  - ui
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: С каждого экрана перейти на главную; проверить заголовок страницы или окна (<title> в web, заголовок окна в desktop)
    notes: 'inbox №104'
  - action: Перейти по пункту меню — сразу открывается URL с параметрами по умолчанию, экран не отрисовывается дважды
    notes: 'inbox №276'
  - action: Проверить боковое меню — только действующие пункты, без пустых иконок
    notes: 'inbox №289'
  expected:
  - С любого экрана есть путь на главную; у страниц и окон есть заголовок; меню содержит только рабочие пункты и открывает экран с параметрами по умолчанию за одну отрисовку.
  applicability:
    when:
    - Есть клиент с соответствующими экранами.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-LEGAL-PAGES
  status: draft
  title: Условия использования и FAQ доступны там, где нужны
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P3
  tags:
  - ui
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Открыть условия использования и FAQ с экранов регистрации, оплаты и других нужных — доступны и актуальны
    notes: 'inbox №122'
  expected:
  - Условия использования и FAQ доступны со всех нужных экранов (регистрация, оплата), читаются, версия актуальная.
  applicability:
    when:
    - Есть клиент с соответствующими экранами.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-SESSION-EXPIRY
  status: draft
  title: Истечение и потеря сессии обрабатываются в интерфейсе понятно
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - session
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Дождаться истечения сессии — переход на вход с понятным сообщением, несохранённый ввод предупреждается, после входа — тот же экран
    notes: 'inbox №119'
  - action: Удалить cookie во время сессии и после — приложение не ломается, переводит на вход, после входа состояние корректно
    notes: 'inbox №125'
  - action: Выйти из приложения под подпутём — страница входа открывается с учётом базового пути
    notes: 'inbox №285'
  - action: Сравнить момент сообщения об истечении с фактическим истечением серверной сессии — не раньше
    notes: 'inbox №291'
  expected:
  - По истечении — переход на вход с сообщением, предупреждение о несохранённом вводе, возврат на тот же экран после входа; сообщение не раньше фактического истечения; базовый путь учитывается.
  applicability:
    when:
    - Есть клиент с соответствующими экранами.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Серверная сторона — AUTH-SESSION-TIMEOUT
  - ADR 0006 (проверки UI)
