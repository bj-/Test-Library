checks:
- id: REST-CORRELATION-ID
  status: approved
  title: Correlation ID
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: errors
  protocols:
  - rest
  kind: positive
  priority: P3
  tags:
  - observability
  - rest
  - regression
  - nightly
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: 'Отправить запрос с X-Request-ID (X-Correlation-ID, traceparent) и проверить, что идентификатор возвращён в ответе и в теле ошибки, записан в логи и передан в вызовы других модулей'
    notes: 'inbox №352'
  - action: 'Отправить запрос без идентификатора и проверить, что сервис сгенерировал свой и вернул его'
    notes: 'inbox №352'
  - action: 'Отправить идентификатор со слишком большой длиной и недопустимыми символами (перевод строки) и проверить, что он отвергнут или заменён и не внедряет строки в логи'
    notes: 'inbox №352'
  expected:
  - ID создаётся/передаётся и коррелируется по политике без утечки секретов
  applicability:
    when:
    - сервис поддерживает request/correlation ID
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
