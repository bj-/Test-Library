checks:
- id: REST-ENUM-VALUES
  status: approved
  title: Допустимые и неизвестные enum
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - contract
  - negative
  - boundary
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Неподдерживаемое значение внутри списка — отклонить запрос или отбросить элемент, по документации
    notes: 'Real-world bug: RWB-0116 (keycloak/keycloak#50362)'
  expected:
  - допустимые значения принимаются, неизвестные обрабатываются по контракту
  applicability:
    when:
    - есть enum
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0116'
