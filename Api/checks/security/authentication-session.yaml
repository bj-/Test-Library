- id: AUTH-BRUTE-FORCE-PROTECTION
  status: approved
  title: Перебор паролей ограничивается
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authn
  - rate-limiting
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть вход по паролю.
  steps:
  - action: Выполнить N неудачных попыток для одного аккаунта, с одного IP по разным аккаунтам, с ротацией заголовков X-Forwarded-For.
  - action: refresh токена или SSO по cookie из существующей сессии не должен сбрасывать блокировку
    notes: 'Real-world bug: RWB-0056 (keycloak/keycloak#49960)'
  expected:
  - Срабатывает блокировка, задержка или CAPTCHA по политике.
  - Ротация X-Forwarded-For не обходит ограничение.
  - Легитимный пользователь может восстановить доступ.
  applicability:
    when:
    - Есть парольный вход.
    skip_when:
    - Нет парольного входа.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0056'
- id: AUTH-USER-ENUMERATION
  status: approved
  title: Ответы входа, регистрации и восстановления не раскрывают существование аккаунта
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authn
  - enumeration
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть вход, регистрация или сброс пароля.
  steps:
  - action: Сравнить ответы и время для существующего и несуществующего логина/email/телефона.
  - action: Выполнить вход для заблокированной, отключённой и несуществующей учёток и сравнить ответы
    notes: 'Real-world bug: RWB-0193 (GHSA-5x25-c2rf-f2jx)'
  - action: Вызвать служебный эндпоинт проверки существования email (мастер создания пользователя) от роли без права просмотра
      пользователей с существующим и несуществующим email
    notes: 'Real-world bug: RWB-0193 (GHSA-225x-3jhx-wh4q)'
  - action: Зарегистрироваться с email существующего пользователя с нестандартной ролью и сравнить все поля ответа, включая
      role, с ответом для нового email
    notes: 'Real-world bug: RWB-0193 (supabase/auth#1365)'
  expected:
  - Тела, статусы и время ответа неразличимы в пределах допуска.
  applicability:
    when:
    - Есть публичные операции аутентификации.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0193'
