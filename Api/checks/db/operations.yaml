  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Практика миграций
  - ADR 0006 (проверки БД)
- id: DB-ALTER-PRESERVES-COLUMN
  status: approved
  title: Изменение столбца или ограничения сохраняет его остальные свойства
  category: db
  protocols:
  - db
  kind: reliability
  priority: P2
  tags:
  - db
  - reliability
  - data-integrity
  - ci
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Добавить ограничение уникальности на столбец serial — тип и default nextval() сохраняются
    notes: inbox №212
  - action: Изменить атрибуты столбца — заданная длина varchar сохраняется
    notes: inbox №217
  expected:
  - После изменения атрибута или добавления ограничения тип, длина и default столбца прежние.
  applicability:
    when:
    - Есть изменение схемы через приложение или миграции.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация СУБД (ALTER TABLE)
  - ADR 0006 (проверки БД)
- id: DB-MIGRATION-DATA-PRESERVED
  status: approved
  title: Миграции переносят данные и связи и учитывают актуальные ограничения
  category: db
  protocols:
  - db
  kind: reliability
  priority: P2
  tags:
  - db
  - reliability
  - data-integrity
  - ci
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  - Нужен стенд с данными, который можно обновить.
  steps:
  - action: Удалить коллекцию с внешними ключами миграцией — учитывается актуальный набор ограничений, а не закэшированный
    notes: inbox №194
  - action: Применить миграцию, создающую копии записей (черновики), — порядок связей переносится по колонке порядка, а не
      по id
    notes: inbox №271
  expected:
  - Данные и порядок связей после миграции те же; миграция работает с актуальным набором ограничений, а не с закэшированным.
  applicability:
    when:
    - Есть миграции, меняющие данные или схему с данными.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Практика миграций
  - Смежная — COMPAT-UPGRADE-STORED-DATA-STABLE
  - ADR 0006 (проверки БД)
- id: DB-SCHEMA-CHANGE-VALIDATED
