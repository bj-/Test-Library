checks:
- id: REAL-BFF-ADMIN-API-CONTENTCONTROLLER-UPDATEITEM-ROLE-MODEL-UNRESO
  title: Confirm minimum privilege policy for sensitive operation
  description: Кандидат сгенерирован по реальному OpenAPI-контракту. Политику доступа и тестовые данные подтвердить
    перед исполнением.
  category: security
  protocols:
  - rest
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authz
  - roles-scopes
  - privilege-escalation
  - ci
  - regression
  - release
  preconditions:
  - Изолированное тестовое окружение и синтетические учётные записи доступны
  - Ожидаемая политика доступа подтверждена
  steps:
  - action: 'Подготовить тестовые данные для PATCH /api/content/{sourceKey}/items/{id}; сценарий: role-model-unresolved.'
    data:
      operationId: ContentController_updateItem
      method: PATCH
      path: /api/content/{sourceKey}/items/{id}
      dimension: roles_scopes
  - action: Отправить PATCH запрос на /api/content/{sourceKey}/items/{id} с заданными credentials/ролью/ресурсом.
    notes: 'Blocked candidate: role model is unknown; do not assume the role names or privileges from earlier draft
      models.'
  expected:
  - The operation must reject callers lacking the confirmed minimum role/scope; exact expected status and role fixture
    remain blocked until the API owner defines the authorization model.
  - При отказе защищённые данные не раскрываются, а запрещённая мутация не меняет состояние.
  applicability:
    when:
    - 'Операция присутствует в OpenAPI: PATCH /api/content/{sourceKey}/items/{id}'
    - Политика для измерения roles_scopes подтверждена
    skip_when:
    - Политика явно помечена как неприменимая к операции
  automation:
    level: partial
    deterministic: true
    notes: Требуется привязка fixtures и фактического transport/client.
  profiles:
  - CI
  - Regression
  - Release
  risk:
    impact: high
    likelihood: high
  references:
  - OpenAPI operationId=ContentController_updateItem
  - 'Contract: bff-admin-api'
