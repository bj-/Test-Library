rules:
  - {id: PRIORITY-01, rule: Include applicable deterministic P0 checks in PR/Smoke/CI.}
  - {id: PRIORITY-02, rule: Smoke contains only fast deterministic critical paths and critical security guards.}
  - {id: PRIORITY-03, rule: Regression includes functional, negative, boundary, and contract checks.}
  - {id: PRIORITY-04, rule: Nightly includes costly combinations, broad compatibility, and long-running reliability checks.}
  - {id: PRIORITY-05, rule: Release emphasizes P0/P1 security, contract, migration, compatibility, and critical business paths.}
  - {id: PRIORITY-06, rule: Do not put nondeterministic checks in PR unless explicitly permitted.}
