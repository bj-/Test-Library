checks:
- id: REST-DELETE-REPEAT
  status: approved
  title: Повторное удаление
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: boundary
  priority: P2
  tags:
  - idempotency
  - rest
  - ci
  - regression
  - nightly
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: 'Повторить DELETE - идемпотентность по эффекту (RFC 9110 §9.2.2): допустимы 204 и 404, но одинаково
      на всех ресурсах API'
    notes: inbox №500
  - action: 'После повтора проверить эффект: счётчики не уменьшились второй раз, нет второго события и записи
      аудита, при мягком удалении не перезаписаны deletedAt и deletedBy'
    notes: inbox №500
  - action: Отправить два DELETE параллельно - эффект один
    notes: inbox №500
  expected:
  - повторный DELETE соответствует контракту и не создаёт побочных эффектов
  - Код повтора единообразен по API; счётчики, события, аудит и метки удаления меняются один раз.
  applicability:
    when:
    - DELETE поддерживается
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
