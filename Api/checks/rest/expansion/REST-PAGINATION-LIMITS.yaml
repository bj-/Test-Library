checks:
- id: REST-PAGINATION-LIMITS
  status: approved
  title: Границы размера страницы
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: pagination
  protocols:
  - rest
  kind: boundary
  priority: P1
  tags:
  - boundary
  - pagination
  - negative
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Проверка целостности тела (обрезанный JSON при статусе 200) при огромном max
    notes: 'Real-world bug: RWB-0126 (keycloak/keycloak#52033)'
  expected:
  - 0/negative/1/max/max+1 обрабатываются по контракту без неограниченной выдачи
  applicability:
    when:
    - операция поддерживает pagination
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0126'
