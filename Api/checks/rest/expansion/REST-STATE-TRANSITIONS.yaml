checks:
- id: REST-STATE-TRANSITIONS
  status: approved
  title: Переходы состояния ресурса
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: resources
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - contract
  - negative
  - rest
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Выписать модель статусов из требований (модель нигде не описана - находка requirements); проверить
      матрицу N×N, включая переход в тот же статус и выход из терминального; после отказа статус не
      изменился
    notes: inbox №511
  - action: Сменить статус в обход отдельной операции - через PUT и PATCH поля status
    notes: inbox №511
  - action: Побочные эффекты перехода (уведомления, зависимые ресурсы) выполняются только при успехе
    notes: inbox №511
  expected:
  - разрешённые переходы работают; запрещённые не меняют состояние
  applicability:
    when:
    - есть конечные состояния и правила переходов
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references: []
