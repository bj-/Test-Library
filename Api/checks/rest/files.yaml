- id: FILE-RANGE-REQUESTS
  status: approved
  title: Частичное скачивание через Range работает по контракту
  category: files
  protocols:
  - rest
  kind: boundary
  priority: P3
  tags:
  - boundary
  - files
  - regression
  - nightly
  preconditions:
  - Поддерживается Range.
  steps:
  - action: Запросить bytes=0-99, bytes=-100, диапазон за концом файла, множественные диапазоны.
  expected:
  - 206 с корректным Content-Range; некорректный диапазон — 416.
  applicability:
    when:
    - Поддерживается Range.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
