  - action: Синтаксически корректное сообщение с невалидной по схеме нагрузкой
    notes: 'Real-world bug: RWB-0178 (nestjs/nest#3127)'
  expected:
  - Ответ-ошибка по протоколу или закрытие с кодом; сервер стабилен.
  applicability:
    when:
    - Всегда.
    skip_when:
