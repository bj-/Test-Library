checks:
- id: UI-CLIENT-CODE-NO-SECRETS
  status: draft
  title: Клиентский код и страницы не раскрывают секретов и лишних данных
  category: ui
  protocols:
  - ui-web
  kind: security
  priority: P1
  tags:
  - ui
  - security
  - privacy
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Скачать JS SPA и искать VITE_*KEY, SECRET, TOKEN, длинные hex и base64 рядом с apiKey и Authorization
    notes: inbox №27
  - action: Просмотреть HTML и JS — нет секретов, внутренних адресов, закомментированного кода и отладочных флагов
    notes: inbox №129
  - action: Проверить публичные JS-бандлы на секреты окружения сборки — ключи, строки подключения
    notes: inbox №184
  - action: Открыть страницу по публичной ссылке — в JS-переменных нет лишних персональных данных
    notes: inbox №254
  expected:
  - В JS-бандлах, HTML и JS-переменных страниц нет ключей, токенов, строк подключения, внутренних адресов, отладочных флагов,
    закомментированного кода и лишних персональных данных.
  applicability:
    when:
    - Есть клиент с соответствующими экранами.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP ASVS V14.3
  - CWE-200, CWE-798
  - ADR 0006 (проверки UI)
- id: UI-SECRET-FIELDS
  status: draft
  title: Поля паролей и секретов не раскрывают и не теряют значение
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: security
  priority: P2
  tags:
  - ui
  - security
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Ввести пароль и секреты — ввод скрыт, не сохраняется в автозаполнении, на mobile экран защищён от снимка
    notes: inbox №130
  - action: Открыть форму с сохранённым секретом (заголовок авторизации вебхука) — секрет не показан; сохранить без ввода
      — не стёрт
    notes: inbox №245
  expected:
  - Ввод скрыт с возможностью показать; значение не попадает в автозаполнение и снимки экрана; сохранённый секрет не показывается
    и не стирается при сохранении без ввода.
  applicability:
    when:
    - Есть клиент с соответствующими экранами.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - OWASP MASVS-STORAGE, MASVS-PLATFORM
  - ADR 0006 (проверки UI)
- id: UI-AUTH-FLOWS
  status: draft
  title: Интерфейсные потоки входа и восстановления нельзя обойти и перенаправить наружу
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: security
  priority: P1
  tags:
  - ui
  - security
  - authn
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: В мастере сброса пароля выбрать другой способ подтверждения — форма нового пароля не открывается без перехода
      по ссылке из письма
    notes: inbox №150
  - action: Открыть форму смены пароля — требует текущий пароль
    notes: inbox №240
  - action: Открыть страницу авторизации OIDC с prompt=none — перенаправление только на redirect_uri из списка клиента
    notes: inbox №242
  - action: Передать redirectTo после входа как //host и /\host — отклоняются, переход только внутрь своего origin
    notes: inbox №243
  - action: Подключить и отключить второй фактор, перевыпустить коды восстановления — форма запрашивает текущий пароль
    notes: inbox №247
  - action: Сменить email для входа — форма запрашивает текущий пароль
    notes: inbox №252
  expected:
  - Шаги восстановления не пропускаются; редиректы после входа и OIDC — только на проверенные адреса своего origin; изменение
    защиты учётки требует текущий пароль.
  applicability:
    when:
    - Есть клиент с соответствующими экранами.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: high
    likelihood: medium
  references:
  - Серверная сторона — REST-OPEN-REDIRECT, AUTH-OAUTH-REDIRECT-STATE, AUTH-SENSITIVE-CHANGE-REAUTH
  - ADR 0006 (проверки UI)
- id: UI-SAFE-RENDERING
  status: draft
  title: Данные отображаются экранированными и не роняют интерфейс
  category: ui
  protocols:
  - ui-web
  kind: security
  priority: P1
  tags:
  - ui
  - security
  - injection
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Создать объекты с метасимволами regex в имени — дерево навигации и маршруты отображаются без падения
    notes: inbox №162
  - action: Сохранить в редактируемом блоке HTML со script и обработчиками событий — на публичной странице не исполняются
    notes: inbox №182
  - action: Передать состояние компонента с сервера или из URL с HTML и JS — не исполняется при отрисовке
    notes: inbox №251
  - action: Передать данные внешних интеграций с HTML — на странице устройства выводятся экранированными
    notes: inbox №253
  expected:
  - HTML и данные из сервера, URL и интеграций отображаются как текст или через безопасный санитайзер; script и обработчики
    событий не исполняются; имена со спецсимволами отображаются без падения.
  applicability:
    when:
    - Есть клиент с соответствующими экранами.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP XSS Prevention Cheat Sheet
  - Серверная сторона — INJ-STORED-XSS
  - ADR 0006 (проверки UI)
- id: UI-PLATFORM-SECURITY
  status: draft
  title: Настольный и мобильный клиенты не открывают недоверенный код и экраны входа другим приложениям
  category: ui
  protocols:
  - ui-desktop
  - ui-mobile
  kind: security
  priority: P1
  tags:
  - ui
  - security
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Открыть в настольном клиенте документ с внешними ссылками — ресурсы и код с недоверенных адресов не загружаются
    notes: inbox №290
  - action: Проверить манифест мобильного приложения — активности и экраны аутентификации не экспортированы и не открываются
      другими приложениями
    notes: inbox №294
  expected:
  - Документы с внешними ссылками не загружают ресурсы и код с недоверенных адресов; активности и экраны аутентификации не
    экспортированы.
  applicability:
    when:
    - Есть клиент с соответствующими экранами.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP MASVS-PLATFORM
  - ADR 0006 (проверки UI)
