    data:
      operationId: ContentController_removeItem
      method: DELETE
      path: /api/content/{sourceKey}/items/{id}
      dimension: authorization
  - action: Отправить DELETE запрос на /api/content/{sourceKey}/items/{id} с заданными credentials/ролью/ресурсом.
    notes: 'Blocked candidate: OpenAPI has no effective security requirement and policy is intentionally unresolved
      pending operation-by-operation review.'
  expected:
  - Expected authentication, authorization, and minimum privilege must be confirmed for this exact operation before
    converting this candidate into an executable assertion.
  - При отказе защищённые данные не раскрываются, а запрещённая мутация не меняет состояние.
  applicability:
    when:
    - 'Операция присутствует в OpenAPI: DELETE /api/content/{sourceKey}/items/{id}'
    - Политика для измерения authorization подтверждена
    skip_when:
    - Политика явно помечена как неприменимая к операции
  automation:
    level: partial
    deterministic: true
    notes: Требуется привязка fixtures и фактического transport/client.
  profiles:
  - CI
  - Regression
  - Release
  risk:
