  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
  - 'Real-world bug: RWB-0086'
- id: INJ-LOG-FORGING
  status: approved
  title: Пользовательские данные не позволяют подделывать записи журналов
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - injection
  - observability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Доступ к логам тестового окружения.
  steps:
  - action: Передать значения с \n, \r, ANSI escape-последовательностями и поддельной строкой лога, ${jndi:ldap://...}.
  expected:
  - Записи в логе экранированы и не разбиваются на поддельные.
  - Lookup-выражения не исполняются.
  applicability:
    when:
    - Есть доступ к логам.
    skip_when:
    - Логи недоступны тестам.
  automation:
    level: manual
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0083'
- id: INJ-PROTOTYPE-POLLUTION
  status: approved
  title: Специальные ключи __proto__ и constructor не меняют поведение сервера
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Бэкенд на JavaScript/TypeScript или выполняет глубокое слияние объектов.
  steps:
  - action: 'Отправить {"__proto__": {"isAdmin": true}}, {"constructor": {"prototype": {...}}} в теле и query.'
  - action: Выполнить последующий запрос другим пользователем.
  - action: Добавить GraphQL-алиасы __proto__ (не только ключи JSON-тела)
    notes: 'Real-world bug: RWB-0087 (directus/directus#28209)'
  - action: Добавить алиасы GraphQL как источник специальных ключей при слиянии ответов подграфов
    notes: 'Real-world bug: RWB-0087 (GHSA-7mx3-vvmw-hjmv)'
  - action: Подмена прототипа одного объекта запроса (без глобального загрязнения) и 5xx на ключе constructor в словарях
    notes: 'Real-world bug: RWB-0087 (GHSA-gcgf-fh7c-8gf2)'
  - action: Добавить пути через унаследованные методы (toString, valueOf, hasOwnProperty) в PATCH-операциях, в обход блок-листа
    notes: 'Real-world bug: RWB-0087 (GHSA-2mhw-wcx5-v3xj)'
  - action: Бинарные форматы сериализации (MessagePack, CBOR), не только JSON
    notes: 'Real-world bug: RWB-0087 (GHSA-8hq7-ggx2-cc6m)'
  - action: Публичные операции начальной настройки (first-register), доступные без аутентификации
    notes: 'Real-world bug: RWB-0087 (GHSA-97rh-rhh2-7vjv)'
  - action: Эндпоинты импорта (CSV/JSON с точечными путями в заголовках колонок)
    notes: 'Real-world bug: RWB-0087 (GHSA-qf28-8hc6-vwrp)'
  - action: __proto__ в значении поля, которое сервер использует как ключ (type/id JSON:API, included), а не в имени ключа
    notes: 'Real-world bug: RWB-0087 (GHSA-325j-mg25-8q58)'
  - action: Отложенное (second-order) загрязнение из ранее сохранённых имён; ограничения только в UI проверять прямым запросом
      к API
    notes: 'Real-world bug: RWB-0087 (GHSA-679f-58pq-4v2c)'
  expected:
  - Ключи отклоняются или игнорируются.
  - Последующие запросы не получают изменённых свойств.
  applicability:
    when:
    - Node.js бэкенд или deep merge.
    skip_when:
    - Другая платформа без deep merge.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0087'
