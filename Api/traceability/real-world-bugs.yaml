# Трассировка проверок на реальные баги (ADR 0004, docs/BUG_MINING_PLAN.md, «Трассировка на источники»).
#
# Пруфы для вопросов «да как такое возможно?». Обычные инструменты (select_checks, build_catalog, генераторы)
# этот файл не читают; validate_library.py проверяет, что каждый `Real-world bug: RWB-NNNN` из references
# записи есть здесь, а у записи стоит метка real-world-bug.
#
# Формат:
# RWB-0001:
#   pattern: суть паттерна одной строкой
#   checks: [CHECK-ID, ...]        # записи библиотеки, которые этот пруф подтверждает
#   batch: pilot                   # партия выгрузки
#   bugs:
#     - url: ссылка на issue / advisory
#       fix: ссылка на PR или коммит с исправлением (если есть)
#       product: продукт
#       closed: YYYY-MM-DD
#       summary: краткая суть своими словами, без копии текста issue
