checks:
- id: SEC-TOKEN-AUDIENCE
  status: approved
  title: Token for another audience is rejected
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P1
  tags:
  - negative
  - security
  - authn
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Token validation uses issuer/audience claims.
  steps:
  - action: Present a correctly signed token issued for a different service or audience.
    notes: 'Matrix axis: Authentication; scenario: Wrong audience. Use isolated synthetic identities and data.'
  - action: Аудитория/приложение для проверки берётся из параметра запроса — должна браться из конфигурации сервиса
    notes: 'Real-world bug: RWB-0160 (GHSA-g74q-6g2f-874x)'
  - action: Смена resource/audience при refresh — refresh-токен привязан к исходному ресурсу
    notes: 'Real-world bug: RWB-0160 (GHSA-cw9w-vv67-hf73)'
  - action: Отправить токен, выданный на хосте одного арендатора, на хост другого арендатора того же сервиса
    notes: 'Real-world bug: RWB-0160 (GHSA-r3v7-5x4c-c69q)'
  expected:
  - Token is rejected unless its audience is explicitly accepted by policy.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Token validation uses issuer/audience claims.
    skip_when:
    - Credential scheme has no audience concept.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0160'
