checks:
- id: REST-DATE-TIME-TZ
  status: approved
  title: Дата, время и timezone
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: boundary
  priority: P1
  tags:
  - boundary
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Отфильтровать и отсортировать по датам на границе года и по функциям над датами
    notes: 'Real-world bug: RWB-0113 (directus/directus#28254)'
  - action: Сохранить дату с годом меньше 1000 и проверить, что ответ содержит год из четырёх цифр (0001-01-01)
    notes: 'Real-world bug: RWB-0113 (directus/directus#25113)'
  - action: Сравнить значение метки времени в агрегации (max, min) с обычным чтением той же записи при часовом поясе сервера
      не UTC
    notes: 'Real-world bug: RWB-0113 (directus/directus#25060)'
  - action: Передать 29 февраля в високосный и невисокосный год (2024 и 2025, 1900 и 2000) и выполнить расчёты через 29.02
      (сроки, подписка «через год»)
    notes: inbox №63
  expected:
  - ISO-8601, offset, leap day и invalid date соответствуют контракту
  applicability:
    when:
    - есть date/date-time поля
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0113'
