checks:
- id: SEC-AUTHZ-METHOD-MATRIX
  status: approved
  title: Authorization is enforced for every method
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P1
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Resource exposes multiple methods with potentially different permissions.
  steps:
  - action: For the same resource, test each supported method as an unauthorized principal.
    notes: 'Matrix axis: Authorization; scenario: Method bypass. Use isolated synthetic identities and data.'
  - action: action-обработчик формы (POST) на маршруте с защищённым GET
    notes: 'Real-world bug: RWB-0147 (GHSA-pp95-gc86-jq6q)'
  - action: Указать защищённую тему как тему завещания при подключении MQTT без права записи, оборвать соединение и проверить,
      что сообщение не опубликовано
    notes: 'Real-world bug: RWB-0147 (GHSA-9jjc-fw8x-fmwx)'
  - action: Повторить матрицу методов для ресурса, запрошенного до входа через форму, после возврата на него по завершении
      входа
    notes: 'Real-world bug: RWB-0147 (GHSA-h3x4-894j-xpx5)'
  - action: Запретить подпуть с завершающим wildcard при разрешённом списке на родительском пути, выполнить LIST по подпути
      и проверить отказ
    notes: 'Real-world bug: RWB-0147 (GHSA-xp3c-3jw3-4vcr)'
  - action: Участником с правом записи удалить объект повышенного уровня, который он не может создать, и проверить отказ и
      сохранность объекта
    notes: 'Real-world bug: RWB-0147 (GHSA-fmmf-xq98-g327)'
  - action: Пройти все эндпоинты чтения одного ресурса (текст, метаданные, ссылки, существование) ролью без доступа к объекту
      и проверить единый отказ
    notes: 'Real-world bug: RWB-0147 (GHSA-4vpg-gwqq-w44c)'
  - action: Ролью с ограниченным доступом запросить агрегаты (уникальные метки, счётчики) и проверить, что значения недоступных
      объектов не входят
    notes: 'Real-world bug: RWB-0147 (GHSA-j4ph-9xwf-wcj4)'
  - action: Повторить проверку каждого эндпоинта чтения для объектов каждого уровня защиты (скрыт, запрещён к публикации,
      защищён паролем без ввода пароля)
    notes: 'Real-world bug: RWB-0147 (GHSA-vpjw-wf5h-cgpq)'
  - action: Вызвать ролью читателя эндпоинты, которые рассчитывают изменение без применения (предпросмотр транзакции), и проверить,
      что в ответе нет содержимого недоступных объектов
    notes: 'Real-world bug: RWB-0147 (GHSA-69mh-gvh4-8gp7)'
  - action: Запустить действие синхронным методом «запустить и дождаться» пользователем с правом запуска без права чтения
      результата и проверить, что вывод не возвращается
    notes: 'Real-world bug: RWB-0147 (GHSA-jm28-2wcr-qf3h)'
  - action: Пользователем с правом чтения одного ключа открыть подписку на изменения с открытым диапазоном и проверить отказ
      или события только по разрешённому ключу
    notes: 'Real-world bug: RWB-0147 (GHSA-xg4h-6gfc-h4m8)'
  - action: Запросить токен со scope, на который настроена политика, каждым типом гранта (code, password, client_credentials,
      refresh) и проверить, что политика срабатывает во всех
    notes: 'Real-world bug: RWB-0147 (keycloak/keycloak#46933)'
  - action: Для каждого типа условия политики клиента (тип доступа, scope, тип гранта) запросить токен и проверить, что исполнитель
      политики применён к ответу
    notes: 'Real-world bug: RWB-0147 (keycloak/keycloak#45740)'
  expected:
  - GET/POST/PUT/PATCH/DELETE and other supported methods each enforce their declared permissions.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Resource exposes multiple methods with potentially different permissions.
    skip_when:
    - Only one method is supported.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0147'
