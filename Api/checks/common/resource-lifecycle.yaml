  - 'Real-world bug: RWB-0106'
- id: RES-REFERENTIAL-INTEGRITY
  status: approved
  title: Ссылка на несуществующий или чужой связанный ресурс отклоняется
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - data-integrity
  - authz
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Ресурс ссылается на другие ресурсы по id.
  steps:
  - action: Создать ресурс со ссылкой на несуществующий, удалённый и принадлежащий другому пользователю объект.
  - action: Обе ссылки существуют, но не связаны между собой; интерфейс ограничивает выбор, API — нет (см. REQ-CROSS-CLIENT-CONSISTENCY)
    notes: 'Real-world bug: RWB-0104 (keycloak/keycloak#50178)'
  expected:
  - Ссылки отклоняются; чужой объект не раскрывается через сообщение об ошибке.
  applicability:
    when:
    - Есть связи.
    skip_when:
    - Нет связей.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0104'
- id: RES-DELETE-WITH-DEPENDENTS
  status: approved
  title: Удаление ресурса с зависимыми объектами выполняется по правилам каскада
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - data-integrity
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть зависимые объекты.
  steps:
  - action: Удалить родительский ресурс с дочерними.
  - action: Добавить проверку зависимых операций после удаления (выдача токена, вычисление прав), в том числе при закэшированной
      конфигурации
    notes: 'Real-world bug: RWB-0102 (keycloak/keycloak#51589)'
  - action: Удалить владельца, у которого сервер автоматически создал зависимые объекты, и проверить, что ссылка на владельца
      в них разрешается и зависимые удаляются
    notes: 'Real-world bug: RWB-0102 (kubernetes/kubernetes#136890)'
  expected:
  - Каскадное удаление или отказ строго по контракту; нет висячих ссылок.
  applicability:
    when:
    - Есть зависимости.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0102'
