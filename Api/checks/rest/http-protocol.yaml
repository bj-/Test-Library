  expected:
  - Ответ 414 или задокументированная ошибка без 5xx.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: HTTP-ACCEPT-LANGUAGE
  status: approved
  title: Язык сообщений определяется Accept-Language с fallback
  category: http-semantics
  protocols:
  - rest
  - graphql
  kind: positive
  priority: P3
  tags:
  - positive
  - i18n
  - regression
  - nightly
  preconditions:
  - API локализует сообщения.
  steps:
  - action: Запросить с ru, en, неподдерживаемым языком, некорректным значением заголовка.
