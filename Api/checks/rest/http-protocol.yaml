    impact: medium
    likelihood: medium
- id: HTTP-BODY-ON-GET-DELETE
  status: approved
  title: Тело в GET/DELETE игнорируется или отклоняется по контракту
  category: http-semantics
  protocols:
  - rest
  kind: boundary
  priority: P3
  tags:
  - boundary
  - contract
  - regression
  - nightly
  preconditions:
  - Есть GET или DELETE.
  steps:
  - action: Отправить GET и DELETE с телом, содержащим фильтры или id.
  expected:
  - Тело не меняет семантику запроса, если контракт этого не описывает.
  applicability:
    when:
    - Есть GET/DELETE.
    skip_when:
    - Контракт явно использует тело.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: HTTP-VERSION-PARITY
  status: draft
  title: Запросы по HTTP/2 и с предложением Upgrade h2c обслуживаются так же, как по HTTP/1.1
  category: http-semantics
  protocols:
  - rest
  kind: compatibility
  priority: P3
  tags:
  - compatibility
  - reliability
  - transport-security
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервер или прокси принимает HTTP/2 (ALPN h2) или клиенты могут предлагать Upgrade.
  steps:
  - action: Выполнить основные запросы (GET, POST с телом) по HTTP/2 и по HTTP/1.1; сравнить ответы.
  - action: Отправить HTTP/1.1 запрос с Connection Upgrade, Upgrade h2c и HTTP2-Settings (GET и POST с телом).
  - action: Проверить живость сервиса после серии.
  expected:
  - Ответы одинаковы для обеих версий протокола.
  - Upgrade игнорируется (обычный ответ HTTP/1.1) или выполняется корректно (101); соединение не сбрасывается, процесс не
    падает.
  applicability:
    when:
    - Сервис доступен по HTTP.
    skip_when:
    - —
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - RFC 9113
  - RFC 9110 §7.8
  - 'Real-world bug: RWB-0013'
- id: HTTP-ABSOLUTE-URL-BASE-PATH
  status: draft
  title: Абсолютные URL, которые формирует сервер, учитывают публичный адрес и базовый путь
  category: http-semantics
  protocols:
  - rest
  kind: positive
  priority: P3
  tags:
  - positive
  - compatibility
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис опубликован за прокси, возможно под подпутём; сервер формирует абсолютные ссылки (Location, callback OAuth, ссылки
    в письмах, пагинация).
  steps:
  - action: Запустить сценарии, где сервер формирует абсолютный URL, и разобрать полученные адреса.
  expected:
  - URL содержит публичную схему, хост и базовый путь и ведёт на рабочий маршрут.
  applicability:
    when:
    - Сервер формирует абсолютные ссылки.
    skip_when:
    - Только относительные ссылки.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Конфигурация публичного URL
  - 'Real-world bug: RWB-0027'
- id: HTTP-HTTP2-RESOURCE-LIMITS
  status: draft
  title: Параметры HTTP/2 со стороны клиента не заставляют сервер буферизовать и работать без предела
  category: http-semantics
  protocols:
  - rest
  - grpc
  kind: boundary
  priority: P3
  tags:
  - boundary
  - hardening
  - real-world-bug
  - nightly
  preconditions:
  - Сервер поддерживает HTTP/2.
  - Нужны инструменты — клиент HTTP/2 с управлением кадрами (h2load, h2spec, собственный клиент) и мониторинг памяти и CPU
    сервера; без них проверка пропускается осознанно.
  steps:
  - action: Передавать по HTTP/2 большое или бесконечное тело на маршрут, который не читает тело или читает его медленно;
      наблюдать память сервера.
  - action: Объявить в SETTINGS малый MAX_HEADER_LIST_SIZE и отправить много запросов, ответы которых его превышают.
  expected:
  - Окно управления потоком не расширяется сверх прочитанного приложением, память ограничена.
  - Сервер не выполняет запросы впустую ради ответа, который клиент не примет; нагрузка не растёт.
  applicability:
    when:
    - HTTP/2 включён и есть инструменты из предусловий.
    skip_when:
    - Только HTTP/1.1 или нет доступа к мониторингу сервера.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - RFC 9113 п. 5.2, 6.5.2
  - 'Real-world bug: RWB-0189'
- id: HTTP-HEADER-REPEATED-LINES-ACCEPTED
  status: draft
  title: Сотни повторяющихся строк одного заголовка в пределах лимита размера принимаются одинаково по HTTP/1.1 и HTTP/2
  category: http-semantics
  protocols:
  - rest
  - grpc
  kind: positive
  priority: P3
  tags:
  - positive
  - compatibility
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Заголовок может передаваться повторяющимися строками (группы при имперсонации, от аутентифицирующего прокси, списки).
  steps:
  - action: Отправить запрос со 100, 500 и 1000 строками одного заголовка (общий размер в пределах документированного
      лимита) по HTTP/1.1 и по HTTP/2.
  expected:
  - Запрос в пределах лимита размера обслуживается одинаково по обеим версиям HTTP.
  - Если действует лимит числа строк, он задокументирован и одинаков для версий протокола; отказ — 431 с понятной причиной.
  applicability:
    when:
    - Есть заголовки со списком значений.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - RFC 9110 §5.3 (повторяющиеся строки поля равноценны списку)
  - Позитивная пара к HTTP-HEADER-SIZE-LIMIT; паритет версий — HTTP-VERSION-PARITY; запись отказа в аудит — OBS-AUDIT-TRAIL
  - 'Real-world bug: RWB-0217'
