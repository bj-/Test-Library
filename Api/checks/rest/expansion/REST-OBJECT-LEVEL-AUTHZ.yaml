checks:
- id: REST-OBJECT-LEVEL-AUTHZ
  status: approved
  title: Object-level authorization
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - security
  - authz
  - negative
  - rest
  - real-world-bug
  - smoke
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: В действиях бота или агента передать параметр цели (канал, комната) другого владельца и проверить каждое действие
      чтения метаданных
    notes: 'Real-world bug: RWB-0124 (GHSA-g7fw-3gjp-g5hf)'
  - action: Вызвать операцию привязки гостевого ресурса к своей учётке по чужому идентификатору без токена гостевого ресурса
    notes: 'Real-world bug: RWB-0124 (GHSA-4825-p4xm-pcf2)'
  expected:
  - доступ и мутации разрешены только по политике; отказ не раскрывает данные
  applicability:
    when:
    - есть owner/tenant/role policy
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Smoke
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0124'
