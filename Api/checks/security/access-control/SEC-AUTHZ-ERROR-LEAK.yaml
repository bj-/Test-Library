checks:
- id: SEC-AUTHZ-ERROR-LEAK
  title: Authorization failures do not disclose protected data
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P1
  tags:
  - negative
  - security
  - authz
  - ci
  - regression
  - release
  preconditions: &id001
  - API has protected resources and authorization-denial responses.
  steps:
  - action: Trigger denied access for an existing resource and compare error details with a nonexistent resource where policy
      requires concealment.
    notes: 'Matrix axis: Authorization; scenario: Error data leakage. Use isolated synthetic identities and data.'
  expected:
  - Error body, headers, and timing do not disclose sensitive fields or existence beyond the documented policy.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when: *id001
    skip_when:
    - Resource existence is intentionally public.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
