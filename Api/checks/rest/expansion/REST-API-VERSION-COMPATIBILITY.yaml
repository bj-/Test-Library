checks:
- id: REST-API-VERSION-COMPATIBILITY
  title: Совместимость версий API
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: positive
  priority: P1
  tags:
  - compatibility
  - contract
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - поддерживаемые версии сохраняют документированную семантику
  applicability:
    when:
    - поддерживаются несколько версий
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Release
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
