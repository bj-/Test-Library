- id: GRPC-PRECONDITION-ABORTED
  status: approved
  title: FAILED_PRECONDITION и ABORTED используются согласно семантике повтора
  category: grpc-errors
  protocols:
  - grpc
  kind: contract
  priority: P3
  tags:
  - contract
  - concurrency
  - regression
  - nightly
  preconditions:
  - Есть условные операции и конкурентные изменения.
  steps:
  - action: Вызвать операцию в неверном состоянии и при конфликте версий.
  expected:
  - FAILED_PRECONDITION — не повторять без изменения состояния; ABORTED — можно повторить транзакцию.
  applicability:
    when:
    - Есть такие сценарии.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
