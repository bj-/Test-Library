checks:
- id: SEC-TOKEN-REFRESH-REPLAY
  title: Refresh-token replay is rejected or rotated
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P1
  tags:
  - negative
  - security
  - authn
  - regression
  - release
  - nightly
  preconditions: &id001
  - Refresh tokens are supported.
  steps:
  - action: Use a refresh token successfully, then submit the same token again.
    notes: 'Matrix axis: Authentication; scenario: Refresh replay. Use isolated synthetic identities and data.'
  expected:
  - Behavior matches the documented rotation/reuse-detection policy; replay must not silently create an unintended parallel
    session.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when: *id001
    skip_when:
    - No refresh-token flow exists.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
