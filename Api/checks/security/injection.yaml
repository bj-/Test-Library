  - negative
  - injection
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Используется MongoDB/Elastic/другая документная БД.
  steps:
  - action: 'Передать объекты вместо скаляров: {"$ne": null}, {"$gt": ""}, {"$regex": ".*"}, $where.'
  - action: Использовать в логине и фильтрах.
  expected:
