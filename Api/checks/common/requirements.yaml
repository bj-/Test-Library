checks:
- id: REQ-SPEC-NOT-IN-CONTRACT
  status: approved
  title: Требование ТЗ не потеряно по пути в контракт и реализацию
  description: Аналитик или разработчик мог пропустить требование заказчика. Контракт молчит - это не значит, что требования
    нет. Проверка строится от ТЗ, а не от контракта.
  category: requirements
  protocols:
  - generic
  kind: contract
  priority: P1
  tags:
  - negative
  - requirements
  - contract
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть ТЗ заказчика и/или внутренние ТЗ (ФТТ, ОТЗ, ЧТЗ) с идентифицируемыми требованиями.
  steps:
  - action: Для каждого требования ТЗ, относящегося к API, найти операцию, поле или поведение контракта, которые его реализуют.
  - action: Для требований без отражения в контракте выполнить запросы, которыми пользователь пытался бы получить требуемое
      поведение (ожидаемая ручка, параметр, поле ответа).
  - action: 'Сверить версию ТЗ, на которую ссылается документация разработки (TS, GTS, FR), с актуальной и сравнить по каждой теме модуля модель данных, обязательность полей и настройки администратора; расхождение - баг requirements'
    notes: 'inbox №360'
  expected:
  - У каждого требования есть реализующая операция или явная отметка, что оно вне этого API.
  - Требование без реализации оформляется находкой (баг на контракт/реализацию или вопрос на ТЗ), тест-заглушка помечается
    TODO со ссылкой на требование, а не удаляется.
  applicability:
    when:
    - Доступно хотя бы одно ТЗ.
    skip_when:
    - ТЗ нет совсем (зафиксировать как риск).
  automation:
    level: partial
    deterministic: true
    notes: Сопоставление требований и операций - анализ; запросы-пробы автоматизируются.
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - docs/decisions/0002-expected-behavior-sources.md
- id: REQ-CONTRACT-CONTRADICTS-SPEC
  status: approved
  title: Поведение по контракту не противоречит ТЗ
  description: Разработчик мог неверно понять ТЗ (или аналитик - заказчика). Расхождение источников - находка сама по себе.
  category: requirements
  protocols:
  - generic
  kind: contract
  priority: P1
  tags:
  - negative
  - requirements
  - contract
  - business-logic
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть ТЗ и контракт, описывающие одно поведение (коды ошибок, ограничения полей, права, сроки, лимиты).
  steps:
  - action: Сравнить ограничения из ТЗ и контракта (длины, форматы, обязательность, права ролей, лимиты попыток, сроки сессий,
      коды и тексты ошибок).
  - action: Выполнить запросы на границах обоих вариантов ограничения.
  - action: Сверить числовые пределы между уровнями документов (ФТТ, ОТЗ, ЧТЗ, контракт) - расхождение это находка на
      документ, даже если реализация совпадает с одним из них
    notes: inbox №448
  expected:
  - Тест утверждает ожидание по более авторитетному источнику (ТЗ заказчика > ОТЗ > ЧТЗ > контракт; требования безопасности
    стандарта - не ниже ТЗ).
  - Нижний документ задаёт ожидание только там, где есть явное согласие заказчика; документа о согласии нет - с пометкой
    «со слов <кто>, <откуда>» (ADR 0017).
  - Противоречие оформляется багом/вопросом на документ, даже если реализация совпадает с контрактом.
  applicability:
    when:
    - Одно поведение описано в нескольких источниках.
    skip_when:
    - Поведение описано только в одном источнике.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - docs/decisions/0002-expected-behavior-sources.md
- id: REQ-CONTRACT-SELF-CONSISTENCY
  status: approved
  title: Контракт не противоречит сам себе и своей прежней версии
  description: Описание операции, схема, примеры и общие компоненты могут расходиться; новая версия может молча отменить обещание
    прежней.
  category: requirements
  protocols:
  - rest
  - grpc
  - graphql
  kind: contract
  priority: P2
  tags:
  - negative
  - requirements
  - contract
  - compatibility
  - ci
  - regression
  - nightly
  preconditions:
  - Есть контракт; желательно - его прежняя версия.
  steps:
  - action: Сверить текст описаний операций с их схемами, кодами ответов и примерами (например, описание обещает поле или
      код, которого нет в схеме).
  - action: Сверить одно и то же поле в разных операциях (формат, длина, регистр, nullable).
  - action: Сверить с прежней версией контракта обещания поведения, исчезнувшие без замены (нормализация пути, снятие cookie,
      коды ошибок).
  - action: 'Сравнить спецификации двух сборок (веток, релизов): при несовместимых изменениях (удалена операция, переименован параметр пути, изменён обязательный набор полей) info.version растёт по принятой схеме, при любых изменениях не остаётся прежней'
    notes: 'inbox №349'
  - action: 'Сверить security операции (альтернатива {} - анонимный доступ) с текстом ошибок в описании и с поведением стенда: без учётных данных - отказ, если описание его обещает'
    notes: 'inbox №356'
  expected:
  - Противоречия и пропавшие обещания оформлены находками.
  - Пропавшее обещание по умолчанию продолжает проверяться (ожидание из прежней версии/стандарта) до явного решения.
  applicability:
    when:
    - Контракт содержит текстовые описания поведения или есть прежняя версия.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: high
  references:
  - docs/decisions/0002-expected-behavior-sources.md
- id: REQ-UNSPECIFIED-BEHAVIOR-PROBE
  status: approved
  title: Неописанное поведение выясняется тестом и сравнивается со стандартом и здравым смыслом
  description: Источники молчат (обрезка пробелов, регистр, путь со слешем, снятие cookie, лишние поля, повтор параметра).
    Это не повод не проверять - фактическое поведение фиксируется тестом.
  category: requirements
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: contract
  priority: P2
  tags:
  - boundary
  - requirements
  - validation
  - ci
  - regression
  - nightly
  preconditions:
  - Найдено поведение, о котором молчат контракт и ТЗ.
  steps:
  - action: Выполнить запрос, выявляющий фактическое поведение, и сохранить ответ в результате теста.
  - action: Сравнить с ожиданием по стандарту (RFC, OWASP), практике отрасли и поведению соседних операций того же API.
  expected:
  - Тест утверждает ожидание со ссылкой на его источник; несовпадение - потенциальный дефект, заводится баг.
  - Фактическое поведение одинаково во всех операциях с тем же полем или механизмом.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: high
  references:
  - docs/decisions/0002-expected-behavior-sources.md
- id: REQ-CROSS-CLIENT-CONSISTENCY
  status: approved
  title: Одно правило продукта одинаково в API разных клиентов
  description: Политика паролей, формат телефона и email, регистр логина, сроки сессий в API админки и мобильного клиента
    реализуют разные команды - и расходятся.
  category: requirements
  protocols:
  - generic
  kind: contract
  priority: P2
  tags:
  - negative
  - requirements
  - business-logic
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - У продукта несколько API (клиентов) с общими сущностями или правилами.
  steps:
  - action: Выписать правила, общие для клиентов по ТЗ (валидация идентификаторов, пароли, сессии, лимиты, ошибки).
  - action: Выполнить одинаковые граничные запросы в каждом API.
  - action: Одна сущность через разные эндпоинты и протоколы, сравнение полей и связей
    notes: 'Real-world bug: RWB-0099 (strapi/strapi#27447)'
  - action: Прочитать одну сущность в разных версиях API и сравнить данные
    notes: 'Real-world bug: RWB-0099 (keycloak/keycloak#53117)'
  - action: Запросить агрегаты с группировкой по функциям через REST и GraphQL одного продукта и сравнить результаты
    notes: 'Real-world bug: RWB-0099 (directus/directus#26703)'
  - action: Разные транспорты одного API (REST и WebSocket) — валидация параметров должна совпадать
    notes: 'Real-world bug: RWB-0099 (directus/directus#27844)'
  - action: Разные пути создания одного объекта (админ-API, регистрация, метаданные) — одинаковые политики
    notes: 'Real-world bug: RWB-0099 (keycloak/keycloak#49457)'
  - action: Выполнить операцию через альтернативный протокол (CalDAV, WebDAV) и сравнить проверку прав с REST
    notes: 'Real-world bug: RWB-0099 (GHSA-g38j-7v97-x298)'
  - action: Зарегистрировать OAuth-клиента с redirect URI пользовательской схемы, разрешённой в списке адресов перенаправления,
      и убедиться, что он принимается так же, как в других потоках входа
    notes: 'Real-world bug: RWB-0099 (supabase/auth#2285)'
  - action: 'Повторить проверку настройки отключённого подтверждения email для каждого пути привязки email: регистрация, смена
      email, перевод анонимного пользователя'
    notes: 'Real-world bug: RWB-0099 (supabase/auth#1619)'
  - action: Перевести анонимного пользователя в постоянный через пользовательский и через админский API и сравнить признак
      анонимности в ответе, при чтении и в токене
    notes: 'Real-world bug: RWB-0099 (supabase/auth#1578)'
  - action: 'Сравнить цены и валюту одного товара в админке и публичной витрине: валюта строк = currency, сумма = цена в копейках
      / 100'
    notes: inbox №32
  - action: Для функции, которая у разных типов объектов бывает режимом или параметром режима (ночной, эко), сравнить
      контракт, ответ API и клиент - у каждого типа она в одном месте и не показана в обоих
    notes: inbox №451
  expected:
  - Правило одинаково везде, где ТЗ не требует различий; расхождение - находка.
  applicability:
    when:
    - Есть два и более API одного продукта.
    skip_when:
    - API один.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - docs/decisions/0002-expected-behavior-sources.md
  - 'Real-world bug: RWB-0099'
- id: REQ-ACCEPTANCE-PLAN-REVIEW
  status: draft
  title: ПМИ соответствует ЧТЗ по порядку шагов, покрытию и редакции
  category: requirements
  protocols:
  - generic
  kind: contract
  priority: P2
  tags:
  - requirements
  preconditions:
  - Есть ПМИ и ЧТЗ с диаграммами последовательности.
  steps:
  - action: Сверить порядок шагов сценариев с диаграммами последовательности ЧТЗ.
  - action: Составить матрицу «требование - закрывающие сценарии» и проверить, что каждое требование закрыто хотя бы одним сценарием
      целиком; в «Проверяемые требования» - только закрываемые сценарием, затрагиваемые отдельно.
  - action: Проверить, что ПМИ и ревьюер сверяют одну редакцию ЧТЗ (версия в шапке ПМИ).
  expected:
  - Порядок шагов совпадает с диаграммами, каждое требование закрыто целиком, редакция ЧТЗ одна; расхождения - находки до отправки
    заказчику.
  applicability:
    when:
    - Есть ПМИ, которое передаётся заказчику.
    skip_when:
    - Нет.
  automation:
    level: manual
    deterministic: false
  risk:
    impact: medium
    likelihood: medium
  references:
  - inbox №353
