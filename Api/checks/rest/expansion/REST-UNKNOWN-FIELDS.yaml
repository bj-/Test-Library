checks:
- id: REST-UNKNOWN-FIELDS
  status: approved
  title: Политика неизвестных полей
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - contract
  - negative
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: При политике «отбросить неизвестные» проверить, что объявленные вложенные объекты и их поля сохраняются (сравнить
      отправленное и прочитанное)
    notes: 'Real-world bug: RWB-0139 (nestjs/nest#8066)'
  - action: Добавить в тело ключ другой операции того же вызова или чужого объекта — поведение и права не меняются
    notes: inbox №49
  - action: Добавить незадокументированные поля пустыми и со значением — без 5xx, по политике неизвестных полей
    notes: inbox №55
  - action: Добавить неизвестное поле на каждом уровне вложенности, в элементы массива и неизвестный параметр
      query - политика одна на всех операциях API
    notes: inbox №506
  - action: 'При политике «игнорировать» отправить необязательное поле с опечаткой в имени (emial) - клиент
      получает успех, а значение потеряно: потенциальный дефект'
    notes: inbox №506
  expected:
  - reject/ignore/preserve соответствует контракту; нет mass assignment
  applicability:
    when:
    - известна политика additionalProperties
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0139'
