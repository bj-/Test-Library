# Трассировка проверок на реальные баги (ADR 0004, docs/BUG_MINING_PLAN.md, «Трассировка на источники»).
#
# Пруфы для вопросов «да как такое возможно?». Обычные инструменты (select_checks, build_catalog, генераторы)
# этот файл не читают; validate_library.py проверяет, что каждый `Real-world bug: RWB-NNNN` из references
# записи есть здесь, а у записи стоит метка real-world-bug.
#
# Формат:
# RWB-0001:
#   pattern: суть паттерна одной строкой
#   checks: [CHECK-ID, ...]        # записи библиотеки, которые этот пруф подтверждает
#   batch: pilot                   # партия выгрузки
#   bugs:
#     - url: ссылка на issue / advisory
#       fix: ссылка на PR или коммит с исправлением (если есть)
#       product: продукт
#       closed: YYYY-MM-DD
#       summary: краткая суть своими словами, без копии текста issue
RWB-0001:
  pattern: Матрица «оператор фильтра × тип поля»; допустимые операторы принимаются для типа и подтипов, результат совпадает
    с эталонным отбором по полному списку
  checks:
  - REST-FILTER-OPERATOR-TYPE-MATRIX
  batch: pilot
  bugs:
  - url: https://github.com/directus/directus/issues/28303
    fix: https://github.com/directus/directus/pull/28308
    product: Directus
    closed: '2026-09-30'
    summary: API отклоняет документированный оператор фильтра для подтипов поля
  - url: https://github.com/directus/directus/issues/28256
    fix: https://github.com/directus/directus/pull/28264
    product: Directus
    closed: '2026-09-22'
    summary: Фильтр по строковому значению в JSON-поле молча не находит записи
