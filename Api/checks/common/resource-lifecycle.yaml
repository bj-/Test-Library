    likelihood: medium
- id: RES-TIMESTAMPS
  status: approved
  title: Метки времени создания и изменения ведут себя корректно
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - data-integrity
  - ci
  - regression
  - nightly
  preconditions:
  - Ресурс содержит createdAt/updatedAt.
  steps:
  - action: Создать ресурс, изменить его, выполнить запрос без изменений.
  expected:
  - createdAt не меняется; updatedAt растёт только при изменении; время в задокументированной зоне и формате.
  applicability:
    when:
    - Есть метки времени.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: RES-REFERENTIAL-INTEGRITY
  status: approved
  title: Ссылка на несуществующий или чужой связанный ресурс отклоняется
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - data-integrity
  - authz
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Ресурс ссылается на другие ресурсы по id.
  steps:
  - action: Создать ресурс со ссылкой на несуществующий, удалённый и принадлежащий другому пользователю объект.
  expected:
  - Ссылки отклоняются; чужой объект не раскрывается через сообщение об ошибке.
  applicability:
    when:
    - Есть связи.
    skip_when:
    - Нет связей.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
