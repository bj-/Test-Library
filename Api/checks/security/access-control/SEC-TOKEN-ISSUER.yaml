checks:
- id: SEC-TOKEN-ISSUER
  status: approved
  title: Token from untrusted issuer is rejected
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authn
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - JWT/OIDC or another issuer-based token scheme is used.
  steps:
  - action: Present a token from an issuer not trusted by the service.
    notes: 'Matrix axis: Authentication; scenario: Untrusted issuer. Use isolated synthetic identities and data.'
  expected:
  - Token is rejected; untrusted identity cannot access protected resources.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - JWT/OIDC or another issuer-based token scheme is used.
    skip_when:
    - Credential scheme does not have issuers.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
