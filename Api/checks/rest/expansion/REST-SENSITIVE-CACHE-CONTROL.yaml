checks:
- id: REST-SENSITIVE-CACHE-CONTROL
  status: approved
  title: Кэширование чувствительных ответов
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - security
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: 'Запросить публично кэшируемый ресурс (файл) с cookie сессии и проверить, что ответ с Cache-Control: public не
      содержит Set-Cookie'
    notes: 'Real-world bug: RWB-0246 (GHSA-8h22-8cf7-hq6g)'
  expected:
  - общий кэш не отдаёт данные другому субъекту; Cache-Control соответствует политике
  applicability:
    when:
    - ответ содержит пользовательские данные
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0246'
