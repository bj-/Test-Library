checks:
- id: ERR-STABLE-ERROR-CODES
  status: approved
  title: Машиночитаемые коды ошибок стабильны и задокументированы
  category: errors
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: contract
  priority: P2
  tags:
  - contract
  - error-handling
  - compatibility
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Модель ошибок содержит code/type.
  steps:
  - action: Вызвать каждую задокументированную ошибку операции.
  - action: Вызвать задокументированные ошибки в каждой поддерживаемой версии API (заголовок версии) и проверить наличие машиночитаемого
      кода
    notes: 'Real-world bug: RWB-0315 (supabase/auth#1631)'
  - action: Отправить на эндпоинт интроспекции неверные учётные данные клиента и проверить error=invalid_client по RFC 7662
      §2.3
    notes: 'Real-world bug: RWB-0315 (keycloak/keycloak#48721)'
  - action: Отправить запрос на эндпоинты token и backchannel-аутентификации без client_assertion от клиента с private_key_jwt
      и ожидать error=invalid_client
    notes: 'Real-world bug: RWB-0315 (keycloak/keycloak#43270)'
  expected:
  - Код ошибки совпадает с документацией и не зависит от языка сообщения.
  applicability:
    when:
    - Есть коды ошибок.
    skip_when:
    - Модель ошибок без кодов.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0315'
- id: ERR-INTERNAL-ERROR-SHAPE
  status: approved
  title: Внутренняя ошибка сервера возвращается в общей модели без утечек
  category: errors
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: negative
  priority: P1
  tags:
  - negative
  - error-handling
  - security
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть способ вызвать 5xx в тестовом окружении (fault injection, некорректная зависимость).
  steps:
  - action: Спровоцировать необработанное исключение на сервере.
  - action: Ошибка зависимости со своим кодом не меняет статус ответа клиенту
    notes: 'Real-world bug: RWB-0068 (nestjs/nest#17695)'
  - action: Ошибка, возникшая асинхронно в обработчике, — ответ приходит без зависания и в общей модели
    notes: 'Real-world bug: RWB-0068 (nestjs/nest#373)'
  - action: Вызвать ошибку СУБД в операции, выполняющей запрос пользователя (EXPLAIN), и проверить, что текст ошибки не содержит
      значений из данных
    notes: 'Real-world bug: RWB-0068 (GHSA-vf99-xw26-86g5)'
  - action: Отправить отрицательные значения параметров пагинации (skip, take) и проверить, что ответ 4xx и не содержит стек-трейса
    notes: 'Real-world bug: RWB-0068 (GHSA-77gj-crhp-3gvx)'
  expected:
  - Ответ в модели ошибок с correlation id.
  - Нет stack trace, SQL, путей файлов, версий библиотек и секретов.
  applicability:
    when:
    - Можно спровоцировать сбой.
    skip_when:
    - Сбой не воспроизводим в окружении.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0068'
- id: ERR-STATUS-MATCHES-EFFECT
  status: approved
  title: Код ответа соответствует фактическому результату операции
  category: errors
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - error-handling
  - data-integrity
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Изменяющая операция с побочными действиями после основной транзакции (синхронизация, кэш, события).
  steps:
  - action: Выполнить изменяющую операцию (в том числе DELETE) разными клиентами; затем прочитать ресурс.
  - action: Отправить изменение конфигурации при открытых WebSocket-подписках и сверить код ответа с фактически применённым
      изменением
    notes: 'Real-world bug: RWB-0045 (hasura/graphql-engine#10662)'
  - action: 'Загрузить файл, затем прочитать его метаданные и скачать содержимое: успешная загрузка означает заполненные имя
      на диске и размер и доступный файл'
    notes: 'Real-world bug: RWB-0045 (directus/directus#25871)'
  - action: 'Вызвать нереализованную операцию — 501, а не 200 с success: true'
    notes: inbox №33
  - action: 'Проверить ответ 200 с признаком ошибки в теле (success: false) - код не скрывает отказ, состояние
      соответствует ответу'
    notes: inbox №520
  - action: Оборвать ожидание ответа по тайм-ауту клиента на изменяющей операции - клиент может узнать итог
      операции
    notes: inbox №520
  expected:
  - '2xx — только когда изменение фактически применено: последующее чтение подтверждает новое состояние.'
  - При 5xx состояние не изменено или ошибка явно сообщает о частичном выполнении.
  applicability:
    when:
    - Есть изменяющие операции.
    skip_when:
    - —
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - RFC 9110 §15.6
  - 'Real-world bug: RWB-0045'
- id: ERR-VALIDATION-NO-LEAK
  status: approved
  title: Ошибки валидации не раскрывают внутренние детали
  category: errors
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: negative
  priority: P1
  tags:
  - negative
  - error-handling
  - security
  - hardening
  - regression
  - nightly
  preconditions:
  - Операция принимает данные клиента.
  steps:
  - action: Передать некорректные данные - ошибка клиента по протоколу объясняет проблему (путь к полю
      и полноту проверяет VAL-ALL-ERRORS-REPORTED)
    notes: inbox №525
  - action: Отправить неверное значение в поле пароля или токена - значение не возвращается эхом в сообщении
    notes: inbox №525
  - action: Вызвать ошибки типов, ограничений и разбора JSON - в тексте нет имён колонок и таблиц, классов
      и DTO, внутренних путей и стека
    notes: inbox №525
  expected:
  - Ответ объясняет проблему клиенту и не содержит деталей реализации, секретов и чувствительных данных.
  applicability:
    when:
    - Есть валидация входных данных; для WebSocket - ошибки разбора сообщений, для GraphQL - массив errors.
    skip_when:
    - Операция не принимает данных.
  automation:
    level: full
    deterministic: true
  risk:
    impact: medium
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - inbox №525
  - Смежные - VAL-ALL-ERRORS-REPORTED, ERR-INTERNAL-ERROR-SHAPE, GQL-ERRORS-NO-LEAK
