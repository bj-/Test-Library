checks:
- id: DB-SCHEMA-MATCHES-SPEC
  status: draft
  title: Схема БД совпадает со спецификацией и контрактом API
  category: db
  protocols:
  - db
  kind: contract
  priority: P2
  tags:
  - db
  - contract
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  - Есть спецификация схемы (ТЗ, модель данных) и контракт API.
  steps:
  - action: Сравнить имя БД, таблицы, колонки, типы, длины, значения по умолчанию и NULL со спецификацией и контрактом API
    notes: inbox №131
  - action: Для каждой колонки-флага проверить описанный смысл и что все значения встречаются и обрабатываются приложением
    notes: inbox №138
  - action: Сравнить длину varchar колонки с валидацией API — превышение отклоняется до записи в БД
    notes: inbox №263
  expected:
  - Таблицы, колонки, типы, длины, значения по умолчанию и допустимость NULL совпадают со спецификацией и контрактом; лимиты
    API = лимиты хранения.
  applicability:
    when:
    - Есть описание схемы.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки БД)
- id: DB-KEYS-AND-CONSTRAINTS
  status: draft
  title: Ключи и ограничения защищают целостность независимо от приложения
  category: db
  protocols:
  - db
  kind: contract
  priority: P1
  tags:
  - db
  - contract
  - data-integrity
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Проверить у каждой таблицы первичный ключ, внешние ключи на все ссылки и уникальность по бизнес-правилам; нарушить
      каждое ограничение
    notes: inbox №132
  - action: Вставить невалидные значения напрямую в БД, минуя приложение, — ограничения отклоняют; если нет — приложение корректно
      читает такие строки
    notes: inbox №137
  - action: Вставить запись о файле с пустым именем в хранилище — NOT NULL или CHECK отклоняет
    notes: inbox №190
  - action: Вставить дубль пары внешних ключей в связующую таблицу многие-ко-многим — уникальное ограничение отклоняет
    notes: inbox №193
  - action: Вставить связующую запись (позиция задачи в представлении) с объектами разных проектов — ограничение отклоняет
    notes: inbox №231
  - action: Сравнить CHECK на допустимые символы имени пользователя с валидацией API; спецсимволы шаблонов (*, +, /) запрещены
      на обоих уровнях
    notes: inbox №232
  expected:
  - Первичные, внешние ключи, уникальность и CHECK есть там, где их требуют бизнес-правила; нарушение отклоняется самой БД.
  applicability:
    when:
    - Есть доступ к схеме.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: high
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки БД)
- id: DB-DEFAULT-PRECEDENCE
  status: draft
  title: Значения по умолчанию применяются по правилам СУБД при любом способе вставки
  category: db
  protocols:
  - db
  kind: contract
  priority: P3
  tags:
  - db
  - contract
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Вставить строку без значения в колонку доменного типа с собственным default — применяется default колонки, а не
      домена
    notes: inbox №300
  - action: Вставить строки пакетно (json_to_recordset и аналоги) с опущенными колонками — подставляется default, а не null
    notes: inbox №306
  expected:
  - Default колонки важнее default домена; опущенные колонки получают default, а не null, при любом способе вставки.
  applicability:
    when:
    - Есть значения по умолчанию в схеме.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация СУБД (CREATE DOMAIN, DEFAULT)
  - ADR 0006 (проверки БД)
- id: DB-COLLATION-COMPARISON
  status: draft
  title: Сравнение строк в БД соответствует назначению колонки
  category: db
  protocols:
  - db
  kind: security
  priority: P2
  tags:
  - db
  - security
  - data-integrity
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Найти строку по идентификатору с другой диакритикой и концевыми пробелами — collation не должна давать совпадение
      там, где нужна точность
    notes: inbox №154
  - action: Сравнить регистр имён и значений на всём пути клиент → API → SQL → БД → ответ; ожидание — по регистрозависимости
      БД (collation, правила идентификаторов, кавычки)
    notes: inbox №181
  - action: Проверить collation колонок с внешними идентификаторами (OIDC sub, ключи) — бинарная, а не регистронезависимая
    notes: inbox №255
  expected:
  - Идентификаторы и внешние ID сравниваются точно (бинарная collation); регистронезависимость — только там, где она нужна
    по требованиям; поведение API согласовано с collation.
  applicability:
    when:
    - Есть строковые идентификаторы.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация СУБД (collation)
  - Смежные — AUTH-EXTERNAL-ID-EXACT-MATCH, RES-DB-OBJECT-NAMES
  - ADR 0006 (проверки БД)
- id: DB-TYPED-COMPARISONS
  status: draft
  title: Значения сравниваются и приводятся в типе колонки
  category: db
  protocols:
  - db
  kind: boundary
  priority: P2
  tags:
  - db
  - boundary
  - data-integrity
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Сравнить и сохранить внешний ключ типа UUID — без приведения к целому числу
    notes: inbox №183
  - action: Передать в один запрос одинаковые значения разных типов (uuid и text) — не сливаются в один параметр привязки,
      в том числе с позиционными параметрами
    notes: inbox №196
  - action: Запустить задачу очистки по сроку — столбец timestamp сравнивается со значением того же типа, а не с числом миллисекунд
    notes: inbox №213
  - action: Привести значения к типу колонки char(n), bit(n), varchar(n) — модификатор длины сохраняется
    notes: inbox №305
  expected:
  - Сравнения идут в типе колонки, без приведения к другому типу; модификаторы длины сохраняются; разные типы не сливаются
    в один параметр.
  applicability:
    when:
    - Есть доступ к журналу запросов.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация СУБД (приведение типов)
  - ADR 0006 (проверки БД)
