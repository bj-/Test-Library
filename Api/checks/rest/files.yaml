checks:
- id: FILE-UPLOAD-SIZE-LIMIT
  status: approved
  title: Лимит размера загружаемого файла соблюдается
  category: files
  protocols:
  - rest
  kind: boundary
  priority: P1
  tags:
  - boundary
  - files
  - validation
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть загрузка файлов.
  steps:
  - action: Загрузить файлы размером max-1, max, max+1 байт и значительно больше.
  expected:
  - За лимитом ответ 413 или задокументированная ошибка без полной буферизации и 5xx.
  applicability:
    when:
    - Есть загрузка.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: FILE-UPLOAD-TYPE-VALIDATION
  status: approved
  title: Тип файла проверяется по содержимому, а не только по расширению
  category: files
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - negative
  - files
  - security
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Разрешён ограниченный набор типов.
  steps:
  - action: Загрузить исполняемый файл с расширением .jpg, корректный файл с неверным Content-Type, polyglot-файл, HTML и
      SVG вместо изображения.
  expected:
  - Запрещённые типы отклоняются; сохранённый файл отдаётся с безопасным Content-Type.
  applicability:
    when:
    - Есть загрузка.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
- id: FILE-FILENAME-SANITIZATION
  status: approved
  title: Имя загружаемого файла санитизируется
  category: files
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - files
  - security
  - injection
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Сервер использует или возвращает имя файла.
  steps:
  - action: Загрузить файлы с именами ../../x, CON, имя длиной 1000, unicode, управляющие символы, двойное расширение .php.jpg.
  expected:
  - Имя нормализуется или заменяется; файл не выходит за каталог хранения.
  applicability:
    when:
    - Есть загрузка.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: FILE-MALICIOUS-CONTENT
  status: approved
  title: Вредоносное содержимое обнаруживается или изолируется
  category: files
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - files
  - security
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Файлы доступны другим пользователям.
  steps:
  - action: Загрузить тестовый EICAR, SVG со скриптом, PDF с JavaScript, документ с макросами.
  expected:
