checks:
- id: SEC-AUTHZ-REVOKE-ROLE
  status: approved
  title: Role revocation takes effect within policy window
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P1
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Roles can be revoked while a session or token remains active.
  steps:
  - action: Authenticate with a privileged role, revoke that role, then retry privileged operations with existing sessions/tokens.
    notes: 'Matrix axis: Roles/Scopes; scenario: Role revoked. Use isolated synthetic identities and data.'
  - action: Удалить участника из проекта всеми способами (из проекта, из команды, удаление команды) и проверить, что его вебхуки
      и ссылки-доступа больше не отдают данные
    notes: 'Real-world bug: RWB-0298 (GHSA-hjx8-qv73-f7cm)'
  - action: Отозвать согласие клиента, отключить пользователя и исключить его из разрешённой группы, затем обновить токен
      по refresh-токену и проверить отказ в каждом случае
    notes: 'Real-world bug: RWB-0298 (GHSA-w6p7-2fxx-4f44)'
  - action: Сделать публичный ресурс приватным через API и проверить, что подписки и списки пользователей без доступа его
      больше не возвращают
    notes: 'Real-world bug: RWB-0298 (GHSA-q423-49rw-g9mh)'
  expected:
  - Access reflects role revocation within the documented propagation/cache window.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Roles can be revoked while a session or token remains active.
    skip_when:
    - Roles are immutable for the lifetime of the identity.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0298'
