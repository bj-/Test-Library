checks:
- id: RESOURCE-CREATE-READ
  status: approved
  title: Created resource can be read back
  category: resources
  protocols:
  - rest
  - graphql
  - generic
  kind: positive
  priority: P1
  tags:
  - positive
  - real-world-bug
  - smoke
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Test identity can create and read the resource.
  steps:
  - action: Create a resource with valid data and save its identifier.
  - action: Read the resource by identifier.
  - action: Создать объект с нулевым значением поля, влияющего на выборку (вес 0), и прочитать его по ключу
    notes: 'Real-world bug: RWB-0279 (Kong/kong#7699)'
  - action: Зарегистрировать пользователя при запрете редактировать атрибут, который служит логином, и проверить, что атрибут
      сохранён и возвращается при чтении
    notes: 'Real-world bug: RWB-0279 (keycloak/keycloak#43718)'
  expected:
  - Create returns the documented success result.
  - Read returns the created resource with expected values.
  applicability:
    when:
    - API supports resource creation and read.
    skip_when:
    - Asynchronous creation has not reached its documented consistency window.
  automation:
    level: full
    deterministic: true
  profiles:
  - Smoke
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: high
  references:
  - 'Real-world bug: RWB-0279'
- id: RESOURCE-READ-MISSING
  status: approved
  title: Reading a missing resource returns a documented error
  category: resources
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P1
  tags:
  - negative
  - error-handling
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - A guaranteed-absent identifier can be generated.
  steps:
  - action: Request a resource that does not exist.
  - action: 'Повторить для четырёх случаев: id никогда не существовал, удалён, чужой, принадлежит ресурсу
      другого типа - на методах чтения, изменения, удаления и во вложенных путях
      (/parents/{нет}/children)'
    notes: inbox №507
  expected:
  - A documented error is returned without leaking internal details.
  - Код одинаков на всех методах и вложенных путях; чужой id неотличим от несуществующего, если политика не
    предусматривает 403.
  applicability:
    when:
    - API supports lookup by resource identifier.
    skip_when:
    - A missing identifier cannot be reliably constructed.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
