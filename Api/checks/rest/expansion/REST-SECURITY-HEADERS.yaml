checks:
- id: REST-SECURITY-HEADERS
  status: approved
  title: Защитные HTTP-заголовки
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: positive
  priority: P2
  tags:
  - security
  - rest
  - ci
  - regression
  - nightly
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - обязательные заголовки присутствуют и согласованы с политикой
  applicability:
    when:
    - определён baseline заголовков
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
