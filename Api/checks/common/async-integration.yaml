- id: ASYNC-EVENT-PATH-SAME-RULES
  status: approved
  title: Событийный путь применяет те же фильтры и границы доступа, что и плановый
  category: async
  protocols:
  - rest
  - generic
  kind: security
  priority: P1
  tags:
  - security
  - webhooks
  - authz
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Объекты или пользователи попадают в систему двумя путями — плановой синхронизацией с фильтрами и входящим событием или
    вебхуком.
  steps:
  - action: Настроить фильтр или область, исключающую объект или пользователя.
  - action: Отправить легитимное событие об исключённом объекте (изменение, добавление в другую группу); сравнить с результатом
      плановой синхронизации.
  - action: Опубликовать в очередь сообщение с пользовательским заголовком, совпадающим с внутренним управляющим параметром
      (адрес исходящего запроса), и проверить, что он отброшен, как на HTTP-входе
    notes: 'Real-world bug: RWB-0040 (GHSA-pw9q-pq7c-rfqw)'
  expected:
  - Событие для исключённого объекта игнорируется; пользователь вне области не получает доступ.
  applicability:
    when:
    - Есть синхронизация по событиям и по расписанию.
    skip_when:
    - Один путь поступления данных.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API8:2023
  - CWE-863
  - 'Real-world bug: RWB-0040'
- id: ASYNC-SSE-STREAM
