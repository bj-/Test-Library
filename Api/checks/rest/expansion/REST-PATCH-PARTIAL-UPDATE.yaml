checks:
- id: REST-PATCH-PARTIAL-UPDATE
  status: approved
  title: Семантика PATCH
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: positive
  priority: P1
  tags:
  - contract
  - boundary
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Удалить вложенное свойство через diff или patch и проверить, что объект целиком не удаляется
    notes: 'Real-world bug: RWB-0127 (directus/directus#27877)'
  - action: null удаляет поле, PUT без поля очищает его; проверять фактическое применение для атрибутов безопасности
    notes: 'Real-world bug: RWB-0127 (keycloak/keycloak#51213)'
  - action: Изменить одно свойство столбца-автоинкремента (unique) через API схемы и проверить, что тип и значение по умолчанию
      не изменились
    notes: 'Real-world bug: RWB-0127 (directus/directus#24319)'
  - action: Изменить другое свойство строкового столбца с заданной длиной и проверить, что длина не сброшена к значению по
      умолчанию
    notes: 'Real-world bug: RWB-0127 (directus/directus#23992)'
  - action: Снять снимок ресурса, изменить одно поле, снять снимок снова - разница только в этом поле и в
      updatedAt или версии; повторить для каждого изменяемого поля
    notes: inbox №497
  - action: Изменить поле вложенного объекта и один элемент массива - соседние поля и элементы не стёрты
    notes: inbox №497
  expected:
  - меняются только указанные поля; null/remove соответствует формату
  applicability:
    when:
    - PATCH и формат patch поддерживаются
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0127'
