  quality:
  - performance
  - reliability
  - observability
  - resilience
  - costly
  protocol:
  - rest
  - grpc
  - graphql
  - websocket
  - generic
  origin:
  - real-world-bug
rules:
- kind describes behavior; run tags describe where a check is selected.
- Run tags must mirror check.profiles (lower-cased); tools/assign_profiles.py keeps them in sync.
- costly marks checks that need load, fault injection, long waits, or special infrastructure; they are kept out of PR/CI/Smoke.
- Smoke requires critical-path relevance, low cost, and determinism.
- Negative means invalid input, identity, state, or dependency should be rejected.
- Boundary covers limits, empty values, maximum sizes, and edge transitions.
