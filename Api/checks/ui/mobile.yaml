- id: UI-MOBILE-DEEP-LINKS
  status: approved
  title: Глубокие ссылки открывают нужный экран и не открывают чужое
  category: ui
  protocols:
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение со ссылками на экраны (своя схема, App Links, Universal Links) и учётки
    нужных ролей.
  steps:
  - action: Открыть ссылку на экран в запущенном и в незапущенном приложении - открывается нужный экран
    notes: inbox №490
  - action: Открыть ссылку без входа - после входа открывается нужный экран
    notes: inbox №490
  - action: Открыть ссылку с битыми параметрами и с идентификатором чужого объекта - приложение не падает,
      чужие данные не показаны
    notes: inbox №490
  - action: Открыть просроченную ссылку и ссылку с неверным доменом или схемой - приложение не падает,
      лишнее не открывается
    notes: сверка inbox-2026-10-30
  expected:
  - Ссылка ведёт на нужный экран из любого состояния приложения, в том числе через вход; битая или чужая
    ссылка даёт сообщение и возврат на доступный экран, чужие данные не показаны.
  applicability:
    when:
    - В приложении есть глубокие ссылки.
    skip_when:
    - Глубоких ссылок нет.
  automation:
    level: partial
    deterministic: true
  risk:
    impact: medium
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-RUNTIME-METRICS
  status: approved
  title: В UI-прогоне нет скрытых падений и ANR, запуск и память в пределах бюджета
  category: ui
  protocols:
  - ui-mobile
  kind: performance
  priority: P2
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение и телефоны из парка; бюджет запуска и памяти - из требований; для сравнения
    - результаты прошлой версии на том же устройстве.
  steps:
  - action: В любом UI-прогоне автоматически снять время холодного запуска, потребление памяти, ANR и
      падения (logcat, crash-логи iOS)
    notes: inbox №491
  - action: Проверить журналы - падение или ANR - находка, даже если шаги теста прошли
    notes: inbox №491
  - action: Сравнить время запуска и память с бюджетом; бюджета нет - с прошлой версией на том же устройстве,
      рост попадает в отчёт как сигнал
    notes: inbox №491
  expected:
  - Падений и ANR нет; запуск и память в пределах бюджета; без бюджета рост к прошлой версии виден в отчёте
    и не роняет прогон.
  applicability:
    when:
    - Идут автоматические UI-прогоны на телефонах.
    skip_when:
    - Только ручные прогоны.
  automation:
    level: partial
    deterministic: false
  risk:
    impact: medium
    likelihood: medium
  references:
  - ADR 0006 (проверки UI)
- id: UI-MOBILE-ACCESSIBILITY-LABELS
  status: approved
  title: У интерактивных элементов есть различимые подписи доступности
  category: ui
  protocols:
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - compatibility
  preconditions:
  - Есть мобильное приложение и доступ к дереву элементов (UiAutomator2, XCUITest).
  steps:
  - action: Обойти дерево элементов на каждом экране - у каждого кликабельного элемента непустое имя для
      озвучки (text или content-desc, accessibilityLabel); декоративные элементы не в счёт
    notes: inbox №493
  - action: Сравнить подписи на экране - у разных кнопок они различимы, в подписи нет склейки с изменяемыми
      данными, мешающей озвучке
    notes: inbox №493
  expected:
  - На всех экранах нет кликабельных элементов без подписи и разных кнопок с одинаковой подписью без контекста.
  applicability:
    when:
    - Есть мобильный клиент.
    skip_when:
    - Только web-клиент.
  automation:
    level: full
    deterministic: true
  risk:
    impact: medium
    likelihood: high
  references:
  - ADR 0006 (проверки UI)
