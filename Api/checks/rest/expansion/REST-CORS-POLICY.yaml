checks:
- id: REST-CORS-POLICY
  title: Политика CORS
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - security
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - разрешённые/запрещённые origins и credentials соответствуют политике
  applicability:
    when:
    - API используется браузерным клиентом
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
