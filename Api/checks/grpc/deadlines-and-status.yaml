checks:
- id: GRPC-DEADLINE-EXCEEDED
  status: approved
  title: Превышение дедлайна возвращает DEADLINE_EXCEEDED без побочных эффектов сверх контракта
  category: grpc-errors
  protocols:
  - grpc
  kind: negative
  priority: P1
  tags:
  - negative
  - deadlines
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - RPC с измеримым временем выполнения.
  steps:
  - action: Вызвать RPC с дедлайном 1 мс и меньше фактического времени.
  expected:
  - Клиент получает DEADLINE_EXCEEDED; сервер прекращает работу; состояние согласовано.
  applicability:
    when:
    - Всегда для gRPC.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: GRPC-DEADLINE-PROPAGATION
  status: approved
  title: Дедлайн передаётся в нижележащие вызовы
  category: grpc-errors
  protocols:
  - grpc
  kind: reliability
  priority: P2
  tags:
  - deadlines
  - resilience
  - costly
  - regression
  - nightly
  preconditions:
  - Сервис вызывает другие gRPC-сервисы.
  steps:
  - action: Вызвать с коротким дедлайном при медленной зависимости.
  expected:
  - Нижележащие вызовы отменяются по истечении исходного дедлайна.
  applicability:
    when:
    - Есть цепочки вызовов.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: GRPC-CANCELLATION
  status: approved
  title: Отмена клиентом прекращает обработку на сервере
  category: grpc-errors
  protocols:
  - grpc
  kind: reliability
  priority: P2
  tags:
  - deadlines
  - resilience
  - regression
  - nightly
  preconditions:
  - Долгий RPC.
  steps:
  - action: Отменить вызов на клиенте в процессе выполнения.
  expected:
  - Сервер получает CANCELLED и освобождает ресурсы; мутации не выполняются частично.
