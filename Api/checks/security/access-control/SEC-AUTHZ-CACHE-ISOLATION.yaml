checks:
- id: SEC-AUTHZ-CACHE-ISOLATION
  status: approved
  title: Authorization context is respected by caches
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Protected responses may be cached by client, gateway, CDN, or service.
  steps:
  - action: Request a protected resource as principal A, then repeat the same URL as principal B and across tenants.
    notes: 'Matrix axis: Tenant isolation; scenario: Cross-principal cache leakage. Use isolated synthetic identities and
      data.'
  - action: Set-Cookie в кэшируемом ответе — проверять двумя пользователями через общий кэш
    notes: 'Real-world bug: RWB-0145 (GHSA-2jfj-6hjv-fm6j)'
  - action: В одном запросе обратиться сначала к разрешённому ресурсу, затем к запрещённому того же типа и проверить, что
      решение о доступе не переиспользуется
    notes: 'Real-world bug: RWB-0145 (GHSA-5974-gfqc-wrcm)'
  - action: Запросить ресурс с полем, видимым по правам, сначала привилегированным, затем непривилегированным пользователем
      в каждом поддерживаемом формате ответа (JSON, JSON:API, HAL, GraphQL)
    notes: 'Real-world bug: RWB-0145 (GHSA-pjhx-3c3w-9v23)'
  expected:
  - Cached responses are partitioned or bypassed appropriately; B never receives A’s protected content.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Protected responses may be cached by client, gateway, CDN, or service.
    skip_when:
    - Responses are public and contain no principal-specific data.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0145'
