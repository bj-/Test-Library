- id: BIZ-SIDE-EFFECTS-ONCE
  status: approved
  title: Побочные эффекты (письма, push, события) выполняются ровно один раз
  category: business-logic
  protocols:
  - rest
  - grpc
  - graphql
  kind: reliability
  priority: P2
  tags:
  - business-logic
  - idempotency
  - async-jobs
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Операция вызывает уведомления или события.
  steps:
  - action: Выполнить операцию, повтор с idempotency key, неуспешную операцию.
  - action: Удалить объекты одиночной и массовой операцией и сравнить число побочных эффектов (событий, уведомлений, списаний)
    notes: 'Real-world bug: RWB-0065 (strapi/strapi#26610)'
  - action: Обработчик WebSocket-события, зарегистрированный дважды (наследование)
    notes: 'Real-world bug: RWB-0065 (nestjs/nest#2557)'
  - action: Загрузить файл через протокол возобновляемой загрузки (TUS) и проверить, что событие загрузки и связанные вебхуки
      срабатывают так же, как при обычной загрузке
    notes: 'Real-world bug: RWB-0065 (directus/directus#24542)'
  - action: 'Стабом смоделировать сбой в трёх точках: до вызова внешней системы, после её выполнения без ответа,
      после ответа до фиксации у себя; повторить обработку - бизнес-действие выполнено один раз'
    notes: inbox №524
  - action: Ключ идемпотентности передаётся во внешнюю систему и один на все попытки; ручной повтор
      пользователем проверить так же, как автоматический
    notes: inbox №524
  expected:
  - Эффект один раз при успехе и ни разу при отказе.
  applicability:
    when:
    - Есть побочные эффекты.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0065'
- id: BIZ-EMAIL-LINK-CROSS-SESSION
  status: approved
  title: Ссылка-действие из письма работает в другой сессии и после перезапуска сервиса
  category: business-logic
  protocols:
  - rest
  kind: positive
  priority: P2
  tags:
  - positive
  - business-logic
  - session
  - error-handling
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Процесс с подтверждением по ссылке из письма (верификация email, сброс пароля, привязка аккаунта); есть варианты настройки
    потока.
  steps:
  - action: Начать процесс в сессии A, открыть ссылку в сессии B (другие cookie), вернуться в A; повторить для каждого варианта
      потока.
  - action: Открыть ссылку новым клиентом без cookie после перезапуска сервиса.
  - action: Завершить действие по ссылке из письма, запущенное запросом авторизации, и проверить, что перенаправление на callback
      содержит code и state исходного запроса
    notes: 'Real-world bug: RWB-0017 (keycloak/keycloak#44488)'
  expected:
  - Подтверждение учитывается одинаково во всех вариантах; процесс завершается.
  - Без исходной сессии — действие выполняется или понятная ошибка (ссылка истекла, войдите заново), но не 5xx.
  applicability:
    when:
    - Есть ссылки-действия в письмах.
    skip_when:
    - Нет email-сценариев.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Здравый смысл — пользователь открывает письмо на другом устройстве
  - 'Real-world bug: RWB-0017'
