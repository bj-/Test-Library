checks:
- id: REST-PAGINATION-BOUNDARIES
  status: approved
  title: Pagination handles boundary values correctly
  category: pagination
  protocols:
  - rest
  - graphql
  kind: boundary
  priority: P1
  tags:
  - boundary
  - validation
  - pagination
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Endpoint is paginated and dataset size is known.
  steps:
  - action: Check minimum, default, maximum, and over-limit page sizes.
  expected:
  - Values are accepted, clamped, or rejected as documented.
  - No gaps or duplicates occur across pages when dataset is unchanged.
  applicability:
    when:
    - Operation returns a paginated collection.
    skip_when:
    - Pagination is not implemented.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
- id: REST-FILTER-SORT-COMPOSITION
  status: approved
  title: Filtering and sorting compose correctly
  category: pagination
  protocols:
  - rest
  - graphql
  kind: positive
  priority: P2
  tags:
  - positive
  - filtering
  - sorting
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Dataset can verify filters and sort order.
  steps:
  - action: Request a collection with two filters and a supported sort field.
  - action: Отсортировать по вычисляемому полю при фильтре по связи (DISTINCT) и сравнить результат на разных СУБД
    notes: 'Real-world bug: RWB-0118 (strapi/strapi#26746)'
  - action: Сортировка на уровне раскрываемой связи вместе с сортировкой верхнего уровня
    notes: 'Real-world bug: RWB-0118 (strapi/strapi#26359)'
  expected:
  - Every returned item satisfies all filters.
  - Ordering matches requested field and direction.
  applicability:
    when:
    - Endpoint supports filtering and sorting.
    skip_when:
    - The requested combination is forbidden by contract.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  references:
  - 'Real-world bug: RWB-0118'
- id: REST-FILTER-OPERATOR-TYPE-MATRIX
  status: approved
  title: Каждый оператор фильтра работает для каждого допустимого типа поля и возвращает ровно подходящие записи
  category: pagination
  protocols:
  - rest
  - graphql
  kind: positive
  priority: P2
  tags:
  - positive
  - filtering
  - validation
  - data-integrity
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Список поддерживает фильтры с операторами (eq, neq, in, gt, starts_with, contains, регистронезависимые и т. п.).
  - Создан набор записей с известными значениями каждого типа поля, включая null, пустую строку и JSON-путь.
  steps:
  - action: Для каждого типа и подтипа поля (integer и int64, geometry и geometry.Point, string, date, json) применить каждый
      документированный для него оператор.
  - action: Сравнить результат с эталонным отбором на клиенте по полному списку без фильтра.
  - action: Применить недокументированный для типа оператор.
  - action: Применить операторы фильтра к колонкам доменных типов (в том числе домена над доменом) и сравнить результат с
      колонкой базового типа
    notes: 'Real-world bug: RWB-0001 (PostgREST/postgrest#4135)'
  - action: Отфильтровать и отсортировать результат функции по полю составного типа через оператор пути
    notes: 'Real-world bug: RWB-0001 (PostgREST/postgrest#2929)'
  - action: Отфильтровать родительские записи по «связь не null» при связанной записи с null в части полей и проверить, что
      такие записи возвращаются, а «связь is null» отдаёт только записи без связи
    notes: 'Real-world bug: RWB-0001 (PostgREST/postgrest#2800)'
  - action: Для каждого значения enum и boolean проверить непустой результат при наличии данных; значение вне enum — 400
    notes: inbox №31
  expected:
  - Допустимый оператор принимается (2xx) для типа и всех его подтипов.
  - Результат совпадает с эталонным отбором; нет молчаливого пустого ответа.
  - Недопустимый оператор — 400 с понятной ошибкой.
  applicability:
    when:
    - Есть фильтрация списков с операторами.
    skip_when:
    - Фильтров нет или только точное совпадение по одному полю.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация операторов фильтра
  - 'Real-world bug: RWB-0001'
- id: REST-FILTER-EQUIVALENT-FORMS
  status: approved
  title: Логически эквивалентные формы фильтра дают одинаковый ответ
  category: pagination
  protocols:
  - rest
  - graphql
  kind: positive
  priority: P3
  tags:
  - positive
  - filtering
  - data-integrity
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Фильтр поддерживает логические операторы ($and, $or) и условия по связанным сущностям.
  steps:
  - action: Выполнить один и тот же фильтр (в том числе по связи) в плоской форме и обёрнутым в $and/$or разной глубины вложенности.
  - action: Сравнить состав выборки и заполненность связанных полей.
  - action: Записать условие диапазона по полю связанной коллекции как _and внутри поля и сравнить ответ с _and на верхнем
      уровне
    notes: 'Real-world bug: RWB-0002 (directus/directus#24367)'
  - action: Передать в query-строке фильтр с вложенностью групп $and/$or глубже лимита разбора query-параметров и сравнить
      с той же формой в теле запроса
    notes: 'Real-world bug: RWB-0002 (directus/directus#24190)'
  - action: Передать параметры чтения (version, fields) в теле запроса SEARCH и сравнить ответ с тем же запросом GET с query-строкой
    notes: 'Real-world bug: RWB-0002 (directus/directus#24038)'
  - action: Отправить PATCH/DELETE с ограничением через заголовок Range вместо limit/offset, с order и без него, и сравнить
      с ответами для limit/offset
    notes: 'Real-world bug: RWB-0002 (PostgREST/postgrest#2705)'
  expected:
  - Состав и содержимое ответа одинаковы во всех эквивалентных формах.
  applicability:
    when:
    - Фильтр поддерживает вложенные логические выражения.
    skip_when:
    - Только плоские фильтры.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - Здравый смысл — эквивалентные выражения дают одинаковый результат
  - 'Real-world bug: RWB-0002'
- id: REST-FILTER-RELATION-NO-DUPLICATES
  status: approved
  title: Фильтр по полю связанной коллекции возвращает каждую запись один раз
  category: pagination
  protocols:
  - rest
  - graphql
  kind: boundary
  priority: P2
  tags:
  - boundary
  - pagination
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Список поддерживает фильтр по полям связанной коллекции (один-ко-многим).
  steps:
  - action: Создать запись с несколькими связанными элементами, каждый из которых подходит под фильтр; запросить список с
      этим фильтром.
  - action: Повторить с фильтром внутри _or/_and и вместе с пагинацией и подсчётом total.
  expected:
  - Каждая подходящая запись в выдаче ровно один раз; total и страницы согласованы с выдачей.
  applicability:
    when:
    - Есть фильтр по связям.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Здравый смысл — фильтр не размножает записи (JOIN без DISTINCT/EXISTS)
  - 'Real-world bug: RWB-0212'
- id: REST-FILTER-OPERATION-PARITY
  status: approved
  title: Один фильтр даёт согласованный результат в списке, агрегации и вложенной выборке
  category: pagination
  protocols:
  - rest
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - filtering
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Фильтр поддерживается в нескольких операциях — список, агрегация (count, group by), вложенная выборка (deep), экспорт.
  steps:
  - action: Применить один и тот же фильтр (по обычному полю, по связи, по полиморфной связи, на нескольких уровнях вложенности)
      в каждой операции.
  - action: Сравнить счётчики агрегатов (дашборд) с totalCount списков с теми же фильтрами
    notes: inbox №30
  expected:
  - Фильтр принимается во всех операциях; результаты согласованы (count = числу записей списка, deep — те же записи).
  applicability:
    when:
    - Фильтр есть больше чем в одной операции.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Смежная — REST-FILTER-EQUIVALENT-FORMS (формы записи фильтра)
  - 'Real-world bug: RWB-0251'
- id: REST-ALIASED-EMBED-FILTER-INDEPENDENCE
  status: approved
  title: Вложения одного ресурса под разными алиасами фильтруются независимо
  category: pagination
  protocols:
  - rest
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - filtering
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - API поддерживает вложение связанного ресурса несколько раз под разными алиасами со своими фильтрами (REST-вложения, алиасы
    GraphQL).
  steps:
  - action: Запросить ресурс с двумя вложениями одного связанного ресурса под разными алиасами и разными фильтрами; сравнить
      каждое с отдельным запросом с его фильтром.
  expected:
  - Каждое вложение содержит ровно записи по своему фильтру.
  applicability:
    when:
    - Есть алиасы вложений.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - Смежные — REST-FILTER-SORT-COMPOSITION, REST-FILTER-OPERATION-PARITY
  - 'Real-world bug: RWB-0327'
- id: REST-FILTER-UNSELECTED-FIELD
  status: approved
  title: Фильтр по полю, не входящему в выбор полей, работает
  category: pagination
  protocols:
  - rest
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - filtering
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть выбор полей ответа (select, fields, sparse fieldsets) и фильтры.
  steps:
  - action: Для таблицы, представления и результата функции запросить select без поля фильтра с простым, логическим и вложенным
      фильтром по этому полю.
  expected:
  - 200, отфильтрованные записи; в ответе только выбранные поля.
  applicability:
    when:
    - Есть выбор полей и фильтры.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Смежная — CONTRACT-FIELD-SELECTION
  - 'Real-world bug: RWB-0328'
- id: REST-FILTER-NAME-COLLISION
  status: approved
  title: Фильтр по полю с именем вложенного ресурса применяется к полю
  category: pagination
  protocols:
  - rest
  kind: contract
  priority: P3
  tags:
  - contract
  - filtering
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Имя поля (например, внешнего ключа) совпадает с именем вложенного ресурса или связи.
  steps:
  - action: Запросить коллекцию с вложением по этому имени и фильтром eq по полю; повторить с переименованным вложением.
  expected:
  - 200, фильтр применён к значению поля; синтаксис фильтра вложения однозначен.
  applicability:
    when:
    - Есть вложения с совпадающими именами.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: low
  references:
  - Смежная — REST-FILTER-OPERATOR-TYPE-MATRIX
  - 'Real-world bug: RWB-0329'
