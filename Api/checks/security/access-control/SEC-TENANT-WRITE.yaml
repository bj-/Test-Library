checks:
- id: SEC-TENANT-WRITE
  status: approved
  title: Tenant A cannot mutate tenant B data
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Multi-tenant model and mutable tenant-scoped resource.
  steps:
  - action: From tenant A, attempt to update or delete a tenant B resource.
    notes: 'Matrix axis: Tenant isolation; scenario: Cross-tenant mutation. Use isolated synthetic identities and data.'
  - action: Окружения внутри проекта как граница изоляции; действия-команды (cancel) против чтения
    notes: 'Real-world bug: RWB-0159 (GHSA-4672-hwv6-gq62)'
  - action: Вызвать gRPC-методы служебного сервиса (метки, отписка воркера) с ID объекта другого тенанта в теле и проверить
      PERMISSION_DENIED или NOT_FOUND
    notes: 'Real-world bug: RWB-0159 (GHSA-8x7x-83cf-c3pg)'
  - action: Удалить через эндпоинт действия в отчёте запись другого арендатора по её глобальному ID
    notes: 'Real-world bug: RWB-0159 (GHSA-35cr-9hqq-p2mg)'
  - action: Выполнить переупорядочивание (reorder) с ID записей другого арендатора
    notes: 'Real-world bug: RWB-0159 (GHSA-vgmv-8xjc-6rch)'
  expected:
  - Request is denied and tenant B persisted data is unchanged.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Multi-tenant model and mutable tenant-scoped resource.
    skip_when:
    - Resource is explicitly shared with cross-tenant write permission.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0159'
