checks:
- id: REST-VALIDATION-ATOMICITY
  status: approved
  title: Атомарность ошибки валидации
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - negative
  - reliability
  - contract
  - rest
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: 'Добавить проверку после сохранения файла (тип, размер > 2 ГиБ): ошибка не должна оставлять ресурс'
    notes: 'Real-world bug: RWB-0141 (strapi/strapi#26674)'
  expected:
  - при ошибке не сохраняются частичные изменения, если контракт обещает атомарность
  applicability:
    when:
    - операция изменяет состояние; ожидается атомарность
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0141'
