- id: ASYNC-JOB-LIFECYCLE
  status: approved
  title: Фоновая задача проходит статусы и отдаёт результат
  category: async
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: positive
  priority: P2
  tags:
  - positive
  - async-jobs
  - ci
  - regression
  - nightly
  preconditions:
  - Есть асинхронные задачи.
  steps:
  - action: Создать задачу, опрашивать статус до завершения, получить результат; задачу с ошибкой.
  expected:
  - Статусы соответствуют контракту; ошибка содержит причину; результат доступен в течение срока хранения.
  applicability:
    when:
    - Есть задачи.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: ASYNC-JOB-CANCEL
  status: approved
  title: Отмена фоновой задачи останавливает её и не оставляет частичных эффектов
  category: async
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: negative
  priority: P3
  tags:
  - negative
  - async-jobs
  - data-integrity
  - regression
  - nightly
  preconditions:
  - Задачи можно отменять.
  steps:
