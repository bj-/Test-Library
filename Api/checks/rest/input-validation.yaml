  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: VAL-MALFORMED-JSON
  status: approved
  title: Синтаксически некорректный JSON отклоняется
