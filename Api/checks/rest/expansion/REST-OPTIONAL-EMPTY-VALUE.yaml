checks:
- id: REST-OPTIONAL-EMPTY-VALUE
  title: Отсутствующий и пустой параметр
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: boundary
  priority: P2
  tags:
  - boundary
  - validation
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - отсутствие, пустая и пробельная строка имеют определённую семантику
  applicability:
    when:
    - параметр необязательный
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
