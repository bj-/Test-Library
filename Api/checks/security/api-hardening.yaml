- id: SEC-FAIL-CLOSED-INPUT
  status: draft
  title: Неожиданный тип, пустое или отсутствующее поле проверки безопасности ведёт к отказу, а не к пропуску проверки
  category: security
  protocols:
  - generic
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authz
  - validation
  - hardening
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Поле запроса или токена участвует в проверке доступа или политики (claim, scope, client_id, role, тип аутентификатора,
    алгоритм).
  steps:
  - action: Подставить в каждое такое поле значение другого JSON-типа — число, boolean, объект, массив.
  - action: Отправить запрос без поля, с пустой строкой и с null при настроенной политике.
  - action: Выполнить операцию, которую поле должно ограничивать.
  - action: Запросить защищённый ресурс без подписи по каждому маршруту, где идентификатор ресурса стоит в другом сегменте
      пути, и проверить отказ
    notes: 'Real-world bug: RWB-0006 (GHSA-h4pc-58cc-hc95)'
  - action: Передать идентификатор защищённого ресурса в неканонической форме (пробел в конце, вариант с диакритикой, другой
      регистр) без учётных данных и проверить отказ
    notes: 'Real-world bug: RWB-0006 (GHSA-4w3q-qpfq-v992)'
  - action: Выполнить вход с существующим логином и пустым или null паролем
    notes: 'Real-world bug: RWB-0006 (GHSA-jrv5-8w28-4265)'
  - action: Отправить cookie сессии в незащищённом формате (без шифрования и подписи) и проверить, что она отклоняется
    notes: 'Real-world bug: RWB-0006 (GHSA-33qg-7wpp-89cq)'
  expected:
  - Запрос отклоняется (400/401/403); проверка не пропускается.
  - Значение не копируется в выдаваемые токены и ответы.
  applicability:
    when:
    - Политики или проверки доступа опираются на данные клиента.
    skip_when:
    - Решение о доступе не зависит от входных полей.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Top 10:2025 A10 (fail-open при исключительных условиях)
  - CWE-636
  - 'Real-world bug: RWB-0006'
- id: HARD-SLOW-CLIENT-LIMITS
  status: draft
  title: Медленные и неполные запросы и непрочитанные ответы не накапливаются без ограничения
  category: security
  protocols:
  - generic
  kind: security
  priority: P2
  tags:
  - security
  - hardening
  - resilience
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис принимает соединения (HTTP, WebSocket, TCP) от недоверенных клиентов; разрешены нагрузочные проверки стенда.
  steps:
  - action: Открыть много соединений, объявить длину сообщения и отправить его часть (slowloris).
  - action: Слать запросы, не читая ответы; наблюдать память и доступность для обычного клиента.
  - action: Подписаться на канал с подтверждением доставки, постоянно присылать одно и то же значение подтверждения и проверить,
      что очередь неподтверждённых сообщений ограничена
    notes: 'Real-world bug: RWB-0024 (GHSA-cqgj-h8vf-4w59)'
  - action: По HTTP/2 отправить заголовок фрейма с длиной больше объявленного SETTINGS_MAX_FRAME_SIZE, передавая payload медленно,
      и проверить закрытие соединения с FRAME_SIZE_ERROR сразу после заголовка
    notes: 'Real-world bug: RWB-0024 (GHSA-gq9p-f254-h286)'
  - action: По HTTP/2 непрерывно слать PING и SETTINGS, не читая ответные ACK, и проверить, что сервер ограничивает очередь
      и закрывает соединение
    notes: 'Real-world bug: RWB-0024 (GHSA-8f3q-3jmv-7prw)'
  - action: Отправить по одному соединению HTTP/1.1 поток конвейерных запросов, не читая ответы, и проверить, что сервер ограничивает
      очередь
    notes: 'Real-world bug: RWB-0024 (GHSA-q4f6-jm68-57ww)'
  - action: Отправить по HTTP/3 на многих потоках кадры зарезервированного типа с огромной заявленной длиной и частью данных
      и проверить, что память не растёт
    notes: 'Real-world bug: RWB-0024 (GHSA-hpcc-26xq-25fv)'
  - action: Отправить сигнатуру PROXY protocol v2 с недопустимым байтом версии и продолжать слать данные; проверить, что соединение
      закрывается
    notes: 'Real-world bug: RWB-0024 (GHSA-q6cq-mhr2-jmr5)'
  - action: Открыть по HTTP/3 много потоков со ссылками на неотправленные записи динамической таблицы QPACK и не досылать
      записи
    notes: 'Real-world bug: RWB-0024 (GHSA-4grm-h2qv-h6w6)'
  - action: Отправить начало TLS ClientHello с большой заявленной длиной и не досылать остальное
    notes: 'Real-world bug: RWB-0024 (GHSA-x4gw-5cx5-pgmh)'
  - action: Отправить при включённом PROXY protocol поток байтов без CRLF и проверить закрытие соединения
    notes: 'Real-world bug: RWB-0024 (GHSA-qpgp-93vx-g8v8)'
  expected:
  - Неполные сообщения и простаивающие соединения закрываются по таймауту; число соединений и буферы ограничены.
  - Обычные клиенты обслуживаются.
  applicability:
    when:
    - Публичный сервис.
    skip_when:
    - Нагрузочные проверки запрещены на стенде.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API4:2023
  - CWE-400
  - 'Real-world bug: RWB-0024'
- id: SEC-READONLY-MODE-ENFORCED
  status: draft
  title: Режим только для чтения запрещает изменения любым запросом, а не по первому ключевому слову
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: security
  priority: P1
  tags:
  - security
  - authz
  - injection
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Пользователь задаёт запросы сам (SQL, GraphQL, выражения) в режиме или с ролью только для чтения.
  steps:
  - action: Отправить запрос, начинающийся как чтение, но с побочным эффектом — функции с записью, составные запросы после
      комментария, изменение последовательностей.
  - action: Для GraphQL — mutation после незначащих символов (запятые, BOM, комментарии) или в документе с несколькими операциями.
  expected:
  - Любое изменение отклоняется; данные не меняются.
  - Тип операции определяется по AST или хранилищем (read-only транзакция), а не разбором текста.
  applicability:
    when:
    - Есть пользовательские запросы с режимом только чтения.
    skip_when:
    - Нет пользовательских запросов.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: critical
    likelihood: low
  references:
  - OWASP API5:2023
  - CWE-863
  - CWE-184
  - 'Real-world bug: RWB-0028'
- id: HARD-CLIENT-IP-TRUSTED-PROXIES
  status: draft
  title: IP клиента определяется по цепочке доверенных прокси одинаково на всех маршрутах
  category: security
  protocols:
  - rest
  kind: security
  priority: P2
  tags:
  - security
  - hardening
  - rate-limiting
  - audit
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис за обратными прокси; IP клиента используется в rate limit, аудите или allowlist.
  steps:
  - action: Отправить запросы с X-Forwarded-For из разного числа адресов (1, N, N+2, с поддельным первым).
  - action: Повторить на маршрутах разных модулей; посмотреть IP в ответе, журнале или срабатывании лимита.
  - action: Отправить X-Forwarded_For и X-Forwarded_Proto (с подчёркиванием) вместе с заголовками прокси и проверить, что
      значения прокси не перезаписаны
    notes: 'Real-world bug: RWB-0030 (GHSA-9hf4-67fc-4vf4)'
  expected:
  - Берётся адрес, добавленный последним доверенным прокси; поддельные левые записи игнорируются.
  - IP одинаков на всех маршрутах; адрес прокси не выдаётся за клиента.
  applicability:
    when:
    - Есть прокси и логика по IP.
    skip_when:
    - IP клиента не используется.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - RFC 7239
  - CWE-348
  - 'Real-world bug: RWB-0030'
- id: SEC-INTERNAL-CONTROL-PARAMS
  status: draft
  title: Заголовки и параметры подключения клиента не задают внутренние управляющие параметры операции
  category: security
  protocols:
  - rest
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - hardening
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис передаёт заголовки входящего запроса или параметры подключения (query, path WebSocket) во внутренний конвейер интеграции
    (маршрутизатор сообщений, клиент поиска, хранилища, DNS, внешней системы).
  steps:
  - action: Отправить заголовки с именами управляющих параметров внутренней операции без служебного префикса — запрос к хранилищу
      или поиску («всё», дорогой regex), тип операции (удаление), ID объекта, адрес исходящего запроса, адрес DNS-сервера,
      ключи объекта во внешней системе.
  - action: Подключиться по WebSocket с query- и path-параметрами, совпадающими по имени с внутренними заголовками, в том
      числе с адресом исходящего запроса на внутренний хост.
  - action: Повторить с префиксами параметров движка (параметры запроса к поиску, поля индексируемого документа).
  - action: Отправить на маршрут, отдаваемый через X-Sendfile/X-Accel-Redirect за прокси, заголовки X-Sendfile-Type и X-Accel-Mapping
      с подобранным отображением путей и проверить, что ответ и доступ к закрытым путям такие же, как без них
    notes: 'Real-world bug: RWB-0180 (GHSA-r657-rxjc-j557)'
  expected:
  - Внутренняя операция выполняется с настроенными параметрами; клиентские значения игнорируются или запрос отклоняется 4xx.
  - Исходящих запросов на заданные клиентом адреса нет; чужие объекты не читаются и не меняются.
  applicability:
    when:
    - Сервис построен на конвейере интеграции, который переносит заголовки запроса во внутренние сообщения.
    skip_when:
    - Внутренние операции не получают данных из заголовков и параметров подключения.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: critical
    likelihood: medium
  references:
  - CWE-15 (внешнее управление настройкой), CWE-918
  - Apache Camel — фильтр заголовков отсекает только служебный префикс
  - 'Real-world bug: RWB-0180'
- id: SEC-DISABLED-FEATURE-ENFORCED
  status: draft
  title: Отключённая настройкой функция недоступна через все API и не попадает в токены
  category: security
  protocols:
  - generic
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - authz
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Функцию (модуль, организации, интеграцию) можно отключить настройкой; у пользователя остались её данные.
  steps:
  - action: Отключить функцию и запросить её данные через все API, где они встречаются (профиль, аккаунт, списки, поиск).
  - action: Выпустить токен со scope этой функции и прочитать claims.
  - action: Выполнить операции функции напрямую по известным маршрутам.
  expected:
  - Данные отключённой функции не отдаются, операции отклоняются (403/404).
  - Scope и claims функции не попадают в токены.
  applicability:
    when:
    - Есть функции, отключаемые настройкой.
    skip_when:
    - Набор функций не настраивается.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Keycloak — данные организаций в API аккаунта и токенах после отключения функции
  - 'Real-world bug: RWB-0182'
- id: SEC-OPAQUE-ID-INTEGRITY
  status: draft
  title: Непрозрачный идентификатор, выданный сервером, проверяется на подлинность
  category: security
  protocols:
  - generic
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - hardening
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Идентификатор ресурса кодирует внутренние данные (список ресурсов, параметры) — сжатие, base64, сериализация.
  steps:
  - action: Раскодировать выданный ID, изменить содержимое (добавить исключённые или чужие ресурсы, внутренний адрес) и закодировать
      обратно.
  - action: Сформировать ID с большим коэффициентом распаковки и большое число уникальных ID подряд.
  expected:
  - Неподписанный, чужой или изменённый ID отклоняется 4xx до распаковки и обращения к ресурсам.
  - Память и кэш не растут от сфабрикованных ID.
  applicability:
    when:
    - Сервер выдаёт составные идентификаторы и принимает их обратно.
    skip_when:
    - ID — простые ключи без внутренней структуры.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - CWE-565, CWE-409
  - Связано с PAGE-CURSOR-TAMPERING (курсоры пагинации)
  - 'Real-world bug: RWB-0184'
- id: HARD-IP-ALLOWLIST
  status: draft
  title: Ограничение доступа по адресам и подсетям работает на границах для IPv4 и IPv6
  category: security
  protocols:
  - generic
  kind: boundary
  priority: P2
  tags:
  - security
  - negative
  - boundary
  - hardening
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Доступ (к API, административным операциям, токенам) ограничен списком адресов и подсетей.
  steps:
  - action: Отправить запросы с первого и последнего адреса разрешённой подсети и с соседних адресов вне её — для IPv4 и IPv6
      (разные длины префикса).
  - action: Повторить с IPv4-адресом в IPv6-записи (::ffff:a.b.c.d).
  expected:
  - Адреса внутри подсети проходят, адреса вне её получают отказ.
  applicability:
    when:
    - Есть ограничение по IP; стенд позволяет отправлять запросы с разных адресов (или доверенный прокси передаёт адрес).
    skip_when:
    - Ограничений по IP нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - Связано с HARD-CLIENT-IP-TRUSTED-PROXIES (определение адреса клиента)
  - 'Real-world bug: RWB-0188'
