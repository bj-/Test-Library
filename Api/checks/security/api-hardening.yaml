    impact: medium
    likelihood: medium
- id: HARD-BUSINESS-FLOW-AUTOMATION
  status: approved
  title: Чувствительные бизнес-потоки защищены от автоматизированного злоупотребления
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - business-logic
  - rate-limiting
  - costly
  - regression
  - nightly
  preconditions:
