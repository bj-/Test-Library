- id: GQL-INTROSPECTION
  status: approved
  title: Introspection отключён или ограничен в продуктиве
  category: graphql
  protocols:
  - graphql
  kind: security
  priority: P2
  tags:
  - security
  - hardening
  - ci
  - regression
  - nightly
  preconditions:
  - GraphQL API.
  steps:
  - action: Выполнить запрос __schema без аутентификации и с ролью пользователя.
  expected:
  - Introspection недоступен публично по политике.
  applicability:
    when:
    - Всегда для GraphQL.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
