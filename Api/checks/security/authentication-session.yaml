  steps:
  - action: Использовать токен дважды, после истечения, для другого пользователя; запросить два токена и использовать первый.
  - action: Отправить запрос сброса пароля с параметром URL ссылки на чужой домен и проверить, что письмо ведёт только на
      настроенный домен, а вход по токену требует второй фактор
    notes: 'Real-world bug: RWB-0307 (GHSA-h854-c3m3-mh5v)'
  - action: Запросить сброс пароля и подтверждение email с адресом, который сервер сопоставляет с пользователем, но дословно
      отличается от сохранённого, и проверить, что письмо уходит только на сохранённый адрес
    notes: 'Real-world bug: RWB-0307 (GHSA-x3vp-85cm-q97r)'
  expected:
  - Все варианты отклоняются.
  - Токен не возвращается в ответе API и не попадает в Referer.
  applicability:
    when:
    - Есть сброс пароля.
    skip_when:
    - Нет.
  automation:
    level: full
