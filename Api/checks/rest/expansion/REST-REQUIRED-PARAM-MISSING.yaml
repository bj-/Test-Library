checks:
- id: REST-REQUIRED-PARAM-MISSING
  status: approved
  title: Отсутствует обязательный параметр
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - validation
  - boundary
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Отсутствуют все поля сразу - пустой POST и GET на URL действия формы; ответ должен быть валидационным, а не общей
      ошибкой
    notes: 'Real-world bug: RWB-0131 (keycloak/keycloak#52076)'
  - action: Прогон по всем эндпоинтам, включая сгенерированные/унаследованные, где валидация может быть молча отключена
    notes: 'Real-world bug: RWB-0131 (nestjs/nest#5688)'
  - action: Создать ресурс без поля, помеченного в контракте обязательным, и проверить, что сервер отклоняет запрос, а не
      подставляет значение по умолчанию молча
    notes: 'Real-world bug: RWB-0131 (kubernetes/kubernetes#130896)'
  - action: Опустить обязательный вложенный объект целиком и проверить, что ошибка называет его отсутствие, а не несовпадение
      его полей с полями родителя
    notes: 'Real-world bug: RWB-0131 (kubernetes/kubernetes#127403)'
  expected:
  - пропуск каждого обязательного параметра даёт контролируемую ошибку
  applicability:
    when:
    - есть обязательные параметры
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0131'
