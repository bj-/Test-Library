    notes: inbox №487
  expected:
  - Показан экран обновления по требованиям (обязательное - без возможности закрыть) с рабочей ссылкой
    в магазин приложений; ошибок работы со старым API нет.
  applicability:
    when:
    - Предусмотрено принудительное обновление.
