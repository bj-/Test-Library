- id: GQL-EQUIVALENT-SELECTION-FORMS
  status: draft
  title: Эквивалентные формы выбора полей GraphQL дают одинаковые данные
  category: graphql
  protocols:
  - graphql
  kind: positive
  priority: P3
  tags:
  - positive
  - contract
  - data-integrity
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Схема с union или interface, полями-связями и аргументами вложенных полей.
  steps:
  - action: Запросить одни поля напрямую, через inline-фрагмент, через именованный фрагмент и под алиасом (в том числе два
      алиаса одного поля с разными аргументами) на разной глубине.
  - action: Выполнить один вложенный фильтр связи в запросе по id и в запросе списка.
  - action: Повторить запрос с аргументом filter по полю связанной коллекции, запросив поле связи под алиасом
    notes: 'Real-world bug: RWB-0014 (directus/directus#26133)'
  - action: Запросить поле типа union через фрагмент на член union, внутри которого фрагмент на сам union с фрагментами на
      каждый член, и сравнить с плоской формой
    notes: 'Real-world bug: RWB-0014 (apollographql/apollo-server#3983)'
  - action: Запросить поле конкретного типа через inline-фрагмент на реализуемый им интерфейс и сравнить с прямым выбором
      поля
    notes: 'Real-world bug: RWB-0014 (apollographql/apollo-server#3253)'
  expected:
  - Значения одинаковы во всех формах; оба запроса с вложенным фильтром успешны и одинаково отфильтрованы.
  applicability:
    when:
    - GraphQL API.
    skip_when:
    - Нет GraphQL.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - GraphQL spec §5.5 (Fragments)
  - Field Alias
  - 'Real-world bug: RWB-0014'
- id: GQL-REST-ENDPOINT-PARITY
  status: draft
  title: Операция, опубликованная как REST-эндпоинт, выполняется так же, как исходный GraphQL-запрос
  category: graphql
  protocols:
  - graphql
  - rest
  kind: contract
  priority: P2
  tags:
  - contract
  - graphql
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - GraphQL-операции публикуются как REST-эндпоинты (RESTified endpoints, persisted queries по URL).
  steps:
  - action: Выполнить одну и ту же операцию (запрос и мутацию) через GraphQL и через REST-эндпоинт с одинаковыми переменными
      и правами.
  - action: При внешнем хуке аутентификации (webhook) сравнить заголовки и тело, которые хук получает в обоих случаях.
  expected:
  - Результат, ошибки и побочные эффекты совпадают.
  - Хук аутентификации получает тот же контекст (заголовки, тело запроса), что и для GraphQL.
  applicability:
    when:
    - Есть REST-публикация GraphQL-операций.
    skip_when:
    - Нет такой публикации.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Здравый смысл — один и тот же запрос через разные входы даёт одинаковый результат
  - 'Real-world bug: RWB-0207'
- id: GQL-GATEWAY-ROUTING
  status: draft
  title: В объединённой схеме каждое поле направляется в свой upstream
  category: graphql
  protocols:
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - graphql
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Схема собрана из нескольких источников (remote schemas, федерация, stitching).
  steps:
  - action: Подключить два источника с одинаковыми именами типов, различающиеся только префиксом (namespace), и запросить
      поля каждого из них в одном и в разных запросах.
  - action: Проверить по журналам или ответам upstream, какой источник обработал каждое поле.
  - action: В объединённой схеме выбрать поле общего типа-значения, объявленного в нескольких подграфах, у сущностей разных
      подграфов — данные возвращаются без ошибок
    notes: 'Real-world bug: RWB-0211 (apollographql/apollo-server#3141)'
  expected:
  - Каждое поле обработано своим источником; данные источников не смешиваются и не подменяются.
  applicability:
    when:
    - Есть объединение схем.
    skip_when:
    - Один источник.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - GraphQL Federation spec
  - 'Real-world bug: RWB-0211'
- id: GQL-ERROR-EXTENSIONS-SHAPE
  status: draft
  title: Поля extensions ошибки GraphQL не дублируются во вложенных объектах
  category: graphql
  protocols:
  - graphql
  kind: contract
  priority: P3
  tags:
  - contract
  - graphql
  - error-handling
  - real-world-bug
  - regression
  preconditions:
  - Ошибки GraphQL содержат extensions (code и пользовательские поля).
  steps:
  - action: Вызвать ошибку с пользовательскими полями extensions и сравнить ключи errors[].extensions и вложенных объектов
      (exception, originalError).
  expected:
  - Каждое поле extensions присутствует в одном месте по документированной структуре; нежелательных копий во вложенных объектах
    нет.
  applicability:
    when:
    - Есть GraphQL с extensions ошибок.
    skip_when:
    - Нет GraphQL.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: low
    likelihood: medium
  references:
  - GraphQL spec §7.1.2 (Errors)
  - Смежная — GQL-ERRORS-NO-LEAK
  - 'Real-world bug: RWB-0316'
