    impact: high
    likelihood: medium
- id: FILE-ARCHIVE-BOMB
  status: approved
  title: Архивные и графические бомбы не исчерпывают ресурсы
  category: files
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - files
  - security
  - costly
  - regression
  - nightly
  preconditions:
  - Сервер распаковывает архивы или обрабатывает изображения.
  steps:
  - action: Загрузить zip-бомбу, архив с path traversal в именах, изображение 50000x50000 пикселей.
  expected:
  - Обработка ограничена по размеру и времени; файлы не пишутся вне каталога.
  applicability:
    when:
    - Есть распаковка или обработка изображений.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
- id: FILE-EMPTY-AND-MALFORMED-MULTIPART
