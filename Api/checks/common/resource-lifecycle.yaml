  expected:
  - Порядок детей у родителя прежний.
  applicability:
    when:
    - Есть ручной порядок связей.
    skip_when:
    - Порядок связей не хранится.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - Здравый смысл
  - 'Real-world bug: RWB-0016'
- id: RES-LARGE-RELATION-SET
  status: draft
  title: Тысячи связанных объектов не дают 5xx из-за лимитов СУБД на параметры запроса
  category: resources
  protocols:
  - rest
  kind: boundary
  priority: P3
  tags:
  - boundary
  - reliability
  - error-handling
  - costly
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - У объекта могут быть тысячи связей (члены группы, составные роли, теги).
  steps:
  - action: Создать больше 2100 связей и выполнить чтение и изменение, использующие их; по возможности на всех поддерживаемых
      СУБД.
  expected:
  - Операции успешны (сервер разбивает выборку) или документированный лимит с 4xx; 5xx нет.
  applicability:
    when:
    - Есть связи «многие ко многим» без жёсткого лимита.
    skip_when:
    - Число связей ограничено контрактом.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - Лимиты СУБД — MSSQL 2100 параметров
  - Oracle 1000 в IN; CWE-770
  - 'Real-world bug: RWB-0022'
- id: RES-CACHE-KEY-COMPLETENESS
  status: draft
  title: Серверный кэш различает ответы по всем значимым параметрам и по типу ресурса
  category: resources
  protocols:
  - rest
  kind: positive
  priority: P2
  tags:
  - positive
  - caching
  - data-integrity
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервер кэширует ответы GET или объекты по id.
  steps:
  - action: Выполнить GET с одним значением query-параметра, затем с другим; сравнить ответы и признак кэша.
  - action: Создать ресурсы двух типов с одинаковым id, прочитать каждый дважды, сравнить с данными без кэша.
  - action: Удалить и пересоздать учётную запись с тем же именем, запросить токен и проверить, что кэш выдаёт новый токен,
      а не токен прежней учётки
    notes: 'Real-world bug: RWB-0023 (kubernetes/kubernetes#132802)'
  expected:
