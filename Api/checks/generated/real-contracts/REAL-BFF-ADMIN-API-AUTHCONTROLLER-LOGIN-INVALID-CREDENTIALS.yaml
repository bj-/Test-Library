checks:
- id: REAL-BFF-ADMIN-API-AUTHCONTROLLER-LOGIN-INVALID-CREDENTIALS
  title: Login rejects invalid credentials
  description: Кандидат сгенерирован по реальному OpenAPI-контракту. Политику доступа и тестовые данные подтвердить
    перед исполнением.
  category: security
  protocols:
  - rest
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authn
  - smoke
  - ci
  - regression
  - release
  preconditions:
  - Test account exists with known test password
  steps:
  - action: 'Подготовить тестовые данные для POST /api/auth/login; сценарий: invalid-credentials.'
    data:
      operationId: AuthController_login
      method: POST
      path: /api/auth/login
      dimension: authentication
  - action: Отправить POST запрос на /api/auth/login с заданными credentials/ролью/ресурсом.
    notes: Assert documented response shape; do not assert rate limiting unless configured.
  expected:
  - Invalid credentials are rejected without creating a session.
  - При отказе защищённые данные не раскрываются, а запрещённая мутация не меняет состояние.
  applicability:
    when:
    - 'Операция присутствует в OpenAPI: POST /api/auth/login'
    - Политика для измерения authentication подтверждена
    skip_when:
    - Политика явно помечена как неприменимая к операции
  automation:
    level: partial
    deterministic: true
    notes: Требуется привязка fixtures и фактического transport/client.
  profiles:
  - Smoke
  - CI
  - Regression
  - Release
  risk:
    impact: high
    likelihood: high
  references:
  - OpenAPI operationId=AuthController_login
  - 'Contract: bff-admin-api'
