# Стоп-темы генерации ассистентом (ADR 0008): записи с такими темами получают automation.ai_generation.restricted.
# Подбор кандидатов - `python tools/restrict_records.py --suggest` (по id, заголовку и меткам; печатает только id),
# решение о флаге - человек (`--flag ID ...`). Здесь - только нейтральные слова-признаки, без сценариев.
# Пополняется при каждой новой остановке генерации фильтром безопасности (тема - сюда, запись - под флаг).
reason: >-
  Генерацию подробных сценариев по записи останавливает фильтр безопасности ассистента (Claude), даже для
  авторизованного тестирования своего стенда
topics:
  - id: credential-guessing
    title: Подбор и перебор учётных данных
    match: ['BRUTE', 'brute', 'перебор', 'подбор', 'ATTEMPT-LIMIT', 'попыт', 'credential-stuffing', 'lockout', 'блокировк']
  - id: account-enumeration
    title: Перечисление учёток
    match: ['ENUMERATION', 'enumeration', 'перечислен', 'существование аккаунта', 'существование учёт']
  - id: command-template-injection-values
    title: Готовые значения инъекций команд ОС, шаблонов и NoSQL (перенос в словарь ADR 0009)
    noted: '2026-10-21: сессия сбора inj-a (INJ-NOSQL, INJ-OS-COMMAND, INJ-TEMPLATE-SSTI) остановлена на переносе значений; сбор - другой моделью (Process/test-data.md, раздел 3)'
    match: ['OS-COMMAND', 'TEMPLATE-SSTI', 'NOSQL']
  - id: mobile-login-valid-token
    title: Вход и сессии мобильного приложения - получение валидного токена для тестов на стенде
    noted: >-
      2026-10-21 - остановлена генерация BFF-Mobile-Auth; 2026-10-23 - остановлена основная сессия (Opus 5.5) при разборе
      способов получить токен на dev. Дочерняя сессия child (Opus 4.8) по той же теме не останавливалась
    blocks: main                      # останавливает основную модель; работу ведёт исполнитель child (security-groups.yaml)
    match: []                         # записи под флаг не уводит: группа sg-token остаётся у child (решение bj 2026-10-23)
