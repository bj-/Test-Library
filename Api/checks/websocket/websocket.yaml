checks:
- id: WS-HANDSHAKE-AUTH
  status: approved
  title: Установление соединения требует аутентификации
  category: websocket
  protocols:
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - authn
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - WebSocket API.
  steps:
  - action: Подключиться без токена, с невалидным и истёкшим токеном.
  - action: Служебные namespace и секреты по умолчанию
    notes: 'Real-world bug: RWB-0177 (GHSA-gg6r-gp4c-89hp)'
  expected:
  - Handshake отклоняется или соединение закрывается до передачи данных.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Публичный канал (зафиксировать).
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0177'
- id: WS-ORIGIN-CHECK
  status: approved
  title: Проверка Origin защищает от cross-site WebSocket hijacking
  category: websocket
  protocols:
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - session
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Cookie-аутентификация.
  steps:
  - action: Подключиться с чужим Origin, используя cookie жертвы.
  - action: Отправить upgrade на путь WebSocket с процентно-закодированными символами (/%61pi/events) и чужим Origin и проверить
      отказ
    notes: 'Real-world bug: RWB-0300 (GHSA-8r62-w5wh-fc5m)'
  expected:
  - Соединение отклоняется.
  applicability:
    when:
    - Cookie-аутентификация.
    skip_when:
    - Токен в первом сообщении.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0300'
- id: WS-SUBSCRIPTION-AUTHZ
  status: approved
  title: Подписки и сообщения авторизуются по каждому каналу
  category: websocket
  protocols:
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - authz
  - ownership
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Каналы на уровне пользователей и тенантов.
  steps:
  - action: Подписаться на канал другого пользователя или тенанта; отправить сообщение в чужой канал.
  - action: Перебор всех типов действий протокола (включая пакетные PATCH_MULTI и аналоги) — действие без явного правила должно
      запрещаться
    notes: 'Real-world bug: RWB-0179 (GHSA-89vx-jh4q-vg3w)'
  - action: Подписаться на поток событий пользователем с ограничивающим фильтром и проверить фильтрацию каждого типа сообщений
      потока
    notes: 'Real-world bug: RWB-0179 (GHSA-xcw9-qmmf-vqxj)'
  - action: Держать открытым WebSocket-соединение ролью читателя, изменить недоступный ему объект от другого пользователя
      и проверить, что событие с его содержимым не приходит
    notes: 'Real-world bug: RWB-0179 (GHSA-mw8r-mw84-88v2)'
  expected:
  - Подписка и отправка отклоняются.
  applicability:
    when:
    - Есть каналы.
    skip_when:
    - Один общий канал.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0179'
- id: WS-TOKEN-EXPIRY
  status: approved
  title: Истечение или отзыв токена учитывается в открытом соединении
  category: websocket
  protocols:
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - token-lifecycle
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Долгие соединения.
  steps:
  - action: Держать соединение дольше срока жизни токена; отозвать токен.
  - action: Отозвать сессию и открыть новое WebSocket-соединение с токеном этой сессии — проверить отказ при аутентификации
    notes: 'Real-world bug: RWB-0301 (GHSA-4hv6-xc92-j86g)'
  expected:
  - Соединение закрывается или требует обновления токена.
  applicability:
    when:
    - Есть долгие соединения.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0301'
- id: WS-MESSAGE-LIMITS
  status: approved
  title: Размер и частота сообщений ограничены
  category: websocket
  protocols:
  - websocket
  kind: negative
  priority: P2
  tags:
  - negative
  - rate-limiting
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Нет.
  steps:
  - action: Отправить сообщение 10MB и 1000 сообщений в секунду.
  - action: Отправить сообщение из множества мелких кадров продолжения без FIN и проверить, что суммарный размер ограничен
    notes: 'Real-world bug: RWB-0205 (GHSA-7ppr-r889-mcf2)'
  - action: Отправить сообщение permessage-deflate, которое меньше лимита в сжатом виде и больше — после распаковки
    notes: 'Real-world bug: RWB-0205 (GHSA-33ph-fccm-39pj)'
  - action: Отправить кадр с бесконечным полем длины (байты ≥0x80) и проверить закрытие соединения
    notes: 'Real-world bug: RWB-0205 (GHSA-ghhp-3qvg-889p)'
  - action: Открыть много WebSocket-соединений с одного IP и подписаться на неограниченный список объектов, проверить лимиты
      соединений и размера подписки
    notes: 'Real-world bug: RWB-0205 (GHSA-4fwh-wrm6-97xm)'
  expected:
  - Соединение закрывается с кодом 1009/1008 или сообщения отклоняются.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0205'
- id: WS-MALFORMED-MESSAGE
  status: approved
  title: Некорректные сообщения не рвут соединение без ответа
  category: websocket
  protocols:
  - websocket
  kind: negative
  priority: P2
  tags:
  - negative
  - validation
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Нет.
  steps:
  - action: Отправить невалидный JSON, неизвестный тип, бинарный кадр вместо текстового.
  - action: Синтаксически корректное сообщение с невалидной по схеме нагрузкой
    notes: 'Real-world bug: RWB-0178 (nestjs/nest#3127)'
  - action: Отправить сообщение подписки с необязательным полем, равным null, и сравнить с ответами при отсутствующем поле
      и пустом объекте
    notes: 'Real-world bug: RWB-0178 (directus/directus#24147)'
  expected:
  - Ответ-ошибка по протоколу или закрытие с кодом; сервер стабилен.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0178'
- id: WS-RECONNECT-RESUME
  status: approved
  title: Переподключение восстанавливает подписки без потери и дублей сверх контракта
  category: websocket
  protocols:
  - websocket
  kind: reliability
  priority: P3
  tags:
  - streaming
  - resilience
  - regression
  - nightly
  preconditions:
  - Протокол поддерживает resume.
  steps:
  - action: Разорвать соединение и переподключиться с last event id.
  expected:
  - Пропущенные события доставлены, дубли распознаваемы.
  applicability:
    when:
    - Есть resume.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: WS-SLOW-CONSUMER-NO-SILENT-LOSS
  status: approved
  title: Медленный клиент подписки не теряет сообщения молча
  category: websocket
  protocols:
  - websocket
  - graphql
  kind: reliability
  priority: P2
  tags:
  - reliability
  - websocket
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть подписки или поток событий по WebSocket.
  steps:
  - action: Подписаться и не читать сокет (или читать медленно), пока сервер генерирует поток событий больше буфера отправки.
  - action: Возобновить чтение и сверить полученные события с отправленными.
  expected:
  - Клиент получает все события, либо сервер явно сообщает о потере (ошибка, закрытие с кодом, маркер пропуска).
  - Сервер не копит память без предела.
  applicability:
    when:
    - Есть подписки.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - RFC 6455
  - 'Real-world bug: RWB-0209'
- id: WS-SUBSCRIPTION-EVENTS-DELIVERED
  status: approved
  title: Подписка получает события создания, изменения и удаления
  category: websocket
  protocols:
  - websocket
  - graphql
  kind: positive
  priority: P2
  tags:
  - positive
  - websocket
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть подписки на изменения коллекций или ресурсов.
  steps:
  - action: Подписаться на коллекцию (в том числе системную, если доступна) и дождаться подтверждения.
  - action: Создать, изменить и удалить запись через API, в том числе пакетной операцией.
  expected:
  - Подписчик получает события create, update и delete с данными записи.
  applicability:
    when:
    - Есть подписки.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Смежные — WS-SUBSCRIPTION-AUTHZ, WS-RECONNECT-RESUME
  - 'Real-world bug: RWB-0255'
- id: WS-MULTIPLE-ENDPOINTS-INDEPENDENT
  status: approved
  title: Несколько WebSocket-эндпоинтов на разных путях работают независимо
  category: websocket
  protocols:
  - websocket
  kind: reliability
  priority: P3
  tags:
  - reliability
  - websocket
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервер поддерживает несколько WebSocket-эндпоинтов (realtime, GraphQL subscriptions, журналы, служебные).
  steps:
  - action: Включить все эндпоинты; подключиться к каждому, пройти аутентификацию и обменяться сообщениями — по отдельности
      и одновременно.
  expected:
  - Рукопожатие, подтверждение аутентификации и сообщения на каждом пути работают так же, как при одном включённом.
  applicability:
    when:
    - Больше одного WebSocket-эндпоинта.
    skip_when:
    - Один эндпоинт.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - Смежная — WS-HANDSHAKE-AUTH
  - 'Real-world bug: RWB-0261'
