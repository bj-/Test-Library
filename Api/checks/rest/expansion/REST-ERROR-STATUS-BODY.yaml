checks:
- id: REST-ERROR-STATUS-BODY
  status: approved
  title: Согласованность статуса и тела ошибки
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - contract
  - negative
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Вызвать операцию, превышающую лимит временных файлов БД, и проверить 500 без Retry-After, а не 503
    notes: 'Real-world bug: RWB-0339 (PostgREST/postgrest#3257)'
  - action: Запросить представление с бесконечной рекурсией в определении и проверить 500, а не 400
    notes: 'Real-world bug: RWB-0339 (PostgREST/postgrest#3256)'
  - action: Вызвать небольшую вставку, приводящую к рекурсии триггера на сервере, и проверить 500, а не 413
    notes: 'Real-world bug: RWB-0339 (PostgREST/postgrest#3255)'
  - action: Запросить встраивание несуществующей связи и проверить, что подсказка в ошибке описывает выполненный поиск, а
      не предлагает перезагрузить кэш
    notes: 'Real-world bug: RWB-0339 (PostgREST/postgrest#2569)'
  expected:
  - HTTP status и machine-readable code не противоречат друг другу
  applicability:
    when:
    - описаны error responses
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0339'
