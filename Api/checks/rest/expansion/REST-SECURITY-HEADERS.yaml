checks:
- id: REST-SECURITY-HEADERS
  status: approved
  title: Защитные HTTP-заголовки
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: positive
  priority: P2
  tags:
  - security
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Проверять наличие заголовков и других следов глобальных middleware на всех группах маршрутов, включая исключённые
      из глобального префикса и служебные
    notes: 'Real-world bug: RWB-0132 (nestjs/nest#13401)'
  - action: Проверять заголовки и другие следы middleware во всех версиях API (вместе с вариантом про исключения из глобального
      префикса)
    notes: 'Real-world bug: RWB-0132 (nestjs/nest#13093)'
  - action: Регистрация middleware шаблоном на все маршруты и под альтернативным HTTP-сервером
    notes: 'Real-world bug: RWB-0132 (nestjs/nest#972)'
  expected:
  - обязательные заголовки присутствуют и согласованы с политикой
  applicability:
    when:
    - определён baseline заголовков
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0132'
