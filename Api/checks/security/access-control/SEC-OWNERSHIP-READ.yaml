checks:
- id: SEC-OWNERSHIP-READ
  status: approved
  title: User cannot read another owner’s resource
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - smoke
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Resource has owner-level access restrictions; users A and B and resource A exist.
  steps:
  - action: As user B, read a resource owned by user A by substituting its identifier.
    notes: 'Matrix axis: Resource ownership; scenario: Cross-owner read. Use isolated synthetic identities and data.'
  - action: Косвенное чтение через clone/copy/duplicate — права проверяются и на источник, а не только на место назначения
    notes: 'Real-world bug: RWB-0150 (GHSA-8xcj-9hfr-fh9j)'
  expected:
  - Deny or conceal the resource according to policy; response contains no owner data and no side effect occurs.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Resource has owner-level access restrictions; users A and B and resource A exist.
    skip_when:
    - Resource is public or shared with user B by an explicit grant.
  automation:
    level: full
    deterministic: true
  profiles:
  - Smoke
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0150'
