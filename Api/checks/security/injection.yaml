- id: INJ-PATH-TRAVERSAL
  status: approved
  title: Обход каталогов через параметры файлов и путей невозможен
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - files
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Параметр задаёт имя файла, путь, шаблон или ключ объекта в хранилище.
  steps:
  - action: Передать ../../etc/passwd, ..\..\windows\win.ini, %2e%2e%2f, двойное кодирование, абсолютные пути, null byte.
  - action: Директивы включения (include/snippets) в загружаемой разметке и её конфигурации
    notes: 'Real-world bug: RWB-0086 (GHSA-f7v3-xhm6-w245)'
  - action: Целевой путь переименования/перемещения (newPath) и соответствие операции требуемому праву (rename = delete)
    notes: 'Real-world bug: RWB-0086 (GHSA-9gfj-28hw-jchp)'
  expected:
  - Доступ только к разрешённым объектам.
  - Ответ не содержит содержимого системных файлов.
