  - webhooks
  - injection
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Пользователь задаёт URL вебхука.
  steps:
  - action: Зарегистрировать URL на localhost, 169.254.169.254, внутренние имена, редирект на внутренний адрес.
  expected:
  - Регистрация или доставка блокируются.
  applicability:
    when:
    - Пользовательские вебхуки.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
- id: ASYNC-WEBHOOK-RETRY
  status: approved
  title: Неуспешная доставка вебхука повторяется с backoff и ограничением
  category: async
  protocols:
  - rest
  - graphql
  kind: reliability
  priority: P2
  tags:
  - webhooks
  - resilience
  - costly
  - regression
  - nightly
  preconditions:
  - Исходящие вебхуки.
  steps:
  - action: Вернуть 500 и тайм-аут от получателя.
  expected:
  - Повторы по задокументированному расписанию; после лимита событие помечается неуспешным.
  applicability:
    when:
    - Есть вебхуки.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: ASYNC-IDEMPOTENT-CONSUMER
