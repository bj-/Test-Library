priority_order: [P0, P1, P2, P3]
default_rules:
  P0:
    - "Критический риск безопасности, межтенантной утечки или потери данных."
    - "Критический бизнес-инвариант или основной путь недоступен."
  P1:
    - "Обязательный контракт, авторизация, целостность изменяющих операций."
    - "Основной сценарий метода или обработка распространённых ошибок."
  P2:
    - "Обычные граничные значения, второстепенные комбинации и совместимость."
  P3:
    - "Редкие комбинации с низким риском или высокая стоимость при низкой вероятности дефекта."
tie_breakers:
  - "Риск безопасности и целостности данных выше стоимости исполнения."
  - "Тест, связанный с изменённой областью, получает повышенный приоритет запуска."
  - "Недетерминированные проверки не должны блокировать PR без стабилизации."
