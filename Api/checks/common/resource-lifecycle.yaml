checks:
- id: RES-CRUD-CYCLE
  status: approved
  title: 'Полный жизненный цикл ресурса: создание, чтение, изменение, удаление'
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: positive
  priority: P1
  tags:
  - positive
  - data-integrity
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Пользователь с правами на все операции.
  steps:
  - action: Создать ресурс, прочитать, изменить, прочитать, удалить, прочитать.
  - action: 'После удаления выполнить PUT и PATCH по старому id - удалённый ресурс не воскресает; чтение даёт
      результат модели удаления: отсутствие ресурса или признак удаления'
    notes: inbox №499
  - action: Запросить дочерние ресурсы по старому пути и ссылки на удалённый ресурс из других ресурсов; создать
      новый ресурс - старый id не выдан повторно
    notes: inbox №499
  expected:
  - Каждый шаг возвращает задокументированный результат; прочитанное состояние соответствует последней записи; после удаления
    ресурс недоступен.
  - Удалённый ресурс не восстанавливается изменением, дочерние пути и ссылки обработаны по модели удаления, id
    не выдаётся повторно.
  applicability:
    when:
    - Ресурс поддерживает CRUD.
    skip_when:
    - Ресурс только для чтения.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: RES-CREATE-RESPONSE-MATCHES-READ
  status: approved
  title: Ответ на создание и изменение совпадает с последующим чтением
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - data-integrity
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Операции записи возвращают ресурс.
  steps:
  - action: Создать/изменить ресурс и сравнить ответ с GET.
  - action: Поле-связь, заданное альтернативным идентификатором, на нестандартном эндпоинте ресурса — 200 без применения
    notes: 'Real-world bug: RWB-0101 (strapi/strapi#26606)'
  - action: Изменить записи по фильтру на изменяемое поле с возвратом представления и проверить, что в ответе все изменённые
      записи
    notes: 'Real-world bug: RWB-0101 (PostgREST/postgrest#3707)'
  - action: Изменить и удалить записи с возвратом представления и сортировкой основного и вложенного ресурса и сравнить порядок
      с GET
    notes: 'Real-world bug: RWB-0101 (PostgREST/postgrest#3013)'
  - action: Создать объект со всеми полями представления и проверить, что чтение возвращает каждое переданное значение
    notes: 'Real-world bug: RWB-0101 (keycloak/keycloak#44586)'
  - action: Зарегистрировать клиента с token_endpoint_auth_method=client_secret_post и проверить, что ответ и чтение содержат
      запрошенный метод
    notes: 'Real-world bug: RWB-0101 (keycloak/keycloak#44403)'
  - action: Задать независимые логические флаги ресурса противоположными значениями и проверить, что повторное (кэшированное)
      чтение возвращает каждое сохранённое значение
    notes: 'Real-world bug: RWB-0101 (keycloak/keycloak#48432)'
  expected:
  - Поля и значения совпадают, кроме задокументированных вычисляемых асинхронно.
  applicability:
    when:
    - Запись возвращает тело.
    skip_when:
    - Запись возвращает только id.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0101'
