  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: PRIV-CONSENT-ENFORCEMENT
  status: approved
  title: Обработка, требующая согласия, не выполняется без него
  category: privacy
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: negative
  priority: P1
  tags:
  - negative
  - privacy
  - business-logic
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть согласия (оферта, документы, рассылки).
  steps:
  - action: Вызвать операции, требующие принятия документов или согласия, до и после принятия и после отзыва.
  expected:
  - Без согласия операция отклоняется или ограничивается по политике; принятие фиксируется с версией документа.
  applicability:
    when:
    - Есть согласия.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
