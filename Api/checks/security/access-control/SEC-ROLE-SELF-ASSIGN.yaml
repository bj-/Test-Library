checks:
- id: SEC-ROLE-SELF-ASSIGN
  title: User cannot grant self a higher role
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - ci
  - regression
  - release
  preconditions: &id001
  - User profile or role-assignment API accepts mutable data.
  steps:
  - action: Attempt to modify own role, group, privilege flags, or permission assignments through writable fields.
    notes: 'Matrix axis: Roles/Scopes; scenario: Self role assignment. Use isolated synthetic identities and data.'
  expected:
  - Privileged fields are ignored or rejected unless the caller has explicit grant permission; effective privileges do not
    increase.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when: *id001
    skip_when:
    - Role changes are intentionally self-service under a documented policy.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
