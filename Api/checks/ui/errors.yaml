checks:
- id: UI-ERROR-DISPLAY
  status: approved
  title: Ошибки сервера при сохранении показываются понятным сообщением
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: negative
  priority: P2
  tags:
  - ui
  - error-handling
  - ci
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Сохранить данные, нарушающие ограничение БД, — сообщение об ошибке показано
    notes: inbox №200
  - action: Сохранить без прав — понятное сообщение с полем и причиной
    notes: inbox №220
  - action: Сохранить при сбое сети и 5xx — уведомление пользователю, а не только запись в консоли
    notes: inbox №286
  - action: Получить от сервера ошибку без тела или без поля сообщения — понятное сообщение
    notes: inbox №301
  expected:
  - Отказ по ограничению БД, правам, сбой сети, 5xx и ответ без тела показываются уведомлением; поле и причина — когда сервер
    их сообщает; внутренние детали не раскрываются.
  applicability:
    when:
    - Есть сохранение данных из клиента.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Серверная сторона — REST-ERROR-SCHEMA
  - ADR 0006 (проверки UI)
- id: UI-NO-BROKEN-RESOURCES
  status: approved
  title: Ссылки, картинки и ресурсы страниц загружаются
  category: ui
  protocols:
  - ui-web
  kind: contract
  priority: P3
  tags:
  - ui
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Обойти сайт краулером — все ссылки и изображения загружаются, в консоли нет 404
    notes: inbox №106
  - action: Открыть встроенную страницу среды разработки — все скрипты и стили загружаются, ошибок нет
    notes: inbox №260
  expected:
  - Краулер не находит битых ссылок и изображений; в консоли нет 404 ресурсов; встроенные страницы загружают все скрипты и
    стили.
  applicability:
    when:
    - Есть web-страницы.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-NETWORK-RESILIENCE
  status: approved
  title: Клиент работает при потере сети и без доступа в интернет
  category: ui
  protocols:
  - ui-web
  - ui-mobile
  kind: reliability
  priority: P2
  tags:
  - ui
  - resilience
  - ci
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Отключить и вернуть сеть на mobile — realtime-соединение и подписки восстанавливаются без перезапуска приложения
    notes: inbox №205
  - action: Открыть встроенную страницу без доступа в интернет — ресурсы отдаются локально или понятное сообщение
    notes: inbox №262
  expected:
  - После потери сети realtime-соединение и подписки восстанавливаются без перезапуска; без интернета ресурсы отдаются локально
    или есть понятное сообщение.
  applicability:
    when:
    - Клиент работает с сетью или realtime-подписками.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Серверная сторона — WS-RECONNECT-RESUME
  - ADR 0006 (проверки UI)
- id: UI-CLIENT-REQUEST-HYGIENE
  status: approved
  title: Клиент не шлёт лишних, дублирующих и бесконечных запросов
  category: ui
  protocols:
  - ui-web
  kind: performance
  priority: P2
  tags:
  - ui
  - performance
  - ci
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Открыть вкладку и посчитать запросы метаданных — бесконечной очереди повторов нет
    notes: inbox №170
  - action: Подменить настройки клиента в localStorage (интервал опроса) — значение проверяется, лавины запросов нет
    notes: inbox №185
  - action: Открыть и переключить список — нет дублирующихся запросов к API, общее количество считается один раз
    notes: inbox №192
  - action: Переключиться между закладками разных коллекций — запросы не содержат полей прежней коллекции
    notes: inbox №225
  expected:
  - Запросы не дублируются сверх необходимых и не повторяются бесконечно; настройки из localStorage проверяются на диапазон;
    запросы не несут данных прежнего экрана.
  applicability:
    when:
    - Есть web-клиент.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - RFC 9110 §9.2.1 (безопасные методы)
  - Смежная — HTTP-ABSOLUTE-URL-BASE-PATH
  - ADR 0006 (проверки UI)
- id: UI-USABILITY
  status: approved
  title: Частые сценарии короткие, ожидание и задержки понятны пользователю
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: performance
  priority: P3
  tags:
  - ui
  - performance
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  - Нужен список частых сценариев продукта и критерии оценки (число шагов, порог задержки ввода).
  steps:
  - action: Оценить частые сценарии — минимум шагов, нет лишних подтверждений, индикатор при ожидании
    notes: inbox №109
  - action: Вводить текст в поле формы большого документа (динамические блоки) — без заметной задержки
    notes: inbox №288
  - action: Открыть экран, загружающий большую схему, — прогресс и работа с частью данных, без падения по тайм-ауту
    notes: inbox №166
  expected:
  - Частые сценарии — в минимум шагов без лишних подтверждений; при ожидании показан индикатор; ввод отображается без заметной
    задержки.
  applicability:
    when:
    - Есть частые пользовательские сценарии и критерии их оценки.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой) — экспертная оценка
  - ADR 0006 (проверки UI)
- id: UI-FAILURE-ROBUSTNESS
  status: approved
  title: Клиент не падает при сбое и неполных данных
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: negative
  priority: P2
  tags:
  - ui
  - error-handling
  - ci
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Вызвать отказ функциональности — понятный экран ошибки с действием (повторить, на главную), без стектрейса; на
      mobile приложение не падает
    notes: inbox №123
  - action: Получить конфигурацию, где необязательный список равен null, — экран не падает
    notes: inbox №161
  - action: Получить список уведомлений, где у элемента нет вложенного объекта (null), — список не падает
    notes: inbox №169
  expected:
  - При отказе функциональности — понятный экран с действием (повторить, на главную) без стектрейса; null в необязательных
    данных не роняет экран; приложение не падает.
  applicability:
    when:
    - Есть клиент.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Серверная сторона — REST-ERROR-SCHEMA
  - ADR 0006 (проверки UI)
- id: UI-CLIENT-BASE-PATH-URLS
  status: approved
  title: Клиент под подпутём строит все URL с учётом базового пути
  category: ui
  protocols:
  - ui-web
  kind: performance
  priority: P2
  tags:
  - ui
  - performance
  - ci
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Открыть клиент под подпутём — все URL, включая WebSocket, учитывают базовый путь
    notes: inbox №227
  - action: Открыть встроенную среду разработки под префиксом — запросы идут на тот же публичный путь
    notes: inbox №261
  expected:
  - Все URL, включая WebSocket и встроенные страницы, учитывают базовый путь и префикс развёртывания.
  applicability:
    when:
    - Клиент публикуется под подпутём или префиксом.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - RFC 9110 §9.2.1 (безопасные методы)
  - Смежная — HTTP-ABSOLUTE-URL-BASE-PATH
  - ADR 0006 (проверки UI)
- id: UI-STATE-CHANGE-METHODS
  status: approved
  title: Изменения состояния отправляются небезопасными методами, а не GET
  category: ui
  protocols:
  - ui-web
  kind: performance
  priority: P2
  tags:
  - ui
  - performance
  - ci
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Выполнить действия, меняющие состояние, — отправляются POST, PUT или DELETE, а не GET-ссылкой
    notes: inbox №187
  expected:
  - Действия, меняющие состояние, отправляются POST, PUT, PATCH или DELETE; GET-ссылки состояние не меняют.
  applicability:
    when:
    - Есть действия, меняющие состояние.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - RFC 9110 §9.2.1 (безопасные методы)
  - Смежная — HTTP-ABSOLUTE-URL-BASE-PATH
  - ADR 0006 (проверки UI)
