checks:
- id: ASYNC-WEBHOOK-SIGNATURE
  status: approved
  title: Вебхуки подписаны, подпись проверяется, повтор отклоняется
  category: async
  protocols:
  - rest
  - graphql
  kind: security
  priority: P0
  tags:
  - security
  - webhooks
  - authn
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API отправляет или принимает вебхуки.
  steps:
  - action: Проверить подпись исходящего вебхука; отправить входящий вебхук без подписи, с неверной подписью, со старым timestamp,
      повторно.
  - action: На стороне приёма вебхука переформатировать JSON тела (пробелы, порядок ключей) при той же подписи и проверить,
      что подпись сверяется по сырым байтам
    notes: 'Real-world bug: RWB-0053 (nestjs/nest#14543)'
  - action: Отправить входящий вебхук с заголовками другого провайдера без подписи и проверить отказ
    notes: 'Real-world bug: RWB-0053 (GHSA-c5f6-2rm9-2w8g)'
  - action: Подменить в подписанном входящем сообщении поле, не входящее в подпись, и проверить, что сервер его не использует
    notes: 'Real-world bug: RWB-0053 (GHSA-fjwv-jf2v-j499)'
  expected:
  - Без валидной подписи и в пределах окна времени вебхук отклоняется; повтор распознаётся.
  applicability:
    when:
    - Есть вебхуки.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0053'
- id: ASYNC-WEBHOOK-URL-SSRF
  status: approved
  title: URL вебхука не может указывать на внутренние адреса
  category: async
  protocols:
  - rest
  - graphql
  kind: security
  priority: P0
  tags:
  - security
  - webhooks
  - injection
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Пользователь задаёт URL вебхука.
  steps:
  - action: Зарегистрировать URL на localhost, 169.254.169.254, внутренние имена, редирект на внутренний адрес.
  - action: Зарегистрировать URL уведомлений о событиях сессии на внешний адрес и проверить, что данные сессии туда не уходят
    notes: 'Real-world bug: RWB-0054 (GHSA-c556-q2mh-477v)'
  - action: Создать push-подписку с endpoint на произвольный и на внутренний хост и проверить, что принимаются только адреса
      разрешённых push-сервисов
    notes: 'Real-world bug: RWB-0054 (GHSA-2g9c-vf8h-prxx)'
  - action: Указать URL вебхука с IPv6-адресом перехода (6to4, NAT64, Teredo, IPv4-compatible), встраивающим loopback или
      169.254.169.254, и проверить отказ
    notes: 'Real-world bug: RWB-0054 (GHSA-p2w3-6x73-2f6x)'
  - action: Создать вебхуки на внутренние адреса и разные порты и проверить, что журнал неуспешных доставок не раскрывает
      ответ и различие открытого и закрытого порта
    notes: 'Real-world bug: RWB-0054 (GHSA-74p6-39f2-23v3)'
  expected:
  - Регистрация или доставка блокируются.
  applicability:
    when:
    - Пользовательские вебхуки.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0054'
