  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: GRPC-UNAUTHENTICATED-VS-PERMISSION-DENIED
  status: approved
  title: Отсутствие аутентификации и отсутствие прав различаются по статусу
  category: grpc-errors
  protocols:
  - grpc
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - authn
  - authz
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Защищённый RPC.
  steps:
  - action: Вызвать без токена, с невалидным токеном, с валидным токеном без прав.
  expected:
  - UNAUTHENTICATED для первых двух, PERMISSION_DENIED (или NOT_FOUND по политике сокрытия) для третьего.
  applicability:
    when:
    - Есть защищённые RPC.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
- id: GRPC-METADATA-AUTH-MISSING
  status: approved
  title: Каждый RPC сервиса требует аутентификационные метаданные
  category: grpc-errors
  protocols:
  - grpc
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - authn
  - metadata
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Сервис содержит защищённые методы.
  steps:
  - action: Перебрать все методы сервиса через reflection или descriptor и вызвать без метаданных.
  - action: Вызвать без метаданных аутентификации каждый потоковый RPC сервиса и проверить UNAUTHENTICATED до любых изменений
    notes: 'Real-world bug: RWB-0294 (GHSA-rrwh-6jrq-wp5v)'
  expected:
  - Все защищённые методы отклоняют вызов; публичные методы явно перечислены.
  applicability:
    when:
    - Есть защищённые методы.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0294'
- id: GRPC-METADATA-MALFORMED
  status: approved
  title: Некорректные и чрезмерные метаданные отклоняются
  category: grpc-errors
  protocols:
  - grpc
  kind: negative
  priority: P2
  tags:
  - negative
  - metadata
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Нет.
  steps:
  - action: Передать метаданные с недопустимыми символами, -bin без base64, 1000 ключей, значения 64KB.
  - action: Отправить метаданные цепочкой HEADERS и множества CONTINUATION-кадров суммарно сверх лимита, а также целые HPACK
      с длинной цепочкой ведущих нулей
    notes: 'Real-world bug: RWB-0242 (GHSA-496j-2rq6-j6cc)'
  expected:
  - RESOURCE_EXHAUSTED или INVALID_ARGUMENT без падения сервера.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0242'
