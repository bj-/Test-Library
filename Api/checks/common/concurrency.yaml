checks:
- id: CONC-PARALLEL-CREATE-UNIQUE
  status: approved
  title: Параллельное создание с одним уникальным ключом создаёт один объект
  category: concurrency
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - concurrency
  - data-integrity
  - costly
  - regression
  - nightly
  preconditions:
  - Есть уникальные ключи.
  steps:
  - action: Отправить 20 параллельных запросов создания с одинаковым ключом.
  expected:
  - Создан ровно один объект; остальные получили задокументированный конфликт.
  applicability:
    when:
    - Есть уникальность.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
- id: CONC-LOST-UPDATE
  status: approved
  title: Параллельные изменения не теряют друг друга молча
  category: concurrency
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - concurrency
  - data-integrity
  - costly
  - regression
  - nightly
  preconditions:
  - Ресурс изменяется несколькими клиентами.
  steps:
  - action: Два клиента читают ресурс и изменяют разные поля; затем одно поле.
  expected:
  - Используется оптимистическая блокировка или слияние по контракту; молчаливая потеря изменений отсутствует.
  applicability:
    when:
    - Есть изменения.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
