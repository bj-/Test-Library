- id: RES-READ-AFTER-WRITE
  status: approved
  title: Чтение после записи соответствует модели согласованности
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: reliability
  priority: P2
  tags:
  - data-integrity
  - reliability
  - regression
  - nightly
  preconditions:
  - Есть реплики, кэши или асинхронная обработка.
  steps:
  - action: Сразу после записи прочитать ресурс многократно из разных узлов.
  expected:
  - Сильная согласованность или задокументированное окно eventual consistency.
  applicability:
    when:
    - Распределённое хранение.
    skip_when:
    - Одна БД без кэша.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
