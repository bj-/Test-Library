- id: INJ-TEMPLATE-SSTI
  status: approved
  title: Инъекция в серверные шаблоны не исполняется
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Пользовательские данные попадают в шаблоны писем, документов или уведомлений.
  steps:
  - action: 'Сохранить {{7*7}}, ${7*7}, <%= 7*7 %>, #{7*7} и вызвать генерацию письма или документа.'
  expected:
  - В результате буквальная строка, а не 49.
  - Нет ошибок шаблонизатора в ответе.
  applicability:
    when:
    - Есть рендеринг шаблонов с пользовательскими данными.
    skip_when:
    - Шаблоны не используются.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
- id: INJ-STORED-XSS
  status: approved
  title: Сохранённые данные с HTML/JS не создают XSS у потребителей API
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Данные API отображаются в веб-интерфейсе или админке.
  steps:
  - action: 'Сохранить <script>alert(1)</script>, <img src=x onerror=...>, javascript: URL в текстовых и URL-полях.'
  - action: Прочитать данные через API и открыть в UI.
  expected:
  - 'API возвращает данные с Content-Type: application/json, не text/html.'
  - UI экранирует данные; URL-поля не принимают javascript:.
  applicability:
    when:
    - Есть UI-потребитель API.
    skip_when:
    - API не имеет веб-потребителей.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
- id: INJ-HEADER-CRLF
  status: approved
  title: CRLF в значениях не позволяет внедрять заголовки ответа
  category: security
  protocols:
  - rest
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Пользовательское значение попадает в заголовки ответа (Location, Set-Cookie, Content-Disposition).
  steps:
  - action: Передать значение с %0d%0aSet-Cookie:x=1 и \r\n в параметре redirect, имени файла, языке.
  expected:
  - В ответе нет внедрённого заголовка или разделения ответа.
  - Запрос отклоняется или значение кодируется.
  applicability:
    when:
    - Значения отражаются в заголовках.
    skip_when:
    - Отражения нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
- id: INJ-PATH-TRAVERSAL
  status: approved
  title: Обход каталогов через параметры файлов и путей невозможен
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - files
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Параметр задаёт имя файла, путь, шаблон или ключ объекта в хранилище.
  steps:
  - action: Передать ../../etc/passwd, ..\..\windows\win.ini, %2e%2e%2f, двойное кодирование, абсолютные пути, null byte.
  expected:
  - Доступ только к разрешённым объектам.
  - Ответ не содержит содержимого системных файлов.
  applicability:
    when:
    - Есть файловые параметры.
    skip_when:
    - Нет файловых параметров.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
- id: INJ-LOG-FORGING
  status: approved
  title: Пользовательские данные не позволяют подделывать записи журналов
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - injection
  - observability
  - regression
  - nightly
  preconditions:
  - Доступ к логам тестового окружения.
  steps:
  - action: Передать значения с \n, \r, ANSI escape-последовательностями и поддельной строкой лога, ${jndi:ldap://...}.
  expected:
  - Записи в логе экранированы и не разбиваются на поддельные.
  - Lookup-выражения не исполняются.
  applicability:
    when:
    - Есть доступ к логам.
    skip_when:
    - Логи недоступны тестам.
  automation:
    level: manual
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: INJ-PROTOTYPE-POLLUTION
  status: approved
  title: Специальные ключи __proto__ и constructor не меняют поведение сервера
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Бэкенд на JavaScript/TypeScript или выполняет глубокое слияние объектов.
  steps:
  - action: 'Отправить {"__proto__": {"isAdmin": true}}, {"constructor": {"prototype": {...}}} в теле и query.'
  - action: Выполнить последующий запрос другим пользователем.
  expected:
  - Ключи отклоняются или игнорируются.
  - Последующие запросы не получают изменённых свойств.
  applicability:
    when:
    - Node.js бэкенд или deep merge.
    skip_when:
    - Другая платформа без deep merge.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
