checks:
- id: SEC-AUTHZ-ROLE-POSITIVE-MATRIX
  status: draft
  title: Разрешённая операция работает для каждой роли с правом, а не только для администратора
  category: security
  protocols:
  - generic
  kind: positive
  priority: P1
  tags:
  - positive
  - authz
  - roles-scopes
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть матрица прав (ТЗ или контракт) с несколькими ролями, включая ограниченные (фильтры видимости, ограничения полей).
  steps:
  - action: Выполнить каждую операцию под каждой ролью, которой она разрешена матрицей.
  - action: Сравнить результат с ожидаемым для роли (данные в пределах прав).
  - action: Заменить существующий файл через возобновляемую загрузку (TUS) под не-администратором с правом обновления файлов
    notes: 'Real-world bug: RWB-0004 (directus/directus#26118)'
  - action: Запросить количество отфильтрованных записей ролью без права чтения первичного ключа, фильтр по разрешённому полю
    notes: 'Real-world bug: RWB-0004 (directus/directus#25212)'
  - action: Прочитать записи с вложенными полями связи под ролью без права на первичный ключ связанной коллекции
    notes: 'Real-world bug: RWB-0004 (directus/directus#24257)'
  - action: Выполнить запрос под ролью с правилом доступа по $CURRENT_USER, когда фильтр запроса содержит то же значение для
      поля другого типа
    notes: 'Real-world bug: RWB-0004 (directus/directus#24125)'
  - action: Задать собственное правило чтения для системной коллекции и проверить, что пользователь видит разрешённые этим
      правилом записи
    notes: 'Real-world bug: RWB-0004 (directus/directus#23952)'
  - action: Удалить файл под ролью с правом удаления, но без права чтения служебных полей файла (хранилище, имя на диске)
    notes: 'Real-world bug: RWB-0004 (directus/directus#24336)'
  - action: Изменить связанную запись вложенным запросом через родителя под ролью без права изменять первичный ключ связанной
      коллекции
    notes: 'Real-world bug: RWB-0004 (directus/directus#23876)'
  - action: Настроить запрет только для группы без пользователей и проверить, что аутентифицированный пользователь без групп
      получает доступ
    notes: 'Real-world bug: RWB-0004 (Kong/kong#6281)'
  - action: Повторить разрешённые операции, включая вспомогательные действия над документом, для роли с условными правами
      («тот же создатель», «та же роль»)
    notes: 'Real-world bug: RWB-0004 (strapi/strapi#25965)'
  expected:
  - 2xx и данные в пределах прав роли.
  - Ни одной 5xx или ложного 403 у ролей с правом.
  applicability:
    when:
    - Больше одной роли с правами на операции.
    skip_when:
    - Единственная роль.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
  references:
  - Матрица прав ТЗ; тесты только под администратором не покрывают ветки ограниченных ролей
  - 'Real-world bug: RWB-0004'
