checks:
- id: REST-SSRF-URL-FETCH
  status: approved
  title: Контроль server-side URL fetch
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - security
  - negative
  - validation
  - rest
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Добавить DNS rebinding (TOCTOU)
    notes: 'Real-world bug: RWB-0135 (GHSA-322m-ff4g-9vx9)'
  - action: Добавить переходные IPv6 и сокращённую запись IPv4
    notes: 'Real-world bug: RWB-0135 (GHSA-r7f2-6fj8-6fg2)'
  - action: Обход allow-list — разрешённый хост в пути/query/поддомене
    notes: 'Real-world bug: RWB-0135 (GHSA-4233-jc72-56c5)'
  - action: 'Добавить вариант с редиректом: внешний URL отвечает 3xx на внутренний адрес; проверка не должна ограничиваться
      исходным URL'
    notes: 'Real-world bug: RWB-0135 (GHSA-r4gj-5m52-g5wh)'
  - action: 'Добавить вариант транспорта: цель с HTTP/2 и имя, разрешающееся во внутренний адрес — защита не должна зависеть
      от версии протокола'
    notes: 'Real-world bug: RWB-0135 (GHSA-3pq3-5fj3-cg6v)'
  - action: Хост из allowlist с DNS на внутренний адрес (DNS rebinding) — проверять IP после резолва
    notes: 'Real-world bug: RWB-0135 (GHSA-cjq9-62q9-8jv4)'
  - action: Утечка учётных данных пользователя в исходящий запрос и повторная проверка адреса при редиректе
    notes: 'Real-world bug: RWB-0135 (GHSA-pj5h-5q6c-3pfx)'
  - action: URL из директив внутри содержимого, разрешаемых сервером с его учётными данными, — ограничение тем же источником
    notes: 'Real-world bug: RWB-0135 (GHSA-qgvj-qcf8-xq73)'
  - action: Обход allowlist префиксом пути без границы сегмента в прокси с учётными данными сервера
    notes: 'Real-world bug: RWB-0135 (GHSA-m62c-5q34-f3cf)'
  - action: link-local IPv6 вне fe80::/64 (весь fe80::/10)
    notes: 'Real-world bug: RWB-0135 (GHSA-rpw4-54j3-4h4q)'
  - action: NAT64 local-use 64:ff9b:1::/48 (в дополнение к ::ffff:0:0/96 и 64:ff9b::/96)
    notes: 'Real-world bug: RWB-0135 (GHSA-2vr4-cq9g-pvrc)'
  - action: Исходящие запросы с учётными данными сервера — назначение ограничено origin интеграции, и после редиректа тоже
    notes: 'Real-world bug: RWB-0135 (GHSA-q5wm-mgqx-fv2f)'
  - action: Передать в параметр URL адрес на разрешённом хосте с произвольным путём и проверить, что без авторизации вызывающего
      сервер не отправляет туда служебный токен
    notes: 'Real-world bug: RWB-0135 (GHSA-xm3x-9cfw-jhx4)'
  - action: Передать домен с чередующимся резолвом во внешний и внутренний адрес (DNS rebinding) и проверить, что запрос во
      внутреннюю сеть не выполняется
    notes: 'Real-world bug: RWB-0135 (GHSA-x8gv-g2g3-65fj)'
  - action: Передать URL, хост которого резолвится в IPv6-обёртку внутреннего IPv4 (NAT64, IPv4-compatible, 6to4), и проверить
      отказ
    notes: 'Real-world bug: RWB-0135 (GHSA-jvh5-97xg-v99f)'
  expected:
  - запрещённые схемы и internal/private targets блокируются
  applicability:
    when:
    - API загружает пользовательский URL
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0135'
