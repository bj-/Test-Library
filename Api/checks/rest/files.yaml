  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0071'
- id: FILE-DOWNLOAD-AUTHZ
  status: approved
  title: Скачивание файлов проверяет права и срок действия ссылок
  category: files
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - negative
  - files
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Файлы приватны.
  steps:
  - action: Скачать чужой файл по id, по прямому URL хранилища, по истёкшей подписанной ссылке, по подписанной ссылке с изменёнными
      параметрами.
  - action: Манипуляция путём в URL статического контента (traversal, кодирование) приводит к файлу другой сущности, а права
      проверены по сущности из исходного пути; прогонять на внешнем хранилище
    notes: 'Real-world bug: RWB-0070 (GHSA-rg9r-hr7g-5gc2)'
  expected:
  - Доступ отклоняется во всех случаях.
  applicability:
    when:
    - Есть приватные файлы.
    skip_when:
    - Все файлы публичны.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0070'
