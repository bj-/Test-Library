  - Ответ — штатная ошибка валидации или обычный результат с данными, трактованными как литерал.
  - Нет 5xx и утечек деталей интерпретатора.
  - Логин с операторами вместо пароля не выполняется.
  applicability:
    when:
    - Используется NoSQL хранилище.
    skip_when:
    - NoSQL не используется.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
  - 'Real-world bug: RWB-0084'
- id: INJ-OS-COMMAND
  status: approved
  title: Инъекция команд ОС не исполняется
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Параметр может попадать в shell, конвертеры файлов или системные утилиты.
  steps:
  - action: Подставить ; id, | whoami, `sleep 10`, $(sleep 10), && ping.
  - action: Без метасимволов оболочки — интерпретатор и флаг выполнения кода в разрешённых аргументах execFile
    notes: 'Real-world bug: RWB-0085 (GHSA-hf57-cqmx-p4gr)'
  - action: Конфигурация серверного генератора/сборщика из пользовательских данных (allowlist ключей)
    notes: 'Real-world bug: RWB-0085 (GHSA-8w7q-29mw-gf5c)'
  - action: 'Символы конца строки (включая U+2028/2029) в связке с # в аргументах, экранируемых библиотекой'
    notes: 'Real-world bug: RWB-0085 (GHSA-pqg4-j6r4-53mv)'
  expected:
  - 'Полезная нагрузка не исполняется: нет изменения поведения, данных, времени ответа или ошибок интерпретатора.'
  - Ответ — штатная ошибка валидации или обычный результат с данными, трактованными как литерал.
  - Нет 5xx и утечек деталей интерпретатора.
  applicability:
    when:
    - Сервис вызывает внешние процессы.
    skip_when:
    - Внешние процессы не вызываются.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
  - 'Real-world bug: RWB-0085'
- id: INJ-TEMPLATE-SSTI
  status: approved
  title: Инъекция в серверные шаблоны не исполняется
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Пользовательские данные попадают в шаблоны писем, документов или уведомлений.
  steps:
  - action: 'Сохранить {{7*7}}, ${7*7}, <%= 7*7 %>, #{7*7} и вызвать генерацию письма или документа.'
  - action: 'Добавить подмену типа: объект вместо строки шаблона'
    notes: 'Real-world bug: RWB-0091 (GHSA-8r5x-fm3f-whwj)'
  expected:
  - В результате буквальная строка, а не 49.
  - Нет ошибок шаблонизатора в ответе.
  applicability:
    when:
    - Есть рендеринг шаблонов с пользовательскими данными.
    skip_when:
    - Шаблоны не используются.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
  - 'Real-world bug: RWB-0091'
- id: INJ-STORED-XSS
  status: approved
  title: Сохранённые данные с HTML/JS не создают XSS у потребителей API
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Данные API отображаются в веб-интерфейсе или админке.
  steps:
  - action: 'Сохранить <script>alert(1)</script>, <img src=x onerror=...>, javascript: URL в текстовых и URL-полях.'
  - action: Прочитать данные через API и открыть в UI.
  expected:
  - 'API возвращает данные с Content-Type: application/json, не text/html.'
  - UI экранирует данные; URL-поля не принимают javascript:.
  applicability:
    when:
    - Есть UI-потребитель API.
    skip_when:
    - API не имеет веб-потребителей.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP Web Security Testing Guide
- id: INJ-HEADER-CRLF
  status: approved
  title: CRLF в значениях не позволяет внедрять заголовки ответа
  category: security
  protocols:
  - rest
  kind: security
  priority: P1
  tags:
