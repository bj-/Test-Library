- id: FILE-TRANSFORM-LIMITS
  status: draft
  title: Лимит трансформации файла пропускает допустимые комбинации и отклоняет превышение
  category: files
  protocols:
  - rest
  kind: boundary
  priority: P3
  tags:
  - boundary
  - files
  - validation
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Эндпоинт отдаёт файл с трансформацией на лету (размер, формат, качество) и лимитом на результат.
  steps:
  - action: Запросить трансформацию с малыми размерами без format и с каждым format (jpeg, png, webp, avif).
  - action: Запросить размер чуть выше лимита и комбинацию, где выше лимита только промежуточный шаг.
  expected:
  - Запросы в пределах лимита успешны независимо от format.
  - Превышение лимита, в том числе на промежуточном шаге, — 4xx.
  applicability:
    when:
    - Есть трансформация файлов.
    skip_when:
    - Файлы отдаются как есть.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: low
  references:
  - OWASP API4:2023
  - 'Real-world bug: RWB-0012'
- id: FILE-MALFORMED-STRUCTURE
  status: draft
  title: Повреждённый файл при разборе метаданных даёт 4xx, а не падение процесса
  category: files
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - negative
  - files
  - resilience
  - hardening
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис разбирает загружаемые файлы (медиа, документы, архивы) для метаданных или превью.
  steps:
  - action: Загрузить файл известного формата с размером блока меньше заголовка, отрицательным остатком, обрезанным концом.
  - action: Проверить живость сервиса другими запросами.
  - action: Отправить JWT с заголовком zip=DEF и пустым или обрезанным сжатым payload и проверить, что ответ 4xx приходит
      за ограниченное время
    notes: 'Real-world bug: RWB-0031 (GHSA-gq9c-wmrm-5hvr)'
  - action: Загрузить документ с циклической цепочкой ссылок наследования (стиль A основан на B, B — на A) и вызвать его обработку
    notes: 'Real-world bug: RWB-0031 (GHSA-gc95-3vw8-vg43)'
  expected:
  - Ошибка разбора как 4xx или файл принят без метаданных; процесс продолжает работу.
  applicability:
    when:
    - Есть разбор содержимого файлов.
    skip_when:
    - Файлы хранятся без разбора.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - CWE-248
  - CWE-400
  - 'Real-world bug: RWB-0031'
- id: FILE-UPLOAD-KEY-COLLISION
  status: draft
  title: Загрузка не перезаписывает чужой файл с тем же именем или ключом хранилища
  category: files
  protocols:
  - rest
  kind: security
  priority: P1
  tags:
  - security
  - files
  - ownership
  - authz
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Разные владельцы или коллекции хранят файлы в общем хранилище.
  steps:
  - action: Загрузить файл с именем или ключом существующего файла другой коллекции или другого пользователя.
  - action: Скачать исходный файл.
  expected:
  - Исходный файл не изменился; новому присвоен уникальный ключ или 409/403.
  applicability:
    when:
    - Есть загрузка файлов.
    skip_when:
    - Нет загрузки.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - OWASP API1:2023
  - CWE-639
  - 'Real-world bug: RWB-0037'
- id: FILE-ABORTED-UPLOAD-CLEANUP
  status: draft
  title: Прерванная загрузка не оставляет данных в хранилище и не учитывается в квоте
  category: files
  protocols:
