checks:
- id: VAL-STRING-FORMAT
  status: approved
  title: Форматы строк (email, uuid, uri, date, phone) проверяются
  category: validation
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - validation
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Для поля в контракте задан format или pattern.
  steps:
  - action: Отправить значения корректного формата и граничные корректные варианты.
  - action: 'Отправить значения неверного формата: без домена, лишние символы, неверная длина uuid, несуществующая дата 2023-02-30.'
  - action: Проверка формата на экстремально длинном значении — время, память и отсутствие 5xx
    notes: 'Real-world bug: RWB-0175 (GHSA-h3mg-xc3c-68pw)'
  - action: Отправить в поле расписания cron значения «TZ=0», «TZ=», «CRON_TZ=UTC» и «TZ=Invalid/Timezone» и проверить 4xx
      валидации, а не 5xx или разрыв соединения
    notes: 'Real-world bug: RWB-0175 (kubernetes/kubernetes#134320)'
  expected:
  - Корректные значения принимаются.
  - Некорректные отклоняются задокументированной ошибкой валидации с указанием поля.
  - Состояние не меняется при отказе.
  applicability:
    when:
    - Поле имеет format/pattern в контракте.
    skip_when:
    - Ограничение не задокументировано в контракте и требует уточнения.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0175'
- id: VAL-REGEX-PATTERN
  status: approved
  title: Поле с pattern принимает только совпадающие значения
  category: validation
  protocols:
  - rest
  - graphql
  kind: boundary
  priority: P2
  tags:
  - boundary
  - validation
  - ci
  - regression
  - nightly
  preconditions:
  - Для поля задан pattern.
  steps:
  - action: 'Построить значения на границе regex: минимальное совпадение, лишний символ в начале и конце, многострочное значение
      с \n.'
  expected:
  - Сопоставление выполняется по всей строке, частичное совпадение не принимается.
  - Перевод строки не обходит якоря ^ и $.
  applicability:
    when:
    - Поле имеет pattern.
    skip_when:
    - Ограничение не задокументировано в контракте и требует уточнения.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: VAL-ARRAY-ITEMS-BOUNDARIES
  status: approved
  title: 'Границы массивов: minItems, maxItems, uniqueItems'
  category: validation
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P1
  tags:
  - boundary
  - validation
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Для массива заданы ограничения количества или уникальности.
  steps:
  - action: Отправить массивы длиной min-1, min, max, max+1.
  - action: Отправить массив с дубликатами при uniqueItems.
  - action: Добавить обязательный массив с пустыми элементами среди непустых
    notes: 'Real-world bug: RWB-0163 (keycloak/keycloak#52776)'
  expected:
  - Значения в пределах принимаются, за пределами отклоняются с указанием поля.
  - Дубликаты отклоняются или схлопываются строго по контракту.
  applicability:
    when:
    - В контракте есть массив с ограничениями.
    skip_when:
    - Ограничения массива не определены.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0163'
- id: VAL-NESTED-OBJECT-ERRORS
  status: approved
  title: Ошибка во вложенном объекте указывает точный путь к полю
  category: validation
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - validation
  - error-handling
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Тело запроса содержит вложенные объекты или массивы объектов.
  steps:
  - action: Сделать невалидным поле на 2-3 уровне вложенности и в n-м элементе массива.
  expected:
  - Ошибка содержит путь вида items[3].address.zip или эквивалент по модели ошибок.
  - Ответ не 5xx.
  applicability:
    when:
    - Есть вложенные структуры.
    skip_when:
    - Плоская модель запроса.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0171'
- id: VAL-DEEP-NESTING
  status: approved
  title: Чрезмерно вложенный JSON отклоняется без деградации сервиса
  category: validation
  protocols:
  - rest
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - validation
  - security
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Эндпоинт принимает JSON-тело.
  steps:
  - action: Отправить JSON с глубиной вложенности 1000+ уровней массивов/объектов.
  - action: Проверить время ответа и доступность сервиса после запроса.
  - action: Вложенность не только в JSON, но и в строковых шаблонах (glob/brace, выражения)
    notes: 'Real-world bug: RWB-0165 (GHSA-qhr7-859c-m2p7)'
  - action: Отправить XML с глубокой вложенностью, где каждый элемент объявляет новый уникальный префикс пространства имён
    notes: 'Real-world bug: RWB-0165 (GHSA-65r4-943x-97jj)'
  - action: Отправить protobuf-сообщение с неизвестным полем из тысяч вложенных групп
    notes: 'Real-world bug: RWB-0165 (GHSA-735f-pc8j-v9w8)'
  expected:
  - Запрос отклоняется контролируемой ошибкой 4xx.
  - Нет 5xx, переполнения стека или зависания; сервис продолжает отвечать.
  applicability:
    when:
    - Тело запроса — JSON.
    skip_when:
    - Тело не принимается.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0165'
- id: VAL-LARGE-COLLECTION-PAYLOAD
  status: approved
  title: Массив с очень большим числом элементов отклоняется или обрабатывается в пределах лимитов
  category: validation
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P2
  tags:
  - boundary
  - validation
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Эндпоинт принимает массив без явного maxItems.
  steps:
  - action: Отправить массив из 10^5 и 10^6 мелких элементов в пределах лимита размера тела.
  - action: Объявленная длина без самих данных (маленький запрос — большое выделение)
    notes: 'Real-world bug: RWB-0169 (GHSA-jp82-f5mq-hwhp)'
  expected:
  - Сервис отклоняет запрос по задокументированному лимиту или обрабатывает его без 5xx и без деградации других запросов.
  applicability:
    when:
    - Есть массивы во входных данных.
    skip_when:
    - maxItems задан и проверен отдельно.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0169'
- id: VAL-MALFORMED-JSON
  status: approved
  title: Синтаксически некорректный JSON отклоняется
  category: validation
  protocols:
  - rest
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - validation
  - error-handling
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Эндпоинт принимает JSON.
  steps:
  - action: Отправить обрезанный JSON, лишнюю запятую, комментарии, одинарные кавычки, неэкранированные управляющие символы,
      пустое тело.
  - action: Добавить сравнение разных видов невалидного JSON между собой
    notes: 'Real-world bug: RWB-0170 (expressjs/body-parser#119)'
  - action: Проверять не только 400, но и что тело — в общей схеме ошибки без стека (ошибка парсера вне фильтров приложения)
    notes: 'Real-world bug: RWB-0170 (nestjs/nest#422)'
  - action: Отправить тело с нераспознаваемым токеном длиной в миллионы символов и проверить, что ответ 4xx приходит быстро,
      а фрагмент токена в сообщении усечён
    notes: 'Real-world bug: RWB-0170 (GHSA-7hhh-6rmp-j9qf)'
  expected:
  - Ответ — задокументированная ошибка 4xx, не 5xx.
  - Сообщение не раскрывает внутренности парсера и stack trace.
  applicability:
    when:
    - Тело — JSON.
    skip_when:
    - Нет тела запроса.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0170'
- id: VAL-JSON-TOP-LEVEL-TYPE
  status: approved
  title: Неожиданный тип корня JSON отклоняется
  category: validation
  protocols:
  - rest
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - validation
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Схема ожидает объект в корне.
  steps:
  - action: Отправить массив, строку, число, null и true вместо объекта.
  - action: Явно включить литерал null и пустое тело с Content-Type JSON
    notes: 'Real-world bug: RWB-0168 (keycloak/keycloak#52798)'
  expected:
  - Каждый вариант отклоняется ошибкой валидации без 5xx.
  applicability:
    when:
    - Тело — JSON-объект.
    skip_when:
    - Схема допускает несколько типов корня.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0168'
- id: VAL-BODY-ENCODING
  status: approved
  title: Тело в неверной кодировке или с BOM обрабатывается предсказуемо
  category: validation
  protocols:
  - rest
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - validation
  - i18n
  - ci
  - regression
  - nightly
  preconditions:
  - Эндпоинт принимает текстовое тело.
  steps:
  - action: Отправить тело в Windows-1251 с charset=utf-8, невалидные UTF-8 последовательности, UTF-8 с BOM, UTF-16.
  expected:
  - Невалидная кодировка отклоняется 4xx или обрабатывается строго по контракту.
  - Данные не сохраняются в искажённом виде.
  applicability:
    when:
    - Есть текстовые поля.
    skip_when:
    - Контракт не определяет поведение и уточнение не получено.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: VAL-NUMBER-REPRESENTATION
  status: approved
  title: Альтернативные записи чисел обрабатываются по контракту
  category: validation
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P1
  tags:
  - boundary
  - validation
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть числовые поля.
  steps:
  - action: Отправить 1e3, 1.0 для integer, -0, ведущие нули 007, число строкой "5", NaN, Infinity, 2^53+1, 2^63, 2^64.
  - action: Передать в числовое поле, которое сервер форматирует, значение 1e10000 и проверить время и размер ответа
    notes: 'Real-world bug: RWB-0250 (GHSA-2j26-frm8-cmj9)'
  expected:
  - Каждое представление принимается или отклоняется однозначно по контракту.
  - Большие целые не теряют точность и не переполняются молча.
  - NaN и Infinity отклоняются.
  applicability:
    when:
    - Есть integer/number поля.
    skip_when:
    - Числовых полей нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0250'
- id: VAL-BOOLEAN-COERCION
  status: approved
  title: Неявное приведение типов для boolean не происходит
  category: validation
  protocols:
  - rest
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - validation
  - ci
  - regression
  - nightly
  preconditions:
  - Есть boolean поля в теле или query.
  steps:
  - action: Отправить "true", "false", 1, 0, "yes", пустую строку вместо boolean.
  expected:
  - Поведение соответствует контракту; в теле JSON строки и числа не приводятся к boolean молча.
  applicability:
    when:
    - Есть boolean параметры.
    skip_when:
    - Контракт явно разрешает приведение.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: VAL-WHITESPACE-HANDLING
  status: approved
  title: Пробелы по краям и строки из пробелов обрабатываются согласованно
  category: validation
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P2
  tags:
  - boundary
  - validation
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть строковые поля с обязательностью или уникальностью.
  steps:
  - action: Отправить значение с пробелами по краям, строку из пробелов, табуляцию и неразрывный пробел в обязательном поле.
  - action: Добавить обход проверки зарезервированного префикса пробелами и несогласованность create/delete
    notes: 'Real-world bug: RWB-0176 (directus/directus#28037)'
  expected:
  - Обрезка либо выполняется везде одинаково, либо не выполняется.
  - Строка из одних пробелов не проходит проверку обязательности, если контракт этого требует.
  - Уникальность не обходится добавлением пробела.
  applicability:
    when:
    - Есть строковые поля.
    skip_when:
    - Строковых полей нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0176'
- id: VAL-CASE-SENSITIVITY
  status: approved
  title: Чувствительность к регистру идентификаторов, email и enum соответствует контракту
  category: validation
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P2
  tags:
  - boundary
  - validation
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть логины, email, коды или enum.
  steps:
  - action: Создать объект с email User@Example.com, затем искать/логиниться/создавать дубликат с user@example.com.
  - action: Передать enum в другом регистре.
  - action: Сравнение имён в правилах авторизации (allow/deny-list) расходится с исполнителем по регистру — обход ограничения
    notes: 'Real-world bug: RWB-0164 (GHSA-hmp2-4m7g-22cv)'
  expected:
  - Поведение одинаково во всех операциях (поиск, уникальность, логин).
  - Enum в другом регистре обрабатывается строго по контракту.
  applicability:
    when:
    - Есть строковые идентификаторы.
    skip_when:
    - Нет таких полей.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0164'
- id: VAL-SPECIAL-CHARACTERS
  status: approved
  title: Спецсимволы, emoji и управляющие символы сохраняются или отклоняются корректно
  category: validation
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P1
  tags:
  - boundary
  - validation
  - i18n
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть свободные текстовые поля.
  steps:
  - action: Сохранить строки с кавычками, обратным слэшем, <>&, emoji, RTL-символами, \u0000, \u202E, суррогатными парами.
  - action: Прочитать сохранённые данные.
  - action: Многобайтовые символы в протоколах с префиксом длины — проверять целостность и следующие сообщения потока
    notes: 'Real-world bug: RWB-0174 (nestjs/nest#1734)'
  expected:
  - Принятые значения возвращаются без искажений и двойного экранирования.
  - Null byte и запрещённые управляющие символы отклоняются или удаляются по контракту.
  - Нет 5xx.
  applicability:
    when:
    - Есть текстовые поля.
    skip_when:
    - Текстовых полей нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0174'
- id: VAL-DEPENDENT-FIELDS
  status: approved
  title: Взаимозависимые поля валидируются совместно
  category: validation
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - validation
  - business-logic
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Контракт содержит условные требования (если A, то обязательно B; oneOf/anyOf).
  steps:
  - action: 'Отправить комбинации: A без B, B без A, оба, ни одного, взаимоисключающие поля одновременно.'
  - action: Добавить вариант взаимоисключающих полей с проверкой, что часть операции не отброшена молча
    notes: 'Real-world bug: RWB-0167 (strapi/strapi#27421)'
  - action: Отправить конфигурацию с запретом повышения привилегий и добавленными опасными возможностями (CAP_SYS_MODULE,
      CAP_SYS_PTRACE) и проверить, что сочетание отклоняется по политике
    notes: 'Real-world bug: RWB-0167 (kubernetes/kubernetes#131336)'
  - action: Отправить в связанные поля подсеть и вложенные в неё адреса с префиксом /32 и проверить, что правило вхождения
      их принимает, а адреса вне подсети отклоняет
    notes: 'Real-world bug: RWB-0167 (kubernetes/kubernetes#130441)'
  expected:
  - Недопустимые комбинации отклоняются с понятной ошибкой.
  - Допустимые комбинации принимаются.
  applicability:
    when:
    - Есть условные зависимости полей.
    skip_when:
    - Зависимостей нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0167'
- id: VAL-RANGE-ORDER
  status: approved
  title: Начало диапазона не может быть позже конца
  category: validation
  protocols:
  - rest
