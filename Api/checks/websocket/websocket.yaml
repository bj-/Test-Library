  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0178'
- id: WS-RECONNECT-RESUME
  status: approved
  title: Переподключение восстанавливает подписки без потери и дублей сверх контракта
  category: websocket
  protocols:
  - websocket
  kind: reliability
  priority: P3
  tags:
  - streaming
  - resilience
  - regression
  - nightly
  preconditions:
  - Протокол поддерживает resume.
  steps:
  - action: Разорвать соединение и переподключиться с last event id.
  expected:
  - Пропущенные события доставлены, дубли распознаваемы.
  applicability:
    when:
    - Есть resume.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: WS-SLOW-CONSUMER-NO-SILENT-LOSS
  status: draft
  title: Медленный клиент подписки не теряет сообщения молча
  category: websocket
  protocols:
  - websocket
  - graphql
  kind: reliability
  priority: P2
  tags:
  - reliability
  - websocket
  - real-world-bug
  - nightly
  preconditions:
  - Есть подписки или поток событий по WebSocket.
  steps:
  - action: Подписаться и не читать сокет (или читать медленно), пока сервер генерирует поток событий больше буфера отправки.
  - action: Возобновить чтение и сверить полученные события с отправленными.
  expected:
  - Клиент получает все события, либо сервер явно сообщает о потере (ошибка, закрытие с кодом, маркер пропуска).
  - Сервер не копит память без предела.
  applicability:
    when:
    - Есть подписки.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - RFC 6455
  - 'Real-world bug: RWB-0209'
