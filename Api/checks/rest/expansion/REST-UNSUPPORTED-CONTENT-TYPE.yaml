checks:
- id: REST-UNSUPPORTED-CONTENT-TYPE
  status: approved
  title: Неподдерживаемый Content-Type запроса
  description: 'Тело в типе, которого операция не принимает (text/plain, application/x-www-form-urlencoded, multipart/form-data,
    application/xml вместо application/json; или наоборот). Важно и для безопасности: text/plain и form-urlencoded - простые
    кросс-доменные запросы без preflight (CSRF).'
  category: validation
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Отправить корректное по содержанию тело с Content-Type text/plain, application/x-www-form-urlencoded, multipart/form-data,
      application/xml, без Content-Type, с application/json; charset=utf-16.
  - action: Передать синтаксически неверный media type и проверить схему тела ошибки, а не только статус
    notes: 'Real-world bug: RWB-0140 (nestjs/nest#15022)'
  - action: Синтаксически некорректный (а не просто неподдерживаемый) Content-Type и пустое значение
    notes: 'Real-world bug: RWB-0140 (keycloak/keycloak#49964)'
  expected:
  - 415 Unsupported Media Type (RFC 9110 п. 15.5.16), желательно с заголовком Accept или Accept-Post со списком допустимых
    типов; 400 - отклонение от стандарта, если не оговорено моделью ошибок проекта.
  - Тело не разбирается как JSON вопреки заголовку; побочных эффектов нет.
  - Одинаковое поведение во всех операциях с телом.
  applicability:
    when:
    - операция принимает тело запроса
    skip_when:
    - operation is not supported by the API
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - RFC 9110 15.5.16
  - docs/decisions/0002-expected-behavior-sources.md
  - 'Real-world bug: RWB-0140'
