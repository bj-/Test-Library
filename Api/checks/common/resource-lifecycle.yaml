- id: RES-READ-AFTER-WRITE
  status: approved
  title: Чтение после записи соответствует модели согласованности
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: reliability
  priority: P2
  tags:
  - data-integrity
  - reliability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть реплики, кэши или асинхронная обработка.
  steps:
  - action: Сразу после записи прочитать ресурс многократно из разных узлов.
  - action: Создать родительский контейнер и сразу создать в нём объект, подпадающий под политику допуска, повторив много
      раз, и проверить отсутствие ложного 404
    notes: 'Real-world bug: RWB-0228 (kubernetes/kubernetes#135352)'
  expected:
  - Сильная согласованность или задокументированное окно eventual consistency.
  applicability:
    when:
    - Распределённое хранение.
    skip_when:
    - Одна БД без кэша.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0228'
- id: RES-BULK-LIMITS
  status: approved
  title: Массовые операции соблюдают лимиты и сообщают о каждом элементе
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P2
  tags:
  - boundary
  - data-integrity
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть bulk-операции.
  steps:
  - action: Отправить пустой пакет, пакет максимального размера, max+1, с дубликатами.
  - action: Добавить дубликаты и несуществующие ID в массовой операции и сравнение поведения ролей
    notes: 'Real-world bug: RWB-0100 (directus/directus#27863)'
  - action: Пустой список ключей не означает «все записи»
    notes: 'Real-world bug: RWB-0100 (directus/directus#27514)'
  - action: Добавить пустой список в массовой операции и сравнение ответа для разных ролей
    notes: 'Real-world bug: RWB-0100 (directus/directus#26754)'
  expected:
  - Лимиты соблюдаются; результат по каждому элементу задокументирован.
  applicability:
    when:
