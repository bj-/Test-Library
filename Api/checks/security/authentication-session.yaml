- id: AUTH-PASSWORD-POLICY
  status: approved
  title: Политика паролей применяется на сервере
  category: security
  protocols:
  - rest
  - graphql
  kind: negative
  priority: P2
  tags:
  - security
  - negative
  - authn
  - validation
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть установка или смена пароля.
  steps:
  - action: Установить пароль короче минимума, из словаря утечек, совпадающий с логином, очень длинный (1000+ символов), с
      unicode.
  - action: Режим с ограниченным криптопровайдером (FIPS), пароль короче его внутреннего минимума — ошибка политики, а не
      5xx; проверить все пути (смена, сброс, обязательное обновление)
    notes: 'Real-world bug: RWB-0062 (keycloak/keycloak#51674)'
  expected:
  - Слабые пароли отклоняются сервером независимо от клиента.
  - Очень длинный пароль не вызывает деградации (DoS хеширования).
  applicability:
    when:
    - Есть пароли.
    skip_when:
    - Нет парольной аутентификации.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
