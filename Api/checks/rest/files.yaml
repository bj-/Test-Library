  steps:
  - action: Многократно начинать multipart-загрузку и обрывать соединение на разных этапах.
  - action: Проверить квоту, список файлов и занятое место.
  expected:
  - Прерванные загрузки не оставляют файлов и не учитываются в квоте.
  applicability:
    when:
    - Есть загрузка файлов.
    skip_when:
    - Нет загрузки.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - OWASP API4:2023
  - CWE-459
  - 'Real-world bug: RWB-0048'
