checks:
- id: REST-OPEN-REDIRECT
  status: approved
  title: Валидация redirect URL
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - security
  - negative
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Добавить опасные схемы (javascript:, data:)
    notes: 'Real-world bug: RWB-0125 (expressjs/express#6614)'
  - action: Параметры внутри redirect URI и кодированные имена параметров (регрессия от защитного фикса)
    notes: 'Real-world bug: RWB-0125 (keycloak/keycloak#51712)'
  - action: Редирект на внутренний маршрут, где пользовательское значение — сегмент пути; проверить scheme-relative '//host'
    notes: 'Real-world bug: RWB-0125 (GHSA-2m6q-8v3h-jqww)'
  - action: Передать URL возврата с сегментами ./ и ../
    notes: 'Real-world bug: RWB-0125 (GHSA-3rqh-hch3-jhpc)'
  - action: Передать URL возврата с табуляцией или переводом строки между //
    notes: 'Real-world bug: RWB-0125 (GHSA-463r-5m89-4xfr)'
  - action: Подставить внешний URL в cookie сохранённого запроса и выполнить вход
    notes: 'Real-world bug: RWB-0125 (GHSA-x2r2-rvhq-2mqv)'
  - action: 'Запросить путь с префиксом redirect: и внешним URL'
    notes: 'Real-world bug: RWB-0125 (GHSA-h3qp-gqrc-q736)'
  - action: Передать в адресе возврата после входа протокол-относительный URL //host/path
    notes: 'Real-world bug: RWB-0125 (GHSA-5jch-xhw4-r43v)'
  - action: Передать адрес возврата с CR/LF и @ перед чужим хостом и пустой адрес возврата
    notes: 'Real-world bug: RWB-0125 (GHSA-7pwc-wh6m-44q3)'
  - action: Отправить не-GET запрос с истёкшей сессией и чужим Referer и проверить Location
    notes: 'Real-world bug: RWB-0125 (GHSA-jp94-3292-c3xv)'
  - action: Передать в сегмент пути резолвера префикс, который сервер разворачивает во внешний URL (интервики, алиас), и цель
      с user:pass@host; проверить Location
    notes: 'Real-world bug: RWB-0125 (GHSA-hw3m-8j5x-94ff)'
  - action: Открыть форму с внешним заголовком Referer и отправить её с возвратом «назад»; проверить, что Location не ведёт
      на внешний адрес
    notes: 'Real-world bug: RWB-0125 (GHSA-wg2f-x2c2-c4rp)'
  expected:
  - разрешены только адреса по allowlist/политике
  applicability:
    when:
    - API принимает returnUrl/redirectUri
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0125'
