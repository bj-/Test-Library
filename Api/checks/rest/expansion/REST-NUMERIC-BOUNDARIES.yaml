checks:
- id: REST-NUMERIC-BOUNDARIES
  status: approved
  title: Числовые границы
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: boundary
  priority: P1
  tags:
  - boundary
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Добавить переполнение в арифметике времени (метка времени + длительность) для параметров срока
    notes: 'Real-world bug: RWB-0123 (keycloak/keycloak#52491)'
  - action: Добавить числа больше 2^53 и с высокой точностью в полях с правилами валидации
    notes: 'Real-world bug: RWB-0123 (directus/directus#26448)'
  - action: Отправить в поле с беззнаковым 32-битным диапазоном значения 2147483648 и 4294967295 и проверить, что они принимаются,
      а 4294967296 отклоняется
    notes: 'Real-world bug: RWB-0123 (kubernetes/kubernetes#138525)'
  - action: 'Отправить в поле со схемой type: integer, format: int32 значение 2147483648, а в поле type: number, format: float
      — 3.5e+38 и проверить отказ'
    notes: 'Real-world bug: RWB-0123 (kubernetes/kubernetes#136091)'
  - action: Отправить в поле-количество строку 9223372036854775807 и проверить, что значение сохраняется, читается и используется
      в правилах валидации без искажения
    notes: 'Real-world bug: RWB-0123 (kubernetes/kubernetes#135487)'
  - action: Передать в числовой параметр фильтра или идентификатор значение больше 2^63-1 и дробное число, сравнить время
      ответа с обычным значением
    notes: 'Real-world bug: RWB-0123 (GHSA-579w-22j4-4749)'
  - action: Отправить значение ниже отрицательного минимума (min = -1, значение -15) и на границе (-1, -1.0001)
    notes: 'Real-world bug: RWB-0123 (strapi/strapi#24861)'
  expected:
  - inclusive/exclusive границы соблюдаются
  applicability:
    when:
    - есть minimum/maximum
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0123'
