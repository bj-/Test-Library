- id: INJ-SSRF-PARAMETERS
  status: approved
  title: Параметры с URL и хостами не дают доступа к внутренней сети
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API принимает URL для загрузки, превью, импорта или вебхуков.
  steps:
  - action: Передать http://169.254.169.254/, http://localhost, внутренние DNS-имена, IPv6, десятичную запись IP, редирект
      на внутренний адрес, file://, gopher://.
  - action: URL спрятан в base64/JSON сегменте пути; слепой SSRF с побочным каналом через статус ответа
    notes: 'Real-world bug: RWB-0090 (GHSA-q8hw-4fvp-9rwv)'
  - action: Адрес задаётся заголовком запроса, сервер прикладывает к исходящему вызову свои учётные данные
    notes: 'Real-world bug: RWB-0090 (GHSA-2h44-8472-frjj)'
  - action: URL приходит не из параметра запроса, а из конфигурации в пользовательском источнике (манифест, репозиторий)
    notes: 'Real-world bug: RWB-0090 (GHSA-q38j-6vcm-2f5m)'
  - action: Параметр базового URL сторонней интеграции - проверять не только доступ к внутренней сети, но и утечку серверного
      токена интеграции на подконтрольный внешний адрес
    notes: 'Real-world bug: RWB-0090 (GHSA-g734-fhp4-7mfp)'
  - action: Хост/адрес проверяется по allowlist уже на эндпоинте регистрации (запись), а не только там, где его потом используют
    notes: 'Real-world bug: RWB-0090 (keycloak/keycloak#52167)'
  - action: allowlist типов/схем источника должен применяться и при фоновой обработке, и для ссылок, найденных внутри принятого
      источника
    notes: 'Real-world bug: RWB-0090 (GHSA-pcmq-25r3-5w9v)'
  - action: Код языка/локали, подставляемый в шаблон URL серверной загрузки
    notes: 'Real-world bug: RWB-0090 (GHSA-xvq9-wjp8-hwqf)'
  - action: Фрагмент хоста (регион, поддомен) из параметра — символы '#', ':', '/', '@' и утечка пересылаемых учётных данных
    notes: 'Real-world bug: RWB-0090 (GHSA-6mwv-4mrm-5p3m)'
  - action: Доменное имя, резолвящееся во внутренний/метаданных адрес (wildcard-DNS), — не только IP-литералы
    notes: 'Real-world bug: RWB-0090 (GHSA-798p-78g2-v556)'
  - action: Вложенные ссылки в загружаемых документах ($ref) и записи IPv4-mapped IPv6, DNS-имена, редиректы
    notes: 'Real-world bug: RWB-0090 (GHSA-65h7-9wrw-629c)'
  - action: Расхождение парсеров URL — Unicode-пробелы (U+00A0, U+FEFF) перед // превращают относительный путь в внешний хост
    notes: 'Real-world bug: RWB-0090 (GHSA-f6mr-pjwc-34m4)'
  - action: Отправить в поле типа IP-адреса имя хоста под контролем тестировщика и проверить по журналу DNS, что сервер не
      разрешает его при разборе
    notes: 'Real-world bug: RWB-0090 (GHSA-vvgp-rfg2-7rr6)'
  - action: Создать и запустить сценарий, в шаблоне которого функция HTTP-запроса обращается к адресу облачных метаданных,
      и проверить отказ
    notes: 'Real-world bug: RWB-0090 (GHSA-r56g-q4p6-m3p6)'
  - action: Указать внутренний адрес в заголовках адреса ответа (WS-Addressing ReplyTo, FaultTo)
    notes: 'Real-world bug: RWB-0090 (GHSA-whpp-xv3h-rwxf)'
  - action: Передать в параметре, который сервер подставляет в путь исходящего запроса, протокол-относительный адрес //host/path
    notes: 'Real-world bug: RWB-0090 (GHSA-33mh-2634-fwr2)'
  - action: Отправить содержимое с директивой импорта (@import url(...)) на внутренний адрес и на внешний адрес с редиректом
      на file://
    notes: 'Real-world bug: RWB-0090 (GHSA-9pmc-p236-855h)'
  - action: Отправить данные, поле которых подставляется в шаблон адреса исходящей доставки, с внутренним хостом в этом поле
    notes: 'Real-world bug: RWB-0090 (GHSA-72f5-rr8c-r6gr)'
  - action: Передать абсолютный URL в поле-идентификаторе, которое сервер подставляет в путь запроса к внешнему API, и проверить,
      что запрос с серверными заголовками не уходит на чужой хост
    notes: 'Real-world bug: RWB-0090 (GHSA-hm5p-x4rq-38w4)'
  - action: Передать URL с адресами CGNAT (100.64.0.0/10), IPv6 site-local (fec0::/10) и IPv6 перехода, встраивающими 169.254.169.254,
      и проверить отказ
    notes: 'Real-world bug: RWB-0090 (GHSA-w98g-5w9p-p3rc)'
  - action: Вызвать RPC загрузки по URL без аутентификации с внутренним адресом и проверить отказ и отсутствие ответа цели
      в сохранённых данных
    notes: 'Real-world bug: RWB-0090 (GHSA-87fv-vqqr-m4jr)'
  - action: Передать в параметре-хосте, который сервер подставляет в шаблон исходящего URL, значения с путём, схемой, userinfo,
      query, fragment и «//внешний.хост» и проверить отказ на валидации
    notes: 'Real-world bug: RWB-0090 (GHSA-4p3g-4hcj-wpvx)'
  - action: Создать объект с аннотацией адреса внешнего сервиса, указывающей на подконтрольный адрес, и проверить, что сервер
      туда не обращается и не передаёт токены
    notes: 'Real-world bug: RWB-0090 (GHSA-r2v3-8gwf-7ghm)'
  - action: Отправить заголовок Signature с keyId на внутренний адрес (127.0.0.1, 169.254.169.254) и проверить, что сервер
      не обращается к нему
    notes: 'Real-world bug: RWB-0090 (GHSA-vw42-752g-5mrp)'
  - action: Передать внутренний IPv4, вложенный в IPv6-адрес NAT64 (64:ff9b::/96), в параметрах с URL и URL вебхуков
    notes: inbox №149
  expected:
  - Запросы к внутренним адресам и неразрешённым схемам блокируются, в том числе после редиректа и DNS rebinding.
  applicability:
    when:
    - Есть серверная загрузка по URL.
    skip_when:
    - URL не принимаются.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0090'
