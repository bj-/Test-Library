- id: AUTH-PASSWORD-RESET-TOKEN
  status: approved
  title: Токен сброса пароля одноразовый, ограничен по времени и привязан к пользователю
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P0
