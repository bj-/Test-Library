checks:
- id: REST-ACCEPT-NEGOTIATION
  title: Согласование Accept
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - contract
  - negative
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - поддерживаемый тип возвращается корректно; неподдерживаемый обрабатывается по
    контракту
  applicability:
    when:
    - операция поддерживает content negotiation
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
