checks:
- id: SEC-TENANT-HEADER-SPOOF
  title: Untrusted tenant header cannot override identity context
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - ci
  - regression
  - release
  preconditions: &id001
  - Tenant context is passed via headers or request metadata.
  steps:
  - action: Authenticate in tenant A and set tenant-identifying headers to tenant B.
    notes: 'Matrix axis: Tenant isolation; scenario: Tenant header spoofing. Use isolated synthetic identities and data.'
  expected:
  - Tenant scope is derived from trusted validated context; spoofed header is ignored or rejected.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when: *id001
    skip_when:
    - No client-supplied tenant context is accepted.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
