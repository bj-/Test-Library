checks:
- id: REST-SENSITIVE-DATA
  status: approved
  title: Отсутствие чувствительных данных в ответах
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - security
  - contract
  - rest
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Маскирование секрета зависит от роли и должно совпадать между версиями API
    notes: 'Real-world bug: RWB-0133 (keycloak/keycloak#52197)'
  - action: Перевести клиент, отражаемый публичным эндпоинтом конфигурации, в конфиденциальный режим и проверить, что ответ
      без аутентификации не содержит секрет
    notes: 'Real-world bug: RWB-0133 (keycloak/keycloak#45728)'
  expected:
  - секреты и чужие данные не возвращаются в success/error responses
  applicability:
    when:
    - модель содержит секретные/внутренние поля
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0133'
