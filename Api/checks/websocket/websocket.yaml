  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: WS-SUBSCRIPTION-AUTHZ
  status: approved
  title: Подписки и сообщения авторизуются по каждому каналу
  category: websocket
  protocols:
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - authz
  - ownership
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Каналы на уровне пользователей и тенантов.
  steps:
  - action: Подписаться на канал другого пользователя или тенанта; отправить сообщение в чужой канал.
  - action: Перебор всех типов действий протокола (включая пакетные PATCH_MULTI и аналоги) — действие без явного правила должно
      запрещаться
    notes: 'Real-world bug: RWB-0179 (GHSA-89vx-jh4q-vg3w)'
  expected:
  - Подписка и отправка отклоняются.
  applicability:
    when:
    - Есть каналы.
    skip_when:
    - Один общий канал.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0179'
- id: WS-TOKEN-EXPIRY
  status: approved
  title: Истечение или отзыв токена учитывается в открытом соединении
  category: websocket
  protocols:
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - token-lifecycle
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Долгие соединения.
  steps:
  - action: Держать соединение дольше срока жизни токена; отозвать токен.
  expected:
  - Соединение закрывается или требует обновления токена.
  applicability:
    when:
    - Есть долгие соединения.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: WS-MESSAGE-LIMITS
  status: approved
  title: Размер и частота сообщений ограничены
  category: websocket
  protocols:
  - websocket
  kind: negative
  priority: P2
  tags:
  - negative
  - rate-limiting
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Нет.
  steps:
  - action: Отправить сообщение 10MB и 1000 сообщений в секунду.
  - action: Отправить сообщение из множества мелких кадров продолжения без FIN и проверить, что суммарный размер ограничен
    notes: 'Real-world bug: RWB-0205 (GHSA-7ppr-r889-mcf2)'
  expected:
  - Соединение закрывается с кодом 1009/1008 или сообщения отклоняются.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0205'
- id: WS-MALFORMED-MESSAGE
  status: approved
  title: Некорректные сообщения не рвут соединение без ответа
  category: websocket
  protocols:
  - websocket
  kind: negative
  priority: P2
  tags:
