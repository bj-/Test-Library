checks:
- id: REST-FILTER-SORT-PAGINATION
  status: approved
  title: Комбинация filter/sort/pagination
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: pagination
  protocols:
  - rest
  kind: positive
  priority: P1
  tags:
  - filtering
  - pagination
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Пустые значения sort и ручной порядок связей при пагинации
    notes: 'Real-world bug: RWB-0119 (strapi/strapi#26577)'
  - action: Исходный баг серии strapi#26577/26550/26465 — пруф к тому же варианту
    notes: 'Real-world bug: RWB-0119 (strapi/strapi#26426)'
  - action: Запросить сортировку с явным порядком null (nullslast, nullsfirst) вместе с limit и offset, в том числе для вложенного
      ресурса
    notes: 'Real-world bug: RWB-0119 (PostgREST/postgrest#4109)'
  expected:
  - все элементы соответствуют фильтру; порядок стабилен; нет пропусков/дублей
  applicability:
    when:
    - поддерживаются минимум два механизма коллекции
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0119'
