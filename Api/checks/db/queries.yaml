checks:
- id: DB-QUERY-INDEX-USAGE
  status: draft
  title: Запросы приложения используют подходящие индексы на реалистичном объёме
  category: db
  protocols:
  - db
  kind: performance
  priority: P2
  tags:
  - db
  - performance
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается осознанно.
  - Нужен стенд с реалистичным объёмом данных.
  steps:
  - action: Получить планы каждого запроса приложения на наполненной БД — индексы на фильтрах и сортировках, время в пределах НФТ
    notes: 'inbox №140'
  - action: Сравнить integer-колонку с параметром numeric — индекс используется, нет последовательного сканирования
    notes: 'inbox №186'
  - action: Выполнить поиск подстроки без учёта регистра по большой таблице — подходящий индекс, а не полное сканирование всех текстовых колонок
    notes: 'inbox №195'
  - action: Проверить индексы колонок внешних ключей таблиц журнала — удаление старых записей не сканирует таблицу
    notes: 'inbox №198'
  - action: Выполнить поиск по email без учёта регистра (ilike, lower) по большой таблице пользователей — используется индекс
    notes: 'inbox №258'
  - action: Отфильтровать по JSON-пути из API — используется функциональный индекс на выражение, без лишнего приведения типа
    notes: 'inbox №310'
  expected:
  - Планы выполнения запросов приложения используют индексы на фильтрах, сортировках и внешних ключах; полного сканирования из-за приведения типов нет.
  applicability:
    when:
    - Есть доступ к планам запросов.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация СУБД (EXPLAIN)
  - Смежная — PERF-DEEP-PAGINATION
  - ADR 0006 (проверки БД)
- id: DB-GENERATED-SQL-SHAPE
  status: draft
  title: Генерируемый SQL не выполняет лишней работы
  category: db
  protocols:
  - db
  kind: performance
  priority: P3
  tags:
  - db
  - performance
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается осознанно.
  steps:
  - action: Выполнить массовую вставку с вложенными связанными записями — пакетные запросы, а не отдельный запрос на строку
    notes: 'inbox №167'
  - action: Изменить строку широкой таблицы — UPDATE … RETURNING выбирает только запрошенные колонки
    notes: 'inbox №175'
  - action: Отфильтровать по связи один-ко-многим — генерируемый SQL использует EXISTS или semi-join
    notes: 'inbox №177'
  - action: Выполнить сводный запрос с заведомо ложным условием — самосоединения таблицы нет
    notes: 'inbox №277'
  expected:
  - Фильтры по связям — EXISTS или semi-join без размножения строк; RETURNING — только нужные колонки; заведомо пустые условия не порождают соединений; вставки пакетные.
  applicability:
    when:
    - Есть генерация SQL (ORM, API по схеме БД).
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Смежная — REST-FILTER-RELATION-NO-DUPLICATES
  - ADR 0006 (проверки БД)
- id: DB-IDENTIFIER-QUOTING
  status: draft
  title: Имена объектов БД экранируются во всех служебных и генерируемых запросах
  category: db
  protocols:
  - db
  kind: boundary
  priority: P2
  tags:
  - db
  - boundary
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается осознанно.
  steps:
  - action: Создать столбцы и таблицы с кавычками, скобками и спецсимволами — экранируются или отклоняются во всех местах генерации запросов и кода
    notes: 'inbox №151'
  - action: Создать таблицы, представления и функции с метасимволами regex в имени — инструменты работы со схемой их поддерживают
    notes: 'inbox №163'
  - action: Создать таблицу с именем встроенного типа (text, int, json) — генерация схемы по БД не ломается
    notes: 'inbox №172'
  - action: Создать объекты и типы в верхнем регистре и со спецсимволами — экранируются, включая приведение к массиву типа
    notes: 'inbox №176'
  - action: Создать схемы, таблицы и роли в смешанном регистре — служебные запросы используют quote_ident
    notes: 'inbox №295'
  - action: Создать объект с именем зарезервированного слова (функция «true») — служебные запросы его экранируют
    notes: 'inbox №298'
  - action: Создать таблицу в смешанном регистре — nextval() по последовательности ключа вызывается с экранированным именем
    notes: 'inbox №299'
  expected:
  - Имена в смешанном регистре, со спецсимволами, совпадающие с типами и зарезервированными словами, работают во всех местах; ошибок разбора нет.
  applicability:
    when:
    - Есть генерация запросов по схеме.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - SQL-стандарт — delimited identifiers
  - Смежная — RES-DB-OBJECT-NAMES
  - ADR 0006 (проверки БД)
- id: DB-DYNAMIC-SQL-PARAMETERIZED
  status: draft
  title: Значения и идентификаторы из ввода и из БД попадают в SQL параметрами или по allowlist
  category: db
  protocols:
  - db
  kind: security
  priority: P1
  tags:
  - db
  - security
  - injection
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается осознанно.
  steps:
  - action: Проверить динамический SQL (crosstab, COPY) — строится с параметрами и quote_ident, а не конкатенацией сохранённых имён
    notes: 'inbox №155'
  - action: Передать ключи JSON-путей и идентификаторы колонок из ввода — экранируются или проверяются по allowlist
    notes: 'inbox №157'
  - action: Искать по началу, концу и вхождению значениями с %, _ и символом экранирования — LIKE-шаблон экранирован
    notes: 'inbox №158'
  - action: Вызвать функции запросов, доступные из шаблонов, — связанные параметры и дескриптор только для чтения
    notes: 'inbox №238'
  - action: Сохранить значение с SQL и вызвать операцию, повторно подставляющую его из БД, — передаётся параметром (вторичная инъекция)
    notes: 'inbox №239'
  - action: Передать в сортировку имя столбца вне списка — ORDER BY берёт идентификаторы только из allowlist
    notes: 'inbox №244'
  - action: Передать имя базы или коллекции с точкой или NUL-байтом — операция не переадресуется в другую коллекцию
    notes: 'inbox №248'
  - action: Сформировать литералы из чисел и дат при разных региональных настройках — они экранируются и не меняют смысл запроса
    notes: 'inbox №292'
  expected:
  - Значения — связанными параметрами; идентификаторы — quote_ident или allowlist; LIKE-шаблоны экранированы; литералы не зависят от локали; инъекции нет.
  applicability:
    when:
    - Есть доступ к журналу запросов или коду запросов.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: high
    likelihood: medium
  references:
  - CWE-89
  - Смежные — INJ-SQL, INJ-SCHEMA-IDENTIFIER-CODEGEN
  - ADR 0006 (проверки БД)
- id: DB-CATALOG-INTROSPECTION
  status: draft
  title: Чтение каталога схемы корректно и укладывается во время на больших схемах
  category: db
  protocols:
  - db
  kind: performance
  priority: P3
  tags:
  - db
  - performance
  - regression
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается осознанно.
  - Нужна БД с тысячами таблиц и минимальная поддерживаемая версия СУБД.
  steps:
  - action: Прочитать каталог схемы на БД с тысячами таблиц — время приемлемое
    notes: 'inbox №165'
  - action: Создать внешний ключ секционированной таблицы — копии ограничения в секциях распознаются как одна связь
    notes: 'inbox №174'
  - action: Выполнить интроспекцию на минимальной поддерживаемой версии СУБД — без функций новых версий (JSON_TABLE в MySQL 5.7)
    notes: 'inbox №179'
  - action: Выполнить серию операций — метаданные схемы из системных каталогов не читаются заново на каждую
    notes: 'inbox №203'
  - action: Посчитать по журналу (pg_stat_statements) запросы к редко меняющимся каталогам — не выполняются при каждой перезагрузке кэша
    notes: 'inbox №297'
  - action: Проверить соединение описаний объектов по идентификатору и классу объекта — одна функция не дублируется
    notes: 'inbox №311'
  expected:
  - Запросы к каталогу быстрые, не повторяются на каждую операцию, работают на минимальной версии СУБД и не дают дублей объектов.
  applicability:
    when:
    - Сервис читает схему БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация СУБД (системные каталоги)
  - ADR 0006 (проверки БД)
