checks:
- id: FILE-UPLOAD-SIZE-LIMIT
  status: approved
  title: Лимит размера загружаемого файла соблюдается
  category: files
  protocols:
  - rest
  kind: boundary
  priority: P1
  tags:
  - boundary
  - files
  - validation
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть загрузка файлов.
  steps:
  - action: Загрузить файлы размером max-1, max, max+1 байт и значительно больше.
  expected:
  - За лимитом ответ 413 или задокументированная ошибка без полной буферизации и 5xx.
  applicability:
    when:
    - Есть загрузка.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: FILE-UPLOAD-TYPE-VALIDATION
  status: approved
  title: Тип файла проверяется по содержимому, а не только по расширению
  category: files
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - negative
  - files
  - security
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Разрешён ограниченный набор типов.
  steps:
  - action: Загрузить исполняемый файл с расширением .jpg, корректный файл с неверным Content-Type, polyglot-файл, HTML и
      SVG вместо изображения.
  - action: Согласованность проверки на альтернативных путях загрузки (TUS, импорт по URL)
    notes: 'Real-world bug: RWB-0073 (directus/directus#27784)'
  expected:
  - Запрещённые типы отклоняются; сохранённый файл отдаётся с безопасным Content-Type.
  applicability:
    when:
    - Есть загрузка.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0073'
- id: FILE-FILENAME-SANITIZATION
