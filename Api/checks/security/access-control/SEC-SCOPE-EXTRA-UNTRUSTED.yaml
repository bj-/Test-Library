checks:
- id: SEC-SCOPE-EXTRA-UNTRUSTED
  status: approved
  title: Client cannot add scopes by request parameter
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Scope-based authorization exists.
  steps:
  - action: Attempt to supply extra scopes or permission claims in query, body, or untrusted headers.
    notes: 'Matrix axis: Roles/Scopes; scenario: Scope injection. Use isolated synthetic identities and data.'
  - action: Запросить лишний scope в каждом grant-типе, включая device flow, и проверить единообразие ошибки invalid_scope
    notes: 'Real-world bug: RWB-0154 (keycloak/keycloak#52785)'
  - action: 'Позитивный вариант для token exchange: разрешённый scope выдаётся, неразрешённый — нет'
    notes: 'Real-world bug: RWB-0154 (keycloak/keycloak#49952)'
  - action: Согласованность проверки scope между grant type (позитивная и негативная сторона)
    notes: 'Real-world bug: RWB-0154 (keycloak/keycloak#49388)'
  - action: Обменять токен через token exchange на токен другого приложения с более широкими scope и проверить отказ
    notes: 'Real-world bug: RWB-0154 (GHSA-vrh8-c9cm-wh8v)'
  expected:
  - Only trusted issuer/server-side authorization grants determine effective scopes.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Scope-based authorization exists.
    skip_when:
    - No scope-based authorization exists.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0154'
