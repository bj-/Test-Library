- id: RES-DRAFT-PUBLISH-FIDELITY
  status: draft
  title: Публикация черновика переносит все изменения и не ломает связи других объектов
  category: resources
  protocols:
  - rest
  - graphql
  kind: positive
  priority: P2
  tags:
  - positive
  - data-integrity
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Ресурсы имеют черновик и опубликованную версию; есть упорядоченные связи, в том числе между типами с разными режимами
    (локализация, draft/publish).
  steps:
  - action: Опубликовать A со связями на B и C в порядке B, C; в черновике изменить поля и порядок; опубликовать повторно.
  - action: Изменить и опубликовать B; прочитать опубликованную версию A по REST и GraphQL.
  - action: Связать ресурсы разных режимов и опубликовать каждую сторону.
  expected:
  - Опубликованная версия совпадает с черновиком, включая порядок связей.
  - Публикация B не удаляет его из связей A; публикация между типами с разными режимами успешна.
  applicability:
    when:
    - Есть жизненный цикл черновик/публикация.
    skip_when:
    - Нет версий публикации.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Здравый смысл — публикация есть копия черновика
  - 'Real-world bug: RWB-0015'
- id: RES-RELATION-ORDER-STABLE
  status: draft
  title: Изменение связанного ресурса не меняет ручной порядок связей у другой стороны
  category: resources
  protocols:
  - rest
