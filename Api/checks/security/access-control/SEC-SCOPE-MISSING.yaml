checks:
- id: SEC-SCOPE-MISSING
  title: Token without required scope is denied
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - ci
  - regression
  - release
  preconditions: &id001
  - OAuth or scope-based access control is used and operation requires a scope.
  steps:
  - action: Use a valid token lacking the required scope for the operation.
    notes: 'Matrix axis: Roles/Scopes; scenario: Missing scope. Use isolated synthetic identities and data.'
  expected:
  - Request is denied according to the API’s scope policy; no protected side effect occurs.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when: *id001
    skip_when:
    - Authorization does not use scopes.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
