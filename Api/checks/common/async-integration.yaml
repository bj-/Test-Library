checks:
- id: ASYNC-WEBHOOK-SIGNATURE
  status: approved
  title: Вебхуки подписаны, подпись проверяется, повтор отклоняется
  category: async
  protocols:
  - rest
  - graphql
  kind: security
  priority: P0
  tags:
  - security
  - webhooks
  - authn
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API отправляет или принимает вебхуки.
  steps:
  - action: Проверить подпись исходящего вебхука; отправить входящий вебхук без подписи, с неверной подписью, со старым timestamp,
      повторно.
  expected:
  - Без валидной подписи и в пределах окна времени вебхук отклоняется; повтор распознаётся.
  applicability:
    when:
    - Есть вебхуки.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
- id: ASYNC-WEBHOOK-URL-SSRF
  status: approved
  title: URL вебхука не может указывать на внутренние адреса
  category: async
  protocols:
