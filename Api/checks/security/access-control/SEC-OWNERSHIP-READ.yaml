checks:
- id: SEC-OWNERSHIP-READ
  status: approved
  title: User cannot read another owner’s resource
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - smoke
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Resource has owner-level access restrictions; users A and B and resource A exist.
  steps:
  - action: As user B, read a resource owned by user A by substituting its identifier.
    notes: 'Matrix axis: Resource ownership; scenario: Cross-owner read. Use isolated synthetic identities and data.'
  - action: Косвенное чтение через clone/copy/duplicate — права проверяются и на источник, а не только на место назначения
    notes: 'Real-world bug: RWB-0150 (GHSA-8xcj-9hfr-fh9j)'
  - action: Запросить сессии другого пользователя по его идентификатору через эндпоинт управления сессиями
    notes: 'Real-world bug: RWB-0150 (GHSA-vvhj-w2jq-263q)'
  - action: Запросить ресурс, созданный гостем, по его идентификатору без токена гостя и с токеном другого гостя
    notes: 'Real-world bug: RWB-0150 (GHSA-p6pv-q7rc-g4h9)'
  - action: Анонимно запросить по ID объект, созданный другим анонимным пользователем, — пустой владелец не должен совпадать
      с пустым текущим пользователем
    notes: 'Real-world bug: RWB-0150 (GHSA-3ghg-3787-w2xr)'
  - action: Подставить чужой последовательный ID заказа в публичный эндпоинт без сессии и проверить, что ни заголовок Location
      редиректа, ни тело не содержат токен доступа к чужому заказу
    notes: 'Real-world bug: RWB-0150 (GHSA-x83g-979r-f5fh)'
  - action: Запросить список объектов модуля от пользователя без прав администратора и проверить, что в нём нет объектов и
      подписанных ссылок других пользователей
    notes: 'Real-world bug: RWB-0150 (GHSA-q6wp-fr43-gm9v)'
  - action: Передать ID другого пользователя в унаследованные действия эндпоинта «мой профиль» (просмотр, редактирование)
    notes: 'Real-world bug: RWB-0150 (GHSA-mpmw-f6h6-3g26)'
  - action: Запросить список с фильтром по чужому владельцу (user=<id>, users[]=<id>) пользователем, которому чтение отдельных
      записей этого владельца запрещено
    notes: 'Real-world bug: RWB-0150 (GHSA-4m8q-55qv-9pwp)'
  - action: Повторить чтение и изменение чужого ресурса ролью «только свои» через каждую версию API
    notes: 'Real-world bug: RWB-0150 (GHSA-2jrw-c95w-h43g)'
  expected:
  - Deny or conceal the resource according to policy; response contains no owner data and no side effect occurs.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Resource has owner-level access restrictions; users A and B and resource A exist.
    skip_when:
    - Resource is public or shared with user B by an explicit grant.
  automation:
    level: full
    deterministic: true
  profiles:
  - Smoke
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0150'
