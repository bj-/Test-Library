checks:
- id: REST-BATCH-PARTIAL-FAILURE
  title: Частичный сбой batch
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - reliability
  - contract
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - частичный успех или атомарный отказ соответствуют контракту; результаты однозначны
  applicability:
    when:
    - есть batch/multi-action operation
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
