- id: DB-SERVICE-ROLE-LEAST-PRIVILEGE
  status: approved
  title: Роль подключения сервиса имеет минимальные права
  category: db
  protocols:
  - db
  kind: security
  priority: P1
  tags:
  - db
  - security
  - authz
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Проверить роль подключения сервиса — права на схему API только у переключаемых ролей
    notes: inbox №308
  - action: Выполнить каждую DDL-команду (DROP и ALTER столбца, переименование, наследование, ограничения) ролью без права
      изменения схемы — отказ
    notes: inbox №153
  expected:
  - Права на схему API — только у переключаемых ролей; DDL выполняется только ролями с нужными для операции правами (по модели
    прав СУБД).
  applicability:
    when:
    - Есть доступ к ролям БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP ASVS V14.1
  - Документация СУБД (GRANT)
  - ADR 0006 (проверки БД)
- id: DB-ROLE-SWITCH-SETTINGS
  status: approved
  title: При переключении роли применяются только допустимые для неё настройки
  category: db
  protocols:
  - db
  kind: security
  priority: P2
  tags:
  - db
  - security
  - ci
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Переключиться (SET ROLE) на непривилегированную роль — приложение не пытается применить параметры только для суперпользователя
    notes: inbox №304
  - action: Задать настройки роли (ALTER ROLE … SET) с регистрозависимыми значениями — применяются без изменения регистра
    notes: inbox №296
  expected:
  - При SET ROLE не применяются параметры, недоступные роли; настройки роли (ALTER ROLE … SET) применяются без изменения регистра.
  applicability:
    when:
    - Сервис переключает роли БД.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Документация СУБД (SET ROLE, ALTER ROLE)
  - ADR 0006 (проверки БД)
