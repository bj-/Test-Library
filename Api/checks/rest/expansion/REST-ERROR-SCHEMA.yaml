  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - contract
  - negative
  - rest
  - ci
  - regression
  - nightly
  - release
