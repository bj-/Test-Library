    likelihood: medium
- id: HARD-EXCESSIVE-DATA-EXPOSURE
  status: approved
  title: Ответы не содержат внутренних полей сверх контракта
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - contract
  - privacy
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Схемы ответов описаны в контракте.
  steps:
  - action: Сравнить фактические поля ответов со схемой для всех ролей.
  - action: 'Вариант для токенов: состав claims по политике проверить для каждого типа grant, а не только основного'
    notes: 'Real-world bug: RWB-0076 (keycloak/keycloak#51137)'
  - action: Ответы о фоновых задачах (статус, шаги, журнал) — без секретов контекста выполнения
    notes: 'Real-world bug: RWB-0076 (GHSA-g2v8-7jhw-pp8p)'
  - action: Ответы auth-эндпоинтов (refresh, reset, verify), обходящие общую фильтрацию полей
    notes: 'Real-world bug: RWB-0076 (GHSA-xgv3-crq2-6f69)'
  expected:
  - 'Нет недокументированных полей: внутренних id, флагов, хешей паролей, служебных метаданных.'
  applicability:
    when:
    - Есть схемы ответов.
    skip_when:
    - Схемы отсутствуют.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0076'
- id: HARD-ID-PREDICTABILITY
  status: approved
  title: Предсказуемые идентификаторы не позволяют собрать данные перебором
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - enumeration
  - ci
  - regression
  - nightly
  preconditions:
  - Используются последовательные числовые id.
  steps:
  - action: Перебрать соседние id от имени пользователя без прав.
  - action: Сравнить ответы для существующих и несуществующих id.
  expected:
  - Ответы для чужих и несуществующих id неразличимы по политике.
  - Нельзя оценить объём бизнеса по id.
  applicability:
    when:
    - Последовательные id.
    skip_when:
    - UUID или случайные id.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: HARD-SHADOW-API-VERSIONS
  status: approved
  title: Старые версии API и недокументированные маршруты не обходят защиту
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - versioning
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API версионируется.
  steps:
  - action: Вызвать ту же операцию через /v0, /v1, /beta, /internal, старые хосты.
  - action: Сравнить авторизацию и валидацию с текущей версией.
  - action: Устаревший маршрут доверяет описанию сущности из тела запроса - сравнить объём выдачи с актуальной операцией при
      подменённых атрибутах
    notes: 'Real-world bug: RWB-0079 (GHSA-r9ph-3637-55px)'
  expected:
  - Устаревшие версии отключены или защищены не слабее текущей.
  applicability:
    when:
    - Есть версионирование.
    skip_when:
    - Одна версия.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0079'
- id: HARD-METHOD-OVERRIDE
  status: approved
  title: Заголовки переопределения метода не обходят авторизацию
  category: security
  protocols:
  - rest
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authz
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - За шлюзом или фреймворком, поддерживающим override.
  steps:
  - action: 'Отправить POST с X-HTTP-Method-Override: DELETE, X-Method-Override, _method=PUT.'
  expected:
  - Override игнорируется или проверяется так же, как исходный метод.
  applicability:
    when:
    - Всегда для REST.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: HARD-HOST-HEADER
  status: approved
  title: Подмена Host и X-Forwarded-Host не влияет на ссылки и маршрутизацию
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API формирует абсолютные ссылки (сброс пароля, Location, pagination links).
  steps:
  - action: Отправить запрос с поддельными Host, X-Forwarded-Host, X-Forwarded-Proto, Forwarded.
  - action: Сервис без аутентификации — Host проверяется по allowlist; совпадения Origin с Host недостаточно
    notes: 'Real-world bug: RWB-0078 (GHSA-fm8p-53ww-hf6w)'
  expected:
  - Ссылки строятся из доверенной конфигурации, а не из заголовков клиента.
  applicability:
    when:
    - Есть абсолютные ссылки.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0078'
- id: HARD-CACHE-POISONING
  status: approved
  title: Неключевые заголовки не отравляют общий кэш
  category: security
  protocols:
