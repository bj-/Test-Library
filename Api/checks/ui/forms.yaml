checks:
- id: UI-FORM-REQUIRED-AND-HINTS
  status: draft
  title: Обязательные поля помечены и проверяются, подсказки объясняют формат
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: negative
  priority: P2
  tags:
  - ui
  - validation
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Проверить подсказку или placeholder о формате у каждого поля и единообразную пометку обязательных
    notes: inbox №102
  - action: Отправить форму с пустым обязательным полем — сообщение у поля, форма не отправляется; пустые необязательные ошибок
      не дают
    notes: inbox №115
  - action: Сохранить форму, где часть полей скрыта условиями видимости, — клиентская валидация их не проверяет
    notes: inbox №272
  expected:
  - Обязательные поля помечены единообразно; пустое обязательное — сообщение у поля и форма не отправляется; необязательные
    и скрытые условиями поля ошибок не дают.
  applicability:
    when:
    - Есть формы с обязательными полями.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-INPUT-VALUES
  status: draft
  title: Поля ввода принимают, показывают и сохраняют значения по своему типу
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: boundary
  priority: P2
  tags:
  - ui
  - validation
  - boundary
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Превысить длину поля вводом и вставкой из буфера — сообщение о лимите или счётчик, без молчаливой обрезки
    notes: inbox №116
  - action: Ввести буквы и отрицательные значения в числовые поля — не вводятся или сообщение; на mobile — цифровая клавиатура
    notes: inbox №117
  - action: Проверить отображение валюты — символ или код, разделители по локали, число знаков по валюте
    notes: inbox №118
  - action: Вставить список через запятую в фильтр «один из», в том числе для числовых полей, — разбивается на отдельные значения
    notes: inbox №222
  - action: Ввести теги с пробелами при отключённой обработке пробелов — пробелы сохраняются, «null» не вставляется
    notes: inbox №226
  - action: Очистить необязательное поле времени и сохранить — сохраняется пустым, прежнее значение не возвращается
    notes: inbox №270
  - action: Выбрать пустой вариант в выпадающем списке необязательного поля — значение очищается и сохраняется без ошибки
    notes: inbox №275
  expected:
  - Лимиты видны и не обрезают молча; типы полей соблюдаются; валюта по локали; пустое значение сохраняется пустым, а не «null»
    или прежним значением.
  applicability:
    when:
    - Есть поля ввода.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-FORM-STATE
  status: draft
  title: Форма сохраняет и сбрасывает состояние ожидаемо
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Вызвать ошибку отправки — введённые данные сохранены (кроме пароля), ошибка у поля
    notes: inbox №112
  - action: Открыть экран с начальными значениями из настроек без параметров в URL — значения показаны
    notes: inbox №259
  - action: Добавить блок в динамический список формы — новый блок раскрыт, в фокусе и в видимой области
    notes: inbox №264
  - action: Создать связанный объект во вложенном окне — несохранённые поля родительской формы не сбрасываются
    notes: inbox №267
  - action: Создать запись и вернуться к форме новой — все поля, включая связи, очищены
    notes: inbox №273
  - action: Переключать вкладки черновика и опубликованной версии — каждое поле показывает содержимое своей версии
    notes: inbox №281
  expected:
  - Ошибка не теряет ввод; вложенные окна не сбрасывают родителя; новая форма чистая; начальные значения из настроек применяются;
    поля показывают свою версию.
  applicability:
    when:
    - Есть формы.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
- id: UI-DISABLED-AND-READONLY
  status: draft
  title: Недоступные и доступные только для чтения элементы видны и не выполняют действий
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: security
  priority: P2
  tags:
  - ui
  - authz
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Нажать недоступные поля и кнопки — визуально отличаются, не реагируют и не отправляют действие
    notes: inbox №105
  - action: Открыть форму, где все поля только для чтения по правам, — кнопка сохранения недоступна
    notes: inbox №215
  - action: Редактировать связанную запись через родительскую — поля, запрещённые политикой, отключены
    notes: inbox №219
  - action: Уйти с экрана в режиме только для чтения — предупреждения о потере изменений нет
    notes: inbox №282
  - action: Открыть форму с недоступным для изменения полем — показано текущее значение, а не заглушка
    notes: inbox №283
  expected:
  - Недоступные элементы визуально отличаются и не отправляют действие; поля, запрещённые политикой, отключены на всех путях;
    read-only поля показывают значение.
  applicability:
    when:
    - Есть права на поля и действия.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Серверная проверка — SEC-AUTHZ-FUNCTION
  - ADR 0006 (проверки UI)
- id: UI-DROPDOWN-VALUES
  status: draft
  title: Выпадающие списки показывают полные, разрешённые и упорядоченные значения
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - authz
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Открыть списки с длинными значениями — видны целиком (перенос или подсказка), список не выходит за экран
    notes: inbox №114
  - action: Проверить порядок значений списков по задокументированному правилу
    notes: inbox №126
  - action: Открыть списки под ограниченной ролью — недоступные роли значения не показаны
    notes: inbox №156
  - action: Открыть конструктор условий прав — предлагаются все виды связей, которые поддерживает сервер
    notes: inbox №171
  - action: Открыть выпадающие списки во вложенном модальном окне — открываются и выбираются
    notes: inbox №201
  - action: Войти пользователем с несколькими ролями — список доступных значений объединяет права всех ролей
    notes: inbox №274
  - action: Прокрутить список с серверной пагинацией — подгружаются следующие варианты
    notes: inbox №280
  expected:
  - Значения не обрезаются и не выходят за экран, упорядочены по правилу, соответствуют правам (объединение ролей) и возможностям
    сервера; серверная пагинация подгружается; списки работают во вложенных окнах.
  applicability:
    when:
    - Есть выпадающие списки.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Смежная — RES-REFERENCE-DATA-COMPLETE
  - ADR 0006 (проверки UI)
- id: UI-ACTIONS-WORK-ONCE
  status: draft
  title: Каждое действие выполняется ровно один раз и меняет ровно своё
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - idempotency
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Нажать каждую доступную кнопку и сделать двойной клик — действие выполняется один раз
    notes: inbox №121
  - action: Сбросить значение выпадающего списка в строке редактируемой таблицы — меняется только эта строка
    notes: inbox №164
  - action: Дублировать запись с полиморфной связью, у целевых коллекций которой одноимённые поля разного типа, — без ошибки
    notes: inbox №191
  - action: Сохранить флажок в настройках и перезагрузить — показывается сохранённое значение, его можно снять
    notes: inbox №199
  expected:
  - Каждая кнопка выполняет действие; двойной клик не дублирует; изменение в строке меняет только её; сохранённые значения
    отображаются после перезагрузки.
  applicability:
    when:
    - Есть действия, меняющие данные.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Серверная сторона — CONC-DOUBLE-SUBMIT
  - ADR 0006 (проверки UI)
- id: UI-CONFIRM-DESTRUCTIVE
  status: draft
  title: Удаление и изменение подтверждаются, отмена ничего не меняет
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - regression
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Удалить и изменить объект — диалог подтверждения перед удалением, сообщение об успехе после
    notes: inbox №107
  - action: Нажать «Отмена» в диалоге удаления — запрос удаления не отправлен, объект остаётся
    notes: inbox №266
  expected:
  - Перед удалением — диалог; после изменения и удаления — сообщение об успехе; отмена не отправляет запрос и не меняет данные.
  applicability:
    when:
    - Есть удаление и изменение данных.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки UI)
