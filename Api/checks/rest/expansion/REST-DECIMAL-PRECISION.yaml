  - action: Отправить дробные min, max и шаг диапазона (0.5, 2.5) и проверить, что кратность шагу вычисляется без округления
      до целого
    notes: 'Real-world bug: RWB-0230 (kubernetes/kubernetes#140160)'
  expected:
