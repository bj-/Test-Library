    likelihood: medium
- id: INJ-REDOS
  status: approved
  title: Пользовательский ввод не вызывает катастрофический backtracking в regex
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - hardening
  - costly
  - regression
  - nightly
  preconditions:
  - Поля валидируются регулярными выражениями или поиск поддерживает regex.
  steps:
  - action: Отправить строки вида aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa! против уязвимых паттернов (email, url).
  expected:
  - Время ответа остаётся в пределах бюджета, CPU не насыщается.
  applicability:
    when:
    - Есть regex-валидация.
    skip_when:
    - Нет regex.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: INJ-CSV-FORMULA
  status: approved
  title: Экспорт в CSV/XLSX нейтрализует формулы
  category: security
  protocols:
  - rest
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - injection
  - files
  - ci
  - regression
  - nightly
  preconditions:
  - API экспортирует пользовательские данные в CSV/XLSX.
  steps:
  - action: Сохранить значения, начинающиеся с =, +, -, @, \t, и выгрузить экспорт.
  expected:
  - Опасные значения экранированы (например, префикс ') и не исполняются как формулы.
  applicability:
    when:
    - Есть экспорт таблиц.
    skip_when:
    - Экспорта нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: INJ-SSRF-PARAMETERS
  status: approved
  title: Параметры с URL и хостами не дают доступа к внутренней сети
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - injection
  - hardening
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API принимает URL для загрузки, превью, импорта или вебхуков.
  steps:
  - action: Передать http://169.254.169.254/, http://localhost, внутренние DNS-имена, IPv6, десятичную запись IP, редирект
      на внутренний адрес, file://, gopher://.
  expected:
  - Запросы к внутренним адресам и неразрешённым схемам блокируются, в том числе после редиректа и DNS rebinding.
  applicability:
    when:
    - Есть серверная загрузка по URL.
    skip_when:
    - URL не принимаются.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP API Security Top 10
