checks:
- id: SEC-IDENTITY-PROOF-OF-POSSESSION
  status: draft
  title: Заявленная клиентом идентичность без доказательства владения не даёт прав и льгот
  category: security
  protocols:
  - rest
  - generic
  kind: security
  priority: P1
  tags:
  - security
  - authn
  - business-logic
  - money
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Запрос содержит идентификатор (адрес кошелька, DID, account id), по которому сервер выдаёт льготу или доступ.
  steps:
  - action: Указать идентификатор чужого субъекта, удовлетворяющего условиям, без подписи или с подписью другого ключа; запросить
      ресурс.
  - action: Повторить в течение TTL кэша решений.
  - action: Привязать к своей учётке чужой идентификатор счёта без подтверждения его владельца и выполнить списание с этого
      счёта
    notes: 'Real-world bug: RWB-0042 (GHSA-w3rp-4cm2-4wgc)'
  - action: Завершить подключение внешней интеграции с чужим ID установки и проверить отказ
    notes: 'Real-world bug: RWB-0042 (GHSA-cp3j-m783-3ph5)'
  - action: Изменить свой email или телефон с запросом возврата кода подтверждения в ответе и проверить, что код не возвращается
      без отдельного права
    notes: 'Real-world bug: RWB-0042 (GHSA-jq8w-8q2f-ffm9)'
  - action: Передать в теле запроса объект с участниками и собственной привилегированной ролью и проверить, что права определяются
      по серверным данным
    notes: 'Real-world bug: RWB-0042 (GHSA-h9qx-v5xp-ph8p)'
  expected:
  - Без доказательства владения льгота и доступ не выдаются; кэш решений привязан к доказанной идентичности.
  applicability:
    when:
    - Есть доступ по заявленному идентификатору.
    skip_when:
    - Идентичность только из аутентификации.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: low
  references:
  - OWASP API2:2023
  - CWE-290
  - 'Real-world bug: RWB-0042'
