# Соответствие полей базового бага (Process/templates/bug.md) полям YouTrack.
# Названия полей и значений - типовые для YouTrack; сверить с проектом (Настройки проекта -> Поля) и поправить здесь.
tracker: youtrack
issue_url: "{url}/issue/{id}"                 # ссылка на задачу для поля «Трекер» базового бага
new_issue_url: "{url}/newIssue?project={project}"

summary: "{summary_prefix} {заголовок}"       # префикс из настроек (по умолчанию [AT]) + «<Где>: <что не так> - <суть>», без BUG-NNNN
description: markdown                         # YouTrack Markdown: таблицы, блоки кода ```bash / ```json / ```http

fields:
  Type:
    from: const
    value: Bug
  Severity:                                   # в некоторых проектах - Priority; тогда поменять имя поля
    from: Серьёзность
    map:
      critical: Critical
      major: Major
      minor: Minor
      trivial: Trivial
  Priority:
    from: Приоритет                           # ставит команда; при переносе не заполнять
    map: {}
  Subsystem:
    from: Модуль                              # BFF-Admin-Auth; значение должно существовать в проекте
  State:
    from: Статус
    map:
      new: Submitted
      confirmed: Open
      rejected: "Won't fix"
      fixed: Fixed
      verified: Verified
      reopened: Reopened

tags: "{tags}"                                # метки из настроек запускающего (по умолчанию [Autotest]);
                                              # связь с файлом test-runs - ссылкой в описании

# Команда для окна команд YouTrack (заполняет поля одной строкой):
command: "Type Bug Severity {Severity} Subsystem {Subsystem} {tag <метка> для каждой метки}"
