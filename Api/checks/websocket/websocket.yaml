checks:
- id: WS-HANDSHAKE-AUTH
  status: approved
  title: Установление соединения требует аутентификации
  category: websocket
  protocols:
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - authn
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - WebSocket API.
  steps:
  - action: Подключиться без токена, с невалидным и истёкшим токеном.
  - action: Служебные namespace и секреты по умолчанию
    notes: 'Real-world bug: RWB-0177 (GHSA-gg6r-gp4c-89hp)'
  expected:
  - Handshake отклоняется или соединение закрывается до передачи данных.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Публичный канал (зафиксировать).
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0177'
- id: WS-ORIGIN-CHECK
  status: approved
  title: Проверка Origin защищает от cross-site WebSocket hijacking
  category: websocket
  protocols:
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - session
  - ci
  - regression
  - nightly
  - release
