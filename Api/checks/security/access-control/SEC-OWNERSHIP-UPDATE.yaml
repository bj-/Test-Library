checks:
- id: SEC-OWNERSHIP-UPDATE
  status: approved
  title: User cannot modify another owner’s resource
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Resource is mutable and owner-restricted; users A and B and resource A exist.
  steps:
  - action: As user B, attempt to update a field on user A’s resource by changing the resource identifier.
    notes: 'Matrix axis: Resource ownership; scenario: Cross-owner update. Use isolated synthetic identities and data.'
  - action: Вспомогательные операции (reorder/move), меняющие поля документа в обход основного update
    notes: 'Real-world bug: RWB-0152 (GHSA-f7hx-52q9-hcrf)'
  - action: Подменить идентификатор ресурса в параметре тела формы (article[id]) на ID чужого ресурса при изменении и удалении
    notes: 'Real-world bug: RWB-0152 (GHSA-c273-c6vg-4pv5)'
  - action: Передать в теле операции над своим контейнером ID чужого объекта и проверить отказ и отсутствие его данных в ответе
    notes: 'Real-world bug: RWB-0152 (GHSA-5pg6-m483-7vrg)'
  - action: Из другой анонимной сессии продолжить чужую незавершённую отправку формы, подставив её ID в каждую операцию продолжения
      (сохранение и финальная отправка)
    notes: 'Real-world bug: RWB-0152 (GHSA-584p-f93j-wpgc)'
  - action: Передать в параметре пути флаг административного действия и ID другого пользователя от имени обычного пользователя
    notes: 'Real-world bug: RWB-0152 (GHSA-53jc-27pc-x8r8)'
  - action: Передать в обработчике вложений ID чужого файла и изменить его заголовок, описание и порядок сортировки
    notes: 'Real-world bug: RWB-0152 (GHSA-3277-h8g9-qj5f)'
  - action: Начать привязку внешней учётной записи (OAuth) с ID чужого объекта в URL и завершить callback
    notes: 'Real-world bug: RWB-0152 (GHSA-8hm4-r66f-29wr)'
  - action: Отправить запрос принятия заявки (в друзья, приглашения), адресованной другому пользователю, и проверить отказ
      403 и неизменный статус заявки
    notes: 'Real-world bug: RWB-0152 (GHSA-fpj4-9qhx-5m6m)'
  - action: Назначить узлу контента вне разрешённой пользователю части дерева связанную настройку (домен) через отдельный
      эндпоинт и проверить 403
    notes: 'Real-world bug: RWB-0152 (GHSA-fpvf-fvp5-996r)'
  expected:
  - Deny the operation; persisted state of resource A remains unchanged.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Resource is mutable and owner-restricted; users A and B and resource A exist.
    skip_when:
    - Resource is shared with user B with write permission.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0152'
