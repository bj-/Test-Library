checks:
- id: REST-VALIDATION-ATOMICITY
  status: approved
  title: Атомарность ошибки валидации
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - negative
  - reliability
  - contract
  - rest
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Вызвать ошибку валидации после сохранения файла (тип, размер больше 2 ГиБ) и проверить, что ресурс не остаётся
    notes: 'Real-world bug: RWB-0141 (strapi/strapi#26674)'
  - action: Изменить ресурс запросом с одним верным и одним неверным полем - верное поле не применилось
    notes: inbox №498
  - action: После отказов 400, 401, 403 и 409 прочитать ресурс и связанные ресурсы - не выросли updatedAt и
      версия, связанные ресурсы не изменились, событие не отправлено
    notes: inbox №498
  expected:
  - при ошибке не сохраняются частичные изменения, если контракт обещает атомарность
  - Отклонённый запрос не меняет ресурс, связанные ресурсы, updatedAt и версию и не отправляет событий.
  applicability:
    when:
    - операция изменяет состояние; ожидается атомарность
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0141'
