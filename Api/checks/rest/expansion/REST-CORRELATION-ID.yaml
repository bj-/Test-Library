checks:
- id: REST-CORRELATION-ID
  title: Correlation ID
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: errors
  protocols:
  - rest
  kind: positive
  priority: P3
  tags:
  - observability
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - ID создаётся/передаётся и коррелируется по политике без утечки секретов
  applicability:
    when:
    - сервис поддерживает request/correlation ID
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references: []
