  category: files
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - negative
  - files
  - validation
  - ci
  - regression
  - nightly
  preconditions:
  - Есть multipart загрузка.
  steps:
  - action: Отправить файл 0 байт, multipart без boundary, с неверным boundary, без части file, с несколькими файлами вместо
