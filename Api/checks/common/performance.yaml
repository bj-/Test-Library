checks:
- id: PERF-LATENCY-BASELINE
  status: approved
  title: Задержка ключевых операций в пределах SLO при обычной нагрузке
  category: performance
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: performance
  priority: P2
  tags:
  - performance
  - costly
  - real-world-bug
  - nightly
  preconditions:
  - Определены SLO и тестовые данные реалистичного объёма.
  steps:
  - action: Измерить p50/p95/p99 для ключевых операций.
  - action: Замерить задержку при росте объёма данных (тенанты, роли) и сравнить с предыдущей версией — регрессии сложности
    notes: 'Real-world bug: RWB-0096 (keycloak/keycloak#51554)'
  - action: Замерить задержку при росте числа ролей на всех вариантах эндпоинта (realm и client) — исправление одного не гарантирует
      другой
    notes: 'Real-world bug: RWB-0096 (keycloak/keycloak#51531)'
  - action: Замерить время операций изменения схемы (создание коллекции, добавление поля) на каждой поддерживаемой СУБД
    notes: 'Real-world bug: RWB-0096 (directus/directus#25581)'
  - action: Измерить время ответа сводных счётчиков (статистика главной страницы) на больших таблицах, включая типы без черновиков
    notes: 'Real-world bug: RWB-0096 (strapi/strapi#26048)'
  expected:
  - Перцентили в пределах SLO; регрессия относительно базовой линии не выше порога.
  applicability:
    when:
    - Есть SLO.
    skip_when:
    - SLO не определены.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0096'
