  - action: Пропуск шага согласования через другой канал продолжения с токеном, выданным для иного шага
    notes: 'Real-world bug: RWB-0066 (GHSA-35jj-42hp-8gmq)'
  expected:
  - Запросы отклоняются; состояние не переходит в недопустимое.
  applicability:
    when:
    - Есть многошаговые процессы.
    skip_when:
