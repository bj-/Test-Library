- id: BIZ-LIMITS-QUOTAS
  status: approved
  title: Лимиты и квоты соблюдаются на границе и не обходятся параллельно
  category: business-logic
  protocols:
  - rest
  - grpc
  - graphql
  kind: boundary
  priority: P1
  tags:
  - boundary
  - business-logic
  - concurrency
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть дневные лимиты, квоты, тарифные ограничения.
  steps:
  - action: Израсходовать лимит до границы, превысить на 1, выполнить параллельные запросы на остаток.
  - action: Импортировать данные с вложениями — квота хранилища учитывает все вложения и не превышается при импорте
    notes: inbox №230
  - action: Параллельно проверять остаток квоты и списывать — проверка и списание атомарны, квота не превышается
    notes: inbox №237
  - action: Превысить общий лимит через одного клиента и выполнить операцию через другого, у которого частный лимит не превышен,
      — проверить поведение по политике без 5xx
    notes: 'Real-world bug: RWB-0293 (keycloak/keycloak#48040)'
  - action: Опубликовать объекты сверх лимита с учётом запланированных - публикация отклоняется, даже если часть ещё только
      запланирована; снятие с публикации и архив освобождают место
    notes: inbox №444
  expected:
  - Граница соблюдается точно, параллельные запросы не превышают лимит.
  applicability:
    when:
    - Есть лимиты.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0293'
