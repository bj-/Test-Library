checks:
- id: REST-EMPTY-VALUES
  status: approved
  title: Пустые объект, массив и строка
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: boundary
  priority: P2
  tags:
  - boundary
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Полностью пустое тело при JSON Content-Type
    notes: 'Real-world bug: RWB-0115 (expressjs/express#5959)'
  - action: Пустые и пробельные строки как элементы массива; неверный статус 409 вместо 400
    notes: 'Real-world bug: RWB-0115 (keycloak/keycloak#50039)'
  - action: Отправить пустой массив в списковом аргументе пакетной операции и проверить, что ответ — пустой список объявленного
      типа
    notes: 'Real-world bug: RWB-0115 (hasura/graphql-engine#10322)'
  - action: Создать коллекцию с пустым объектом schema и без полей
    notes: 'Real-world bug: RWB-0115 (directus/directus#23939)'
  - action: Получить ответ или запись, где списочное поле пусто, и проверить, что оно выдаётся как [], а не {}
    notes: 'Real-world bug: RWB-0115 (Kong/kong#6390)'
  - action: Отправить массив полиморфных элементов (динамическая зона) с элементом null и проверить 4xx или пропуск элемента
      без 5xx
    notes: 'Real-world bug: RWB-0115 (strapi/strapi#24303)'
  expected:
  - пустые значения принимаются только если допускаются контрактом
  applicability:
    when:
    - схема содержит object/array/string
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0115'
