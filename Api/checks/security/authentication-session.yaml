- id: AUTH-LOGOUT-INVALIDATES
  status: approved
  title: После выхода токен и сессия недействительны
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - negative
  - authn
  - session
  - token-lifecycle
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть операция logout.
  steps:
  - action: Войти, выполнить запрос, выйти, повторить запрос с тем же access и refresh токеном или cookie.
  - action: Выход после отзыва согласия — отзыв refresh-токена не должен падать, сессия завершается
    notes: 'Real-world bug: RWB-0059 (keycloak/keycloak#50629)'
  - action: Выполнить выход параллельно с долгим запросом в той же сессии и после завершения обоих повторить запрос со старой
      cookie
    notes: 'Real-world bug: RWB-0059 (GHSA-9j94-67jr-4cqj)'
  - action: Удалить пользователя администратором и выполнить выход с его ещё не истёкшим токеном — выход завершается успешно
      или не мешает клиенту завершить сеанс, сессии пользователя недействительны
    notes: 'Real-world bug: RWB-0059 (supabase/auth#1550)'
  expected:
  - Запросы после выхода отклоняются в пределах задокументированного окна.
  applicability:
    when:
    - Есть logout.
    skip_when:
    - Stateless токены без отзыва (зафиксировать окно риска).
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0059'
