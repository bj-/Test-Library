checks:
- id: REST-CONTENT-TYPE-JSON
  status: approved
  title: Content-Type и JSON-формат
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: positive
  priority: P1
  tags:
  - contract
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Запросить служебный эндпоинт метрик и проверить Content-Type text/plain формата Prometheus
    notes: 'Real-world bug: RWB-0338 (PostgREST/postgrest#4271)'
  - action: Отправить тело с Content-Type application/json; charset=utf-8 и с нераспознанным параметром медиатипа и проверить,
      что запрос принят
    notes: 'Real-world bug: RWB-0338 (PostgREST/postgrest#4030)'
  - action: Переопределить Content-Type ответа из обработчика и проверить, что в ответе один заголовок Content-Type с новым
      значением
    notes: 'Real-world bug: RWB-0338 (PostgREST/postgrest#2915)'
  expected:
  - media type соответствует контракту, тело разбирается как JSON
  applicability:
    when:
    - операция возвращает JSON
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0338'
