checks:
- id: COMPAT-BREAKING-CHANGE-DIFF
  status: approved
  title: Изменения контракта проверяются на обратную несовместимость
  category: compatibility
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: compatibility
  priority: P0
  tags:
  - compatibility
  - contract
  - versioning
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Контракт хранится в репозитории (OpenAPI, proto, GraphQL SDL).
  steps:
  - action: Сравнить контракт с предыдущим релизом инструментом diff (oasdiff, buf breaking, graphql-inspector).
  - action: Обновить сервер до новой версии с неизменной конфигурацией и проверить, что он стартует без ошибок согласованности
      конфигурации
    notes: 'Real-world bug: RWB-0216 (hasura/graphql-engine#10867)'
  - action: Снять схему API до и после обновления сервера при неизменной конфигурации и сравнить имена типов на несовместимые
      изменения
    notes: 'Real-world bug: RWB-0216 (hasura/graphql-engine#10864)'
  - action: Создать объекты (OAuth-клиентов) на предыдущей версии, обновить сервис и убедиться, что они работают прежним способом
    notes: 'Real-world bug: RWB-0216 (supabase/auth#2369)'
  expected:
  - Ломающие изменения (удаление поля, смена типа, новое обязательное поле, удаление enum) отсутствуют или сопровождаются
    новой версией.
  applicability:
    when:
    - Контракт версионируется.
    skip_when:
    - Контракта нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0216'
- id: COMPAT-IMPLEMENTATION-MATCHES-CONTRACT
  status: approved
  title: Реализация соответствует опубликованному контракту
  category: compatibility
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: contract
  priority: P1
  tags:
  - contract
  - compatibility
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Контракт опубликован.
  steps:
  - action: Для всех операций проверить существование, коды ответов и схемы (schemathesis, dredd, contract tests).
  - action: Производные контракты (схемы MCP-инструментов, SDK) против контракта API
    notes: 'Real-world bug: RWB-0067 (directus/directus#27039)'
  - action: Описанные параметры без эффекта — проверить влияние каждого документированного параметра
    notes: 'Real-world bug: RWB-0067 (directus/directus#27762)'
  - action: Реализованные маршруты, отсутствующие в контракте (включая публичные без аутентификации)
    notes: 'Real-world bug: RWB-0067 (directus/directus#27761)'
  - action: Маршруты-префиксы перехватывают более длинные пути — проверить, что ответ от нужной операции
    notes: 'Real-world bug: RWB-0067 (expressjs/express#2495)'
  - action: Документ discovery/метаданных как контракт — сверять объявленные возможности с фактическими
    notes: 'Real-world bug: RWB-0067 (keycloak/keycloak#49730)'
  - action: Для каждого задокументированного флага запроса выполнить пример из документации с флагом и без него и проверить
      заявленное различие поведения
    notes: 'Real-world bug: RWB-0067 (hasura/graphql-engine#10707)'
  - action: Сравнить обнуляемость полей в схеме GraphQL с ограничениями модели для полей NOT NULL со значением по умолчанию
      и без него
    notes: 'Real-world bug: RWB-0067 (directus/directus#25888)'
  - action: Создать объект с целочисленным сроком жизни и проверить, что вычисляемый остаток срока в ответах — целое число
    notes: 'Real-world bug: RWB-0067 (Kong/kong#9944)'
  - action: Сверить пути опубликованного контракта с фактическими маршрутами, включая маршруты плагинов и роутеров с префиксом
    notes: 'Real-world bug: RWB-0067 (strapi/strapi#25591)'
  expected:
  - Все задокументированные операции существуют; ответы соответствуют схемам; нет недокументированных операций.
  applicability:
    when:
    - Есть контракт.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0067'
- id: COMPAT-ADDITIVE-CHANGE
  status: approved
  title: Добавление полей не ломает существующих клиентов
  category: compatibility
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: compatibility
  priority: P1
  tags:
  - compatibility
  - versioning
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть клиенты предыдущей версии.
  steps:
  - action: Выполнить тесты старого клиента против новой версии API.
  expected:
  - Старые клиенты работают без изменений.
  applicability:
    when:
    - Есть старые клиенты или их тесты.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: COMPAT-ENUM-EXTENSION
  status: approved
  title: Добавление значения enum не ломает клиентов
  category: compatibility
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: compatibility
  priority: P2
  tags:
  - compatibility
  - versioning
  - ci
  - regression
  - nightly
  preconditions:
  - Есть enum в ответах.
  steps:
  - action: Вернуть новое значение enum клиенту предыдущей версии (через заглушку).
  expected:
  - Клиент обрабатывает неизвестное значение безопасно; сервер документирует политику расширения.
  applicability:
    when:
    - Есть enum.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: COMPAT-DEPRECATION-SIGNALS
  status: approved
  title: Устаревающие операции помечены Deprecation и Sunset
  category: compatibility
  protocols:
  - rest
  - graphql
  kind: contract
  priority: P3
  tags:
  - contract
  - versioning
  - regression
  - nightly
  preconditions:
  - Есть устаревающие операции.
  steps:
  - action: Вызвать устаревшую операцию.
  expected:
  - Ответ содержит Deprecation/Sunset/Link или аналог; контракт помечает deprecated.
  applicability:
    when:
    - Есть устаревающие операции.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: COMPAT-DEFAULT-VERSION
  status: approved
  title: Запрос без указания версии обслуживается задокументированной версией
  category: compatibility
  protocols:
  - rest
  - graphql
  kind: contract
  priority: P2
  tags:
  - contract
  - versioning
  - ci
  - regression
  - nightly
  preconditions:
  - Версия задаётся заголовком или параметром.
  steps:
  - action: Вызвать операцию без версии, с неизвестной и с устаревшей версией.
  expected:
  - Используется задокументированная версия; неизвестная отклоняется.
  applicability:
    when:
    - Версионирование заголовком/параметром.
    skip_when:
    - Версия в пути.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: COMPAT-UPGRADE-STORED-DATA-STABLE
  status: draft
  title: Обновление сервера не меняет сохранённые объекты и не запускает побочных действий
  category: compatibility
  protocols:
  - generic
  kind: compatibility
  priority: P2
  tags:
  - compatibility
  - data-integrity
  - real-world-bug
  - release
  preconditions:
  - Можно обновить стенд с предыдущей версии на новую, сохранив данные.
  steps:
  - action: Создать объекты на старой версии, запомнить их ревизии, производные объекты и события.
  - action: Обновить сервер и без действий пользователя сравнить ревизии, производные объекты и события.
  expected:
  - Ревизии не меняются, производные действия (раскатки, перерасчёты, уведомления) не запускаются.
  applicability:
    when:
    - Есть обновление версии с сохранением данных.
    skip_when:
    - Нет возможности обновить стенд.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Release
  risk:
    impact: high
    likelihood: low
  references:
  - Здравый смысл — обновление без изменения данных пользователем не меняет данные
  - 'Real-world bug: RWB-0220'
- id: COMPAT-MIXED-VERSION-WRITE-STABILITY
  status: draft
  title: Экземпляры разных версий при поэтапном обновлении не перезаписывают общий объект по кругу
  category: compatibility
  protocols:
  - generic
  kind: compatibility
  priority: P3
  tags:
  - compatibility
  - concurrency
  - real-world-bug
  - release
  preconditions:
  - Нужны две версии сервиса одновременно (поэтапное обновление) с общим хранилищем или общим служебным объектом.
  steps:
  - action: Запустить экземпляры старой и новой версии и наблюдать ревизию и содержимое общего объекта, нагрузку на хранилище.
  expected:
  - Объект стабилизируется; новые поля не стираются старой версией и не дописываются по кругу.
  applicability:
    when:
    - Поддерживается поэтапное обновление.
    skip_when:
    - Один экземпляр или обновление с остановкой.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Release
  risk:
    impact: medium
    likelihood: low
  references:
  - Смежная — CONC-LOST-UPDATE
  - 'Real-world bug: RWB-0221'
