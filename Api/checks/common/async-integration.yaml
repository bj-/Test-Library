- id: ASYNC-SCHEDULE-LONG-UPTIME
  status: approved
  title: Задача по расписанию срабатывает и после длительной непрерывной работы процесса
  category: async
  protocols:
  - generic
  kind: reliability
  priority: P3
  tags:
  - reliability
  - async-jobs
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Есть задачи по расписанию (cron, плановые потоки).
  - Нужна длительная работа стенда без перезапуска (больше 25 суток) или управляемый сдвиг времени процесса; без этого проверка
    пропускается осознанно.
  steps:
  - action: Создать ежедневную и ежечасную задачу и наблюдать срабатывания при длительной работе или после сдвига времени
      за 25 суток.
  expected:
  - Задачи срабатывают по расписанию независимо от времени работы процесса.
  applicability:
    when:
    - Есть расписания и условия из предусловий.
    skip_when:
    - Нет расписаний или нельзя обеспечить длительную работу.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - Вероятная причина — предел 32-битного таймера в миллисекундах (2^31 мс ≈ 24,8 суток)
  - Смежная — PERF-SOAK
  - 'Real-world bug: RWB-0254'
- id: ASYNC-OUTBOUND-REQUEST-HEADERS
  status: approved
  title: Исходящий запрос сервера содержит корректный Host, в том числе с нестандартным портом
  category: async
  protocols:
  - generic
  kind: contract
  priority: P3
  tags:
  - contract
  - webhooks
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервер отправляет HTTP-запросы на настроенный пользователем адрес (вебхук, приёмник журналов, интеграция).
  - Нужен тестовый приёмник, записывающий заголовки.
  steps:
  - action: Настроить адрес приёмника с нестандартным портом и со стандартным; вызвать отправку и проверить заголовок Host.
  expected:
  - 'Host: имя:порт для нестандартного порта и имя без порта для стандартного.'
  applicability:
    when:
    - Есть исходящие запросы на настраиваемый адрес.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - RFC 9110 §7.2
  - 'Real-world bug: RWB-0268'
- id: ASYNC-SCHEDULE-DST-TRANSITION
  status: approved
  title: Расписание на несуществующее или повторяющееся местное время срабатывает по правилу
  category: async
  protocols:
  - generic
  kind: boundary
  priority: P3
  tags:
  - boundary
  - async-jobs
  - regression
  - nightly
  preconditions:
  - Есть задачи по расписанию в местном времени с переходом на летнее или зимнее время; можно сдвигать время стенда.
  steps:
