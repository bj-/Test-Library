- id: CONC-DOUBLE-SUBMIT
  status: approved
  title: Двойная отправка формы не создаёт дубликат операции
  category: concurrency
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - concurrency
  - idempotency
  - regression
  - nightly
  preconditions:
  - Создающая операция без обязательного idempotency key.
  steps:
  - action: Отправить два одинаковых запроса с интервалом 0-100 мс.
  expected:
  - 'Поведение по контракту: дедупликация или явное создание двух объектов.'
  applicability:
    when:
    - Есть создание.
    skip_when:
    - Обязательный idempotency key проверен отдельно.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: high
    likelihood: medium
