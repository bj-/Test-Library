checks:
- id: OBS-NO-SECRETS-IN-LOGS
  status: approved
  title: Логи не содержат паролей, токенов и ПДн в открытом виде
  category: observability
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P0
  tags:
  - security
  - observability
  - privacy
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Доступ к логам тестового окружения.
  steps:
  - action: Выполнить вход, операции с ПДн и ошибки с секретами в запросе; найти значения в логах и трассировках.
  - action: Использовать секрет со спецсимволами регулярных выражений ()[]{}|$^ в операции с журналированием и проверить,
      что запрос не падает, а секрет в журнале замаскирован
    notes: 'Real-world bug: RWB-0263 (directus/directus#24641)'
  - action: Прочитать записи журнала аудита о входе и верификации — нет OTP-кодов, токенов, ссылок подтверждения и лишних
      данных провайдера
    notes: inbox №43
  expected:
  - Секреты и ПДн отсутствуют или маскированы.
  applicability:
    when:
    - Логи доступны.
    skip_when:
    - Логи недоступны тестам.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: critical
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0263'
- id: OBS-AUDIT-TRAIL
  status: approved
  title: Чувствительные действия фиксируются в журнале аудита
  category: observability
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: positive
  priority: P1
  tags:
  - positive
  - observability
  - audit
  - security
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть журнал аудита.
  steps:
  - action: Выполнить вход, смену прав, удаление, экспорт, неуспешные попытки доступа.
  - action: Вызвать отказ на каждой ветке проверок выдачи токена и проверить, что каждый отказ попадает в журнал аудита, а
      не только успешные действия
    notes: 'Real-world bug: RWB-0092 (keycloak/keycloak#52568)'
  - action: Несколько событий в одном запросе — проверить, что тип и детали каждого не перезаписаны
    notes: 'Real-world bug: RWB-0092 (keycloak/keycloak#52257)'
  - action: Выполнить загрузку каждым путём под каждой ролью (включая администратора тенанта) и проверить инициатора в событиях
      аудита
    notes: 'Real-world bug: RWB-0092 (directus/directus#26242)'
  - action: Выполнить запрос дольше порога медленного запроса и проверить, что его событие аудита содержит аннотации общей
      задержки и задержки по компонентам
    notes: 'Real-world bug: RWB-0092 (kubernetes/kubernetes#135684)'
  - action: Изменить несколько записей одним пакетным запросом и проверить, что ревизия каждой записи содержит её собственные
      значения
    notes: 'Real-world bug: RWB-0092 (directus/directus#25720)'
  - action: Отключить журналирование для коллекции и сохранить версию записи — записи активности и ревизий не создаются
    notes: 'Real-world bug: RWB-0092 (directus/directus#25894)'
  expected:
  - Запись содержит кто, что, когда, откуда, результат; журнал недоступен для изменения пользователем.
  applicability:
    when:
    - Есть аудит.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0092'
- id: OBS-TRACE-PROPAGATION
  status: approved
  title: Контекст трассировки принимается и передаётся дальше
  category: observability
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: positive
  priority: P3
  tags:
  - positive
  - observability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Используется распределённая трассировка.
  steps:
  - action: Отправить запрос с traceparent и проверить trace в системе трассировки.
  - action: Отправить заголовок baggage с десятками тысяч пар и огромным значением и проверить, что время ответа не растёт
    notes: 'Real-world bug: RWB-0245 (GHSA-p5f6-rccc-jv98)'
  - action: Включить трассировку только части операций и проверить, что parent span ID в исходящем запросе совпадает со спаном,
      отправленным в коллектор
    notes: 'Real-world bug: RWB-0245 (Kong/kong#11294)'
  - action: Отправить заголовок baggage с десятками тысяч пар ключ-значение и с одним очень большим значением и проверить,
      что лишнее отбрасывается без роста времени ответа
    notes: 'Real-world bug: RWB-0245 (GHSA-38wr-vpc7-2mp4)'
  - action: Отправить запросы с заголовками traceparent и tracestate и проверить, что время и CPU обработки не отличаются
      от запросов без них
    notes: 'Real-world bug: RWB-0245 (GHSA-vc29-vg52-6643)'
  expected:
  - Трасса связана с входящим контекстом; некорректный traceparent не ломает запрос.
  applicability:
    when:
    - Есть трассировка.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0245'
- id: OBS-HEALTH-ENDPOINTS
  status: approved
  title: Health-эндпоинты отражают состояние и не раскрывают детали
  category: observability
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: contract
  priority: P2
  tags:
  - contract
  - observability
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Есть liveness/readiness.
  steps:
  - action: Запросить health при норме и при недоступной зависимости; запросить без аутентификации.
  - action: Доступность health без аутентификации при глобальном префиксе/версии и что исключение не расширяется на соседние
      маршруты
    notes: 'Real-world bug: RWB-0093 (nestjs/nest#11442)'
  - action: Замерить время ответа liveness-эндпоинта под нагрузкой и во время перестроения конфигурации; ответ не должен зависеть
      от долгих проверок
    notes: 'Real-world bug: RWB-0093 (hasura/graphql-engine#10721)'
  - action: Сделать недоступным дополнительное хранилище части ресурсов и проверить, что health- и ready-эндпоинты сообщают
      о неисправности
    notes: 'Real-world bug: RWB-0093 (kubernetes/kubernetes#129417)'
  - action: Запросить эндпоинты мониторинга компонентов и проверить, что в ответе нет паролей, токенов и ключей из их конфигурации
    notes: 'Real-world bug: RWB-0093 (GHSA-pr7j-96cj-549h)'
  - action: 'Запустить несколько экземпляров с общим хранилищем и вызывать health-эндпоинт каждого: проверка не изменяет общий
      объект и не вызывает ошибок лимита хранилища'
    notes: 'Real-world bug: RWB-0093 (directus/directus#26191)'
  - action: Запросить health при каждом поддерживаемом драйвере хранилища и проверить, что исправное хранилище даёт статус
      ok
    notes: 'Real-world bug: RWB-0093 (directus/directus#23635)'
  - action: Запустить сервис с валидной конфигурацией из файла и проверить, что статус-эндпоинт сообщает о загруженной конфигурации
    notes: 'Real-world bug: RWB-0093 (Kong/kong#9879)'
  - action: Опрашивать эндпоинт готовности во время долгой загрузки кэша метаданных и проверить 503 до её завершения
    notes: 'Real-world bug: RWB-0093 (PostgREST/postgrest#3330)'
  - action: Запросить health-эндпоинт с тайм-аутом клиента и проверить, что ответ или отказ соединения приходит за ограниченное
      время
    notes: 'Real-world bug: RWB-0093 (PostgREST/postgrest#5012)'
  expected:
  - Readiness отражает зависимости; публичный ответ не содержит версий, хостов и секретов.
  applicability:
    when:
    - Есть health.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0093'
- id: OBS-TELEMETRY-FORMAT
  status: approved
  title: Экспортируемая телеметрия соответствует документированной структуре и соглашениям OpenTelemetry
  category: observability
  protocols:
  - generic
  kind: contract
  priority: P3
  tags:
  - contract
  - observability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис экспортирует спаны, метрики или журналы (OTLP и др.).
  - Нужны инструменты — тестовый коллектор телеметрии (OpenTelemetry Collector с файловым экспортом и т. п.); без него проверка
    пропускается осознанно.
  steps:
  - action: Выполнить запросы, затрагивающие БД и внешние сервисы, и собрать экспортированные спаны.
  - action: Собрать экспортированные записи журнала и сверить их поля с документацией.
  expected:
  - Спаны обращений к БД и сервисам имеют span.kind CLIENT и атрибуты по семантическим соглашениям; связь parent/child сохранена.
  - Текст записи журнала — в body, атрибуты — в attributes, как в документации и спецификации OTLP.
  applicability:
    when:
    - Экспорт телеметрии включён и есть коллектор из предусловий.
    skip_when:
    - Телеметрии нет или нет доступа к коллектору.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - OpenTelemetry Semantic Conventions, OTLP specification
  - 'Real-world bug: RWB-0208'
- id: OBS-CONFIG-ENDPOINT-ACCURATE
  status: approved
  title: Служебный эндпоинт конфигурации показывает фактические значения
  category: observability
  protocols:
  - generic
  kind: contract
  priority: P3
  tags:
  - contract
  - observability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис отдаёт текущую конфигурацию (flagz, configz, env, actuator) и можно запустить его с заданными параметрами.
  steps:
  - action: Запустить сервис с известными значениями параметров и сравнить значения в ответе эндпоинта с переданными.
  expected:
  - Каждое значение совпадает с фактически применённым; сравниваются значения, а не формат вывода.
  applicability:
    when:
    - Есть такой эндпоинт и управление параметрами запуска.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - Доступ к эндпоинту — HARD-DEBUG-ENDPOINTS
  - 'Real-world bug: RWB-0223'
- id: OBS-REQUEST-LOG-ALL-ATTEMPTS
  status: approved
  title: Журнал запроса с повторами содержит каждую попытку, включая последнюю
  category: observability
  protocols:
  - generic
  kind: contract
  priority: P3
  tags:
  - contract
  - observability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис повторяет запросы к зависимости; нужен доступ к журналу запросов.
  steps:
  - action: Отправить запрос, при котором все попытки к зависимости неуспешны (тайм-аут, 5xx), и прочитать запись журнала.
  expected:
  - У каждой попытки, включая последнюю, есть код, состояние и время.
  applicability:
    when:
    - Есть повторы и доступ к журналу.
    skip_when:
    - Нет повторов или доступа.
  automation:
    level: partial
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - Смежная — OBS-AUDIT-TRAIL
  - 'Real-world bug: RWB-0273'
- id: OBS-METRICS-LABEL-CARDINALITY
  status: approved
  title: Значения из запроса не создают неограниченно новых серий метрик
  category: observability
  protocols:
  - generic
  kind: performance
  priority: P2
  tags:
  - performance
  - observability
  - hardening
  - real-world-bug
  - ci
  - nightly
  preconditions:
  - Сервис экспортирует метрики с метками из запроса (метод, путь, коды, заголовки); есть доступ к /metrics и к памяти процесса.
  steps:
  - action: Отправить тысячи запросов с уникальными методами (M1, M2, …), путями и значениями заголовков; сравнить /metrics
      и память до и после.
  expected:
  - Кардинальность меток ограничена (например, неизвестные значения сводятся в other, пути — в шаблон маршрута); размер /metrics
    и память не растут.
  applicability:
    when:
    - Есть метрики с метками из запроса.
    skip_when:
    - Нет метрик.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - OWASP API4:2023
  - Практика Prometheus — ограничение кардинальности меток
  - 'Real-world bug: RWB-0282'
- id: OBS-METRICS-VALUE-RANGE
  status: approved
  title: Gauge-метрики с известными границами остаются в них после сбоев и восстановления
  category: observability
  protocols:
  - generic
  kind: reliability
  priority: P3
  tags:
  - reliability
  - observability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис экспортирует gauge-метрики с известной семантикой границ (доступные соединения пула, размер очереди); есть доступ
    к эндпоинту метрик.
  - Нужна возможность вызвать сбой зависимости (обрыв соединений с БД, перезапуск зависимости).
  steps:
  - action: Вызвать серию обрывов и переподключений, затем прочитать метрики и сравнить с фактическим состоянием и границами
      (0..размер пула).
  expected:
  - Значения в документированных границах и восстанавливаются после сбоя; расхождения с фактическим состоянием нет.
  applicability:
    when:
    - Есть gauge-метрики и управляемый сбой.
    skip_when:
    - Нет метрик или сбой не управляем.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - Смежная — OBS-METRICS-LABEL-CARDINALITY
  - 'Real-world bug: RWB-0325'
- id: OBS-SERVER-TIMING-ACCURATE
  status: approved
  title: Server-Timing отражает фактическую длительность этапов
  category: observability
  protocols:
  - rest
  kind: contract
  priority: P3
  tags:
  - contract
  - observability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервис отдаёт заголовок Server-Timing.
  steps:
  - action: Выполнить запрос с известной задержкой (короткой и длинной, от 100 с) и сравнить значения dur с независимым клиентским
      измерением.
  expected:
  - Единицы документированы (миллисекунды); значения согласуются с измерением в пределах допуска; точного равенства суммы
    этапов общему времени не требуется.
  applicability:
    when:
    - Есть Server-Timing.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: low
  references:
  - W3C Server Timing
  - 'Real-world bug: RWB-0326'
- id: OBS-LOG-ENTRY-INTEGRITY
  status: approved
  title: Записи журнала при всплеске параллельных запросов не склеиваются
  category: observability
  protocols:
  - generic
  kind: reliability
  priority: P3
  tags:
  - reliability
  - observability
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Нужен доступ к журналу сервиса; без него проверка пропускается осознанно.
  steps:
  - action: Отправить пачку из сотен параллельных запросов и разобрать журнал построчно (для структурированного — парсером
      формата).
  expected:
  - Каждая запись — отдельная строка с собственной меткой времени; записей столько, сколько запросов; строки не склеены и
    не разорваны.
  applicability:
    when:
    - Есть доступ к журналу.
    skip_when:
    - Нет доступа к журналу.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - Решение bj 2026-10-16 (обе модели перекрёстного ревью — reject как не API)
  - Смежные — OBS-REQUEST-LOG-ALL-ATTEMPTS, INJ-LOG-FORGING
  - 'Real-world bug: RWB-0333'
- id: OBS-BUILD-VERSION-TRACEABLE
  status: draft
  title: Версия сборки доступна для трассировки на тестовых стендах и скрыта в production
  category: observability
  protocols:
  - generic
  kind: contract
  priority: P3
  tags:
  - contract
  - observability
  - regression
  preconditions:
  - Известно, какой стенд тестовый, а какой production.
  steps:
  - action: На тестовом стенде запросить версию сборки (служебная ручка, заголовок, health).
  - action: Повторить на production или по его конфигурации.
  expected:
  - На тестовом стенде версия сборки определяется — результат прогона привязан к версии.
  - На production версия скрыта или доступна только авторизованно (HARD-VERSION-DISCLOSURE).
  applicability:
    when:
    - Есть разные стенды.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  risk:
    impact: low
    likelihood: medium
  references:
  - Здравый смысл — тестировать без знания версии нельзя
  - Смежная — HARD-VERSION-DISCLOSURE
  - inbox №6
