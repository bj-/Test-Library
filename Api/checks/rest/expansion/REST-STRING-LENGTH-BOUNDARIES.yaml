checks:
- id: REST-STRING-LENGTH-BOUNDARIES
  status: approved
  title: Границы длины строки
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: boundary
  priority: P1
  tags:
  - boundary
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Поле логина без лимита длины на неаутентифицированном эндпоинте — усиление записи в логи
    notes: 'Real-world bug: RWB-0137 (keycloak/keycloak#50903)'
  - action: Отправить в строковое поле без объявленного maxLength, в том числе во вложенном компоненте, строку длиннее размера
      колонки БД (256 и более символов)
    notes: 'Real-world bug: RWB-0137 (strapi/strapi#26113)'
  - action: Вставить и изменить значение максимальной длины в колонки char(n) и bit(n) и проверить, что оно принято
    notes: 'Real-world bug: RWB-0137 (PostgREST/postgrest#2861)'
  - action: Передать строку длиной max в символах и в байтах (кириллица, эмодзи) — сохраняется целиком; max+1 — 400 с лимитом;
      maxLength контракта = лимит хранения
    notes: inbox №66
  - action: Превысить длину в одном из нескольких полей одной вставки — ошибка указывает верное поле (ошибка СУБД 22001 сопоставлена
      с колонкой)
    notes: inbox №189
  - action: Значение на лимите с пробелами по краям и в разных формах нормализации Unicode - лимит считается до
      или после обрезки и нормализации одинаково при создании и изменении
    notes: inbox №503
  - action: Значение ровно на лимите - чтение возвращает строку целиком, молчаливого усечения нет; те же границы
      для строк в query и заголовках
    notes: inbox №503
  expected:
  - min-1/min/max/max+1 проверяются относительно ограничений
  applicability:
    when:
    - есть minLength/maxLength
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0137'
