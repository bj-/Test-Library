  - Серверная сторона — PAGE-SORT-FIELD-TYPE-MATRIX, REST-FILTER-OPERATOR-TYPE-MATRIX
  - ADR 0006 (проверки UI)
- id: UI-LIST-FILTER-STATE
  status: approved
  title: Фильтры снимаются и не переносятся между списками
  category: ui
  protocols:
  - ui-web
  kind: contract
  priority: P2
  tags:
  - ui
  - filtering
  - sorting
  - ci
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Перейти между списками разных типов сущностей — фильтры одного не переносятся на другой
    notes: inbox №265
  - action: Снять каждый применённый фильтр кнопкой сброса при любом выбранном значении
    notes: inbox №269
  - action: Открыть список на странице конкретного типа — показаны только объекты этого типа, без пустых строк от других типов
    notes: inbox №338
  expected:
  - Каждый фильтр снимается сбросом; фильтры одного типа сущностей не применяются к списку другого.
  applicability:
    when:
    - Есть фильтры списков.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Серверная сторона — PAGE-SORT-FIELD-TYPE-MATRIX, REST-FILTER-OPERATOR-TYPE-MATRIX
  - ADR 0006 (проверки UI)
