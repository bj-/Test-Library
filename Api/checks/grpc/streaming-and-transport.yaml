checks:
- id: GRPC-SERVER-STREAM-COMPLETE
  status: approved
  title: Серверный стрим отдаёт все элементы по порядку и завершается OK
  category: grpc-contract
  protocols:
  - grpc
  kind: positive
  priority: P1
  tags:
  - positive
  - streaming
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Есть server streaming.
  steps:
  - action: Получить стрим с известным набором данных.
  expected:
  - Все элементы в задокументированном порядке; завершение со статусом OK и trailer.
  applicability:
    when:
    - Есть server streaming.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
