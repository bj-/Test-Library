checks:
- id: SEC-ROLE-MASS-ASSIGN
  title: Mass assignment cannot elevate privileges
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - regression
  - release
  preconditions: &id001
  - Create/update payloads may contain fields near privileged attributes.
  steps:
  - action: Submit privileged fields such as role, isAdmin, scopes, tenantId, or ownerId in create/update payloads.
    notes: 'Matrix axis: Roles/Scopes; scenario: Privileged field injection. Use isolated synthetic identities and data.'
  expected:
  - Untrusted fields cannot change effective authorization, ownership, or tenant binding.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when: *id001
    skip_when:
    - All such fields are explicitly client-controlled by design and reviewed.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
