- id: AUTH-TOKEN-TYPE-CONFUSION
  status: approved
  title: Refresh, ID или сервисный токен не принимается как access-токен
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authn
  - token-lifecycle
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Выдаются разные типы токенов.
  steps:
  - action: Вызвать защищённую операцию с refresh-токеном, id_token, токеном другого клиента и токеном сброса пароля.
  - action: Предъявить как токен идентификатор записи другого типа из того же хранилища (регистрация, сессия), содержимое
      которой задал клиент, и проверить 401
    notes: 'Real-world bug: RWB-0192 (GHSA-cj8f-2fhf-826r)'
  - action: Вызвать эндпоинты пользователей токеном гостевой ссылки во всех версиях API и проверить отказ
    notes: 'Real-world bug: RWB-0192 (GHSA-vfxw-3x8p-2vjr)'
  - action: Токеном ссылки-доступа, чей ID совпадает с ID пользователя, вызвать операции над ресурсами этого пользователя
      (API-токены, команды, боты) и проверить отказ
    notes: 'Real-world bug: RWB-0192 (GHSA-32r8-5843-4qw2)'
  expected:
  - Все варианты отклоняются.
  applicability:
    when:
    - Несколько типов токенов.
    skip_when:
    - Один тип токена.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0192'
