- id: PERF-NO-UNNEEDED-DEPENDENCY-CALLS
  status: draft
  title: Внешняя зависимость вызывается только когда её результат нужен
  category: performance
  protocols:
  - generic
  kind: performance
  priority: P3
  tags:
  - performance
  - webhooks
  - real-world-bug
  - nightly
  preconditions:
  - Сервис вызывает внешние обработчики (вебхуки преобразования, валидации, обогащения).
  - Нужна управляемая заглушка обработчика со счётчиком вызовов.
  steps:
  - action: Выполнить операции, которым обработчик не нужен (без преобразования, в версии хранения), и посчитать вызовы.
  - action: Выполнить операцию, которой он нужен, и проверить, что вызов есть и результат применён.
  expected:
  - Без необходимости вызовов нет; при необходимости — ровно нужные.
  applicability:
    when:
    - Есть внешние обработчики и заглушка.
    skip_when:
    - Нет внешних обработчиков.
  automation:
    level: full
    deterministic: true
  profiles:
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - Смежная — BIZ-SIDE-EFFECTS-ONCE
  - 'Real-world bug: RWB-0224'
- id: PERF-METADATA-RELOAD-NO-BLOCK
  status: draft
  title: Перезагрузка кэша метаданных не блокирует обслуживание запросов надолго
  category: performance
  protocols:
  - generic
  kind: performance
  priority: P3
  tags:
  - performance
  - real-world-bug
  - nightly
  preconditions:
  - Сервис перезагружает кэш метаданных (схема, конфигурация, маршруты) по событию или команде.
  - Нужен стенд с большой схемой (сотни таблиц, тысячи связей) и заданный SLO.
  steps:
  - action: Запустить перезагрузку и параллельно отправлять запросы, замеряя задержку и долю ошибок.
  expected:
  - Запросы обслуживаются в пределах SLO; допустимое поведение во время перезагрузки (старое состояние или короткая пауза)
    — по документации.
  applicability:
    when:
    - Есть перезагрузка метаданных.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - Смежные — PERF-LATENCY-BASELINE, RESIL-GRACEFUL-SHUTDOWN
  - 'Real-world bug: RWB-0334'
