- id: UI-LIST-FILTER-VALUES
  status: approved
  title: Фильтры принимают и показывают значения своего типа
  category: ui
  protocols:
  - ui-web
  - ui-desktop
  - ui-mobile
  kind: contract
  priority: P2
  tags:
  - ui
  - filtering
  - sorting
  - ci
  - regression
  - nightly
  preconditions:
  - Есть клиент (web, desktop или mobile) и учётки нужных ролей.
  steps:
  - action: Переключить быстрый фильтр по булеву полю — true, false и пусто
    notes: inbox №206
  - action: Оставить пустым фильтр текстового поля — отображается пустым, а не строкой null
    notes: inbox №207
  - action: Задать в редакторе фильтра каждую поддерживаемую сервером динамическую переменную — сохраняется, не сбрасывается
      в null
    notes: inbox №224
  expected:
  - Булев фильтр переключается между true, false и пусто; пустое значение отображается пустым, а не «null»; динамические переменные
    сохраняются.
  applicability:
    when:
    - Есть фильтры списков.
    skip_when:
    - Только API без клиента.
  automation:
    level: partial
    deterministic: true
