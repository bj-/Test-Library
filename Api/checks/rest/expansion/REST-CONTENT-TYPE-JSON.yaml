checks:
- id: REST-CONTENT-TYPE-JSON
  title: Content-Type и JSON-формат
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: positive
  priority: P1
  tags:
  - contract
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - media type соответствует контракту, тело разбирается как JSON
  applicability:
    when:
    - операция возвращает JSON
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Release
  risk:
    impact: medium
    likelihood: medium
  references: []
