checks:
- id: SEC-OWNERSHIP-DELETE
  status: approved
  title: User cannot delete another owner’s resource
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Resource supports deletion and is owner-restricted.
  steps:
  - action: As user B, attempt to delete user A’s resource.
    notes: 'Matrix axis: Resource ownership; scenario: Cross-owner delete. Use isolated synthetic identities and data.'
  - action: Удалить через путь своего проекта объект с ID чужого проекта и проверить 404 и сохранность связанных данных чужого
      проекта
    notes: 'Real-world bug: RWB-0149 (GHSA-gg93-x632-9ccv)'
  - action: Передать при изменении своей записи в параметре очистки файлов путь к файлу другой записи и проверить, что файл
      не удалён
    notes: 'Real-world bug: RWB-0149 (GHSA-8xjm-wqrp-2f25)'
  - action: Удалить контейнер (папку) с объектами других пользователей пользователем без права удалять чужие; чужие объекты
      не удаляются каскадом
    notes: 'Real-world bug: RWB-0149 (GHSA-7h62-6v23-v8fm)'
  expected:
  - Deny the operation; resource A remains available to its owner.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Resource supports deletion and is owner-restricted.
    skip_when:
    - Resource is shared with user B with delete permission.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0149'
