- id: RES-SOFT-DELETE-VISIBILITY
  status: approved
  title: Мягко удалённые ресурсы не видны в обычных операциях
  category: resources
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - data-integrity
  - ci
  - regression
  - nightly
  preconditions:
  - Используется soft delete.
  steps:
  - action: Удалить ресурс и проверить чтение, список, поиск, счётчики, уникальность имени.
  expected:
  - Ресурс скрыт везде, кроме задокументированных административных операций; уникальность учитывает политику.
  applicability:
    when:
    - Soft delete.
    skip_when:
    - Hard delete.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
