checks:
- id: DB-STORED-ROUTINES
  status: approved
  title: Хранимые процедуры и функции установлены и работают по спецификации
  category: db
  protocols:
  - db
  kind: contract
  priority: P2
  tags:
  - db
  - contract
  - ci
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Проверить наличие каждой процедуры, имя, имена, типы, число и обязательность параметров
    notes: inbox №133
  - action: Вызвать без части параметров (ошибка — если у них нет значений по умолчанию), на тестовых данных и с нулём строк
      на выходе; подтвердить результат и изменения состояния запросами до и после
    notes: inbox №134
  - action: Вызвать функции, возвращающие массив базового типа (text[]), там же, где скалярные
    notes: inbox №173
  - action: Вызвать перегруженные функции (одно имя, разные типы аргументов) во всех местах использования — выбирается своя
      перегрузка
    notes: inbox №315
  - action: Вызвать функции с каждым видом возвращаемого значения (record, setof record, скаляр, составной тип, таблица) —
      ограничения дают понятную ошибку
    notes: inbox №316
  - action: Проверить у функций SECURITY DEFINER фиксированный search_path (pg_catalog, pg_temp) и что он не влияет на остальную
      транзакцию
    notes: inbox №303
  expected:
  - Процедуры и функции есть, сигнатуры по спецификации; результаты на тестовых данных верны, включая ноль строк; перегрузки
    и виды возвращаемых значений поддерживаются.
  applicability:
    when:
    - Есть хранимая логика.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - ADR 0006 (проверки БД)
- id: DB-TRIGGERS
  status: approved
  title: Триггеры срабатывают ровно на нужные события и изолированы
  category: db
  protocols:
  - db
  kind: reliability
  priority: P2
  tags:
  - db
  - reliability
  - security
  - ci
  - regression
  - nightly
  preconditions:
  - Нужен доступ к БД стенда (схема, системные каталоги, журнал запросов и планы выполнения); без него проверка пропускается
    осознанно.
  steps:
  - action: Выполнить insert, update, delete — триггер срабатывает на нужные, результат (аудит, пересчёт, каскад) верен, лишних
      срабатываний нет
    notes: inbox №135
  - action: Создать скрипт триггера, обращающийся к классам запуска процессов и файлам хоста, — доступ запрещён
    notes: inbox №152
  - action: Создать триггер, вставляющий в ту же таблицу, — бесконечной рекурсии нет (условие выхода или запрет)
    notes: inbox №302
  expected:
  - Триггер срабатывает на каждое подходящее по определению событие и строку, без лишних срабатываний; рекурсии нет; доступа
    к процессам и файлам хоста нет.
  applicability:
    when:
    - Есть триггеры.
    skip_when:
    - Нет доступа к БД стенда.
  automation:
    level: partial
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - Смежная — INJ-USER-CODE-EXECUTION
  - ADR 0006 (проверки БД)
