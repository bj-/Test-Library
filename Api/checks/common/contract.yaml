checks:
- id: CONTRACT-REQUIRED-FIELDS
  status: approved
  title: Successful response contains required contract fields
  category: contract
  protocols:
  - rest
  - grpc
  - graphql
  - generic
  kind: contract
  priority: P1
  tags:
  - positive
  - contract
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - A valid request exists for the operation.
  steps:
  - action: Execute a valid request and validate the response against the contract.
  - action: Проверить обязательные поля исходящего payload хука для каждого типа события
    notes: 'Real-world bug: RWB-0314 (supabase/auth#1744)'
  - action: Развернуть объект с описанием в дескрипторе и проверить, что список типов и созданный объект возвращают это описание
    notes: 'Real-world bug: RWB-0314 (keycloak/keycloak#47452)'
  expected:
  - Required fields are present.
  - Field types and constraints match the schema.
  applicability:
    when:
    - A response schema is defined.
    skip_when:
    - The operation intentionally has no payload, such as HTTP 204.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: high
  references:
  - 'Real-world bug: RWB-0314'
- id: CONTRACT-UNKNOWN-FIELD-POLICY
  status: approved
  title: Unknown fields follow the documented contract policy
  category: contract
  protocols:
  - rest
  - graphql
  - generic
  kind: compatibility
  priority: P2
  tags:
  - contract
  - compatibility
  - ci
  - regression
  - nightly
  preconditions:
  - Unknown-field policy is documented.
  steps:
  - action: Add an unknown request field or inspect an extended response as applicable.
  expected:
  - Unknown fields are rejected, ignored, or preserved exactly as documented.
  applicability:
    when:
    - The contract defines unknown-field handling.
    skip_when:
    - The format does not allow extensible fields.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
- id: CONTRACT-FIELD-SELECTION
  status: approved
  title: Выбор полей возвращает ровно запрошенные поля с правильными значениями
  category: contract
  protocols:
  - rest
  kind: contract
  priority: P2
  tags:
  - contract
  - compatibility
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - API поддерживает выбор полей (fields, select, sparse fieldsets), в том числе для связей.
  steps:
  - action: Запросить списки и объекты с разными наборами полей — с id и без, со связями, с '*'.
  - action: Сравнить с полным ответом.
  - action: Запросить экспорт в CSV, поставив поля связанной сущности между прямыми полями, и проверить порядок колонок
    notes: 'Real-world bug: RWB-0026 (directus/directus#25521)'
  - action: Задать алиас поля с именем в синтаксисе функции (year(x)) и проверить ключ и значение в ответе
    notes: 'Real-world bug: RWB-0026 (directus/directus#25138)'
  - action: Запросить fields=* вместе с заданным алиасом и проверить, что алиас есть в ответе
    notes: 'Real-world bug: RWB-0026 (directus/directus#25121)'
  - action: Запросить вложение со спредом и пустым списком полей и сравнить ответ с ответом на обычное пустое вложение
    notes: 'Real-world bug: RWB-0026 (PostgREST/postgrest#3887)'
  - action: Запросить вложенные пустые вложения с фильтром по ним и проверить, что фильтр применён, а пустые вложения не попали
      в ответ
    notes: 'Real-world bug: RWB-0026 (PostgREST/postgrest#3093)'
  - action: Запросить у результата функции только встроенную связь многие-ко-многим без собственных колонок и проверить успешный
      ответ
    notes: 'Real-world bug: RWB-0026 (PostgREST/postgrest#2565)'
  - action: Запросить пользовательский формат ответа вместе с выбором части колонок или вычисляемых колонок и проверить, что
      формат применяется
    notes: 'Real-world bug: RWB-0026 (PostgREST/postgrest#3160)'
  - action: Запросить список с параметром краткого представления и проверить отсутствие полей полного представления (атрибуты,
      служебные поля)
    notes: 'Real-world bug: RWB-0026 (keycloak/keycloak#46296)'
  expected:
  - Возвращаются запрошенные поля с теми же значениями, что в полном ответе; ключ есть, если запрошен или обязателен.
  - Поля сверх запрошенных не возвращаются (кроме обязательных по контракту).
  applicability:
    when:
    - Есть выбор полей.
    skip_when:
    - Ответ фиксированной формы.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - JSON API sparse fieldsets
  - 'Real-world bug: RWB-0026'
- id: CONTRACT-PUBLISHED-SCHEMA-VALID
  status: approved
  title: Опубликованные сервисом описания API валидны в заявленном диалекте
  category: contract
  protocols:
  - generic
  kind: contract
  priority: P2
  tags:
  - contract
  - compatibility
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Сервис отдаёт описание (openapi.json, JSON Schema, MCP tools/list, GraphQL SDL, proto через reflection).
  steps:
  - action: Скачать описание и проверить строгим валидатором заявленной версии (OpenAPI 3.1, JSON Schema 2020-12).
  - action: Выполнить полный запрос introspection и проверить ответ на соответствие мета-схеме GraphQL, включая non-null поля
      вроде isRepeatable
    notes: 'Real-world bug: RWB-0049 (hasura/graphql-engine#10560)'
  - action: Создать представление над таблицей со связью, имя которого по алфавиту раньше таблицы, и проверить, что описание
      внешнего ключа в опубликованной схеме указывает на исходную таблицу
    notes: 'Real-world bug: RWB-0049 (PostgREST/postgrest#2619)'
  - action: 'Найти в контракте OpenAPI 3.0 поля с nullable: true рядом с allOf или $ref и сверить с описанием: по OAS 3.0.3 nullable действует только на type той же схемы, null формально запрещён, строгий валидатор и генератор клиента его отвергнут'
    notes: 'inbox №355'
  expected:
  - Описание валидно; $schema и версия соответствуют фактическому синтаксису.
  applicability:
    when:
    - Сервис публикует описание.
    skip_when:
    - Описание не публикуется.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - OpenAPI 3.1
  - JSON Schema 2020-12
  - 'Real-world bug: RWB-0049'
- id: CONTRACT-RESPONSE-LINKS-RESOLVE
  status: approved
  title: URL в ответах открываются
  category: contract
  protocols:
  - rest
  - graphql
  kind: contract
  priority: P3
  tags:
  - contract
  - regression
  - nightly
  preconditions:
  - Ответы содержат URL — ссылки на ресурсы, файлы, изображения, next и prev, Location.
  steps:
  - action: Собрать все URL из ответов основных операций и запросить каждый с теми же правами.
  expected:
  - Каждый URL отвечает 200 (или документированным статусом) с ожидаемым Content-Type; битых ссылок нет.
  applicability:
    when:
    - Есть URL в ответах.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - Смежные — PAGE-NEXT-LINK-VALID, HTTP-ABSOLUTE-URL-BASE-PATH
  - inbox №60
- id: CONTRACT-GENERATED-URI-ENCODING
  status: approved
  title: URI, которые формирует сервер, кодируют значения по правилам своей части
  category: contract
  protocols:
  - generic
  kind: contract
  priority: P3
  tags:
  - contract
  - real-world-bug
  - regression
  - nightly
  preconditions:
  - Сервер выдаёт URI со значениями пользователя — otpauth, ссылки в письмах, Location, redirect.
  steps:
  - action: Создать объекты со значениями с пробелом, +, &, /, кириллицей и получить URI, где они участвуют (путь, query,
      fragment); разобрать URI.
  expected:
  - Каждая часть закодирована по правилам своей схемы (пробел — %20 в пути); после декодирования значение совпадает с исходным.
  applicability:
    when:
    - Сервер формирует URI со значениями пользователя.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
  references:
  - RFC 3986 §2.1, §3.3
  - Входящие URL — REST-PATH-PARAM-ENCODING, REST-QUERY-ENCODING
  - 'Real-world bug: RWB-0341'
