- id: HARD-EXCESSIVE-DATA-EXPOSURE
  status: approved
  title: Ответы не содержат внутренних полей сверх контракта
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - contract
  - privacy
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Схемы ответов описаны в контракте.
  steps:
  - action: Сравнить фактические поля ответов со схемой для всех ролей.
  - action: 'Вариант для токенов: состав claims по политике проверить для каждого типа grant, а не только основного'
    notes: 'Real-world bug: RWB-0076 (keycloak/keycloak#51137)'
  - action: Ответы о фоновых задачах (статус, шаги, журнал) — без секретов контекста выполнения
    notes: 'Real-world bug: RWB-0076 (GHSA-g2v8-7jhw-pp8p)'
  - action: Ответы auth-эндпоинтов (refresh, reset, verify), обходящие общую фильтрацию полей
    notes: 'Real-world bug: RWB-0076 (GHSA-xgv3-crq2-6f69)'
  - action: Запросить ресурс в альтернативных форматах через расширение пути (.xml, .json) и сравнить набор полей с основным
      ответом
    notes: 'Real-world bug: RWB-0076 (GHSA-f25h-3mj6-4jpg)'
  - action: Запросить конфигурацию ролью читателя и проверить, что в ней нет состояния сеанса администратора (открытые документы,
      поисковые запросы, пути)
    notes: 'Real-world bug: RWB-0076 (GHSA-hgfg-j9pg-43xw)'
  - action: Запросить ролью читателя эндпоинты, разрешающие пути ресурсов, и проверить, что в ответе нет абсолютных путей
      файловой системы и имени пользователя ОС
    notes: 'Real-world bug: RWB-0076 (GHSA-jv8v-xq2h-657v)'
  - action: Открыть без аутентификации страницу по ссылке-хэшу и проверить, что встроенные данные связанного объекта ограничены
      нужными полями
    notes: 'Real-world bug: RWB-0076 (GHSA-xgr6-pqjv-3pf8)'
  - action: Проверить, что поиск связанных объектов не возвращает секретные хэши-ссылки чужих объектов, и попытаться использовать
      их для изменения
    notes: 'Real-world bug: RWB-0076 (GHSA-4vmm-5qvc-w5p7)'
  - action: Запросить через параметр выбора полей (select) поле, помеченное как недоступное для выбора, и проверить, что оно
      не возвращается
    notes: 'Real-world bug: RWB-0076 (GHSA-m4mm-534h-5cp5)'
  - action: Найти другого пользователя через эндпоинт предоставления доступа к ресурсу и проверить, что ответ содержит только
      идентификационные поля без атрибутов и служебных полей
    notes: 'Real-world bug: RWB-0076 (keycloak/keycloak#47036)'
  expected:
  - 'Нет недокументированных полей: внутренних id, флагов, хешей паролей, служебных метаданных.'
  applicability:
    when:
    - Есть схемы ответов.
    skip_when:
    - Схемы отсутствуют.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0076'
- id: HARD-ID-PREDICTABILITY
  status: approved
  title: Предсказуемые идентификаторы не позволяют собрать данные перебором
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - enumeration
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Используются последовательные числовые id.
  steps:
  - action: Перебрать соседние id от имени пользователя без прав.
  - action: Сравнить ответы для существующих и несуществующих id.
  - action: Перебрать последовательные ID на эндпоинтах, доступных без сессии, и проверить, что без случайного токена в URL
      данные не отдаются
    notes: 'Real-world bug: RWB-0295 (GHSA-q9c5-pp7m-fm2g)'
  expected:
  - Ответы для чужих и несуществующих id неразличимы по политике.
  - Нельзя оценить объём бизнеса по id.
  applicability:
    when:
    - Последовательные id.
    skip_when:
    - UUID или случайные id.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0295'
- id: HARD-SHADOW-API-VERSIONS
  status: approved
  title: Старые версии API и недокументированные маршруты не обходят защиту
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - versioning
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API версионируется.
  steps:
  - action: Вызвать ту же операцию через /v0, /v1, /beta, /internal, старые хосты.
  - action: Сравнить авторизацию и валидацию с текущей версией.
  - action: Устаревший маршрут доверяет описанию сущности из тела запроса - сравнить объём выдачи с актуальной операцией при
      подменённых атрибутах
    notes: 'Real-world bug: RWB-0079 (GHSA-r9ph-3637-55px)'
  - action: Перебрать типовые пути (/api/docs, /swagger, /api-json, /health, /metrics, /debug, /admin, /v1, /api/v0, /graphql,
      /.env, /actuator/*) и проверить, что отвечающее есть в контракте или закрыто
    notes: inbox №5
  - action: Запросить операции, удалённые из контракта или устаревшие с прошедшим сроком (по истории версий), — 404 или 410,
      а до срока Deprecation и Sunset (RFC 8594, RFC 9745)
    notes: inbox №143
  expected:
  - Устаревшие версии отключены или защищены не слабее текущей.
  applicability:
    when:
    - Есть версионирование.
    skip_when:
    - Одна версия.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - OWASP API Security Top 10
  - 'Real-world bug: RWB-0079'
- id: HARD-METHOD-OVERRIDE
  status: approved
  title: Заголовки переопределения метода не обходят авторизацию
  category: security
  protocols:
  - rest
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - authz
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - За шлюзом или фреймворком, поддерживающим override.
  steps:
  - action: 'Отправить POST с X-HTTP-Method-Override: DELETE, X-Method-Override, _method=PUT.'
  - action: Отправить запрос к закрытому пути с заголовком X-Original-URI или X-Forwarded-Uri, совпадающим с разрешающим правилом,
      и проверить, что политика применяется к фактическому пути
    notes: 'Real-world bug: RWB-0296 (GHSA-6wcg-mqvh-fcvg)'
  expected:
  - Override игнорируется или проверяется так же, как исходный метод.
  applicability:
    when:
    - Всегда для REST.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0296'
- id: HARD-HOST-HEADER
  status: approved
  title: Подмена Host и X-Forwarded-Host не влияет на ссылки и маршрутизацию
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - injection
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - API формирует абсолютные ссылки (сброс пароля, Location, pagination links).
  steps:
  - action: Отправить запрос с поддельными Host, X-Forwarded-Host, X-Forwarded-Proto, Forwarded.
  - action: Сервис без аутентификации — Host проверяется по allowlist; совпадения Origin с Host недостаточно
    notes: 'Real-world bug: RWB-0078 (GHSA-fm8p-53ww-hf6w)'
  - action: Отправить запрос к локальному служебному эндпоинту с посторонним Host и Origin и проверить отказ
    notes: 'Real-world bug: RWB-0078 (GHSA-5gm3-9crp-6g3v)'
  - action: Подменить Host при старте OIDC- и SAML-входа и при выходе; проверить redirect_uri, адреса ACS/SLO и редирект после
      выхода
    notes: 'Real-world bug: RWB-0078 (GHSA-3735-5339-xfwx)'
  - action: Отправить запрос с X-Forwarded-Host на контролируемый внешний хост и проверить, что сервер не обращается к этому
      хосту
    notes: 'Real-world bug: RWB-0078 (GHSA-4chg-4752-w88r)'
  - action: Отправить на публичный порт запрос к служебному эндпоинту с Host, указывающим служебный порт, и проверить 404
      или 403
    notes: 'Real-world bug: RWB-0078 (GHSA-58f6-6rj2-3v8r)'
  expected:
  - Ссылки строятся из доверенной конфигурации, а не из заголовков клиента.
  applicability:
    when:
    - Есть абсолютные ссылки.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0078'
- id: HARD-CACHE-POISONING
  status: approved
  title: Неключевые заголовки не отравляют общий кэш
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - caching
  - costly
  - regression
  - nightly
  preconditions:
  - Есть CDN или обратный прокси с кэшем.
  steps:
  - action: Отправить запрос с X-Forwarded-Host, X-Original-URL и cache buster; затем обычный запрос.
  expected:
  - Второй запрос не получает отравленный ответ.
  applicability:
    when:
    - Есть общий кэш.
    skip_when:
    - Кэша нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
- id: HARD-BUSINESS-FLOW-AUTOMATION
  status: approved
  title: Чувствительные бизнес-потоки защищены от автоматизированного злоупотребления
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P2
  tags:
  - security
  - negative
  - business-logic
  - rate-limiting
  - costly
  - regression
  - nightly
  preconditions:
  - Есть потоки регистрации, бронирования, покупки, отправки сообщений.
  steps:
  - action: Выполнить поток скриптом массово с одного и нескольких клиентов.
  expected:
  - Срабатывают задокументированные ограничения (лимиты, CAPTCHA, device binding).
  applicability:
    when:
    - Есть чувствительные потоки.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
