rules:
  - {id: IMPACT-01, rule: Schema changes select contract, validation, compatibility, and resource-flow checks.}
  - {id: IMPACT-02, rule: Auth changes select security checks for affected operations and roles.}
  - {id: IMPACT-03, rule: Collection changes select pagination, filtering, sorting, and boundary checks.}
  - {id: IMPACT-04, rule: Retry/timeout/dependency changes select idempotency, resilience, and reliability checks.}
  - {id: IMPACT-05, rule: Unknown impact does not imply irrelevance; keep checks in broad regression.}
