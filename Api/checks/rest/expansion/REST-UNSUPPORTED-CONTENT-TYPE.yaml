checks:
- id: REST-UNSUPPORTED-CONTENT-TYPE
  title: Неподдерживаемый Content-Type запроса
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - validation
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - запрос отклоняется документированно, побочных эффектов нет
  applicability:
    when:
    - операция принимает тело запроса
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Release
  risk:
    impact: medium
    likelihood: medium
  references: []
