  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: HTTP-VARY-HEADER
  status: approved
  title: Кэшируемые ответы содержат корректный Vary
  category: http-semantics
  protocols:
  - rest
  kind: contract
  priority: P3
  tags:
  - contract
  - caching
  - regression
  - nightly
  preconditions:
  - Ответ зависит от Accept, Accept-Language, Authorization или Origin.
  steps:
  - action: Запросить ресурс с разными значениями влияющих заголовков.
  expected:
  - Vary перечисляет все заголовки, влияющие на ответ.
  applicability:
    when:
    - Ответы кэшируемы.
    skip_when:
    - 'Cache-Control: no-store для всех ответов.'
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  risk:
    impact: low
    likelihood: medium
- id: HTTP-BODY-WITHOUT-CONTENT-TYPE
  status: approved
  title: Тело без Content-Type обрабатывается предсказуемо
  category: http-semantics
  protocols:
  - rest
  kind: negative
  priority: P2
  tags:
  - negative
  - validation
  - ci
  - regression
  - nightly
  preconditions:
  - Эндпоинт принимает тело.
  steps:
  - action: Отправить JSON-тело без Content-Type и с text/plain.
