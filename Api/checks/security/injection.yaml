    notes: 'Real-world bug: RWB-0086 (GHSA-hf8h-97gm-4x2p)'
  - action: Отправить в путь WebDAV закодированные сегменты %2e%2e и %2f учёткой, ограниченной папкой, и проверить, что доступ
      не выходит за её корень
    notes: 'Real-world bug: RWB-0086 (GHSA-w5fv-7x5q-g8qp)'
  - action: Отправить путь вида /<свой>/../<чужой>/объект, где первый сегмент проходит проверку владельца, и проверить 403
    notes: 'Real-world bug: RWB-0086 (GHSA-fqj9-69pf-6pjg)'
  - action: Указать путь соседнего каталога с тем же префиксом имени (/base2 при корне /base) и проверить отказ
