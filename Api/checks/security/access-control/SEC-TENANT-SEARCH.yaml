checks:
- id: SEC-TENANT-SEARCH
  status: approved
  title: Tenant filter cannot be bypassed in list/search
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - real-world-bug
  - pr
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Tenant-scoped list/search endpoint exists.
  steps:
  - action: Call list/search endpoints with omitted, altered, duplicated, or conflicting tenant filters.
    notes: 'Matrix axis: Tenant isolation; scenario: List isolation bypass. Use isolated synthetic identities and data.'
  - action: Не только граница tenant, но и запрет по типу данных/политике в поиске; прогонять на каждом поддерживаемом поисковом
      бэкенде
    notes: 'Real-world bug: RWB-0158 (GHSA-9325-vq29-gp3v)'
  - action: Служебные/вспомогательные списки (активные, запущенные) и broadcast push-событий — тот же фильтр доступа, что
      у основного списка
    notes: 'Real-world bug: RWB-0158 (GHSA-65xw-2v52-jhxc)'
  expected:
  - Returned items are limited to authorized tenant scope regardless of client-supplied filters.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when:
    - Tenant-scoped list/search endpoint exists.
    skip_when:
    - Endpoint intentionally returns globally shared public data.
  automation:
    level: full
    deterministic: true
  profiles:
  - PR
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
  - 'Real-world bug: RWB-0158'
