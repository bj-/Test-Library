checks:
- id: SEC-AUTHN-SCHEMES-SUPPORTED
  status: approved
  title: Все задокументированные схемы Authorization принимаются на своих эндпоинтах
  category: security
  protocols:
  - rest
  kind: positive
  priority: P2
  tags:
  - positive
  - authn
  - compatibility
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Контракт заявляет несколько схем аутентификации (Basic, Bearer, DPoP, API-ключ).
  steps:
  - action: Вызвать каждый эндпоинт с каждой задокументированной схемой и валидными учётными данными.
  - action: Вызвать с незаявленной схемой.
  - action: Обновить токен, передав refresh-токен только в httpOnly cookie, выданной сервером при входе, без тела запроса
    notes: 'Real-world bug: RWB-0036 (strapi/strapi#24669)'
  - action: Передать схему bearer в нижнем регистре — принимается (схема регистронезависима, RFC 9110 §11.1)
    notes: inbox №29
  - action: Вызвать эндпоинт регистрации и отмены регистрации узла клиента с учётными данными в теле формы (client_secret_post,
      client_secret_jwt) и проверить успех, как при Basic
    notes: 'Real-world bug: RWB-0036 (keycloak/keycloak#48628)'
  expected:
  - Заявленные схемы принимаются.
  - Неподдерживаемая схема — 401 с WWW-Authenticate.
  applicability:
    when:
    - Заявлено больше одной схемы.
    skip_when:
    - Одна схема.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - RFC 9110 §11.6.2
  - 'Real-world bug: RWB-0036'
