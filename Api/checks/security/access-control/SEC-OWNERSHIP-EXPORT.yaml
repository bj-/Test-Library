checks:
- id: SEC-OWNERSHIP-EXPORT
  title: Export/report endpoints enforce ownership and tenant boundaries
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - regression
  - release
  - nightly
  preconditions: &id001
  - Export/report/download functionality exists.
  steps:
  - action: Request export, report, download, or generated file using another owner’s or tenant’s identifiers.
    notes: 'Matrix axis: Resource ownership; scenario: Export scope bypass. Use isolated synthetic identities and data.'
  expected:
  - Exported content includes only authorized data; download handles cannot be used across principals/tenants.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when: *id001
    skip_when:
    - No export or downloadable artifacts exist.
  automation:
    level: full
    deterministic: true
  profiles:
  - Regression
  - Nightly
  - Release
  risk:
    impact: critical
    likelihood: medium
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
