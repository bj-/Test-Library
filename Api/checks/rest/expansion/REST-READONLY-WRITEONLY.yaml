checks:
- id: REST-READONLY-WRITEONLY
  status: approved
  title: Поля readOnly/writeOnly
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: contract
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - contract
  - validation
  - rest
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  - action: Вычисляемые значения внутри свободной карты атрибутов и round-trip GET→PUT
    notes: 'Real-world bug: RWB-0129 (keycloak/keycloak#52173)'
  - action: Отсутствие read-only поля в запросе на изменение не должно давать ошибку
    notes: 'Real-world bug: RWB-0129 (keycloak/keycloak#49272)'
  - action: Обновление ресурса без writeOnly-секрета (тело из GET, где секрет не отдаётся) сохраняет прежний секрет; проверить
      аутентификацией по нему, в том числе на мигрированных данных
    notes: 'Real-world bug: RWB-0129 (keycloak/keycloak#48868)'
  - action: Задать в вебхуке секретный заголовок авторизации и проверить, что список, чтение и ответ на изменение не содержат
      его значения
    notes: 'Real-world bug: RWB-0129 (GHSA-3r5c-2xxx-h872)'
  expected:
  - защищённые поля не принимаются/не раскрываются вопреки контракту
  applicability:
    when:
    - схема содержит readOnly/writeOnly
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0129'
