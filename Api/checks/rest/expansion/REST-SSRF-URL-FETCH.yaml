checks:
- id: REST-SSRF-URL-FETCH
  title: Контроль server-side URL fetch
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: security
  protocols:
  - rest
  kind: negative
  priority: P0
  tags:
  - security
  - negative
  - validation
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - запрещённые схемы и internal/private targets блокируются
  applicability:
    when:
    - API загружает пользовательский URL
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - Nightly
  - Release
  risk:
    impact: medium
    likelihood: medium
  references: []
