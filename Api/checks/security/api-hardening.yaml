checks:
- id: HARD-TLS-ONLY
  status: approved
  title: API доступен только по TLS с актуальными настройками
  category: security
  protocols:
  - rest
  - grpc
  - graphql
  - websocket
  kind: security
  priority: P1
  tags:
  - security
  - transport-security
  - hardening
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Публичный или межсервисный эндпоинт.
  steps:
  - action: Обратиться по HTTP, по TLS 1.0/1.1, со слабыми шифрами; проверить HSTS и сертификат.
  - action: 'Выполнить вход по http:// без X-Forwarded-Proto: https и проверить, что сервер не принимает пароль и не выдаёт сессию (отказ или редирект на https); если сессия выдана, проверить Secure у cookie и завести находку: пароль уже ушёл открытым текстом'
    notes: 'inbox №345; на http-стенде Secure-cookie раннер сам не вернёт - передавать заголовком Cookie явно, иначе проверки после входа ложно падают с 401'
  expected:
  - HTTP отклоняется или перенаправляется без передачи данных; устаревшие протоколы отключены; HSTS присутствует; сертификат
    валиден.
  applicability:
    when:
    - Сетевой доступ к эндпоинту.
    skip_when:
    - Тест в среде без TLS (зафиксировать).
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
- id: HARD-DEBUG-ENDPOINTS
  status: approved
  title: Отладочные и служебные эндпоинты недоступны извне
  category: security
  protocols:
  - rest
  - graphql
  kind: security
  priority: P1
  tags:
  - security
  - negative
  - hardening
  - real-world-bug
  - ci
  - regression
  - nightly
  - release
  preconditions:
  - Известен стек (Spring, .NET, Node, Django).
  steps:
  - action: Запросить /actuator, /debug, /metrics, /env, /swagger, /graphiql, /.git, /admin, /console, /heapdump.
  - action: Служебный сервер доступен по сети (0.0.0.0) и с wildcard CORS — проверить доступность не с loopback и ответ на
      preflight с чужим Origin
    notes: 'Real-world bug: RWB-0075 (GHSA-jmg2-rcxh-w8q3)'
  - action: Подключиться без аутентификации к служебному WebSocket журналов, отправить изменяющее сообщение и проверить отказ
      и неизменность настроек
    notes: 'Real-world bug: RWB-0075 (GHSA-9v8p-frvj-2pcm)'
  - action: Обратиться к внутреннему прокси управления без клиентского сертификата и токена, в том числе изменяющими методами,
      и проверить отказ
    notes: 'Real-world bug: RWB-0075 (GHSA-rh53-xvx2-j327)'
  - action: Обратиться без учётных данных к управляющим API на внешнем порту, через который подключаются агенты, и проверить
      отказ
    notes: 'Real-world bug: RWB-0075 (GHSA-qh9r-j7rp-4x2m)'
  - action: Отправить запрос с токеном в query-строке, затем прочитать служебный эндпоинт истории запросов и проверить, что
      секрет в поле uri замаскирован
    notes: 'Real-world bug: RWB-0075 (GHSA-8phw-xrj9-cpqp)'
  - action: Запросить дамп памяти, окружение и дамп потоков от роли с правом только базового чтения и проверить 403
    notes: 'Real-world bug: RWB-0075 (GHSA-227r-jm2g-7cp4)'
  - action: Прочитать служебный эндпоинт конфигурации и проверить, что пароли внутри строк подключения замаскированы, а не
      только значения с ключами password и secret
    notes: 'Real-world bug: RWB-0075 (GHSA-q62h-354g-5r85)'
  - action: Запустить сервер с настройками по умолчанию и проверить, что экспериментальные (preview) функции и их эндпоинты
      недоступны
    notes: 'Real-world bug: RWB-0075 (keycloak/keycloak#44132)'
  - action: Проверить, что отладочные логи выключены в PROD (NODE_ENV и аналоги).
    notes: inbox №348; проверка конфигурации стенда, раз на стенд, включая PROD
  expected:
  - Служебные эндпоинты закрыты или требуют аутентификации в соответствии с политикой окружения.
  applicability:
    when:
    - Всегда.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  - Release
  risk:
    impact: high
    likelihood: medium
  references:
  - 'Real-world bug: RWB-0075'
