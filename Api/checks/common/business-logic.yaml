- id: BIZ-FLAG-EFFECT-MATRIX
  status: approved
  title: Каждый флаг сущности влияет на поведение так, как описано
  category: business-logic
  protocols:
  - generic
  kind: contract
  priority: P2
  tags:
  - contract
  - business-logic
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - У сущности есть флаги (boolean-поля), меняющие поведение.
  steps:
  - action: Для каждого флага выполнить затрагиваемые операции при true и false и в комбинациях с другими флагами.
  - action: Включить флаг изменением существующего объекта, а не при создании (в том числе через DCR), — зависимые объекты
      создаются так же, при выключении — удаляются
    notes: 'Real-world bug: RWB-0353 (keycloak/keycloak#44257)'
  expected:
  - Поведение соответствует описанию; флаг, который ни на что не влияет, — находка.
  applicability:
    when:
    - Есть флаги.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Чек-лист guru99 (пер. О. Алифановой)
  - inbox №79
  - 'Real-world bug: RWB-0353'
- id: BIZ-IMPOSSIBLE-STEP-NOT-ASSIGNED
  status: approved
  title: Невыполнимый обязательный шаг не назначается и не блокирует законную операцию
  category: business-logic
  protocols:
  - generic
  kind: positive
  priority: P2
  tags:
  - positive
  - business-logic
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Процесс назначает обязательные шаги — подтверждение email, смена пароля, второй фактор.
  steps:
  - action: Включить обязательный шаг и выполнить операцию (вход, выдача токена) пользователем, у которого нет нужного канала
      (нет email или телефона).
  expected:
  - Невыполнимый шаг не назначается или применяется документированная альтернатива; законная операция не блокируется.
  applicability:
    when:
    - Есть обязательные шаги процессов.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
  references:
  - Позитивная пара к BIZ-WORKFLOW-STEP-SKIP
  - 'Real-world bug: RWB-0342'
- id: BIZ-RULES-DETERMINISTIC
  status: approved
  title: Итог нескольких правил над одним значением детерминирован
  category: business-logic
  protocols:
  - generic
  kind: contract
  priority: P2
  tags:
  - contract
  - business-logic
  - real-world-bug
  - ci
  - regression
  - nightly
  preconditions:
  - Несколько правил в одном запросе влияют на одно значение — маппинг групп и ролей при входе, скидки, политики.
  steps:
  - action: Настроить конфликтующие правила и повторить операцию несколько раз.
  expected:
  - Результат одинаков при каждом повторе и соответствует документированному приоритету; без документации — неоднозначность
    фиксируется как находка.
  applicability:
    when:
    - Есть несколько правил над одним значением.
    skip_when:
    - Нет.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: low
  references:
  - Смежные — ASYNC-EVENT-ORDERING, CONC-*
  - 'Real-world bug: RWB-0349'
- id: BIZ-ECHOED-VALUE-VERIFIED
  status: approved
  title: Значение из выдачи, возвращаемое клиентом, проверяется сервером
  description: Если клиент передаёт обратно хеш, ETag, версию или подпись, полученные в выдаче, а сервер
    их не сверяет, поле декоративное, и клиент «принимает» не то, что видел.
  category: business-logic
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P1
  tags:
  - negative
  - business-logic
  - data-integrity
  preconditions:
  - Операция принимает значение, ранее выданное сервером (хеш документа, ETag, версия, подпись).
  steps:
  - action: Отправить произвольное значение, значение другой версии или перевода, пустое значение, а если
      значение чувствительно к регистру - значение в другом регистре.
  - action: Отправить верное значение и проверить успех.
  expected:
  - Неверное значение отклоняется по контракту (обычно 409 или 422) и не меняет состояние, верное принимается.
  applicability:
    when:
    - Есть операция с возвратом выданного значения.
    skip_when:
    - Операции, принимающей выданное значение, нет.
  automation:
    level: full
    deterministic: true
  risk:
    impact: high
    likelihood: medium
  references:
  - inbox №362
  - Смежные - REST-ETAG-IF-MATCH
- id: BIZ-MESSAGE-TEMPLATE-COVERAGE
  status: approved
  title: Для каждого региона и языка есть шаблон сообщения
  category: business-logic
  protocols:
  - rest
  - grpc
  - graphql
  kind: negative
  priority: P2
  tags:
  - negative
  - boundary
  preconditions:
  - Система шлёт письма или SMS по шаблонам с настройкой по регионам и языкам.
  steps:
  - action: Запросить сообщение (код входа, уведомление) в регионе без опубликованного шаблона письма
      или SMS - явная ошибка по контракту или описанный запасной вариант (другой язык, канал), а не 200
      «код отправлен» без отправки и не 500
    notes: inbox №445
  expected:
  - Без шаблона операция отвечает явной ошибкой или идёт по описанному запасному варианту; сообщение о
    мнимой отправке и 500 - находка.
  applicability:
    when:
    - Есть шаблоны сообщений по регионам или языкам.
    skip_when:
    - Шаблоны не настраиваются.
  automation:
    level: partial
    deterministic: true
  risk:
    impact: medium
    likelihood: medium
  references:
  - inbox №445
- id: BIZ-SMS-TEMPLATE-LENGTH
  status: approved
  title: Шаблон SMS укладывается в лимит сегментов после подстановки переменных
  category: business-logic
  protocols:
  - generic
  kind: boundary
  priority: P2
  tags:
  - boundary
  preconditions:
  - Система шлёт SMS по шаблонам, лимит сегментов задан требованиями или договором с оператором.
  steps:
  - action: 'Подставить в шаблон переменные максимальной длины, вызвать отправку и проверить длину и число
      сегментов - на границе разрешённых сегментов, ровно и +1 символ: латиница (GSM-7, 160 / 153), кириллица
      (UCS-2, 70 / 67); символы таблицы расширения GSM-7 считаются за два'
    notes: inbox №446
  expected:
  - Сообщение после подстановок не длиннее разрешённого числа сегментов; выход за границу обнаруживается
    по требованиям, а не уходит молча с лишней оплатой.
  applicability:
    when:
    - Есть SMS по шаблонам.
    skip_when:
    - SMS не отправляются.
  automation:
    level: partial
    deterministic: true
  risk:
    impact: medium
    likelihood: medium
  references:
  - 3GPP TS 23.038 (кодировки SMS)
  - inbox №446
- id: BIZ-ADJACENT-RANGES-PARTITION
  status: approved
  title: Соседние диапазоны не пересекаются и не оставляют дыр на границах
  category: business-logic
  protocols:
  - generic
  kind: boundary
  priority: P2
  tags:
  - boundary
  preconditions:
  - Значения распределяются по набору диапазонов (фильтр, тариф, скидка, зона).
  steps:
  - action: Проверить набор диапазонов с учётом правила включения границ - соседние не пересекаются (…-300
      и 300-9999 при включённых границах) и между ними нет дыр
    notes: inbox №476
  - action: Подать значения на границах и рядом - каждое попадает ровно в один диапазон
    notes: inbox №476
  expected:
  - Каждое допустимое значение попадает ровно в один диапазон.
  applicability:
    when:
    - Есть набор смежных диапазонов.
    skip_when:
    - Диапазонов нет.
  automation:
    level: partial
    deterministic: true
  risk:
    impact: medium
    likelihood: medium
  references:
  - Анализ граничных значений и классов эквивалентности
  - Смежная - UI-DROPDOWN-VALUES (пустые пункты списка из идеи №476)
