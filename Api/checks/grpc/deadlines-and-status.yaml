- id: GRPC-RETRY-POLICY
  status: approved
  title: Автоматические повторы применяются только к безопасным методам и статусам
  category: grpc-errors
  protocols:
  - grpc
  kind: reliability
  priority: P2
  tags:
  - resilience
  - idempotency
  - costly
  - regression
  - nightly
  preconditions:
  - Настроен service config с retryPolicy.
  steps:
  - action: Сымитировать UNAVAILABLE для идемпотентного и неидемпотентного метода.
  expected:
  - Повторы только для разрешённых методов и статусов, с backoff; мутации не дублируются.
  applicability:
    when:
    - Есть retryPolicy.
    skip_when:
    - Нет.
  automation:
    level: partial
    deterministic: false
  profiles:
  - Regression
  - Nightly
  risk:
    impact: medium
    likelihood: medium
