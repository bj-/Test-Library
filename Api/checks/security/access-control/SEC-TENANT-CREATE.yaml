checks:
- id: SEC-TENANT-CREATE
  title: Client cannot assign resource to another tenant
  category: security
  protocols:
  - rest
  - graphql
  - generic
  kind: negative
  priority: P0
  tags:
  - negative
  - security
  - authz
  - ci
  - regression
  - release
  preconditions: &id001
  - Create operation is tenant-scoped and client can submit tenant-related fields.
  steps:
  - action: Create a resource while supplying another tenant’s identifier in body, query, or header.
    notes: 'Matrix axis: Tenant isolation; scenario: Tenant ID injection. Use isolated synthetic identities and data.'
  expected:
  - Server derives tenant context from trusted identity/policy or rejects the mismatch; resource is not created under another
    tenant.
  - Verify persisted state and audit/security events where applicable; do not assert a universal HTTP status unless the API
    contract specifies it.
  applicability:
    when: *id001
    skip_when:
    - Cross-tenant creation is a documented privileged workflow.
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  - Release
  risk:
    impact: critical
    likelihood: high
  references:
  - OWASP API Security Top 10 (relevant access-control/authentication risk); adapt to the project threat model
