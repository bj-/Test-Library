checks:
- id: REST-TYPE-MISMATCH
  title: Несовпадение типа поля
  description: Черновой шаблон проверки; адаптировать к спецификации конкретного API.
  category: validation
  protocols:
  - rest
  kind: negative
  priority: P1
  tags:
  - negative
  - validation
  - contract
  - rest
  preconditions:
  - Подготовить тестовые данные и credentials согласно сценарию.
  steps:
  - action: Выполнить запрос по операции, удовлетворяющей условиям применимости.
  expected:
  - неверный тип обрабатывается по контракту без неожиданного coercion
  applicability:
    when:
    - поля имеют объявленные типы
    skip_when:
    - operation is not supported by the API
    - expected behavior is not specified and requires review
  automation:
    level: full
    deterministic: true
  profiles:
  - CI
  - Regression
  risk:
    impact: medium
    likelihood: medium
  references: []
